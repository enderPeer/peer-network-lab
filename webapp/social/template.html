    var posts = h('details', {}, h('summary', { class: 'eyebrow', style: 'cursor:pointer',

    var guide = h('details', { id: 'guide' }, h('summary', { class: 'eyebrow', style: 'cursor:pointer', text: 'the guide — how any of this works' }));

  /**

  /** Operator-facing: can this instance actually connect two hard networks? */
  function callHealthCard() {
    var out = h('div', { class: 'smallnote', text: 'Not tested yet.' });

      h('p', { class: 'eyebrow', text: 'call reachability' }),

  function feedTab(st) {
    var text = h('textarea', { placeholder: 'Say something… (payload — carried, never scored; @name mentions and quotes are priced Reference acts)' });
    var att = slider('attachment', 0.8);
    var fileIn = h('input', { type: 'file', multiple: '', accept: 'image/*,video/*,audio/*,.pdf,.txt,.md,.csv,.json,.zip,.heic,.heif,.mov,.m4a', style: 'display:none' });
    var chips = h('div', { class: 'row' });
    composeChipHost = chips;
    redrawComposeChips();
    fileIn.addEventListener('change', function () {
      handleMediaPicks(fileIn.files);
      fileIn.value = '';
    });
    // Show the ceiling before it is hit — finding it by trial cost a tester
    // several real acts, and every one of them burned θ.
    var TEXT_MAX = 1000;
    var counter = h('span', { class: 'charcount' });
    function updateCount() {
      var n = text.value.length;
      counter.textContent = n + ' / ' + TEXT_MAX;
      counter.className = 'charcount' + (n > TEXT_MAX ? ' over' : n > TEXT_MAX * 0.9 ? ' near' : '');
    }
    text.addEventListener('input', updateCount);
    updateCount();
    // ── One composer, three kinds ────────────────────────────────────────
    //
    // A note, a gathering and a broadcast are the same thing in the record —
    // each mints a Content node through the same path — so they are published
    // from the same place. The fields a kind cannot carry are UNMOUNTED, not
    // disabled: the host's field whitelist deletes them silently and answers
    // 200, so a fee left behind on a note would vanish without a word, and an
    // attachment left on an event would show a chip for a file that never
    // travelled.
    text.value = draft.text;
    text.addEventListener('input', function () { draft.text = text.value; });
    var KINDS = [['post', 'Note'], ['event', 'Gathering'], ['stream', 'Broadcast']];
    var CEIL = { post: TEXT_MAX, event: 280, stream: 200 };
    var kindBar = h('div', { class: 'uline' });
    KINDS.forEach(function (k) {
      kindBar.appendChild(h('button', { class: draft.kind === k[0] ? 'on' : '', text: k[1], onclick: function () {
        draft.kind = k[0];
        // Clear what the new kind cannot carry, rather than leaving it to be
        // dropped at the door.
        if (k[0] !== 'event') { draft.at = ''; draft.place = ''; draft.fee = ''; draft.cap = ''; }
        if (k[0] !== 'post') { clearCompose(); }
        render();
      } }));
    });

    var evAt = h('input', { type: 'datetime-local', value: draft.at });
    var evPlace = h('input', { type: 'text', placeholder: 'where', maxlength: '120', value: draft.place, style: 'flex:1; min-width:0' });
    var evFee = h('input', { type: 'text', inputmode: 'decimal', placeholder: 'entry (blank = free)', value: draft.fee, style: 'width:150px' });
    // PEER only. tBTC is retired, and an entry fee denominated in a retired
    // faucet asset would be a price in a currency nobody can obtain.
    var evCur = h('select', {}, h('option', { value: 'PEER', text: 'PEER' }));
    evCur.value = draft.cur;
    var evCap = h('input', { type: 'text', inputmode: 'numeric', placeholder: 'places', value: draft.cap, style: 'width:90px' });
    [[evAt, 'at'], [evPlace, 'place'], [evFee, 'fee'], [evCur, 'cur'], [evCap, 'cap']].forEach(function (p) {
      p[0].addEventListener('input', function () { draft[p[1]] = p[0].value; });
      p[0].addEventListener('change', function () { draft[p[1]] = p[0].value; });
    });
    var camBox = h('input', { type: 'checkbox' });
    camBox.checked = draft.camera;
    camBox.addEventListener('change', function () { draft.camera = camBox.checked; });

    /**
     * A fee typed on a German keyboard.
     *
     * The old form read parseFloat on a number input, and a browser that
     * considers "0,5" invalid reports an empty string — so a comma decimal
     * silently became 0 and published a FREE gathering the author believed
     * was priced. The field is text now and the comma is read as what it is.
     */
    function readFee() {
      var raw = String(draft.fee || '').trim().replace(',', '.');
      if (!raw) return 0;
      var n = parseFloat(raw);
      return isFinite(n) && n > 0 ? n : NaN;
    }

    var cost = (function () {
      if (draft.kind !== 'post') return 1;
      var probe = { t: 'post', author: who, text: text.value, ref: composeQuote };
      try { return actCost(probe, st); } catch (e) { return 1; }
    })();
    var verb = draft.kind === 'event' ? 'Announce' : draft.kind === 'stream' ? 'Go live' : 'Publish';

    var composer = h('div', { class: 'card composer' },
      h('p', { class: 'eyebrow', text: 'publish' }), kindBar, text, counter, chips);
    if (draft.kind === 'event') {
      composer.appendChild(h('div', { class: 'mini-form persistent' }, evAt, evPlace));
      composer.appendChild(h('div', { class: 'mini-form persistent' }, evFee, evCur, evCap));
      composer.appendChild(h('p', { class: 'smallnote', text: 'An entry fee moves existing tokens from whoever joins to you. It mints nothing and raises nobody\u2019s standing, yours included. The place is a physical address — deleting the gathering redacts it. A gathering cannot be revised afterwards, only deleted.' }));
    }
    if (draft.kind === 'stream') {
      composer.appendChild(h('div', { class: 'mini-form persistent' },
        h('label', { class: 'smallnote' }, camBox, ' camera'),
        h('span', { class: 'smallnote', text: 'Your video goes to the host once and the host sends it on, so your upload is the same for one viewer or a hundred.' })));
    }
    var row = h('div', { class: 'row' });
    if (draft.kind === 'post') {
      row.appendChild(att.row);
      row.appendChild(h('button', { class: 'btn small', text: '+ media', onclick: function () { fileIn.click(); } }));
      row.appendChild(fileIn);
    }
    row.appendChild(h('button', { class: 'btn primary', text: verb + ' · −' + (cost > 1 ? cost : '') + 'θ', onclick: function () {
      var t = text.value.trim();
      var ceil = CEIL[draft.kind];
      if (composeBusy) { toast('Still uploading — give it a moment.'); return; }
      if (!t && !(draft.kind === 'post' && composeMedia.length)) { toast('Say what it is first — the payload is yours, the husk is the network’s.'); return; }
      if (t.length > ceil) { toast('Too long by ' + (t.length - ceil) + ' characters — the limit for a ' + draft.kind + ' is ' + ceil + '. Trim it before spending θ.'); return; }

      if (draft.kind === 'post') {
        var act = { t: 'post', author: who, text: t || '·', a: att.value() };
        if (composeQuote) act.ref = composeQuote;
        if (composeMedia.length) act.media = composeMedia.slice();
        // Same rule as the simple composer: cleared when the host has taken
        // it, never before. A refusal used to cost the caption and every
        // upload — measured once at thirteen files, and once at 66 MB.
        tryAct(who, act, 'Published. Publish mints the Content node; references append as their own acts.', function () {
          clearCompose(); draft.text = ''; text.value = '';
          updateCount(); redrawComposeChips();
        });
        return;
      }

      if (draft.kind === 'stream') {
        // The refusal used to arrive AFTER the act: canRecord() was only ever
        // consulted on the deleted Live tab, so a browser with no MediaRecorder
        // offered a priced 'Go live' button and explained itself only once it
        // had been pressed.
        if (!canRecord().length) {
          toast('This browser cannot encode video, so it cannot broadcast — it can still watch. Nothing was spent.');
          return;
        }
        // Only the TRIGGER lives here. The session — the camera, the recorder,
        // the socket — is held on `live` and drawn by the bar at the top, so
        // this element being destroyed on the next repaint costs nothing.
        broadcastStart(t, draft.camera);
        draft.text = ''; text.value = '';
        return;
      }

      var fee = readFee();
      if (isNaN(fee)) { toast('That entry fee is not a number I can read. Use a plain figure like 0.5, or leave it blank for a free gathering.'); return; }
      var when = draft.at ? new Date(draft.at).getTime() : 0;
      var cap = Math.max(0, parseInt(String(draft.cap || '').replace(/[^0-9]/g, ''), 10) || 0);
      // A gathering cannot be revised — the host refuses a revision whose
      // original is an event — and its only remedy is a delete. So the numbers
      // are read back before they become permanent.
      var summary = 'Announce this gathering?\n\n'
        + '· ' + t + '\n'
        + '· when: ' + (when ? new Date(when).toLocaleString() : 'not stated') + '\n'
        + '· where: ' + (draft.place || 'not stated') + '\n'
        + '· entry: ' + (fee > 0 ? fee + ' ' + draft.cur + ', paid to you' : 'free') + '\n'
        + '· places: ' + (cap || 'unlimited') + '\n\n'
        + 'Once published the price and the place cannot be edited — only deleted.';
      if (!window.confirm(summary)) return;
      tryAct(who, {
        t: 'event', author: who, text: t, at: when, place: draft.place.trim(),
        fee: fee, cur: fee > 0 ? draft.cur : '', cap: cap,
      }, 'Gathering announced. It is content like any post — people can react to it, and entry moves tokens without moving standing.');
      draft.text = ''; draft.at = ''; draft.place = ''; draft.fee = ''; draft.cap = '';
      text.value = '';
    } }));
    composer.appendChild(row);

    var wrap = h('div', {});

    // There is ONE search row on this screen, in the ranking head below. A
    // second one was added at the top and the original was never removed, so
    // the feed carried two identical controls that did not share their input:
    // typing in one and pressing Enter left the other showing the previous
    // query. Deleted here rather than there, because the one that survives is
    // the one sitting with the sort and filter rows it belongs to.
    // On a phone the rails stack BELOW the feed, which would put search, sort
    // and filters after thirty cards — the controls that govern a list must
    // not require traversing the list. So the feed carries a folded copy at
    // its head on narrow screens; CSS shows one copy or the other, never both.
    var ctlM = h('details', { class: 'ctl-m' },
      h('summary', { class: 'eyebrow', text: 'Search \u00b7 sorting \u00b7 filters' }),
      railSearchCard(), railSortCard(), railFilterCard());
    wrap.appendChild(ctlM);
    var onAir = onAirStrip(st);
    if (onAir) wrap.appendChild(onAir);
    var focused = focusCard(st, false);
    if (focused) wrap.appendChild(focused);
    wrap.appendChild(composer);
    var cogra = feedMode === 'cogra';
    var head = h('div', { class: 'card', style: 'margin-top:14px' },
      h('div', { class: 'panel-head', style: 'margin-bottom:6px' },
        h('p', { class: 'eyebrow', style: 'margin:0', text: feedMode === 'old'
          ? 'OLDEST FIRST — append order, from the beginning'
          : feedMode === 'talked'
            ? 'MOST DISCUSSED — by number of comments, each one a priced act'
            : feedMode === 'backed'
              ? 'MOST BACKED — by number of reactions. Every one cost its author θ, so this orders by commitment spent, not by attention given'
              : feedMode === 'follow'
                ? 'FOLLOWING — the accounts you chose, newest first, unranked'
          : feedMode === 'new'
          ? 'chronological — authoritative append order, no ranking'
          : cogra
            ? 'CoGra Σ σ(π)·m(π)·f(Δt) — k-disjoint paths, no standing, balance × taint'
            : 'L1 default — S = W · (1 + standing/ν) · ‖T‖F' }),
        null));
    // Sorting, filters and search moved to the left rail — the feed column
    // keeps only the label saying which order is in charge, and view-as.

    // View-as (community request): rank the feed from any identity's position — read-only.
    var vu = viewAs && st.ledgerById[viewAs] ? viewAs : who;
    var vaSel = h('select', {});
    vaSel.appendChild(h('option', { value: '', text: 'viewing as: me' }));
    st.ledgers.forEach(function (l) {
      if (l.id === who || l.deleted) return;
      var o = h('option', { value: l.id, text: 'viewing as: ' + st.handles[l.id] });
      if (viewAs === l.id) o.selected = true;
      vaSel.appendChild(o);
    });
    vaSel.addEventListener('change', function () { viewAs = vaSel.value || null; feedLimit = 30; render(); });
    head.appendChild(h('div', { style: 'display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px' },
      vaSel,
      vu !== who ? h('span', { class: 'gate pass', text: 'read-only — acting stays you' }) : null));
    var ranked, maxRel;
    if (feedMode === 'new') {
      var newest = [], newestAt = {};
      st.g.edges.forEach(function (e) {
        // One entry per node, at its newest Publish. A node now carries a
        // Publish edge per revision, and listing edges showed a revised post
        // once for every time it had been revised.
        if (e.family !== 'Publish' || !st.payloads[e.tgt]) return;
        if (newestAt[e.tgt] === undefined || e.appendIndex > newestAt[e.tgt]) {
          newestAt[e.tgt] = e.appendIndex;
        }
      });
      for (var nid in newestAt) newest.push({ node: st.g.nodes.get(nid), idx: newestAt[nid] });
      newest.sort(function (a2, b2) { return b2.idx - a2.idx; });
      ranked = newest.map(function (r) { return { node: r.node, relevance: 0, bfsWeight: 0, amplifier: 0, contentNorm: 0, newest: true }; });
      maxRel = 1;
    } else if (feedMode === 'old' || feedMode === 'talked' || feedMode === 'backed') {
      // Three plain orderings over the same corpus.
      //
      // 'Backed' deserves a note, because in most places sorting by reactions
      // is sorting by clicks. Here every reaction is a priced act: it cost its
      // author θ and raised their act count, which dilutes their own rate. So
      // this orders by commitment other people spent, not by attention they
      // gave away for free — which is the distinction the whole network is
      // built on. It still ranks nothing: standing is untouched by any of it.
      var pool = [];
      Object.keys(st.payloads).forEach(function (cid) {
        var meta = st.postMeta[cid];
        if (!meta || meta.comment) return;
        var node = st.g.nodes.get(cid);
        if (!node) return;
        var eng = feedMode === 'old' ? { reacts: 0, comments: 0 } : engagementOf(st, cid);
        pool.push({ node: node, idx: meta.idx, reacts: eng.reacts, comments: eng.comments });
      });
      pool.sort(function (a2, b2) {
        if (feedMode === 'old') return a2.idx - b2.idx;
        if (feedMode === 'talked') return (b2.comments - a2.comments) || (b2.idx - a2.idx);
        return (b2.reacts - a2.reacts) || (b2.idx - a2.idx);
      });
      ranked = pool.map(function (r) { return { node: r.node, relevance: 0, bfsWeight: 0, amplifier: 0, contentNorm: 0, newest: true }; });
      maxRel = 1;
    } else if (feedMode === 'follow') {
      // Everything by the people you follow, newest first. No ranking is
      // applied on top: you already chose these accounts, and re-sorting your
      // own choices by a score would be the app arguing with you.
      var mine = (st.follows && st.follows[who]) || {};
      var fl = [];
      Object.keys(st.payloads).forEach(function (cid) {
        var meta = st.postMeta[cid];
        if (!meta || meta.comment) return;
        if (!mine[st.creators[cid]]) return;
        var node = st.g.nodes.get(cid);
        if (node) fl.push({ node: node, idx: meta.idx });
      });
      fl.sort(function (a2, b2) { return b2.idx - a2.idx; });
      ranked = fl.map(function (r) { return { node: r.node, relevance: 0, bfsWeight: 0, amplifier: 0, contentNorm: 0, newest: true }; });
      maxRel = 1;
      if (!ranked.length) {
        head.appendChild(h('p', { class: 'smallnote', text: Object.keys(mine).length
          ? 'The people you follow have not posted yet.'
          : 'You are not following anyone yet. Open a profile and press Follow — it costs θ like every act here, and it enters no score: following is attention, and attention is not standing on this network.' }));
      }
    } else if (cogra) {
      var scores = cograFeed(st, vu);
      maxRel = scores.length ? Math.max.apply(null, scores.map(function (s) { return Math.abs(s.S); })) : 1;
      ranked = scores.map(function (s) {
        return { node: s.node, relevance: s.S, bfsWeight: 0, amplifier: 0, contentNorm: 0, cogra: s };
      });
    } else {
      var feed = E.rankFeed(st.g, vu, function (id) { return credibility(st, id); }, function (nid) { return st.creators[nid] || null; });
      ranked = feed.filter(function (f) { return f.relevance > 0 && st.payloads[f.node.id] && f.node.kind !== 'Comment'; });
      maxRel = ranked.length ? ranked[0].relevance : 1;
    }
    if (feedKind !== 'any') {
      ranked = ranked.filter(function (f2) {
        var meta = st.postMeta[f2.node.id] || {};
        if (feedKind === 'event') return !!meta.event;
        if (feedKind === 'stream') return !!meta.stream;
        if (feedKind === 'onair') return !!liveEntryFor(f2.node.id);
        return !meta.event && !meta.stream;      // 'post'
      });
    }

    // The attachment filter, applied after the ordering so it can never
    // change it — it only takes cards out.
    if (feedFile !== 'all') {
      ranked = ranked.filter(function (f2) {
        var k = mediaKinds(st, f2.node.id);
        if (feedFile === 'text') return !k.image && !k.video && !k.audio && !k.file;
        return !!k[feedFile];
      });
    }

    // A query filters the corpus; it does not rank it. The three ranking
    // buttons stay live underneath, and the order here is append order —
    // the same authority Newest uses — so nothing on screen claims to be a
    // fourth opinion about what matters.
    if (query) {
      var res = searchState(st, query);
      var total = res.posts.length + res.comments.length + res.people.length + res.tags.length;
      head.appendChild(h('p', { class: 'smallnote', text: total
        ? total + ' match' + (total === 1 ? '' : 'es') + ' for “' + query + '” · newest first · direct messages are never searched'
        : 'Nothing matches “' + query + '”. Posts, comments, handles and tags are searched; direct messages are not.' }));
      wrap.appendChild(head);
      if (res.people.length) {
        var pc = h('div', { class: 'card' }, h('p', { class: 'eyebrow', text: 'people' }));
        res.people.slice(0, 12).forEach(function (id) {
          var row = h('div', { class: 'chat-row' },
            avatar(id, 'avatar s'),
            h('div', { class: 'grow' }, h('b', { text: st.handles[id] }),
              h('div', { class: 'smallnote', text: 'standing ' + fmt(credibility(st, id), 4) })),
            followBtn(st, id, true),
            h('button', { class: 'btn small', text: 'Profile', onclick: function () { openProfile(id); } }));
          pc.appendChild(row);
        });
        wrap.appendChild(pc);
      }
      if (res.tags.length) {
        var tc = h('div', { class: 'card' }, h('p', { class: 'eyebrow', text: 'tags' }));
        var tr2 = h('div', { class: 'tagrow' });
        res.tags.slice(0, 20).forEach(function (n) { tr2.appendChild(h('span', { class: 'tagchip', text: n.label })); });
        tc.appendChild(tr2);
        wrap.appendChild(tc);
      }
      res.posts.slice(0, 30).forEach(function (r) {
        var node = st.g.nodes.get(r.cid);
        if (!node) return;
        var card = postCard(st, { node: node, relevance: 0, bfsWeight: 0, amplifier: 0, contentNorm: 0, newest: true }, 0, 1);
        // Results carry no data-cid: reportViews() sweeps every one of those in
        // the viewport and posts it to the host, which would turn scrolling a
        // result list into a record of what people searched for.
        card.removeAttribute('data-cid');
        wrap.appendChild(card);
      });
      res.comments.slice(0, 20).forEach(function (r) {
        wrap.appendChild(h('div', { class: 'card' },
          h('p', { class: 'eyebrow', text: 'comment by ' + (st.handles[st.creators[r.cid]] || '—') }),
          h('p', { style: 'margin:0' }, (st.payloads[r.cid] || '').slice(0, 220)),
          h('button', { class: 'btn small', style: 'margin-top:8px', text: 'Open in thread', onclick: function () { jumpTo(st, r.cid); } })));
      });
      return wrap;
    }

    if (!ranked.length) {
      head.appendChild(h('p', { class: 'smallnote', text: 'Empty: ranking runs from your own position, so nothing is reachable until you react, review, or vouch. Everything below the fold is waiting.' }));
    }
    wrap.appendChild(head);
    // One paid placement, after the third ranked item, never woven in deeper.
    // It is a card the feed carries, not a card the feed ranked: it has no
    // relevance line because there is no path to it and no score to print.
    var feedAds = adsFor(st, 'feed');
    ranked.slice(0, feedLimit).forEach(function (f, i) {
      wrap.appendChild(postCard(st, f, i + 1, maxRel));
      if (i === 2 && feedAds.length) wrap.appendChild(adCard(feedAds[0]));
    });
    if (ranked.length && ranked.length <= 3 && feedAds.length) wrap.appendChild(adCard(feedAds[0]));
    if (ranked.length > feedLimit) {
      wrap.appendChild(h('div', { style: 'text-align:center; margin:12px 0' },
        h('button', { class: 'btn', text: 'Show more (' + (ranked.length - feedLimit) + ')', onclick: function () { feedLimit += 30; render(); } })));
    }

    var seen = {};
    ranked.forEach(function (f) { seen[f.node.id] = 1; });
    var horizon = [];
    st.g.nodes.forEach(function (n) {
      if (n.kind === 'Content' && st.payloads[n.id] && !seen[n.id]) horizon.push(n);
    });
    // Not under Following either. That list is the accounts you chose; padding
    // it with everything you did not choose is the opposite of what was asked
    // for — it showed a viewer their own unfollowed posts under a heading
    // saying these were the people they follow.
    if (horizon.length && ['new', 'follow', 'old', 'talked', 'backed'].indexOf(feedMode) < 0
        && feedFile === 'all' && feedKind === 'any') {
      wrap.appendChild(h('div', { class: 'card', style: 'margin-top:14px' },
        h('p', { class: 'eyebrow', text: 'beyond your horizon — exists, not yet reachable in ≤4 hops (' + horizon.length + ')' })));
      horizon.slice(0, 15).forEach(function (n) {
        wrap.appendChild(postCard(st, { node: n, bfsWeight: 0, amplifier: 1, contentNorm: 0, relevance: 0 }, null, 1));
      });
    }
    return wrap;
  }

  // ── Paid placements ───────────────────────────────────────────────────────
  // Deliberately built from a different shape than a post. There is no node
  // id, no author, no relevance decomposition and no react/comment row — not
  // because those were left off, but because none of them exist: an advert is
  // not in the act log, so the protocol has nothing to say about it. The card
  // says so out loud, because a network claiming influence is commitment
  // cannot quietly sell attention next to it and stay honest.
  var adList = [];

  /**
   * Which commons tags has THIS reader engaged with?
   *
   * Computed here, in their browser, from the act log their browser already
   * has — because everything in this network is public, the question is
   * answerable locally and nobody has to be identified for targeting to work.
   * The host is never told the answer, no profile is stored anywhere, and this
   * still works in the offline sandbox where there is no server at all.
   */
  function myTags(st) {
    var out = {};
    if (!who || !st || !st.g) return out;
    // Content I acted on: reactions, comments, tags, and my own posts.
    var mine = {};
    st.g.edges.forEach(function (e) {
      if (e.src !== who) return;
      if (e.family === 'Opinion' || e.family === 'ReviewA' || e.family === 'TagA' || e.family === 'Publish') mine[e.tgt] = 1;
    });
    // …and the Type nodes those pieces of content were filed under.
    st.g.edges.forEach(function (e) {
      if (e.family !== 'TagT' || !mine[e.src]) return;
      var n = st.g.nodes.get(e.tgt);
      var label = (n && n.label ? n.label : e.tgt).toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (label) out[label] = 1;
    });
    return out;
  }

  /**
   * Does this advert apply to this reader, on this tab? Both halves are
   * optional: an advert that names nothing shows everywhere, which is the
   * honest default rather than a hidden one.
   */
  /**
   * Where is this reader, as far as their own device is concerned?
   *
   * The browser's timezone and language, nothing else. NOT their IP address:
   * this project keeps caller addresses for blocking abuse and promised, in
   * public and in a test, that they would never become a targeting input.
   * Aiming adverts by where somebody connects from is the surveillance
   * business this network argues against — so region targeting is answered by
   * the device describing itself, which it already does to every site.
   */
  function myRegion() {
    var out = {};
    try {
      var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      out.tz = tz.toLowerCase();                       // 'europe/berlin'
      out.area = tz.split('/')[0].toLowerCase();       // 'europe'
      out.city = (tz.split('/')[1] || '').toLowerCase();
    } catch (e) {}
    var lang = (navigator.language || '').toLowerCase();
    out.lang = lang.split('-')[0];                     // 'de'
    out.locale = lang;                                 // 'de-de'
    if (lang.indexOf('-') > 0) out.country = lang.split('-')[1];
    return out;
  }

  /** Content this reader has acted on — for post-level targeting. */
  function myTouched(st) {
    var out = {};
    if (!who || !st || !st.g) return out;
    st.g.edges.forEach(function (e) {
      if (e.src !== who) return;
      if (e.family === 'Opinion' || e.family === 'ReviewA' || e.family === 'TagA' || e.family === 'Publish') out[e.tgt] = 1;
    });
    return out;
  }

  /**
   * Does this advert apply to this reader, on this tab?
   *
   * Any single criterion matching is enough — an advertiser naming both a tag
   * and a region means "either", not "both", because the alternative is
   * advertisers accidentally aiming at nobody. Naming nothing shows it to
   * everyone, which is the honest default rather than a hidden one.
   *
   * Every branch reads either the public act log or this device's own locale.
   * The host sends the same list to everybody and is never told the answer.
   */
  function adApplies(ad, st, where) {
    var aim = ad.aim || ad;
    if (aim.placement && aim.placement.length && aim.placement.indexOf(where) < 0) return null;

    var any = (aim.tags && aim.tags.length) || (aim.people && aim.people.length)
      || (aim.posts && aim.posts.length) || (aim.regions && aim.regions.length);
    if (!any) return { why: null };

    // aimed at me by name
    if (aim.people && aim.people.indexOf(who) >= 0) {
      return { why: 'you were named directly by the advertiser' };
    }
    // aimed at people who engaged with a particular post
    if (aim.posts && aim.posts.length) {
      var touched = myTouched(st);
      for (var pi = 0; pi < aim.posts.length; pi++) {
        if (touched[aim.posts[pi]]) {
          return { why: 'you engaged with ' + aim.posts[pi] };
        }
      }
    }
    // aimed at a subject in the commons
    if (aim.tags && aim.tags.length) {
      var mine = myTags(st);
      for (var i = 0; i < aim.tags.length; i++) {
        if (mine[aim.tags[i]]) return { why: 'you have engaged with #' + aim.tags[i] };
      }
    }
    // aimed at a place, as this device describes itself
    if (aim.regions && aim.regions.length) {
      var r = myRegion();
      for (var ri = 0; ri < aim.regions.length; ri++) {
        var want = String(aim.regions[ri]).toLowerCase();
        if (want === r.lang || want === r.locale || want === r.country
            || want === r.area || want === r.city || want === r.tz
            || (r.tz && r.tz.indexOf(want) >= 0)) {
          return { why: 'your device reports ' + (r.tz || r.locale) + ', which the advertiser asked for' };
        }
      }
    }
    return null;
  }

  /** The advert(s) that apply here, most recent first, at most one. */
  function adsFor(st, where) {
    var out = [];
    for (var i = 0; i < adList.length && out.length < 1; i++) {
      var m = adApplies(adList[i], st, where);
      if (m) out.push({ ad: adList[i], why: m.why });
    }
    return out;
  }

  function adCard(entry) {
    var ad = entry.ad || entry;
    var card = h('div', { class: 'card ad-card' },
      h('p', { class: 'eyebrow' }, h('span', { class: 'ad-tag', text: 'PAID PLACEMENT' }), ' · bought, not earned'),
      h('p', { style: 'margin:6px 0 10px' }, ad.text));
    var a = h('a', { class: 'btn small', href: ad.url, target: '_blank', rel: 'noopener noreferrer nofollow', text: 'Open link ↗' });
    card.appendChild(h('div', { class: 'row' }, a));
    // Say why, always. An advert that can explain itself in one sentence is a
    // different thing from one that follows you and will not say how it found
    // you — and the answer here is short because the matching happened on this
    // device against a public log.
    if (entry.why) {
      card.appendChild(h('p', { class: 'smallnote' },
        'Shown because ' + entry.why + '. That match was made in this browser — from the public log and your own device settings. The host sends the same advert list to everyone and was never told who you are; where you connect from is never used.'));
    } else {
      card.appendChild(h('p', { class: 'smallnote', text: 'Shown to everyone here. This advert names no audience, so nothing about you was consulted.' }));
    }
    if (ad.byHandle) {
      card.appendChild(h('p', { class: 'smallnote', text: 'Bought by ' + ad.byHandle + ' for ' + (ad.paid || 0) + ' PEER, which was destroyed rather than paid to anyone.' }));
    }
    card.appendChild(h('p', { class: 'smallnote', text: 'This is not an act. It holds no standing, sits outside the graph, and changes nobody’s feed score — including its own, because it has none. Money buys this box and nothing else in the network.' }));
    return card;
  }
  function pollAds() {
    if (!REMOTE) return;
    fetch(API + '/api/ads', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !Array.isArray(d.ads)) return;
        var changed = d.ads.length !== adList.length;
        adList = d.ads;
        if (changed) render();
      })
      .catch(function () {});
  }

  /**
   * The event half of a content card: when, where, what entry costs, and the
   * two answers. Everything else on the card — reacting, commenting, quoting,
   * vouching — is the ordinary machinery, because an event mints a content
   * node exactly as a post does. That is the whole integration.
   */
  function eventPanel(st, cid, ev) {
    var going = (st.eventGoing && st.eventGoing[cid]) || {};
    var invited = (st.eventInvites && st.eventInvites[cid]) || {};
    var n = Object.keys(going).length;
    var mine = !!going[who];
    var box = h('div', { class: 'card', style: 'margin:8px 0; background:var(--card-2)' },
      h('p', { class: 'eyebrow', text: 'event' }));
    if (ev.at) {
      box.appendChild(h('div', { class: 'kv' }, h('span', { text: 'when' }),
        h('span', { class: 'num', text: new Date(ev.at).toLocaleString() })));
    }
    if (ev.place) box.appendChild(h('div', { class: 'kv' }, h('span', { text: 'where' }), h('span', { text: ev.place })));
    box.appendChild(h('div', { class: 'kv' }, h('span', { text: 'entry' }),
      h('span', { class: 'num', text: ev.fee > 0 ? fmt(ev.fee, 6) + ' ' + ev.cur : 'free' })));
    box.appendChild(h('div', { class: 'kv' }, h('span', { text: 'going' }),
      h('span', { class: 'num', text: n + (ev.cap ? ' / ' + ev.cap : '') })));

    var over = !!(ev.at && ev.at < Date.now());
    if (over) {
      box.appendChild(h('p', { class: 'smallnote', text: 'This has already happened — the door is closed.' }));
    }
    var row = h('div', { class: 'mini-form' });
    if (who && who !== ev.host && !over) {
      if (mine) {
        row.appendChild(h('button', {
          class: 'btn small', text: 'Withdraw',
          title: 'Leaving does not refund: the payment already moved, and this record does not reverse value.',
          onclick: function () {
            tryAct(who, { t: 'rsvp', from: who, cid: cid, on: false }, 'Withdrawn — the entry fee is not returned.');
          },
        }));
      } else {
        row.appendChild(h('button', {
          class: 'btn small primary',
          text: ev.fee > 0 ? 'Join · pay ' + fmt(ev.fee, 6) + ' ' + ev.cur : 'Join',
          title: ev.fee > 0
            ? 'The fee moves from you to the host. It mints nothing and changes no standing — here or theirs.'
            : 'Recorded, and in no score.',
          onclick: function () {
            // Ask the same function the host applies before claiming anything
            // happened. In the private sandbox nothing validates an act at
            // all, so this button used to toast 'Paid and joined.' at somebody
            // with no balance while the card still read 'going 0'.
            var why = st.tokenActError && st.tokenActError({
              t: 'rsvp', author: who, cid: cid, amt: ev.fee || 0, cur: ev.cur || '', to: ev.host,
            });
            if (why) { toast(why); return; }
            tryAct(who, { t: 'rsvp', from: who, cid: cid, on: true, amt: ev.fee || 0, cur: ev.cur || '', to: ev.host },
              ev.fee > 0 ? 'Paid and joined.' : 'Joined.');
          },
        }));
      }
    }
    if (who === ev.host) {
      var inv = h('select', {});
      st.ledgers.forEach(function (l) {
        if (l.id !== who && !l.deleted && !invited[l.id]) inv.appendChild(h('option', { value: l.id, text: st.handles[l.id] }));
      });
      row.appendChild(inv);
      row.appendChild(h('button', { class: 'btn small', text: 'Invite', onclick: function () {
        if (!inv.value) return;
        tryAct(who, { t: 'invite', from: who, to: inv.value, cid: cid }, 'Invited.');
      } }));
    }
    if (invited[who] && !mine) row.appendChild(h('span', { class: 'smallnote', text: 'you were invited' }));
    box.appendChild(row);
    box.appendChild(h('p', { class: 'smallnote', text: ev.fee > 0
      ? 'The fee is a transfer of tokens that already exist. It mints nothing, and neither paying nor being paid moves a standing or an epoch share — while money is moving between two accounts, engagement between them earns nothing either.'
      : 'Going is recorded and enters no score. Reactions and comments on this event are ordinary priced acts and do count, exactly as on any post.' }));
    return box;
  }

  /**
   * Is this broadcast on air right now, and can the reader get to it?
   *
   * liveList is the host's own answer — it is keyed by the stream's content
   * id — and until now no feed card looked at it. The only on-air signal in

  /**
   * Everything one person has published that carries music.
   *
   * Scans st.mediaMeta rather than st.creators, for two reasons that are not
   * about speed alone. The replay writes mediaMeta ONLY in the post branch, so
   * a comment, a stream and an event structurally cannot appear in it, and a
   * deleted post has its entry removed — there is no filtering to remember and
   * therefore none to forget. It is also the smaller map by two orders of
   * magnitude: measured against the published 754-act log, 12 keys against 249,
   * 0.0009 ms against 0.0102 ms, and the gap widens with the corpus.
   *
   * Ordered by first publication, deliberately. A revision replaces the media
   * on a post but leaves postMeta.idx at the genesis index, so this is the date
   * the release entered the record — not the date its files were last swapped.

  function songsOf(st, id) {
    var out = [];
    Object.keys(st.mediaMeta || {}).forEach(function (cid) {
      if (st.creators[cid] !== id) return;
      if (st.payloads[cid] === undefined) return;      // deleted, or its author left
      var meta = st.postMeta[cid];
      if (!meta) return;
      var entries = st.mediaMeta[cid] || [];
      var tracks = entries.filter(isAudioEntry);
      if (!tracks.length) return;
      out.push({
        cid: cid, idx: meta.idx, ts: meta.ts, tracks: tracks,
        cover: entries.filter(function (e) { return isImageEntry(e) && e.cv; })[0] || null,
        title: String(st.payloads[cid] || '').trim(),
      });
    });
    out.sort(function (a, b) { return b.idx - a.idx; });
    return out;
  }

  /**
   * A person's music, on their page.

   * ONE player over every track they have released, not one player per
   * release. That is not a layout preference: audioPlaylist fetches a whole
   * file on mount to decode its waveform, so a player per release downloads
   * the entire catalogue the moment somebody opens the page — measured, four
   * players pulled four complete files with nothing played. The releases are
   * expressed as rows AROUND the single player instead.
   *

    var rows = songsOf(st, id);

    rows.forEach(function (r) {

    box.appendChild(h('p', { class: 'eyebrow', text: 'music · ' + rows.length + ' release'
      + (rows.length === 1 ? '' : 's') + ' carrying audio, ' + tracks.length + ' track'
      + (tracks.length === 1 ? '' : 's') }));

  /** What a post carries, for the attachment filter. */
  function mediaKinds(st, cid) {
    var out = {};
    (st.mediaMeta[cid] || []).forEach(function (m) {

      else if (mime.indexOf('audio/') === 0) out.audio = true;

  // ── Network view: deterministic force layout + pan/zoom + filters ──
  function hash32(s) {
    var hh = 2166136261;
    for (var i = 0; i < s.length; i++) { hh ^= s.charCodeAt(i); hh = Math.imul(hh, 16777619) >>> 0; }
    return hh;
  }
  function netData(st) {
    var nodes = [], keep = {};
    if (netScope === 'ego') {
      // undirected 2-hop neighborhood of the current identity (person-folded)
      var adj = {};
      st.g.edges.forEach(function (e) {
        (adj[e.src] = adj[e.src] || []).push(e.tgt);
        (adj[e.tgt] = adj[e.tgt] || []).push(e.src);
      });
      var frontier = [who, 'prof_' + who], depth = 0;
      frontier.forEach(function (id) { keep[id] = 1; });
      while (depth < 2 && frontier.length) {
        var next = [];
        frontier.forEach(function (id) {
          (adj[id] || []).forEach(function (nb) { if (!keep[nb]) { keep[nb] = 1; next.push(nb); } });
        });
        frontier = next; depth++;
      }
      st.g.nodes.forEach(function (n) { if (keep[n.id]) nodes.push(n); });
    } else {
      st.g.nodes.forEach(function (n) {
        if (netScope === 'social' && n.kind === 'Type') return;
        keep[n.id] = 1; nodes.push(n);
      });
    }
    var edges = st.g.edges.filter(function (e) {
      return keep[e.src] && keep[e.tgt] && e.weight >= netMinW;
    });
    return { nodes: nodes, edges: edges };
  }
  function layoutGraph(nodes, edges) {
    var key = netScope + '|' + netMinW + '|' + nodes.length + '|' + edges.length + '|' + world.acts.length + '|' + who;
    if (netLayoutCache.key === key && netLayoutCache.pos) return netLayoutCache.pos;
    var pos = {};
    nodes.forEach(function (n) {
      var hh = hash32(n.id);
      var ang = (hh % 6283) / 1000;
      var rad = 60 + (hh % 977) * 0.28;
      pos[n.id] = { x: Math.cos(ang) * rad, y: Math.sin(ang) * rad * 0.8 };
    });
    var iters = nodes.length > 120 ? 90 : 160;
    for (var it = 0; it < iters; it++) {
      var t = 1 - it / iters;
      var disp = {};
      nodes.forEach(function (n) { disp[n.id] = { x: 0, y: 0 }; });
      for (var i = 0; i < nodes.length; i++) {
        for (var j = i + 1; j < nodes.length; j++) {
          var a = pos[nodes[i].id], b = pos[nodes[j].id];
          var dx = a.x - b.x, dy = a.y - b.y;
          var d2 = dx * dx + dy * dy + 0.01, d = Math.sqrt(d2);
          var f = 2200 / d2;
          dx = dx / d * f; dy = dy / d * f;
          disp[nodes[i].id].x += dx; disp[nodes[i].id].y += dy;
          disp[nodes[j].id].x -= dx; disp[nodes[j].id].y -= dy;
        }
      }
      edges.forEach(function (e) {
        var a = pos[e.src], b = pos[e.tgt];
        if (!a || !b) return;
        var dx = b.x - a.x, dy = b.y - a.y;
        var d = Math.sqrt(dx * dx + dy * dy) + 0.01;
        var f = (d - 95) * 0.025;
        dx = dx / d * f; dy = dy / d * f;
        disp[e.src].x += dx; disp[e.src].y += dy;
        disp[e.tgt].x -= dx; disp[e.tgt].y -= dy;
      });
      nodes.forEach(function (n) {
        var dd = disp[n.id], p = pos[n.id];
        dd.x -= p.x * 0.035; dd.y -= p.y * 0.035;
        var len = Math.sqrt(dd.x * dd.x + dd.y * dd.y) + 1e-9;
        var cap = 16 * t + 1;
        p.x += dd.x / len * Math.min(len, cap);
        p.y += dd.y / len * Math.min(len, cap);
      });
    }
    netLayoutCache = { key: key, pos: pos };
    return pos;
  }
  function exportGraphJSON(st) {
    var data = {
      format: 'peer-network-graph/1',
      generatedFromActs: world.acts.length,
      epoch: st.epochNow,
      constants: { theta: THETA, nu: NU, wall: SAFE_FLOOR, door: PART_FLOOR, feedDepth: 4 },
      nodes: [],
      edges: st.g.edges.map(function (e) {
        return { id: e.id, family: e.family, src: e.src, tgt: e.tgt, pd: e.pd, pi: e.pi, tau: e.tau, epoch: e.epoch, weight: e.weight, sign: e.sign, detScore: e.score };
      }),
      standings: st.ledgers.filter(function (l) { return !l.deleted; }).map(function (l) { return { id: l.id, burnBal: l.burnBal, actCount: l.actCount, x: st.xById[l.id] || 0 }; }),
    };

  /**
   * The Network view's summary — what a reader needs before a picture.
   *
   * Every figure here is measured from the record, and each one names WHICH
   * measurement it is, because the obvious ones disagree with each other by
   * large factors and a bare number would be a guess dressed as a fact:
   *
   *   Reach, undirected and person-folded: for one account here, 39 peers.
   *   Reach, through the protocol's own directed primitive: 5.
   *
   * The second is the one this page reports, because it is the mechanism that
   * actually decides the feed — "transported commitment" is directional, and
   * an undirected count would tell somebody they reach people who cannot see
   * them. Measured across this network: 25 of 51 accounts reach nobody at all.
   */
  function netStats(st, me, reach) {
    var live = st.ledgers.filter(function (l) { return !l.deleted; });
    var peers = 0, nodes = 0;
    reach.forEach(function (r, id) {
      if (!(r.pos > 0)) return;
      nodes += 1;
      var n = st.g.nodes.get(id);
      if (n && n.kind === 'Actor' && id !== me) peers += 1;
    });
    // Rank, reported as a band. Twenty of the fifty-one accounts here sit on
    // exactly tied standings — eight of them share one value — so a bare
    // "top N%" would be arbitrary for two fifths of the roster.
    var mine = st.xById[me] || 0;
    var above = 0, tied = 0;
    live.forEach(function (l) {
      var x = st.xById[l.id] || 0;
      if (x > mine) above += 1; else if (x === mine && l.id !== me) tied += 1;
    });
    return {
      peers: peers, nodes: nodes, total: live.length,
      edges: st.g.edges.length,
      rank: above + 1, tied: tied, of: live.length,
      standing: NU * mine,

  /**
   * Advice, and only the kind that survived being checked.
   *
   * Two things the brief asked for are not derivable here and are left out
   * rather than approximated. Topic concentration: 22 tag edges over 256
   * pieces of content, and a tag node is a dead end in the routing graph, so
   * "connect to X and reach grows by N%" evaluates to exactly zero every time
   * — it was run, not assumed. And a day-based "dormant" count would be a
   * fiction, because a third of this log carries no timestamp at all.
   *
   * What IS derivable is the one that matters most: remove a neighbour and
   * re-run the reach, and see what is left. The shares do not sum to a hundred

      return out;
    }
    // Neighbours: actors one hop out in the directed register.
    var neigh = [];
    reach.forEach(function (r, id) {
      var n = st.g.nodes.get(id);
      if (r.pos > 0 && n && n.kind === 'Actor' && id !== me) neigh.push(id);
    });
    // The counterfactual, run rather than estimated. Capped because it is one
    // BFS per neighbour and the graph is walked in full each time.
    var worst = null;

      var pruned = { nodes: new Map(), edges: [] };
      st.g.nodes.forEach(function (n, k) { if (k !== id && k !== 'prof_' + id) pruned.nodes.set(k, n); });
      st.g.edges.forEach(function (e) {
        if (e.src === id || e.tgt === id || e.src === 'prof_' + id || e.tgt === 'prof_' + id) return;
        pruned.edges.push(e);

  /**
   * Events.
   *
   * Its own screen because an event has a shape a feed cannot show: a time
   * that has or has not passed, a place, a price, a guest list. What it is
   * NOT is a separate world — every card here is the same content node the
   * feed ranks, and reacting or commenting on one is the ordinary priced act
   * that moves standing. Only the going and the paying are unscored.
   */
  // Geek chats — the same dm acts and threads as simple mode, lab styling.
  /**
   * Every conversation on the network, not only yours.
   *
   * The messages were always public — a dm act's text sits in /api/acts, in
   * every mirror and in the published archive — but until now no screen showed
   * one to somebody who was not in it, and people write differently when a
   * thing is merely technically readable than when it is browsable. That gap
   * is closed here on purpose, at the owner's decision, so the app must say so
   * where somebody is about to type rather than in a footnote.
   */
  function allThreads(st) {
    var out = {};
    (st.dms || []).forEach(function (m) {
      var key = [m.from, m.to].sort().join('|');
      (out[key] || (out[key] = [])).push(m);
    });
    return out;
  }

  // ══ Wallet ═══════════════════════════════════════════════════════════════
  //
  // The point of this screen is that a balance is never asked to be believed.
  // Every number on it is followed by the arithmetic that produced it and the
  // acts it came from, because "you earned 2,341 PEER" is a claim and
  // "because bob commented on c123, weight 1.2 x damping 1.00 x their rate
  // factor 0.65" is something anyone holding the log can check.

  /** 1st, 2nd, 3rd, 4th — "their 2th" read like a bug, because it was one. */
  function ordinal(n) {
    var mod100 = n % 100;
    if (mod100 >= 11 && mod100 <= 13) return n + 'th';
    return n + ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
  }

  // ══ Every value movement, in order ═══════════════════════════════════════
  //
  // Derived from the log rather than kept as a second ledger, so it cannot

  /**
   * One line of the record, with everything that can be a link made one.
   *
   * The record is where people catch up, so a dead end in it is a dead end in
   * the whole app: an act that names a person or a post should take you there.
   * Three sources of links, and none of them guesses:
   *   - the actor, from `who`
   *   - whatever the line names, from `refs` recorded at replay time — matching
   *     handles against prose would link "a", "cam" and "Echo" inside ordinary
   *     words, so the labels come from the same strings that built the line
   *   - any cN written into the text, via richText
   */
  function chronRow(st, c) {
    var openable = function (id) {
      if (!id) return false;
      if (id.indexOf('prof_') === 0) return !!st.ledgerById[id.slice(5)];
      if (st.ledgerById[id]) return true;
      return !!resolvePost(st, id);
    };
    var row = h('div', { class: openable(c.to) ? 'chron-jump' : '' });

    if (c.who) {
      row.appendChild(h('button', {
        class: 'who-link', text: st.handles[c.who] || c.who,
        title: 'Open ' + (st.handles[c.who] || c.who) + '’s profile',
        onclick: function (ev) { ev.stopPropagation(); openProfile(c.who); },
      }));
      row.appendChild(document.createTextNode(' '));
    }

    // Split the line on each recorded label, linking those spans exactly.
    var rest = String(c.line == null ? '' : c.line);
    (c.refs || []).forEach(function (r) {
      if (!r || !r.label) return;
      var at = rest.indexOf(r.label);
      if (at < 0) return;
      richText(st, rest.slice(0, at)).forEach(function (n) { row.appendChild(typeof n === 'string' ? document.createTextNode(n) : n); });
      if (openable(r.id)) {
        row.appendChild(h('button', {
          class: 'who-link', text: r.label, title: 'Open ' + r.label,
          onclick: function (ev) { ev.stopPropagation(); jumpTo(st, r.id); },
        }));
      } else {
        row.appendChild(document.createTextNode(r.label));
      }
      rest = rest.slice(at + r.label.length);
    });
    richText(st, rest).forEach(function (n) { row.appendChild(typeof n === 'string' ? document.createTextNode(n) : n); });

    if (openable(c.to)) {
      row.appendChild(h('span', { class: 'jump-hint', text: ' ↗ open' }));
      row.addEventListener('click', function () { jumpTo(st, c.to); });
    }
    return row;
  }

      ['new', 'Append order', 'authoritative — the log as written, newest first'],
      ['l1', 'L1 ranking', 'S = W · (1 + standing/ν) · ‖T‖F'],
      ['cogra', 'CoGra ranking', 'k-disjoint paths — no standing enters'],
      ['follow', 'Following', 'your chosen accounts, newest first, unranked'],
      ['old', 'Oldest first', 'append order, from the beginning'],
      ['talked', 'Most discussed', 'by comments — each one a priced act'],
      ['backed', 'Most backed', 'by reactions — commitment spent, not attention'],
    ];
    var card = h('div', { class: 'card' }, h('p', { class: 'eyebrow', text: 'Sorting' }));
    MODES.forEach(function (m) {
      card.appendChild(h('button', { class: 'rail-opt' + (feedMode === m[0] ? ' on' : ''), 'aria-pressed': feedMode === m[0] ? 'true' : 'false',
        onclick: function () { feedMode = m[0]; feedLimit = 30; saveView(); render(); } },
        h('b', { text: m[1] }), h('span', { class: 'smallnote', text: m[2] })));
    });
    return card;
  }

  /**
   * Content-form filters: what a thing IS, then what it CARRIES. Filters only
   * remove cards — whichever sort is running stays the one in charge.
   */
  function railFilterCard() {
    var card = h('div', { class: 'card' }, h('p', { class: 'eyebrow', text: 'Filters' }));
    card.appendChild(h('p', { class: 'smallnote', style: 'margin:0', text: 'Content form' }));
    var whats = [['any', 'All kinds'], ['post', 'Notes'], ['event', 'Events'], ['stream', 'Broadcasts'], ['onair', 'Live now']];
    var wbar = h('div', { class: 'uline' });
    whats.forEach(function (k) {
      wbar.appendChild(h('button', { class: feedKind === k[0] ? 'on' : '', text: k[1],
        onclick: function () { feedKind = k[0]; feedLimit = 30; saveView(); render(); } }));
    });
    card.appendChild(wbar);
    card.appendChild(h('p', { class: 'smallnote', style: 'margin:8px 0 0', text: 'Carrying' }));
    var kinds = [['all', 'Everything'], ['image', 'Images'], ['video', 'Video'], ['audio', 'Audio'], ['file', 'Files'], ['text', 'Text only']];
    var fbar = h('div', { class: 'uline' });
    kinds.forEach(function (k) {
      fbar.appendChild(h('button', { class: feedFile === k[0] ? 'on' : '', text: k[1],
        onclick: function () { feedFile = k[0]; feedLimit = 30; saveView(); render(); } }));
    });
    card.appendChild(fbar);
    return card;
  }

  function alertsCard(st) {
    var notifs = notificationsFor(st, who);
    if (!notifs.length) return null;
    var freshN = unseenCount(notifs);
    var card = h('div', { class: 'card' },
      h('h2', {}, 'Alerts', freshN ? h('span', { class: 'standing-chip', style: 'margin-left:8px', text: freshN + ' new' }) : null));
    notifs.slice(0, 8).forEach(function (n) {
      card.appendChild(h('p', { class: 'smallnote', style: n.idx > seenMark ? 'border-left:2px solid var(--ember); padding-left:7px' : '' },
        h('b', {}, st.handles[n.who] || n.who), ' ' + (NOTIF_VERB[n.kind] || n.kind) +
        (n.text ? ' — “' + n.text.slice(0, 40) + '”' : '')));
    });
    markSeen(notifs);
    return card;
  }

  /**
   * The side rails as a board of widgets.
   *
   * The standings table came out at the owner's request. What replaces it is
   * the same question asked differently — what is this place made of, and how
   * old is it — answered from timestamps and tag edges that are already in the
   * log. Nothing here is a new measurement: there is no session timer and no
   * attention counter anywhere in this network, and none was added to fill
   * these cards.
   */
  function tagsWidget(st) {
    var count = {}, last = {};
    Object.keys(st.payloads).forEach(function (cid) {
      var meta = st.postMeta[cid];
      tagsOf(st, cid).forEach(function (t) {
        count[t] = (count[t] || 0) + 1;
        var when = meta && meta.ts ? meta.ts : 0;
        if (when > (last[t] || 0)) last[t] = when;
      });
    });
    var top = Object.keys(count).sort(function (a, b) { return count[b] - count[a]; }).slice(0, 10);
    if (!top.length) return null;
    var card = h('div', { class: 'card' },
      h('h2', { text: 'Tags in use' }),
      h('p', { class: 'smallnote', text: 'Every tag anyone has attached, and how many pieces of content carry it.' }));
    top.forEach(function (t) {
      card.appendChild(h('div', { class: 'kv' },
        h('span', { text: t }),
        h('span', { class: 'num', text: String(count[t]) })));
    });
    return card;
  }

  /** How old the things here are — from the stamps the acts carry. */
  function ageWidget(st) {
    var now = Date.now();
    var first = 0, newest = 0;
    world.acts.forEach(function (a) {
      if (typeof a.ts !== 'number') return;
      if (!first || a.ts < first) first = a.ts;
      if (a.ts > newest) newest = a.ts;
    });
    function span(ms) {
      if (!ms) return '—';
      var d = Math.floor(ms / 86400000);
      if (d >= 1) return d + (d === 1 ? ' day' : ' days');
      var hrs = Math.floor(ms / 3600000);
      if (hrs >= 1) return hrs + (hrs === 1 ? ' hour' : ' hours');
      return Math.max(1, Math.floor(ms / 60000)) + ' min';
    }
    var mineFrom = 0;
    world.acts.forEach(function (a) {
      if (a.t === 'register' && a.id === who && typeof a.ts === 'number' && !mineFrom) mineFrom = a.ts;
    });
    var card = h('div', { class: 'card' }, h('h2', { text: 'Age' }));
    card.appendChild(h('div', { class: 'kv' }, h('span', { text: 'this network' }), h('span', { class: 'num', text: first ? span(now - first) : '—' })));
    if (mineFrom) card.appendChild(h('div', { class: 'kv' }, h('span', { text: 'your handle' }), h('span', { class: 'num', text: span(now - mineFrom) })));
    card.appendChild(h('div', { class: 'kv' }, h('span', { text: 'last act' }), h('span', { class: 'num', text: newest ? relAgo(newest) : '—' })));
    card.appendChild(h('div', { class: 'kv' }, h('span', { text: 'acts recorded' }), h('span', { class: 'num', text: String(world.acts.length - 1) })));
    card.appendChild(h('p', { class: 'smallnote', text: 'Measured from the stamps in the record. Nothing here counts time spent looking — this network does not collect that.' }));
    return card;
  }

  /** What the place is made of right now. */
  function shapeWidget(st) {
    var people = st.ledgers.filter(function (l) { return !l.deleted; }).length;
    var posts = 0, comments = 0;
    Object.keys(st.payloads).forEach(function (cid) {
      var meta = st.postMeta[cid];
      if (meta && meta.comment) comments++; else posts++;
    });
    var card = h('div', { class: 'card' }, h('h2', { text: 'The network' }));
    [['people', people], ['posts', posts], ['comments', comments],
      ['edges', st.g.edges.length], ['epoch', st.epochNow]].forEach(function (r) {
      card.appendChild(h('div', { class: 'kv' }, h('span', { text: r[0] }), h('span', { class: 'num', text: String(r[1]) })));
    });
    return card;
  }

  function standingsCard(st) {
    var table = h('table', { class: 'standings' },
      h('tr', {}, h('th', { text: 'peer' }), h('th', { class: 'r', text: 'rate' }), h('th', { class: 'r', text: 'standing' }), h('th', { text: '' })));
    st.ledgers.slice().sort(function (a, b) { return (st.xById[b.id] || 0) - (st.xById[a.id] || 0); }).forEach(function (l) {
      if (l.deleted) return;
      var row = h('tr', { class: l.id === who ? 'me' : '' },
        h('td', {}, st.handles[l.id] + (st.pinHash[l.id] ? ' 🔒' : ''), ' ', deltaChip(l.id, st)),
        h('td', { class: 'r num', text: fmt(l.burnBal / Math.max(l.actCount, 1), 3) }),
        h('td', { class: 'r num', text: fmt(credibility(st, l.id), 4) }),
        h('td', {}));
      row.addEventListener('click', function () { openProfile(l.id); });
      table.appendChild(row);
    });
    return h('div', { class: 'card' }, h('h2', { text: 'Standings' }), table,
      h('p', { class: 'smallnote', text: 'ν · x*, the conserved mediant of transported (balance, count) pairs. Click a peer for their profile.' }));
  }

  function epochCard(st) {
    var dActs = Object.keys(st.deltaActs).reduce(function (s, k) { return s + st.deltaActs[k]; }, 0);
    var gates = E.evaluateGates(st.ledgers, st.solved.x, st.dmap);
    return h('div', { class: 'card' },
      h('h2', { text: 'Epoch ' + st.epochNow }),
      h('p', { class: 'smallnote' }, dActs + ' act' + (dActs === 1 ? '' : 's') + ' pending · projected stamp ',
        h('span', { class: 'num', text: dActs ? fmt(gates.epochStamp, 3) : '—' }), ' vs door ' + PART_FLOOR),
      h('div', {},
        h('span', { class: 'gate ' + (gates.w2bPass ? 'pass' : 'fail'), text: 'W2b door' }),
        h('span', { class: 'gate ' + (gates.w2a.every(function (x) { return x.pass; }) ? 'pass' : 'fail'), text: 'W2a wall' })),
      h('button', { class: 'btn', style: 'margin-top:8px', text: 'Close epoch ' + st.epochNow, onclick: function () {
        var stNow = replay();
        Object.keys(stNow.xById).forEach(function (id) { prevX[id] = stNow.xById[id]; });
        pushAct({ t: 'closeEpoch', epoch: stNow.epochNow }, function () {
          toast('Epoch closed and stamped. Tenure advances; the self-edge bond re-reads standing.');
        });
      } }),
      h('p', { class: 'smallnote', style: 'margin-top:8px', text: 'Closing stamps writers with final reduced standing, checks wall ' + fmt(SAFE_FLOOR, 3) + ' and door ' + PART_FLOOR + ', advances self-edge tenure.' }));
  }

  function iFollow(st, id) {
    return !!(st.follows && st.follows[who] && st.follows[who][id]);
  }

  /** Follow / unfollow, priced like every other act and scored like none. */
  function followBtn(st, id, small) {
    if (!who || id === who || !st.ledgerById[id]) return null;
    var on = iFollow(st, id);
    return h('button', {
      class: 'btn' + (small ? ' small' : '') + (on ? '' : ' primary'),
      text: on ? 'Following' : 'Follow · −θ',
      title: on ? 'Stop following. Recorded as an act; it is in no score.'
        : 'Follow. Free, and in no score — θ is itself a standing input, so a follow must not spend one. Following is attention, and attention is not standing here.',
      onclick: function () {
        tryAct(who, { t: 'follow', from: who, to: id, on: !on },
          on ? 'No longer following.' : 'Following — free, and in no score. Their posts now have a feed of their own.');
      },
    });
  }

  /**
   * Settings — one door for everything about the account.
   *
   * These controls were spread over a folded 'account and security' block on
   * the Profile tab, the lock banner, and two places in the simple mode. They
   * are all the same question — who can act as this handle — so they live in
   * one drawer now, reachable from the Profile tab and from the identity card.
   * Delete account is the only red button in the app, and it is last.
   */
  function settingsDrawer() {
    var st = replay();
    if (!who || !st.ledgerById[who]) return;
    var overlay = document.getElementById('overlay');
    overlay.innerHTML = '';
    function close() { overlay.innerHTML = ''; }
    var secured = !!st.pinHash[who];

    function group(title, note, buttons) {
      var g = h('div', { class: 'sect' }, h('p', { class: 'eyebrow', text: title }));
      var row = h('div', { class: 'mini-form persistent', style: 'margin-top:6px' });
      buttons.filter(Boolean).forEach(function (b) { row.appendChild(b); });
      g.appendChild(row);
      if (note) g.appendChild(h('p', { class: 'smallnote', text: note }));
      return g;
    }

    var drawer = h('div', { class: 'drawer' },
      h('button', { class: 'btn small ghost', text: '\u2190 close', onclick: close }),
      h('h3', { text: 'Settings' }),
      h('p', { class: 'smallnote', text: st.handles[who] + (secured ? ' \u00b7 PIN set' : ' \u00b7 no PIN \u2014 anyone knowing this name can act as you') }));

    drawer.appendChild(group('How you appear', 'Bio, link and picture are self-declared payload — carried by the record, read by no formula.', [
      h('button', { class: 'btn small primary', text: 'Edit profile', onclick: function () { close(); profileFlow(st); } }),
    ]));

    drawer.appendChild(group('Who can act as you',
      'A PIN is a shared secret whose hash is published; a passkey is not. The recovery code is the one way back into a handle whose PIN is gone that does not need the operator.', [
      h('button', { class: 'btn small' + (secured ? '' : ' primary'), text: secured ? 'Change PIN' : 'Set PIN',
        onclick: function () { close(); setPinFlow(st, secured); } }),
      passkeySupported ? h('button', { class: 'btn small', text: '+ Passkey', onclick: function () { close(); addPasskey(st); } }) : null,
      h('button', { class: 'btn small', text: 'Recovery code', onclick: function () { close(); recoveryFlow(st); } }),
      REMOTE ? h('button', { class: 'btn small', text: 'Contact address', onclick: function () { close(); contactFlow(); } }) : null,
    ]));

    drawer.appendChild(group('Reserve', 'Burning is the only way in: every act debits θ from the reserve and raises your act count.', [
      h('button', { class: 'btn small primary', text: 'Burn bitcoin \u2192', onclick: function () { burnDialog(); } }),
    ]));

    drawer.appendChild(group('Leaving',
      'Deletion is a tombstone act plus a byte redaction: your payloads go, the counters and other people\u2019s commentary stay. It cannot be undone.', [
      h('button', { class: 'btn small danger', text: 'Delete account', onclick: function () { close(); deleteAccountFlow(st); } }),
    ]));

    overlay.appendChild(h('div', { class: 'scrim', onclick: close }));
    overlay.appendChild(drawer);
    var first = drawer.querySelector('button');
    if (first) first.focus();
  }

  function openProfile(id) {
    var st = replay();
    var l = st.ledgerById[id];
    if (!l) return;
    var overlay = document.getElementById('overlay');
    overlay.innerHTML = '';
    function close() { overlay.innerHTML = ''; }
    var given = [], received = [];
    for (var k in st.bundles) {
      var b = st.bundles[k];
      var pd = Math.max(-1, Math.min(1, b.pd)), pi = Math.max(-1, Math.min(1, b.pi));
      var live = pd > 0 && pi > 0;
      var line = { other: b.src === id ? b.rcp : b.src, coeff: live ? Math.sqrt(pd * pi) : 0, live: live };
      if (b.src === id) given.push(line); else if (b.rcp === id) received.push(line);
    }
    var prof = (st.profiles && st.profiles[id]) || null;
    var bond = credibility(st, id) / (NU + credibility(st, id));
    var drawer = h('div', { class: 'drawer' },
      h('button', { class: 'btn small ghost', text: '← close', onclick: close }),
      avatar(id),
      h('h3', { text: st.handles[id] + (st.pinHash[id] ? ' 🔒' : '') }),
      h('span', { class: 'standing-chip', text: 'standing ' + fmt(credibility(st, id), 4) }),
      // Self-declared, and labelled as such: everything else on this card is
      // derived from the record, this part is simply what they typed.
      prof && prof.bio ? h('p', { class: 'sect', style: 'margin:10px 0 0', text: prof.bio }) : null,
      prof && prof.link ? h('p', { class: 'sect', style: 'margin:4px 0 0' },
        h('a', { href: prof.link, target: '_blank', rel: 'noopener noreferrer nofollow', text: prof.link })) : null,
      h('div', { class: 'mini-form sect' },
        followBtn(st, id, true),
        h('button', { class: 'btn small', text: 'Guide →', title: 'What a standing is, and what moves it.',
          onclick: function () { close(); tab = 'profile'; lqView = 'you'; saveView(); render(); } }),
        (function () {
          if (id !== who) return null;
          return h('button', { class: 'btn small', text: prof ? 'Edit profile' : 'Add a profile', onclick: function () { profileFlow(st); } });
        })(),
        (function () {
          var n = st.followers && st.followers[id] ? Object.keys(st.followers[id]).length : 0;
          var f = st.follows && st.follows[id] ? Object.keys(st.follows[id]).length : 0;
          return h('span', { class: 'smallnote', text: n + ' following them · ' + f + ' followed — counted, never scored' });
        })()),
      h('dl', { class: 'ledger sect' },
        h('dt', { text: 'reserve' }), h('dd', { class: 'num', text: fmt(l.burnBal, 3) }),
        h('dt', { text: 'acts N' }), h('dd', { class: 'num', text: String(l.actCount) }),
        h('dt', { text: 'rate' }), h('dd', { class: 'num', text: fmt(l.burnBal / Math.max(l.actCount, 1), 3) }),
        h('dt', { text: 'self-bond p_i' }), h('dd', { class: 'num', text: fmt(bond, 3) }),
        h('dt', { text: 'acts this epoch' }), h('dd', { class: 'num', text: String(st.deltaActs[id] || 0) })));
    function vsect(title, list, dir) {
      var s = h('div', { class: 'sect' }, h('p', { class: 'eyebrow', text: title }));
      if (!list.length) s.appendChild(h('p', { class: 'smallnote', text: 'none yet' }));
      list.forEach(function (v) {
        s.appendChild(h('div', { class: 'vouchline' },
          h('span', {}, (dir === 'out' ? '→ ' : '← ') + (st.handles[v.other] || v.other)),
          h('span', { class: 'num', text: v.live ? 'c ' + fmt(v.coeff, 3) : 'folded out' })));
      });
      return s;
    }
    var music = musicSection(st, id, false);
    if (music) drawer.appendChild(music);
    drawer.appendChild(vsect('vouches given', given, 'out'));
    drawer.appendChild(vsect('vouches received', received, 'in'));
    if (id !== who) {
      drawer.appendChild(h('div', { class: 'sect' },
        h('button', { class: 'btn small', text: 'Chat with ' + st.handles[id], onclick: function () {
          close();
          chatPeer = id;
          if (mode === 'geek') { tab = 'chat'; } else { lqView = 'chats'; }
          save(); render();
        } })));
      var p = slider('support', 0.7), r = slider('conviction', 0.7);
      var sect = h('div', { class: 'sect' },
        h('p', { class: 'eyebrow', text: 'vouch for ' + st.handles[id] }));
      sect.appendChild(vouchEffect(st, who, id));
      sect.appendChild(h('div', { class: 'mini-form' }, p.row, r.row,
        h('button', { class: 'btn small primary', text: 'Vouch · −θ', onclick: function () {
          close();
          tryAct(who, { t: 'opinion', author: who, target: 'prof_' + id, p: p.value(), r: r.value() },
            'Vouch recorded — a positive folded Opinion on a profile compiles a person-vouch. Your rate now flows to ' + st.handles[id] + '.');
        } })));
      drawer.appendChild(sect);
    }
    overlay.appendChild(h('div', { class: 'scrim', onclick: close }));
    overlay.appendChild(drawer);
  }

  markStandalone();
  guardExternalLinks();
  offerInstall();
  // What this device is holding, read from the cache itself before the first
  // paint has anything to claim. offlineSizes stays null until it answers, and
  // the control says 'checking' rather than 'not saved' in the meantime.
  if (offlineAvailable()) {
    offlineScan().then(function () { if (safeToRepaint()) render(); });
  } else {
    offlineSizes = {};
  }

  boot();
})();
</script>
