        // provenance, so it says so rather than sitting in the list's voice.
        function poolRow(p, sharing, foundById) {
          var rp = BigInt(p.resPeerRaw || '0'), rb = BigInt(p.resBtcRaw || '0');
          var ts = BigInt(p.totalSharesRaw || '0');
          // Every sentence about this pool says its id, because the id is the
          // identity; the name is only what it is called.
          var label = (p.name ? '\u201c' + p.name + '\u201d' : 'the unnamed pool') + ' #' + p.id;
          var box = h('div', {});
          var kv = h('div', { class: 'kv' },
            h('span', { text: (p.name || '(no name)') + ' \u00b7 #' + p.id }),
            h('b', { class: 'num', text: ocFmt(rp, pdec) + ' PEER / ' + ocFmt(rb, bdec) + ' BTC' }));
          if (rp > 0n && rb > 0n) {
            // Display-only float; the raw integers above are the truth.
            var px = (Number(rb) / Math.pow(10, bdec)) / (Number(rp) / Math.pow(10, pdec));
            kv.appendChild(h('span', { text: 'price' }));
            kv.appendChild(h('b', { class: 'num', text: '1 PEER = ' + (px >= 0.001 ? Math.round(px * 1e8) / 1e8 : px.toExponential(3)) + ' BTC' }));
          }
          box.appendChild(kv);
          // Beside every price, because a price is the thing people read
          // meaning into. A pool's ratio is whatever its opener put in,
          // moved by whoever has traded since \u2014 and neither this card nor
          // the token card above can see how the PEER supply is held, so
          // nothing here establishes that anybody but one holder has ever
          // agreed to this number.
          if (rp > 0n && rb > 0n) box.appendChild(h('p', { class: 'smallnote', text: 'That price is this pool\u2019s own ratio and nothing more: what its opener deposited, moved by whoever has traded since. It is not a market price, and this page cannot show how the PEER supply is held \u2014 a ratio one holder chose is a number, not a valuation.' }));
          // Provenance on every row, not only the ambiguous ones: a creator
          // shown only where there is a clash would make its absence read
          // like a guarantee. Where the host reports no creator, that is what
          // it says — an unknown opener is not a trustworthy one.
          var who = ocShort(p.creator);
          var prov = who ? 'opened by ' + who : 'opened by an address this host did not report';
          if (foundById) prov += ' \u00b7 read from Base just now by its id, not from this host\u2019s scan';
          // Only ever "on this page". The old wording said "in this list",
          // which invited the reading that a name unmarked here is a name
          // nobody else took \u2014 and where the scan reached part of the
          // factory, that is a guarantee this card cannot make.
          if (sharing > 1) prov += ' \u00b7 ' + sharing + ' of the pools on this page carry the name \u201c' + (p.name || '') + '\u201d \u2014 different pools, different creators, one word between them';
          // The creator, linkable. "Read the creator" is advice nobody can
          // take from twelve characters of hex: on the explorer that address
          // has a history, and this row is where somebody decides whether to
          // hand it money.
          box.appendChild(h('p', { class: 'smallnote' }, prov + ' ',
            l2ScanLink(8453, 'address', p.creator, 'that address on basescan')));

          var sellSel = h('select', {}, h('option', { value: 'PEER', text: 'sell PEER' }), h('option', { value: 'BTC', text: 'sell BTC' }));
          var amtIn = h('input', { type: 'text', placeholder: 'amount', style: 'width:90px', inputmode: 'decimal' });
          var quote = h('span', { class: 'smallnote' });
          function quoteNow() {
            var sellPeer = sellSel.value === 'PEER';
            var vin = ocUnits(amtIn.value, sellPeer ? pdec : bdec);
            if (vin === null) return null;
            var out = ocQuote(vin, sellPeer ? rp : rb, sellPeer ? rb : rp);
            return { sellPeer: sellPeer, vin: vin, out: out, min: ocGuard(out), dec: sellPeer ? bdec : pdec, sym: sellPeer ? 'BTC' : 'PEER' };
          }
          function requote() {
            var q = quoteNow();
            if (!q) { quote.textContent = ''; return; }
            if (q.out <= 0n) { quote.textContent = 'the pool cannot fill this'; return; }
            var t = '\u2192 ' + ocFmt(q.out, q.dec) + ' ' + q.sym + ' (incl. 0.3% fee); it reverts below ' + ocFmt(q.min, q.dec) + ' ' + q.sym;
            // Below about fifty raw units a percentage is not expressible at
            // all: 2% of three sats is nothing an integer can hold. The guard
            // is floored at one unit there, which makes the trade
            // all-or-nothing, and saying so is the difference between a tight
            // guard and a guard the user thinks they have.
            if (q.out < 50n) t += ' \u2014 that output is only ' + q.out + ' raw units, too small to protect by percentage, so any move at all makes it revert. Trade more if you want room.';
            quote.textContent = t;
          }
          amtIn.addEventListener('input', requote);
          sellSel.addEventListener('change', requote);
          var swapBusy = false;
          var swapBtn = h('button', { class: 'btn small primary', text: 'Swap on Base', onclick: function () {
              var q = quoteNow();
              if (!q) { toast('Say how much.'); return; }
              if (q.out <= 0n) { toast('The pool cannot fill this.'); return; }
              if (swapBusy) { toast('That swap is already going through \u2014 the wallet may be asking for an approval before the trade itself. Pressing again would start a second one, and an approval that lands after the first swap lets the second one through too.'); return; }
              var led = ocLedger();
              swapBusy = true;
              swapBtn.disabled = true;
              swapBtn.textContent = 'Working\u2026';
              (async function () {
                try {
                  if (!l2Wallet && !(await ocConnect())) { toast('Trading needs a wallet on Base.'); return; }
                  drawWallet();
                  var toks = await ocGetTokens(factory);
                  var sellTok = q.sellPeer ? toks.peer : toks.btc;
                  var sellSym = q.sellPeer ? 'PEER' : 'cbBTC';
                  var sellDec = q.sellPeer ? pdec : bdec;
                  // Free, and asked first: a wallet that cannot cover the
                  // trade used to find that out one approval too late, having
                  // paid gas for a permission it could not use.
                  await ocHave(sellTok, q.vin, sellSym, sellDec);
                  await ocAllow(sellTok, factory, q.vin, sellSym, sellDec, led);
                  // Two guards, both the caller's own. minOut is the 2% band
                  // with a floor under it, so if the chain moved between this
                  // quote and the fill the contract refuses rather than
                  // filling at a price this screen never showed. deadline is
                  // ten minutes on the chain's clock, so a transaction held
                  // back and replayed later is void rather than merely late —
                  // minOut says nothing about WHEN. And it is only worth
                  // what it is measured against, so the pool is asked again
                  // HERE \u2014 after the approval above has confirmed, not
                  // before it \u2014 and the minimum is set from what it pays
                  // now, floored at what the quote line promised.
                  var fr = await ocFresh(factory, p.id);
                  var nowOut = ocQuote(q.vin, q.sellPeer ? fr.rp : fr.rb, q.sellPeer ? fr.rb : fr.rp);
                  if (ocDrift(q.out, nowOut)) {
                    ocRefresh();
                    throw new Error('the pool moved while this was waiting \u2014 ' + ocFmt(q.out, q.dec) + ' ' + q.sym + ' was quoted and it would fill ' + ocFmt(nowOut, q.dec) + ' ' + q.sym + ' now. Nothing was signed against the old number; press Swap again to trade at a price you can see.');
                  }
                  var data = OC_SEL.swap + ocWord(p.id) + ocWord(q.sellPeer ? 1n : 0n) + ocWord(q.vin) + ocWord(ocFloor(q.out, nowOut)) + ocWord(await ocDeadline());
                  await ocSend(factory, data, 'Swapping in ' + label, led, 'the swap of ' + ocFmt(q.vin, sellDec) + ' ' + sellSym + ' in ' + label);
                  toast('Swapped in ' + label + '. ' + OC_LAG);
                  ocTxRecord(led, 'Swap in ' + label);
                  ocRefresh();
                } catch (e) { toast(led.sentence('The swap stopped', e)); ocTxRecord(led, 'Swap in ' + label + ' — stopped'); }
                finally {
                  swapBusy = false;
                  swapBtn.disabled = false;
                  swapBtn.textContent = 'Swap on Base';
                }
              })();
            } });
          box.appendChild(h('div', { class: 'mini-form' }, sellSel, amtIn, swapBtn, quote));

          var addP = h('input', { type: 'text', placeholder: 'PEER', style: 'width:90px', inputmode: 'decimal' });
          var addB = h('input', { type: 'text', placeholder: 'cbBTC', style: 'width:90px', inputmode: 'decimal' });
          var slot = h('span', {});
          var addBusy = false;
          var addBtn = h('button', { class: 'btn small', text: 'Add liquidity', onclick: function () {
              var vp = ocUnits(addP.value, pdec), vb = ocUnits(addB.value, bdec);
              if (vp === null || vb === null) { toast('Both amounts, please.'); return; }
              if (addBusy) { toast('That deposit is already going through \u2014 it takes up to two approvals and the wallet asks for each in turn. Pressing again would start a second deposit.'); return; }
              // What the pool would mint, computed the way the contract does:
              // the smaller of the two offers measured in shares. Free
              // arithmetic, and it catches the deposit too small to mint
              // anything BEFORE it costs two approvals.
              var expect = 0n;
              if (ts > 0n && rp > 0n && rb > 0n) {
                var byP = vp * ts / rp, byB = vb * ts / rb;
                expect = byP < byB ? byP : byB;
                if (expect <= 0n) { toast('That deposit is too small to mint a share in ' + label + ' \u2014 the contract would refuse it, so nothing was signed.'); return; }
              }
              var led = ocLedger();
              addBusy = true;
              addBtn.disabled = true;
              addBtn.textContent = 'Working\u2026';
              (async function () {
                try {
                  if (!l2Wallet && !(await ocConnect())) { toast('Adding liquidity needs a wallet on Base.'); return; }
                  drawWallet();
                  var toks = await ocGetTokens(factory);
                  // The allowance covers the full offer; the contract pulls
                  // only the ratio-matched part of it, rounding in the
                  // pool's favour. What the ratio is right now is the
                  // chain's business, not this page's guess.
                  // Both sides asked for free before either is approved:
                  // approving PEER and then discovering the wallet has no
                  // cbBTC leaves a paid-for permission and no deposit.
                  await ocHave(toks.peer, vp, 'PEER', pdec);
                  await ocHave(toks.btc, vb, 'cbBTC', bdec);
                  await ocAllow(toks.peer, factory, vp, 'PEER', pdec, led);
                  await ocAllow(toks.btc, factory, vb, 'cbBTC', bdec, led);
                  // minShares is the sandwich guard: a swap landing just
                  // ahead of this moves the ratio, which changes WHICH side
                  // binds and can mint fewer shares for the same coins. 2%
                  // under what these reserves say, floored — and a deadline,
                  // for the same reason the swap has one.
                  var fr = await ocFresh(factory, p.id);
                  var nowExp = 0n;
                  if (fr.ts > 0n && fr.rp > 0n && fr.rb > 0n) {
                    var nP = vp * fr.ts / fr.rp, nB = vb * fr.ts / fr.rb;
                    nowExp = nP < nB ? nP : nB;
                    if (nowExp <= 0n) {
                      ocRefresh();
                      throw new Error('that deposit is too small to mint a share in ' + label + ' at the ratio the pool holds NOW, so the contract would refuse it \u2014 nothing was signed');
                    }
                  }
                  if (ocDrift(expect, nowExp)) {
                    ocRefresh();
                    throw new Error('the pool moved while this was waiting: this deposit was going to mint ' + expect + ' raw share units and it would mint ' + nowExp + ' now. Nothing was signed \u2014 press Add liquidity again against the ratio it holds now.');
                  }
                  await ocSend(factory, OC_SEL.addLiquidity + ocWord(p.id) + ocWord(vp) + ocWord(vb) + ocWord(ocFloor(expect, nowExp)) + ocWord(await ocDeadline()), 'Adding liquidity to ' + label, led, 'the deposit into ' + label);
                  toast('Added to ' + label + ' \u2014 the proportional part of what you offered. ' + OC_LAG);
                  ocTxRecord(led, 'Deposit into ' + label);
                  ocRefresh();
                } catch (e) { toast(led.sentence('The deposit stopped', e)); ocTxRecord(led, 'Deposit into ' + label + ' \u2014 stopped'); }
                finally {
                  addBusy = false;
                  addBtn.disabled = false;
                  addBtn.textContent = 'Add liquidity';
                }
              })();
            } });
          box.appendChild(h('div', { class: 'mini-form' }, addP, addB, addBtn, slot));
          if (ts <= 0n) {
            // No total-shares figure, nothing to compute a minimum from, and
            // 0 means no guard — the contract says so and so does this row.
            box.appendChild(h('p', { class: 'smallnote', text: 'This host did not report this pool\u2019s total shares, so the figure above the button is missing rather than zero. The minimum-shares guard does not come from it: the pool is read again on chain the moment you press, and the minimum is set from that. A deposit here goes in unguarded only if the chain also answers zero \u2014 which means the pool holds nothing and there is no ratio to be moved.' }));
          }

          // The withdraw button appears only when the connected wallet
          // actually holds shares in this pool — asked of the chain each
          // render, never remembered. Shares are internal accounting inside
          // the factory, not a token, so this is the only place they show.
          if (l2Wallet && window.ethereum) {
            ocEth('eth_call', [{ to: factory, data: OC_SEL.sharesOf + ocWord(p.id) + ocAddr(l2Wallet) }, 'latest'])
              .then(function (res) {
                var sh = 0n;
                // Here an unreadable answer really does just mean no button:
                // nothing is signed off this read, so the honest response to
                // silence is to offer nothing rather than to raise.
                try { sh = ocUint(res, 'your share balance'); } catch (e) { return; }
                if (sh <= 0n) return;
                var wdBusy = false;
                var wdBtn = h('button', { class: 'btn small', text: 'Withdraw all', onclick: function () {
                  if (wdBusy) { toast('That withdrawal is already going through. Pressing again would sign a second one.'); return; }
                  // The slice is proportional whatever happens, but WHAT it
                  // is made of moves with the pool: a swap landing ahead of
                  // this turns some of one side into the other, so a
                  // withdrawal aimed at one coin can be sandwiched into the
                  // other. Both minimums are 2% under what the pool holds
                  // WHEN THIS IS SIGNED \u2014 read again below rather than
                  // taken from the render, which on a screen that has stopped
                  // repainting can be hours behind \u2014 and floored at the
                  // slice printed above, so neither a stale number nor a live
                  // one can lower what was promised.
                  var expP = ts > 0n ? sh * rp / ts : 0n;
                  var expB = ts > 0n ? sh * rb / ts : 0n;
                  var led = ocLedger();
                  wdBusy = true;
                  wdBtn.disabled = true;
                  wdBtn.textContent = 'Working\u2026';
                  (async function () {
                    try {
                      var fr = await ocFresh(factory, p.id);
                      var nowP = fr.ts > 0n ? sh * fr.rp / fr.ts : 0n;
                      var nowB = fr.ts > 0n ? sh * fr.rb / fr.ts : 0n;
                      if (ocDrift(expP, nowP) || ocDrift(expB, nowB)) {
                        ocRefresh();
                        throw new Error('the pool moved while this row sat open: your slice reads ' + ocFmt(nowP, pdec) + ' PEER and ' + ocFmt(nowB, bdec) + ' BTC now, not ' + ocFmt(expP, pdec) + ' and ' + ocFmt(expB, bdec) + '. Nothing was signed \u2014 press Withdraw all again against what it holds now.');
                      }
                      await ocSend(factory, OC_SEL.removeLiquidity + ocWord(p.id) + ocWord(sh) + ocWord(ocFloor(expP, nowP)) + ocWord(ocFloor(expB, nowB)), 'Withdrawing from ' + label, led, 'the withdrawal of your whole share of ' + label);
                      toast('Withdrew from ' + label + ' \u2014 both sides, proportional to your shares. ' + OC_LAG);
                      ocTxRecord(led, 'Withdrawal from ' + label);
                      ocRefresh();
                    } catch (e) { toast(led.sentence('The withdrawal stopped', e)); ocTxRecord(led, 'Withdrawal from ' + label + ' \u2014 stopped'); }
                    finally {
                      wdBusy = false;
                      wdBtn.disabled = false;
                      wdBtn.textContent = 'Withdraw all';
                    }
                  })();
                } });
                slot.appendChild(wdBtn);
              })
              .catch(function () { /* a provider that refuses eth_call just means no button */ });
          }
          return box;
        }

        // ── find a pool by its id ──
        // The list above is what this host's scan reached, and when that is
        // less than the whole factory the reader says so in its own words —
        // ending, quite correctly, that a pool missing from the list "is
        // still perfectly usable by anyone who has its id". This is where
        // that promise is kept. Until now the card made it and offered no
        // way to act on it, which is worse than staying quiet: it told
        // somebody their pool was reachable and then hid the door.
        //
        // poolInfo(uint256) is a free read and signs nothing. It goes through
        // the WALLET's connection because a wallet is this page's only way to
        // ask Base a direct question — the host's endpoint answers with its
        // scan and nothing else, and this file will not reach for some third
        // party's RPC on a user's behalf. Without a wallet the button says so
        // rather than failing quietly.
        //
        // The row it draws is the same row the list draws, with the same
        // buttons, keyed by the same id: a pool nobody can see is not a pool
        // anybody should have to trade in blind.
        var idIn = h('input', { type: 'text', placeholder: 'pool id', style: 'width:90px', inputmode: 'numeric' });
        var idSlot = h('div', {});
        ocBody.appendChild(h('p', { class: 'eyebrow', style: 'margin:10px 0 0', text: 'find a pool by id \u2014 including one this host never listed' }));
        ocBody.appendChild(h('div', { class: 'mini-form persistent' }, idIn,
          h('button', { class: 'btn small', text: 'Look it up', onclick: function () {
            idSlot.innerHTML = '';
            var t = String(idIn.value || '').trim();
            if (!/^\d+$/.test(t)) { toast('A pool id is a whole number \u2014 the one printed beside every pool in the list.'); return; }
            if (!window.ethereum) { toast('An id lookup asks Base directly, which needs a wallet. It signs nothing; this page has no other way to reach the chain.'); return; }
            (async function () {
              try {
                var chain = await ocEth('eth_chainId');
                if (chain !== OC_CHAIN) { toast('That wallet answers for chain ' + chain + ', not Base \u2014 an id read through it would be about a different chain entirely.'); return; }
                var ret = await ocEth('eth_call', [{ to: factory, data: OC_SEL.poolInfo + ocWord(BigInt(t)) }, 'latest']);
                var body = String(ret == null ? '' : ret).replace(/^0x/, '');
                // Five static words: name, resPeer, resBtc, totalShares,
                // creator. An id past the end of the factory reverts, which
                // arrives here as an error or an empty answer \u2014 never as a
                // pool full of zeroes, which is why nothing short is decoded.
                if (body.length < 64 * 5) { toast('Nothing answered for pool #' + t + ' on this factory. An id that exists answers in five words; this answered in fewer.'); return; }
                var p = {
                  id: t,
                  name: ocName(body.slice(0, 64)),
                  nameRaw: '0x' + body.slice(0, 64),
                  resPeerRaw: BigInt('0x' + body.slice(64, 128)).toString(),
                  resBtcRaw: BigInt('0x' + body.slice(128, 192)).toString(),
                  totalSharesRaw: BigInt('0x' + body.slice(192, 256)).toString(),
                  creator: '0x' + body.slice(280, 320)
                };
                idSlot.appendChild(poolRow(p, ocSharing(p), true));
              } catch (e) { toast('Could not read pool #' + t + ': ' + ocErr(e)); }
            })();
          } }),
          h('span', { class: 'smallnote', text: window.ethereum ? 'A free read straight to Base \u2014 it signs nothing, and it works for ids this host\u2019s scan never reached.' : 'Needs a wallet: asking Base directly is the only way to reach a pool this host did not list.' })));
        ocBody.appendChild(idSlot);

        // ── open a pool — one press, all the way through ──
        // Three fields and one button. The pair is not one of the fields:
        // every pool this factory can make is PEER against cbBTC, fixed in
        // its immutables at deployment, so offering a choice would be
        // offering a lie.
        //
        // Opening a pool is not one action on chain. It is up to three —
        // approve PEER, approve cbBTC, createPool — and three wallet prompts
        // arriving with no account of which is which is exactly where people
        // stop, having paid for an approval and got no pool. So the button
        // carries all three and names each one while it is on screen.
        //
        // Everything that can refuse this is asked FIRST and asked for FREE.
        // An eth_call costs nothing; an approval costs gas and leaves a
        // standing permission behind, so any refusal discovered after it is a
        // refusal somebody paid for:
        //   · the wallet is connected and answering for Base
        //   · the factory's two token addresses hold actual code
        //   · sqrt(PEER × cbBTC) clears the factory's own MIN_LIQ
        //   · this creator has not used this name before
        //   · this wallet holds both amounts
        //
        // The name is yours alone in one direction only: you cannot reuse one
        // of your own, and somebody else opening theirs under the same word
        // takes nothing from you. That is what stops a watcher copying a name
        // out of the mempool and paying a higher fee to steal it.
        var cName = h('input', { type: 'text', placeholder: 'pool name', style: 'flex:1; min-width:110px', maxlength: '32' });
        var cPeer = h('input', { type: 'text', placeholder: 'PEER', style: 'width:104px', inputmode: 'decimal' });
        var cBtc = h('input', { type: 'text', placeholder: 'cbBTC', style: 'width:104px', inputmode: 'decimal' });
        var cPrice = h('p', { class: 'smallnote', style: 'border-left:2px solid var(--ember); padding-left:9px' });
        var cBtn = h('button', { class: 'btn small primary', text: 'Open pool on Base' });
        var cBusy = false;

        // The two sentences a zero balance has to be answered with, because a
        // field filled with 0 and no explanation is the dead end this card
        // exists to remove. Neither invents a way to get the coin: where to
        // buy bitcoin is not this page's business, and a page that points
        // somewhere is a page that has picked somebody.
        var NO_PEER = 'This wallet holds no PEER token on Base at all. The PEER counted in the Wallet tab is a different thing that happens to share the name: a number in this network\u2019s own log, not in any wallet, and there is no bridge that turns one into the other. Opening a pool needs the Base token itself, in this address.';
        var NO_BTC = 'This wallet holds no cbBTC at all. A pool has two sides and cbBTC is the other one: it is bitcoin on Base \u2014 an ERC-20 that stands for BTC \u2014 and no amount of PEER becomes it. It has to be bought or bridged onto Base, into this address, before a pool can be opened.';

        function cSay(t, warn) {
          ocSeq.appendChild(h('p', { class: 'smallnote', style: warn ? 'border-left:2px solid var(--ember); padding-left:9px' : 'padding-left:9px', text: t }));
        }

        // The most consequential line on this screen, and it used to be
        // nowhere at all. There is no market in PEER/BTC, so nothing prices
        // this pool but the two numbers above it: whatever ratio goes in is
        // what the first trader pays, and against a pool this thin the first
        // trade moves it a long way. Said live, both ways round, before
        // anything is signed — a price you learn afterwards is a price you
        // did not choose.
        function cRatio() {
          var vp = ocUnits(cPeer.value, pdec), vb = ocUnits(cBtc.value, bdec);
          if (vp === null || vb === null) {
            cPrice.textContent = 'The two amounts ARE the opening price \u2014 there is no market to take one from. Fill both in and the price they set appears here, before anything is signed.';
            return;
          }
          var pf = Number(vp) / Math.pow(10, pdec), bf = Number(vb) / Math.pow(10, bdec);
          cPrice.textContent = 'You are setting the price: 1 PEER = ' + ocPx(bf / pf) + ' BTC, and 1 BTC = ' + ocPx(pf / bf) + ' PEER. Nothing else prices PEER against bitcoin, so this ratio is the market until somebody trades against it \u2014 and against a pool this thin the first trade moves it a long way, in whichever direction pays the trader. Nor can this page show how the PEER supply is held, so nothing outside this form agrees with the number you are about to set.';
        }
        cPeer.addEventListener('input', cRatio);
        cBtc.addEventListener('input', cRatio);
        cRatio();

        // "The number of peer tokens you have", as one tap rather than
        // arithmetic. Exact to the last raw unit, because this value is
        // parsed straight back into the transaction. Gas is paid in ETH, so
        // emptying either of these two balances strands nothing.
        function cMax(input, sym) {
          return h('button', { class: 'btn small', text: 'max ' + sym, onclick: function () {
            // Not during the open-pool sequence. This rewrites the amount
            // field and the price line under it, while the amounts being
            // signed were captured when Open pool was pressed \u2014 so the
            // \u201cYou are setting the price\u201d sentence on screen would
            // drift away from the transaction in the wallet, which is the
            // one thing this form exists to prevent.
            if (cBusy) { toast('The pool is being opened with the amounts already captured \u2014 the fields are held still until that finishes.'); return; }
            (async function () {
              try {
                if (!l2Wallet && !(await ocConnect())) { toast('Reading your balance needs the wallet connected on Base. It signs nothing.'); return; }
                drawWallet();
                var toks = await ocGetTokens(factory);
                var isPeer = sym === 'PEER';
                var raw = await ocBal(isPeer ? toks.peer : toks.btc, sym);
                input.value = ocDec(raw, isPeer ? pdec : bdec);
                cRatio();
                if (raw === 0n) cSay(isPeer ? NO_PEER : NO_BTC, true);
              } catch (e) { toast('Could not read your ' + sym + ' balance: ' + ocErr(e)); }
            })();
          } });
        }

        cBtn.addEventListener('click', function () {
          if (cBusy) return;
          ocSeq.innerHTML = '';
          var nm = String(cName.value || '').trim();
          if (!nm) { cSay('A pool needs a name \u2014 it is the label this one is listed under, and it is claimed for you alone: a stranger opening theirs under the same word takes nothing from you.', true); return; }
          var nb = new TextEncoder().encode(nm);
          if (nb.length > 32) { cSay('That name is ' + nb.length + ' bytes as UTF-8, and 32 is all a bytes32 holds. Nothing was signed.', true); return; }
          var vp = ocUnits(cPeer.value, pdec), vb = ocUnits(cBtc.value, bdec);
          if (vp === null || vb === null) { cSay('Both starting amounts, both above zero \u2014 a pool has two sides and they go in together. \u201cmax PEER\u201d and \u201cmax cbBTC\u201d fill in what this wallet actually holds.', true); return; }
          // bytes32: the UTF-8 bytes hex-encoded, right-padded with NULs —
          // the exact shape the host strips back off to show the name.
          var hexName = '';
          for (var bi = 0; bi < nb.length; bi++) hexName += nb[bi].toString(16).padStart(2, '0');
          while (hexName.length < 64) hexName += '0';
          var led = ocLedger();
          cBusy = true;
          cBtn.disabled = true;
          cBtn.textContent = 'Working\u2026';
          // Everything the price line is computed from goes still with it.
          // vp and vb are captured above and the wallet is about to be
          // asked about exactly those two numbers; a field that can still
          // be typed into leaves a sentence on screen describing a trade
          // nobody is making.
          cName.disabled = true;
          cPeer.disabled = true;
          cBtc.disabled = true;
          cMaxP.disabled = true;
          cMaxB.disabled = true;
          (async function () {
            try {
              cSay('Checking everything that can be checked for free. Nothing is signed and no gas is spent until all of it passes.');
              if (!l2Wallet && !(await ocConnect())) { cSay('Opening a pool needs a wallet connected on Base. Nothing was signed.', true); return; }
              drawWallet();
              // Asked before the READS, not only before the signature. On
              // another chain every check below answers about a different
              // world — eth_getCode comes back empty at an address that holds
              // a token on Base — and a page that blamed the operator's

              cSay('Done. \u201c' + nm + '\u201d is open on Base holding ' + ocDec(vp, pdec) + ' PEER against ' + ocDec(vb, bdec) + ' cbBTC, and that ratio is its price until somebody trades against it. The name is yours and not the network\u2019s: somebody else may open one called the same thing.');

  /**
   * One line of the record, with everything that can be a link made one.
   *
   * The record is where people catch up, so a dead end in it is a dead end in
   * the whole app: an act that names a person or a post should take you there.
   * Three sources of links, and none of them guesses:
   *   - the actor, from `who`
   *   - whatever the line names, from `refs` recorded at replay time — matching
   *     handles against prose would link "a", "cam" and "Echo" inside ordinary
   *     words, so the labels come from the same strings that built the line
   *   - any cN written into the text, via richText
   */
  function chronRow(st, c) {
    var openable = function (id) {
      if (!id) return false;
      if (id.indexOf('prof_') === 0) return !!st.ledgerById[id.slice(5)];
      if (st.ledgerById[id]) return true;
      return !!resolvePost(st, id);
    };
    var row = h('div', { class: openable(c.to) ? 'chron-jump' : '' });

    if (c.who) {
      row.appendChild(h('button', {
        class: 'who-link', text: st.handles[c.who] || c.who,
        title: 'Open ' + (st.handles[c.who] || c.who) + '’s profile',
        onclick: function (ev) { ev.stopPropagation(); openProfile(c.who); },
      }));
      row.appendChild(document.createTextNode(' '));
    }

    // Split the line on each recorded label, linking those spans exactly.
    var rest = String(c.line == null ? '' : c.line);
    (c.refs || []).forEach(function (r) {
      if (!r || !r.label) return;
      var at = rest.indexOf(r.label);
      if (at < 0) return;
      richText(st, rest.slice(0, at)).forEach(function (n) { row.appendChild(typeof n === 'string' ? document.createTextNode(n) : n); });
      if (openable(r.id)) {
        row.appendChild(h('button', {
          class: 'who-link', text: r.label, title: 'Open ' + r.label,
          onclick: function (ev) { ev.stopPropagation(); jumpTo(st, r.id); },
        }));
      } else {
        row.appendChild(document.createTextNode(r.label));
      }
      rest = rest.slice(at + r.label.length);
    });
    richText(st, rest).forEach(function (n) { row.appendChild(typeof n === 'string' ? document.createTextNode(n) : n); });

    if (openable(c.to)) {
      row.appendChild(h('span', { class: 'jump-hint', text: ' ↗ open' }));
      row.addEventListener('click', function () { jumpTo(st, c.to); });
    }
    return row;
  }

    st.chron.slice().reverse().forEach(function (c) {

  /**
   * The side rails as a board of widgets.
   *
   * The standings table came out at the owner's request. What replaces it is
   * the same question asked differently — what is this place made of, and how
   * old is it — answered from timestamps and tag edges that are already in the
   * log. Nothing here is a new measurement: there is no session timer and no
   * attention counter anywhere in this network, and none was added to fill
   * these cards.
   */
  function tagsWidget(st) {
    var count = {}, last = {};
    Object.keys(st.payloads).forEach(function (cid) {
      var meta = st.postMeta[cid];
      tagsOf(st, cid).forEach(function (t) {
        count[t] = (count[t] || 0) + 1;
        var when = meta && meta.ts ? meta.ts : 0;
        if (when > (last[t] || 0)) last[t] = when;
      });
    });
    var top = Object.keys(count).sort(function (a, b) { return count[b] - count[a]; }).slice(0, 10);
    if (!top.length) return null;
    var card = h('div', { class: 'card' },
      h('h2', { text: 'Tags in use' }),
      h('p', { class: 'smallnote', text: 'Every tag anyone has attached, and how many pieces of content carry it.' }));
    top.forEach(function (t) {
      card.appendChild(h('div', { class: 'kv' },
        h('span', { text: t }),
        h('span', { class: 'num', text: String(count[t]) })));
    });
    return card;
  }

  /** How old the things here are — from the stamps the acts carry. */
  function ageWidget(st) {
    var now = Date.now();
    var first = 0, newest = 0;
    world.acts.forEach(function (a) {
      if (typeof a.ts !== 'number') return;
      if (!first || a.ts < first) first = a.ts;
      if (a.ts > newest) newest = a.ts;
    });
    function span(ms) {
      if (!ms) return '—';
      var d = Math.floor(ms / 86400000);
      if (d >= 1) return d + (d === 1 ? ' day' : ' days');
      var hrs = Math.floor(ms / 3600000);
      if (hrs >= 1) return hrs + (hrs === 1 ? ' hour' : ' hours');
      return Math.max(1, Math.floor(ms / 60000)) + ' min';
    }
    var mineFrom = 0;
    world.acts.forEach(function (a) {
      if (a.t === 'register' && a.id === who && typeof a.ts === 'number' && !mineFrom) mineFrom = a.ts;
    });
    var card = h('div', { class: 'card' }, h('h2', { text: 'Age' }));
    card.appendChild(h('div', { class: 'kv' }, h('span', { text: 'this network' }), h('span', { class: 'num', text: first ? span(now - first) : '—' })));
    if (mineFrom) card.appendChild(h('div', { class: 'kv' }, h('span', { text: 'your handle' }), h('span', { class: 'num', text: span(now - mineFrom) })));
    card.appendChild(h('div', { class: 'kv' }, h('span', { text: 'last act' }), h('span', { class: 'num', text: newest ? relAgo(newest) : '—' })));
    card.appendChild(h('div', { class: 'kv' }, h('span', { text: 'acts recorded' }), h('span', { class: 'num', text: String(world.acts.length - 1) })));
    card.appendChild(h('p', { class: 'smallnote', text: 'Measured from the stamps in the record. Nothing here counts time spent looking — this network does not collect that.' }));
    return card;
  }

      h('button', { class: 'btn small primary', text: 'Burn bitcoin \u2192', onclick: function () { burnDialog(); } }),
    ]));

    drawer.appendChild(group('Leaving',
      'Deletion is a tombstone act plus a byte redaction: your payloads go, the counters and other people\u2019s commentary stay. It cannot be undone.', [
      h('button', { class: 'btn small danger', text: 'Delete account', onclick: function () { close(); deleteAccountFlow(st); } }),
    ]));

    overlay.appendChild(h('div', { class: 'scrim', onclick: close }));
    overlay.appendChild(drawer);
    var first = drawer.querySelector('button');
    if (first) first.focus();
  }

  function openProfile(id) {
    var st = replay();
    var l = st.ledgerById[id];
    if (!l) return;
    var overlay = document.getElementById('overlay');
    overlay.innerHTML = '';
    function close() { overlay.innerHTML = ''; }
    var given = [], received = [];
    for (var k in st.bundles) {
      var b = st.bundles[k];
      var pd = Math.max(-1, Math.min(1, b.pd)), pi = Math.max(-1, Math.min(1, b.pi));
      var live = pd > 0 && pi > 0;
      var line = { other: b.src === id ? b.rcp : b.src, coeff: live ? Math.sqrt(pd * pi) : 0, live: live };
      if (b.src === id) given.push(line); else if (b.rcp === id) received.push(line);
    }
    var prof = (st.profiles && st.profiles[id]) || null;
    var bond = credibility(st, id) / (NU + credibility(st, id));
    var drawer = h('div', { class: 'drawer' },
      h('button', { class: 'btn small ghost', text: '← close', onclick: close }),
      avatar(id),
      h('h3', { text: st.handles[id] + (st.pinHash[id] ? ' 🔒' : '') }),
      h('span', { class: 'standing-chip', text: 'standing ' + fmt(credibility(st, id), 4) }),
      // Self-declared, and labelled as such: everything else on this card is
      // derived from the record, this part is simply what they typed.
      prof && prof.bio ? h('p', { class: 'sect', style: 'margin:10px 0 0', text: prof.bio }) : null,
      prof && prof.link ? h('p', { class: 'sect', style: 'margin:4px 0 0' },
        h('a', { href: prof.link, target: '_blank', rel: 'noopener noreferrer nofollow', text: prof.link })) : null,
      h('div', { class: 'mini-form sect' },
        followBtn(st, id),
        h('button', { class: 'btn small', text: 'Guide →', title: 'What a standing is, and what moves it.',
          onclick: function () { close(); tab = 'profile'; saveView(); render(); } }),
        (function () {
          if (id !== who) return null;
          return h('button', { class: 'btn small', text: prof ? 'Edit profile' : 'Add a profile', onclick: function () { profileFlow(st); } });
        })(),
        (function () {
          var n = st.followers && st.followers[id] ? Object.keys(st.followers[id]).length : 0;
          var f = st.follows && st.follows[id] ? Object.keys(st.follows[id]).length : 0;
          return h('span', { class: 'smallnote', text: n + ' following them · ' + f + ' followed — counted, never scored' });
        })()),
      h('dl', { class: 'ledger sect' },
        h('dt', { text: 'reserve' }), h('dd', { class: 'num', text: fmt(l.burnBal, 3) }),
        h('dt', { text: 'acts N' }), h('dd', { class: 'num', text: String(l.actCount) }),
        h('dt', { text: 'rate' }), h('dd', { class: 'num', text: fmt(l.burnBal / Math.max(l.actCount, 1), 3) }),
        h('dt', { text: 'self-bond p_i' }), h('dd', { class: 'num', text: fmt(bond, 3) }),
        h('dt', { text: 'acts this epoch' }), h('dd', { class: 'num', text: String(st.deltaActs[id] || 0) })));
    function vsect(title, list, dir) {
      var s = h('div', { class: 'sect' }, h('p', { class: 'eyebrow', text: title }));
      if (!list.length) s.appendChild(h('p', { class: 'smallnote', text: 'none yet' }));
      list.forEach(function (v) {
        s.appendChild(h('div', { class: 'vouchline' },
          h('span', {}, (dir === 'out' ? '→ ' : '← ') + (st.handles[v.other] || v.other)),
          h('span', { class: 'num', text: v.live ? 'c ' + fmt(v.coeff, 3) : 'folded out' })));
      });
      return s;
    }
    var music = musicSection(st, id);
    if (music) drawer.appendChild(music);
    drawer.appendChild(vsect('vouches given', given, 'out'));
    drawer.appendChild(vsect('vouches received', received, 'in'));
    if (id !== who) {
      drawer.appendChild(h('div', { class: 'sect' },
        h('button', { class: 'btn small', text: 'Chat with ' + st.handles[id], onclick: function () {
          close();
          chatPeer = id;
          tab = 'chat';
          save(); render();
        } })));
      var p = slider('support', 0.7), r = slider('conviction', 0.7);
      var sect = h('div', { class: 'sect' },
        h('p', { class: 'eyebrow', text: 'vouch for ' + st.handles[id] }));
      sect.appendChild(vouchEffect(st, who, id));
      sect.appendChild(h('div', { class: 'mini-form' }, p.row, r.row,
        h('button', { class: 'btn small primary', text: 'Vouch · −θ', onclick: function () {
          close();
          tryAct(who, { t: 'opinion', author: who, target: 'prof_' + id, p: p.value(), r: r.value() },
            'Vouch recorded — a positive folded Opinion on a profile compiles a person-vouch. Your rate now flows to ' + st.handles[id] + '.');
        } })));
      drawer.appendChild(sect);
    }
    overlay.appendChild(h('div', { class: 'scrim', onclick: close }));
    overlay.appendChild(drawer);
  }

  markStandalone();
  guardExternalLinks();
  offerInstall();
  // What this device is holding, read from the cache itself before the first
  // paint has anything to claim. offlineSizes stays null until it answers, and
  // the control says 'checking' rather than 'not saved' in the meantime.
  if (offlineAvailable()) {
    offlineScan().then(function () { if (safeToRepaint()) render(); });
  } else {
    offlineSizes = {};
  }

  boot();
})();
</script>
