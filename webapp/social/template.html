<title>Peer — social sandbox</title>
<style>
:root {
  --paper: #FBF6F0;
  --card: #FFFFFF;
  --card-2: #F6EFE6;
  --ink: #251F19;
  --muted: #8A7C6C;
  --line: #E7DCCC;
  --line-2: #D9CBB6;
  --ember: #C24D2C;
  --ember-hot: #E0663C;
  --ember-soft: rgba(194, 77, 44, 0.10);
  --brass: #9C7A3C;
  --brass-soft: rgba(156, 122, 60, 0.12);
  --moss: #4E7A56;
  --moss-soft: rgba(78, 122, 86, 0.13);
  --bad: #A93B2A;
  --bad-soft: rgba(169, 59, 42, 0.11);
  --shadow: 0 1px 2px rgba(60, 42, 24, 0.06), 0 8px 28px rgba(60, 42, 24, 0.07);
  /* type: condensed grotesk for display/labels, book serif for reading, mono for figures */
  --display: 'Bahnschrift', 'Avenir Next Condensed', 'Roboto Condensed', 'Arial Narrow', sans-serif;
  --body: 'Charter', 'Bitstream Charter', Cambria, 'Iowan Old Style', Georgia, serif;
  --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  /* ledger tokens (mainstream view) — paper, ink, one signal colour */
  --lq-paper: #EFEFEA;
  --lq-sheet: #FFFFFF;
  --lq-sunk: #E7E7E1;
  --lq-ink: #17181B;
  --lq-muted: #6E7075;
  --lq-rule: #D6D6CF;
  --lq-rule-2: #BFBFB6;
  --lq-accent: #D8330F;
  --lq-accent-2: #1F3A6B;
  --lq-gold: #8A6A2B;
  --lq-good: #1F6B4A;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #131110; --card: #1C1917; --card-2: #211D1A; --ink: #EEE7DC; --muted: #9F9283;
    --line: #2E2822; --line-2: #3A322A; --ember: #E0663C; --ember-hot: #F07A4C;
    --ember-soft: rgba(224, 102, 60, 0.14); --brass: #C9A45E; --brass-soft: rgba(201, 164, 94, 0.14);
    --moss: #7FAF88; --moss-soft: rgba(127, 175, 136, 0.14); --bad: #E06A55; --bad-soft: rgba(224, 106, 85, 0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 28px rgba(0,0,0,0.35);
    --lq-paper: #131315; --lq-sheet: #1A1B1E; --lq-sunk: #202126;
    --lq-ink: #ECECE7; --lq-muted: #92949A; --lq-rule: #2C2D32; --lq-rule-2: #3D3E45;
    --lq-accent: #FF5630; --lq-accent-2: #7FA3E8; --lq-gold: #C9A25E; --lq-good: #58B98A;
  }
}
:root[data-theme="light"] {
  --paper: #FBF6F0; --card: #FFFFFF; --card-2: #F6EFE6; --ink: #251F19; --muted: #8A7C6C;
  --line: #E7DCCC; --line-2: #D9CBB6; --ember: #C24D2C; --ember-hot: #E0663C;
  --ember-soft: rgba(194,77,44,0.10); --brass: #9C7A3C; --brass-soft: rgba(156,122,60,0.12);
  --moss: #4E7A56; --moss-soft: rgba(78,122,86,0.13); --bad: #A93B2A; --bad-soft: rgba(169,59,42,0.11);
  --shadow: 0 1px 2px rgba(60,42,24,0.06), 0 8px 28px rgba(60,42,24,0.07);
  --lq-paper: #EFEFEA; --lq-sheet: #FFFFFF; --lq-sunk: #E7E7E1;
  --lq-ink: #17181B; --lq-muted: #6E7075; --lq-rule: #D6D6CF; --lq-rule-2: #BFBFB6;
  --lq-accent: #D8330F; --lq-accent-2: #1F3A6B; --lq-gold: #8A6A2B; --lq-good: #1F6B4A;
}
:root[data-theme="dark"] {
  --paper: #131110; --card: #1C1917; --card-2: #211D1A; --ink: #EEE7DC; --muted: #9F9283;
  --line: #2E2822; --line-2: #3A322A; --ember: #E0663C; --ember-hot: #F07A4C;
  --ember-soft: rgba(224,102,60,0.14); --brass: #C9A45E; --brass-soft: rgba(201,164,94,0.14);
  --moss: #7FAF88; --moss-soft: rgba(127,175,136,0.14); --bad: #E06A55; --bad-soft: rgba(224,106,85,0.14);
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 28px rgba(0,0,0,0.35);
  --lq-paper: #131315; --lq-sheet: #1A1B1E; --lq-sunk: #202126;
  --lq-ink: #ECECE7; --lq-muted: #92949A; --lq-rule: #2C2D32; --lq-rule-2: #3D3E45;
  --lq-accent: #FF5630; --lq-accent-2: #7FA3E8; --lq-gold: #C9A25E; --lq-good: #58B98A;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); margin: 0; line-height: 1.45; }
button { font-family: var(--body); cursor: pointer; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
::selection { background: var(--ember-soft); }

.shell { max-width: 1220px; margin: 0 auto; padding: 0 18px 40px; }

/* ═══ GEEK MODE (Layer-1 lab look) ═══ */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 10px 2px; margin-bottom: 14px; flex-wrap: wrap;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.wordmark { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 24px; margin: 0; letter-spacing: 0.04em; }
.wordmark em { font-style: normal; color: var(--ember); }
.tabs { display: flex; gap: 2px; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 5px 14px; border-radius: 7px; font-weight: 600; }
.tabs button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.switcher { display: flex; gap: 8px; align-items: center; }
.switcher select { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }

.cols { display: grid; grid-template-columns: 256px minmax(0, 1fr) 296px; gap: 16px; align-items: start; }
@media (max-width: 1010px) { .cols { grid-template-columns: 1fr; } .rail { position: static; } }
.rail { position: sticky; top: 62px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
.card + .card { margin-top: 14px; }
.card h2 { font-family: var(--display); font-size: 17px; margin: 0 0 10px; letter-spacing: 0.01em; }
.eyebrow { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600; }

.idcard .who { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
.avatar { width: 42px; height: 42px; border-radius: 5px; border: 1.5px solid var(--ink); background: var(--card-2); color: var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 21px; flex: none; }
.avatar.s { width: 27px; height: 27px; font-size: 13.5px; }
.handle { font-weight: 700; font-size: 15px; }
.standing-chip { font-family: var(--mono); font-size: 11px; color: var(--brass); background: var(--brass-soft); border-radius: 10px; padding: 2px 8px; }
.ledger { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12.5px; margin: 0; }
.ledger dt { color: var(--muted); }
.ledger dd { margin: 0; text-align: right; }
.gauge { height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 10px 0 6px; }
.gauge i { display: block; height: 100%; background: var(--ember); border-radius: 4px; transition: width 0.4s ease; }
.smallnote { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

.btn { border: 1px solid var(--line-2); background: var(--card); color: var(--ink); border-radius: 9px; padding: 6px 13px; font-size: 13px; transition: border-color 0.12s, transform 0.05s; }
.btn:hover { border-color: var(--ember); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ember); border-color: var(--ink); color: #FFF4EC; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.small { padding: 3px 10px; font-size: 12px; border-radius: 7px; }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ember); border-color: transparent; }
.btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }

.composer textarea, .mini-form textarea { width: 100%; min-height: 66px; resize: vertical; background: var(--card-2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-family: var(--body); font-size: 13.5px; }
.composer .row { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.slider { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.slider input { accent-color: var(--ember); width: 88px; }
.slider output { font-family: var(--mono); width: 40px; text-align: right; color: var(--ink); }

.post { border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; margin-top: 12px; background: var(--card); transition: border-color 0.15s, box-shadow 0.15s; }
.post:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.post .head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.rank-chip { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 1px 7px; }
.post .head .kindtag { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-left: auto; }
.post .body { font-size: 14.5px; line-height: 1.55; margin: 8px 0; }
.tagrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 6px; }
.tagchip { font-size: 11.5px; color: var(--moss); background: var(--moss-soft); border-radius: 9px; padding: 2px 9px; }
.post .mech { font-family: var(--mono); font-size: 10.8px; color: var(--muted); overflow-wrap: anywhere; }
.post .mech b { color: var(--ink); font-weight: 600; }
.rankbar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 7px; overflow: hidden; }
.rankbar i { display: block; height: 100%; background: var(--ember); transition: width 0.5s ease; }
.actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.mini-form { background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.mini-form input[type='text'], .mini-form input[type='password'] { background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 6px 9px; font-size: 13px; }

.post-media { display: block; max-width: 100%; max-height: 420px; object-fit: contain; border-radius: 12px; margin: 8px 0 4px; background: rgba(127,127,127,0.08); }
.post-audio { display: block; width: 100%; margin: 4px 0; }
/* Call dock: fixed dark panel, deliberately theme-independent — it floats
   above both frontends and must never be rebuilt by render() mid-call. */
#call-dock { position: fixed; right: 16px; bottom: 16px; z-index: 400; }
#call-dock audio { display: none; }
.call-panel { background: #211d1a; color: #efe9df; border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 12px 14px; min-width: 230px; box-shadow: 0 10px 34px rgba(0,0,0,0.5); font-size: 14px; }
.call-panel .c-title { font-weight: 700; margin-bottom: 2px; }
.call-panel .c-sub { font-size: 11px; opacity: 0.6; margin-bottom: 9px; }
.call-panel .c-row { display: flex; gap: 8px; }
.call-btn { border: 1px solid rgba(255,255,255,0.22); background: transparent; color: #efe9df; border-radius: 8px; padding: 6px 14px; cursor: pointer; font: inherit; font-size: 13px; }
.call-btn.yes { background: #2e7d4f; border-color: #2e7d4f; color: #fff; }
.call-btn.no { background: #a33d2f; border-color: #a33d2f; color: #fff; }
.call-live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4caf7a; margin-right: 7px; animation: callpulse 1.6s infinite; }
@keyframes callpulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.3 } }
.call-panel.ringing { animation: ringpulse 1.1s infinite; border-color: #4caf7a; min-width: 260px; }
@keyframes ringpulse { 0%, 100% { box-shadow: 0 10px 34px rgba(0,0,0,0.5); } 50% { box-shadow: 0 10px 34px rgba(0,0,0,0.5), 0 0 0 6px rgba(76,175,122,0.25); } }
.chat-call { text-align: center; font-size: 12px; opacity: 0.75; margin: 6px 0; }
.audio-wrap { margin: 8px 0 4px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px 4px; background: var(--card-2); }
.audio-wave { display: block; width: 100%; height: 44px; cursor: pointer; }
.audio-wrap.wave-none .audio-wave { display: none; }
body[data-mode='liquid'] .audio-wrap { background: var(--lq-sunk); border-color: var(--lq-rule); border-radius: 4px; }
.file-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; border: 1px solid var(--line-2); border-radius: 9px; padding: 5px 11px; margin: 8px 0 4px; color: var(--ink); text-decoration: none; background: var(--card-2); }
.file-chip:hover { border-color: var(--ember); }
body[data-mode='liquid'] .file-chip { background: var(--lq-glass-2); border-color: var(--lq-edge); color: var(--lq-ink); border-radius: 12px; }
.quote-embed { border-left: 3px solid var(--ember); background: var(--card-2); border-radius: 8px; padding: 8px 12px; margin: 8px 0 4px; cursor: pointer; }
.quote-embed .q-head { font-size: 11.5px; color: var(--muted); }
.quote-embed .q-head b { color: var(--ink); }
.quote-embed .q-text { font-size: 13px; line-height: 1.5; }
.quote-embed.gone { border-left-color: var(--line-2); cursor: default; }
.quote-embed.gone .q-text { font-style: italic; color: var(--muted); }
body[data-mode='liquid'] .quote-embed { background: var(--lq-glass-2); border-left-color: var(--lq-accent); border-radius: 12px; }
body[data-mode='liquid'] .quote-embed .q-text { color: var(--lq-ink); }
.mention-chip { font-size: 11.5px; color: var(--ember); background: var(--ember-soft); border-radius: 9px; padding: 2px 9px; }
body[data-mode='liquid'] .mention-chip { color: var(--lq-accent); background: color-mix(in srgb, var(--lq-accent) 12%, transparent); }
.compose-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px dashed var(--line-2); border-radius: 9px; padding: 3px 9px; color: var(--muted); }
.compose-chip button { border: 0; background: transparent; color: var(--bad); cursor: pointer; font-size: 13px; padding: 0 2px; }

.comments { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 4px; }
.comment { display: flex; gap: 8px; padding: 7px 0; align-items: flex-start; }
.comment .c-body { font-size: 13px; line-height: 1.5; }
.comment .c-head { font-size: 12px; color: var(--muted); }
.comment .c-head b { color: var(--ink); }

.gate { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; border-radius: 10px; padding: 2px 9px; margin: 2px 4px 2px 0; font-weight: 600; }
.gate.pass { background: var(--moss-soft); color: var(--moss); }
.gate.fail { background: var(--bad-soft); color: var(--bad); }
.delta { font-family: var(--mono); font-size: 10.5px; border-radius: 8px; padding: 1px 6px; }
.delta.up { color: var(--moss); background: var(--moss-soft); }
.delta.down { color: var(--bad); background: var(--bad-soft); }

table.standings { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.standings th { text-align: left; color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; padding: 2px 6px 5px 0; }
table.standings td { padding: 5px 6px 5px 0; border-top: 1px solid var(--line); }
table.standings td.r, table.standings th.r { text-align: right; }
table.standings tr.me td { background: var(--ember-soft); }
table.standings tr:not(:first-child) { cursor: pointer; }
table.standings tr:not(:first-child):hover td { background: var(--card-2); }

/* network tab: path explanation */
.path-row { border-top: 1px solid var(--line); padding: 8px 0 6px; }
.path-row:first-of-type { border-top: 0; }
.path-chain { font-size: 12.5px; color: var(--ink); margin-top: 3px; overflow-wrap: anywhere; }
.bridge-note { font-size: 12.5px; line-height: 1.55; color: var(--muted); background: var(--bad-soft); border: 1px solid rgba(169,59,42,0.35); border-radius: 9px; padding: 9px 12px; margin-top: 10px; }
.bridge-note b { color: var(--bad); }

/* jump-to-content */
.chron-jump { cursor: pointer; border-radius: 6px; padding-left: 6px; margin-left: -6px; }
.chron-jump:hover { background: var(--card-2); }
.jump-hint { font-size: 10.5px; color: var(--ember); font-weight: 600; white-space: nowrap; }
.focus-wrap { border: 2px solid var(--ember); border-radius: 14px; padding: 4px; margin-bottom: 14px; scroll-margin-top: 70px; }
.focus-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 10px 6px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ember); font-weight: 700; }
.focus-hit { background: var(--ember-soft); border-radius: 8px; outline: 1px solid var(--ember); }
body[data-mode='liquid'] .focus-wrap { border-color: var(--lq-accent); border-radius: 6px; }
body[data-mode='liquid'] .focus-bar { color: var(--lq-accent); }
body[data-mode='liquid'] .focus-hit { background: color-mix(in srgb, var(--lq-accent) 12%, transparent); outline-color: var(--lq-accent); }
@media (prefers-reduced-motion: no-preference) {
  .focus-wrap { animation: focusIn 0.35s ease-out; }
  @keyframes focusIn { from { box-shadow: 0 0 0 6px var(--ember-soft); } to { box-shadow: 0 0 0 0 transparent; } }
}

/* threaded replies */
.comments .nested, .lq-comments .nested { margin-left: 22px; border-left: 2px solid var(--line); padding-left: 10px; }
.comment .grow, .lq-comment .grow { flex: 1; min-width: 0; }
.reply-btn { margin-top: 4px; opacity: 0.75; }
.reply-btn:hover { opacity: 1; }
body[data-mode='liquid'] .reply-btn { padding: 3px 11px; font-size: 12px; }

/* wall warning */
.wall-warn { background: rgba(210, 153, 34, 0.14); border: 1px solid rgba(210, 153, 34, 0.45); border-radius: 10px; padding: 8px 11px; margin-bottom: 10px; }
.wall-warn b { color: var(--brass); font-size: 12.5px; }
.wall-warn.bad { background: var(--bad-soft); border-color: rgba(169, 59, 42, 0.5); }
.wall-warn.bad b { color: var(--bad); }

/* geek alerts */
.alert-row { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
.alert-row:first-of-type { border-top: 0; }
.alert-row .grow { flex: 1; min-width: 0; }
.alert-row.fresh { background: var(--ember-soft); border-radius: 8px; padding-left: 8px; padding-right: 8px; }
.nbadge { display: inline-block; min-width: 15px; margin-left: 5px; padding: 0 4px; border-radius: 8px; background: var(--ember); color: #FFF4EC; font-size: 10px; line-height: 15px; text-align: center; font-weight: 700; }
.media-failed { display: none; }

/* geek chats */
.chat-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
.chat-row:hover { background: var(--card-2); }
.chat-row .grow { flex: 1; min-width: 0; }
.chat-thread { max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 6px 0; }
.chat-msg { max-width: 78%; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 13.5px; align-self: flex-start; }
.chat-msg.mine { align-self: flex-end; background: var(--ember-soft); border-color: rgba(194,77,44,0.3); }
.chat-msg .m-meta { display: block; font-size: 10px; color: var(--muted); margin-bottom: 2px; }

.chron { font-size: 12.5px; color: var(--muted); }
.chron > div { padding: 7px 0; border-top: 1px dashed var(--line); line-height: 1.5; }
.chron b { color: var(--ink); font-weight: 600; }

.onboard { max-width: 620px; margin: 7vh auto 0; text-align: center; }
.onboard .wordmark { font-size: 64px; margin-bottom: 2px; }
.onboard p.lede { font-family: var(--display); font-size: 18.5px; line-height: 1.6; margin: 12px auto 8px; max-width: 34em; text-wrap: balance; }
.pulse { display: flex; gap: 18px; justify-content: center; margin: 18px 0 26px; flex-wrap: wrap; }
.pulse .stat { font-size: 12px; color: var(--muted); }
.pulse .stat b { display: block; font-family: var(--mono); font-size: 19px; color: var(--ink); font-weight: 600; }
.onboard .join { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.onboard input { background: var(--card); border: 1px solid var(--line-2); color: var(--ink); border-radius: 10px; padding: 10px 14px; font-size: 15px; width: 200px; }
.residents { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.resident { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px 8px 9px; cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s; }

    b.id = 'net-banner';
    b.className = 'net-banner';
    b.textContent = 'Connection lost — reconnecting… nothing you send is recorded until this clears.';
    document.body.prepend(b);
  }

  /** Merge a server tail response into the local log (incremental sync). */
  function mergeTail(d) {
    if (!d || !d.acts) return false;
    var base = typeof d.since === 'number' ? d.since : world.acts.length;
    if (base > world.acts.length) return false; // gap — full refetch will heal
    var next = world.acts.slice(0, base).concat(d.acts);
    var changed = next.length !== world.acts.length;
    world.acts = next;
    return changed;
  }

  function pushAct(act, onOk) {
    var actor = act.author || act.from ||
      (act.t === 'closeEpoch' || act.t === 'closeCycle' ? null : act.id) || null;
    if (REMOTE && actor && act.t !== 'register' && lastPinHash[actor]) act.auth = pins[actor] || '';
    if (!REMOTE) {
      delete act.auth;
      world.acts.push(act); save();
      if (onOk) onOk();
      render(); return;
    }
    if (offline) { toast('Still reconnecting — hold on, nothing can be recorded right now.'); return; }
    act.since = world.acts.length;
    fetch('/api/act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(act) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        setOnline(true);
        if (!x.ok) { toast(x.d && x.d.error ? x.d.error : 'The network refused that action.'); render(); return; }
        mergeTail(x.d); save();
        if (onOk) onOk();
        render();
      })
      .catch(function () { setOnline(false); toast('Connection hiccup — nothing was recorded, try again.'); });
  }

  function pollRemote() {
    var ae = document.activeElement;
    if (!offline) {
      if (ae && (ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && (ae.type === 'text' || ae.type === 'password')))) return;
      if (document.querySelector('.drawer') || document.querySelector('.mini-form') || document.querySelector('.lq-sheet') || document.querySelector('.pin-dialog')) return;
    }
    fetch('/api/acts?since=' + world.acts.length, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) {
        var wasOffline = offline;
        setOnline(true);
        if (mergeTail({ acts: d.acts, since: world.acts.length }) || wasOffline) render();
      })
      .catch(function () { setOnline(false); });
  }

  function boot() {
    fetch('/api/acts', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) {
        REMOTE = true;
        world = { acts: d.acts };
        render();
        setInterval(pollRemote, 5000);
        setInterval(signalTick, 1200); // call signaling: ~5s idle, ~1.2s in-call
        // Background tabs get throttled — poll the moment the tab comes back,
        // so an incoming call shows immediately instead of one interval late.
        document.addEventListener('visibilitychange', function () { if (!document.hidden) signalTick(true); });
        window.addEventListener('focus', function () { signalTick(true); });
      })
      .catch(function () { render(); });
  }

  // ── Replay: world state is a deterministic function of the act log ──
  var SEED_POSTS = {
    photo: 'Street shot from the underpass — first light.',
    comment: 'Grain placement is deliberate. This holds up.',
  };

  // Memoized: the log is append-only, so (array identity, length) keys a replay.
  var replayCache = { ref: null, len: -1, st: null };
  function replay() {
    if (replayCache.ref === world.acts && replayCache.len === world.acts.length && replayCache.st) {
      return replayCache.st;
    }
    var st = replayUncached();
    replayCache = { ref: world.acts, len: world.acts.length, st: st };
    return st;
  }

  function replayUncached() {
    var g = new E.RawGraph();
    var ledgers = [], ledgerById = {}, handles = {}, kReg = {}, creators = {}, payloads = {};
    var bundles = {}, selfCells = [], deltaActs = {}, epochHistory = [], chron = [];
    var reviewMeta = {}; // commentNodeId -> {e, f}
    var mediaMeta = {};  // contentId -> [{h, m} | {d, m}]
    var dms = [];        // {from, to, text, idx}
    var pinHash = {};
    var counter = 0;
    var certsSoFar = 0; // certificates issued before the current act (CoGra epoch age)

    // ── Deletion pre-scan ──────────────────────────────────────────────────
    // Replay is a pure function of the whole log, so deletions are retroactive.
    // A muted act keeps FULL counter and θ parity — content ids ('c167') are
    // minted by the counter and later acts reference them, and balance-gated
    // branches depend on every prior debit — but leaves no payload, no edges,
    // no vouches and no chron line. Muting cascades: a comment on deleted
    // content is muted too, which mutes replies to it, in log order.
    var deletedActors = {}, deletedPostIdx = {};
    for (var pre = 0; pre < world.acts.length; pre++) {
      var pact = world.acts[pre];
      if (pact.t === 'deleteAccount') deletedActors[pact.id] = true;
      else if (pact.t === 'deletePost') deletedPostIdx[pact.target] = true;
    }
    var mutedContent = {}; // content ids whose acts are muted
    var actContent = {};   // act index -> content id (posts only; edit targets)
    var postMeta = {};     // cid -> {idx, ts, edited} for the edit/delete UI
    // Layer 0: the attestation ledger (Peer Attestation v0.6.0). The L1 seam:
    // every attestation increment feeds the actor's residual burn balance.
    var l0 = new E.AttestationLedger({ E0: 100, zeta: 0.5, fee: 0.5, maturityCycle: 10 });
    function l0safe(fn) { try { return fn(); } catch (e) { return null; } }

    // `handles` keeps the REAL handle — mention slugs resolve against it and
    // must stay deterministic forever. Node labels are what humans see, so a
    // deleted actor is labelled '[deleted]' there and nowhere leaks its name
    // into the graph view or the JSON export.
    function addActor(id, handle, burn, count, epoch, label) {
      var lab = label || handle;
      g.addNode({ id: id, kind: 'Actor', label: lab });
      g.addNode({ id: 'prof_' + id, kind: 'Profile', label: lab });
      var l = { id: id, burnBal: burn, actCount: count };
      ledgers.push(l); ledgerById[id] = l; handles[id] = handle; kReg[id] = epoch;
    }
    // Name for human-readable chronicle text: never the real handle of a
    // deleted account — the Record is served to everyone.
    function dispName(id) { return deletedActors[id] ? '[deleted]' : (handles[id] || id); }
    function debit(id) { var l = ledgerById[id]; l.burnBal -= THETA; l.actCount += 1; deltaActs[id] = (deltaActs[id] || 0) + 1; }
    function vouch(author, target, p, r) {
      var key = author + '>' + target;
      var b = bundles[key] || (bundles[key] = { src: author, rcp: target, pd: 0, pi: 0 });
      b.pd += p; b.pi += r;
    }
    function weighHome(author, pd, pi) {
      var c = Math.sqrt(Math.abs(pd) * Math.abs(pi));
      if (c > 0) selfCells.push({ src: author, rcp: author, coeff: Math.min(1, c) });
    }
    function typeNode(name) {
      var id = 'type_' + name.toLowerCase().replace(/[^a-z0-9]/g, '');
      if (!g.nodes.get(id)) g.addNode({ id: id, kind: 'Type', label: '#' + name });
      return id;
    }

    for (var i = 0; i < world.acts.length; i++) {
      var a = world.acts[i];
      var mutedA = !!(deletedActors[a.author] || deletedActors[a.from] || deletedActors[a.id] ||
        deletedPostIdx[i] || (typeof a.target === 'string' && mutedContent[a.target]) ||
        (a.t === 'dm' && deletedActors[a.to]));
      if (a.t === 'seedWorld') {
        addActor('alice', 'Alice', 3, 10, 0);
        addActor('bob', 'Bob', 2, 8, 0);
        addActor('carol', 'Carol', 4, 12, 0);
        addActor('dave', 'Dave', 1, 5, 0);
        g.addNode({ id: 'photo', kind: 'Content', label: 'Photo' });
        g.addNode({ id: 'comment', kind: 'Comment', label: 'Comment' });
        g.addNode({ id: 'streetart', kind: 'Type', label: '#StreetArt' });
        g.addNode({ id: 'sneakers', kind: 'Item', label: 'Sneakers' });
        g.append({ id: 'e1', family: 'SelfDeclaration', src: 'alice', tgt: 'prof_alice', pd: 1, pi: 0.75 });
        g.append({ id: 'e1r', family: 'SelfReputation', src: 'prof_alice', tgt: 'alice', pd: 1, pi: 0.75 });
        g.append({ id: 'e2', family: 'Opinion', src: 'alice', tgt: 'photo', pd: 0.9, pi: 0.7 });
        g.append({ id: 'e3', family: 'ReviewA', src: 'bob', tgt: 'photo', pd: 0.7, pi: 0.8 });
        g.append({ id: 'e4', family: 'ReviewT', src: 'photo', tgt: 'comment', pd: 0.8, pi: 0.7 });
        g.append({ id: 'e5', family: 'TagA', src: 'carol', tgt: 'comment', pd: 0.8, pi: 0.9 });
        g.append({ id: 'e6', family: 'TagT', src: 'comment', tgt: 'streetart', pd: 0.9, pi: 0.8 });
        g.append({ id: 'e7', family: 'Affinity', src: 'alice', tgt: 'streetart', pd: 0.6, pi: 0.8 });
        g.append({ id: 'e8', family: 'Owner', src: 'bob', tgt: 'sneakers', pd: 0.7, pi: 1.0 });
        creators.photo = 'alice'; creators.comment = 'bob'; creators.sneakers = 'bob'; creators.streetart = 'carol';
        payloads.photo = SEED_POSTS.photo; payloads.comment = SEED_POSTS.comment;
        reviewMeta.comment = { e: 0.7, f: 0.8 };
        // Layer-0 seed: residents get an external-reserve faucet and a starter
        // grant of live units from the operator (the genesis holder).
        ['alice', 'bob', 'carol', 'dave'].forEach(function (id) {
          l0.faucet(id, 10);
          l0safe(function () { l0.transfer('op', id, 2, 'live'); });
        });
        chron.push({ who: 'alice', line: 'posted Photo — seed world', to: 'photo' });
        chron.push({ who: 'bob', line: 'reviewed Photo, minting a Comment — seed world', to: 'comment' });
      } else if (a.t === 'register') {
        addActor(a.id, a.handle, a.seed, 0, a.epoch, mutedA ? '[deleted]' : a.handle);
        if (a.pinHash) pinHash[a.id] = a.pinHash;
        if (!mutedA) g.append({ id: 'reg_' + a.id, family: 'Registration', src: a.id, tgt: 'prof_' + a.id, pd: 1, pi: 1 });
        debit(a.id); if (!mutedA) weighHome(a.id, 1, 1);
        // Layer-0 onboarding: external-reserve faucet + operator starter grant.
        // Muted actors keep full economic parity — only visibility goes.
        l0.faucet(a.id, 10);
        l0safe(function () { l0.transfer('op', a.id, 2, 'live'); });
        if (mutedA) ledgerById[a.id].deleted = true;
        else chron.push({ who: a.id, line: 'registered · genesis attestation ' + a.seed.toFixed(2) + ' · θ-debit' + (a.pinHash ? ' · PIN-secured' : '') });
      } else if (a.t === 'burn') {
        // legacy faucet-burn (pre-economy acts in the shared log)
        ledgerById[a.id].burnBal += a.amt;
        if (!mutedA) chron.push({ who: a.id, line: 'burned +' + a.amt.toFixed(2) + ' reserve (legacy faucet)' });
      } else if (a.t === 'deposit') {
        if (l0safe(function () { l0.deposit(a.id, a.amt); return true; }) && !mutedA) {
          chron.push({ who: a.id, line: 'deposited ' + a.amt.toFixed(2) + ' reserve → escrow (mints at the next cycle boundary)' });
        }
      } else if (a.t === 'burnL0') {
        var dA = l0safe(function () { return l0.burn(a.id, a.x); });
        if (dA != null && ledgerById[a.id]) {
          ledgerById[a.id].burnBal += dA; // the L1 seam: attestation is burn_val
          if (!mutedA) chron.push({ who: a.id, line: 'burned ' + a.x.toFixed(2) + ' live units → attestation +' + dA.toFixed(3) + ' at settled floor φ ' + l0.settledFloor.toFixed(3) });
        }
      } else if (a.t === 'redeem') {
        var pay = l0safe(function () { return l0.redeem(a.id, a.x); });
        if (pay != null && !mutedA) {
          chron.push({ who: a.id, line: 'redeemed ' + a.x.toFixed(2) + ' live units → ' + pay.toFixed(3) + ' reserve (floor-preserving)' });
        }
      } else if (a.t === 'transferL0') {
        if (l0safe(function () { l0.transfer(a.from, a.to, a.x, a.cls === 'tlock' ? 'tlock' : 'live'); return true; }) && !mutedA) {
          chron.push({ who: a.from, line: 'sent ' + a.x.toFixed(2) + ' ' + (a.cls === 'tlock' ? 'time-locked' : 'live') + ' units to ' + dispName(a.to) });
        }
      } else if (a.t === 'setPin') {
        if (ledgerById[a.id] && a.pinHash) {
          pinHash[a.id] = a.pinHash; // newest wins — add or change
          if (!mutedA) chron.push({ who: a.id, line: 'secured the handle with a PIN' });
        }
      } else if (a.t === 'dm') {
        if (ledgerById[a.from] && ledgerById[a.to] && ledgerById[a.from].burnBal >= THETA) {
          var pair = [a.from, a.to].sort();
          var chatId = 'chat_' + pair[0] + '_' + pair[1];
          if (!g.nodes.get(chatId)) {
            g.addNode({ id: chatId, kind: 'Chat', label: 'Chat' });
          }
          counter++;
          var msgId = 'm' + counter;
          g.addNode({ id: msgId, kind: 'Message', label: 'Message' });
          if (!mutedA) {
            g.appendHyper(
              { id: 'snA' + counter, family: 'SendA', src: a.from, tgt: chatId, pd: 0.8, pi: 0.8, epoch: certsSoFar },
              { id: 'snT' + counter, family: 'SendT', src: chatId, tgt: msgId, pd: 0.8, pi: 0.8, epoch: certsSoFar }
            );
          }
          debit(a.from); if (!mutedA) weighHome(a.from, 0.8, 0.8);
          if (!mutedA) dms.push({ from: a.from, to: a.to, text: a.text, idx: i });
        }
      } else if (a.t === 'closeCycle') {
        var cyc = l0.closeCycle();
        chron.push({ who: null, line: 'L0 cycle ' + l0.cycle + ' processed · minted ' + cyc.minted.toFixed(2) + ' receipt units · settled floor φ ' + cyc.floor.toFixed(4) + (l0.cycle === 10 ? ' · maturity conversion: all time-locked units are now live' : '') });
      } else if (a.t === 'post') {
        counter++;
        var cid = 'c' + counter;
        actContent[i] = cid;
        if (mutedA) mutedContent[cid] = true;
        g.addNode({ id: cid, kind: 'Content', label: mutedA ? '[deleted]' : 'Post ' + counter });
        if (!mutedA) g.append({ id: 'pub' + counter, family: 'Publish', src: a.author, tgt: cid, pd: a.a, pi: 1, epoch: certsSoFar });
        debit(a.author); if (!mutedA) weighHome(a.author, a.a, 1);
        if (!mutedA) {
          creators[cid] = a.author; payloads[cid] = a.text;
          if (a.media && a.media.length) mediaMeta[cid] = a.media;
          postMeta[cid] = { idx: i, ts: a.ts, edited: !!a.edited };
          chron.push({ who: a.author, line: 'posted · attachment ' + a.a.toFixed(2), to: cid });
        }
        // Quote reference: one Reference hyper act (A-leg into the post, Full-tier
        // citation T-leg to the target) — its own θ-debit.
        if (a.ref && g.nodes.get(a.ref) && ledgerById[a.author] && ledgerById[a.author].burnBal >= THETA) {
          counter++;
          if (!mutedA) {
            g.appendHyper(
              { id: 'rfA' + counter, family: 'ReferenceA', src: a.author, tgt: cid, pd: 0.8, pi: 0.9, epoch: certsSoFar },
              { id: 'rfT' + counter, family: 'ReferenceT', src: cid, tgt: a.ref, pd: 0.9, pi: 0.8, epoch: certsSoFar }
            );
          }
          debit(a.author); if (!mutedA) weighHome(a.author, 0.8, 0.9);
          if (!mutedA) chron.push({ who: a.author, line: 'referenced ' + ((g.nodes.get(a.ref) || {}).label || a.ref) + ' — content-intrinsic citation', to: a.ref });
        }
        // @mentions: References whose target is the person's Profile (max 3, priced).
        // The server stamps rmen (resolved ids) on accepted posts so redaction
        // can blank text without shifting the counter; parse only legacy acts.
        var mentioned = a.rmen !== undefined ? a.rmen : parseMentions(a.text, handles);
        for (var mi = 0; mi < mentioned.length; mi++) {
          var mid = mentioned[mi];
          if (mid === a.author || !ledgerById[a.author] || ledgerById[a.author].burnBal < THETA) continue;
          counter++;
          if (!mutedA) {
            g.appendHyper(
              { id: 'rfA' + counter, family: 'ReferenceA', src: a.author, tgt: cid, pd: 0.7, pi: 0.8, epoch: certsSoFar },
              { id: 'rfT' + counter, family: 'ReferenceT', src: cid, tgt: 'prof_' + mid, pd: 0.8, pi: 0.7, epoch: certsSoFar }
            );
          }
          // def:epoch:standing-recipient-resolution — a positive Reference to a
          // Profile compiles a person-vouch to that actor (cam's spec review).
          debit(a.author);
          if (!mutedA) {
            vouch(a.author, mid, 0.7, 0.8);
            chron.push({ who: a.author, line: 'mentioned ' + dispName(mid) + ' — person-vouch compiled', to: cid });
          }
        }
      } else if (a.t === 'opinion') {
        counter++;
        if (!mutedA) {
          var rec = g.append({ id: 'op' + counter, family: 'Opinion', src: a.author, tgt: a.target, pd: a.p, pi: a.r, epoch: certsSoFar });
          var owner = a.target.indexOf('prof_') === 0 ? a.target.slice(5) : null;
          if (owner && owner !== a.author) vouch(a.author, owner, a.p, a.r);
          else weighHome(a.author, a.p, a.r);
          chron.push({ who: a.author, line: (owner ? 'vouched on ' + dispName(owner) + '’s profile' : 'reacted to ' + ((g.nodes.get(a.target) || {}).label || a.target)) + ' (' + a.p.toFixed(2) + ', ' + a.r.toFixed(2) + ') · τ ' + rec.tau.toFixed(2) + ' · w ' + rec.weight.toFixed(3), to: a.target });
        }
        debit(a.author);
      } else if (a.t === 'review') {
        counter++;
        var cmid = 'c' + counter;
        if (mutedA) mutedContent[cmid] = true; // cascades to replies on this comment
        g.addNode({ id: cmid, kind: 'Comment', label: mutedA ? '[deleted]' : 'Review ' + counter });
        if (!mutedA) {
          g.appendHyper(
            { id: 'rvA' + counter, family: 'ReviewA', src: a.author, tgt: a.target, pd: a.e, pi: a.f, epoch: certsSoFar },
            { id: 'rvT' + counter, family: 'ReviewT', src: a.target, tgt: cmid, pd: a.f, pi: a.e, epoch: certsSoFar }
          );
          weighHome(a.author, a.e, a.f);
          creators[cmid] = a.author; payloads[cmid] = a.text;
          reviewMeta[cmid] = { e: a.e, f: a.f };
          chron.push({ who: a.author, line: 'reviewed ' + ((g.nodes.get(a.target) || {}).label || '') + ' → minted a Comment · one act, two legs', to: cmid });
        }
        debit(a.author);
      } else if (a.t === 'tag') {
        counter++;
        var tid = typeNode(a.name);
        if (!mutedA) {
          g.appendHyper(
            { id: 'tgA' + counter, family: 'TagA', src: a.author, tgt: a.target, pd: a.r, pi: a.c, epoch: certsSoFar },
            { id: 'tgT' + counter, family: 'TagT', src: a.target, tgt: tid, pd: a.c, pi: a.r, epoch: certsSoFar }
          );
          weighHome(a.author, a.r, a.c);
          chron.push({ who: a.author, line: 'tagged ' + ((g.nodes.get(a.target) || {}).label || '') + ' as #' + a.name, to: a.target });
        }
        debit(a.author);
      } else if (a.t === 'call') {
        // Recorded by the caller after the call ended; the voice itself was
        // peer-to-peer and never touched the record. Priced like a dm.
        if (ledgerById[a.from] && ledgerById[a.to] && ledgerById[a.from].burnBal >= THETA) {
          debit(a.from);
          if (!mutedA) {
            dms.push({ from: a.from, to: a.to, text: '', call: { outcome: a.outcome, dur: a.dur || 0 }, idx: i });
            var cline = a.outcome === 'completed' ? '☎ call with ' + dispName(a.to) + ' · ' + Math.floor((a.dur || 0) / 60) + ':' + ('0' + ((a.dur || 0) % 60)).slice(-2)
              : a.outcome === 'missed' ? '☎ called ' + dispName(a.to) + ' — no answer'
              : a.outcome === 'declined' ? '☎ called ' + dispName(a.to) + ' — declined'
              : '☎ call to ' + dispName(a.to) + ' failed to connect';
            chron.push({ who: a.from, line: cline });
          }
        }
      } else if (a.t === 'editPost') {
        // Applies only inside the server-enforced 5-minute window; replay just
        // swaps the payload of the (still-visible) target.
        var ecid = actContent[a.target];
        if (ecid && !mutedContent[ecid] && payloads[ecid] !== undefined) {
          payloads[ecid] = a.text;
          if (postMeta[ecid]) postMeta[ecid].edited = true;
          chron.push({ who: a.author, line: 'edited a post — within the 5-minute window', to: ecid });
        }
      } else if (a.t === 'deletePost') {
        chron.push({ who: a.author, line: 'deleted a post — content redacted from the served record' });
      } else if (a.t === 'deleteAccount') {
        chron.push({ who: a.id, line: 'account deleted — content redacted, handle stays reserved' });
      } else if (a.t === 'closeEpoch') {
        var cells0 = compileCells(bundles, selfCells);
        var solved0 = E.solveStanding(ledgers, cells0, { tilt: 1 });
        var dmap0 = new Map(Object.keys(deltaActs).map(function (k) { return [k, deltaActs[k]]; }));
        var g0 = E.evaluateGates(ledgers, solved0.x, dmap0);
        epochHistory.push({
          epoch: a.epoch,
          acts: Object.keys(deltaActs).reduce(function (s, k) { return s + deltaActs[k]; }, 0),
          stamp: g0.epochStamp, headroom: g0.headroom, pass: g0.allPass,
        });
        chron.push({ who: null, line: 'epoch ' + a.epoch + ' closed · stamp ' + g0.epochStamp.toFixed(3) + ' · ' + (g0.allPass ? 'certificate accepted' : 'wall/door failed') });
        deltaActs = {};
        certsSoFar++;
      }
    }

    // Deleted actors leave the standings solve entirely: their vouches (given
    // and received) and self-cells are dropped before compilation.
    for (var bk in bundles) {
      if (deletedActors[bundles[bk].src] || deletedActors[bundles[bk].rcp]) delete bundles[bk];
    }
    selfCells = selfCells.filter(function (sc) { return !deletedActors[sc.src]; });

    var cells = compileCells(bundles, selfCells);
    var solved = E.solveStanding(ledgers, cells, { tilt: 1 });
    var xById = {};
    solved.ids.forEach(function (id, i) { xById[id] = solved.x[i]; });

    var epochNow = epochHistory.length + 1;
    for (var id2 in ledgerById) {
      if (id2 === 'alice' || deletedActors[id2]) continue;
      var S = NU * (xById[id2] || 0);
      var bond = S / (NU + S);
      var tenure = 1 - 1 / (epochNow - kReg[id2] + 1);

  // ── Voice calls: negotiated through the host, carried peer-to-peer ────────
  // Signaling (SDP/ICE) travels through ephemeral host mailboxes — never acts,
  // never persisted. The voice itself flows browser-to-browser over WebRTC; the
  // network only introduces the two ends. The call dock lives OUTSIDE the
  // render root: render() rebuilds the app wholesale and must not tear down
  // the live audio element mid-call.

  var signalAuthBad = false; // back off after a 401 until identity changes
  var signalWhoLast = null;
  var signalTickN = 0;

  function fmtDur(s) { return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function callLabel(c) {
    return c.outcome === 'completed' ? '☎ Call · ' + fmtDur(c.dur)

      : c.outcome === 'declined' ? '☎ Call declined'

  function signalSend(kind, to, payload) {
    if (!REMOTE) return;
    var me = (call && call.me) || who;
    fetch('/api/signal', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ from: me, to: to, kind: kind, payload: payload || null, auth: pins[me] || '' }),
    }).catch(function () {});
  }

  function signalTick(force) {
    if (signalWhoLast !== who) { signalWhoLast = who; signalAuthBad = false; }
    if (!REMOTE || !who || signalAuthBad || offline) return;
    if (!call && !force) { signalTickN++; if (signalTickN % 4 !== 0) return; } // idle ~5s, in-call ~1.2s
    if (lastPinHash[who] && !pins[who]) return; // secured handle without its PIN cannot collect
    fetch('/api/signal/poll', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ who: who, auth: pins[who] || '' }),
    }).then(function (r) {
      if (r.status === 401) { signalAuthBad = true; throw 0; }
      if (!r.ok) throw 0;
      return r.json();
    }).then(function (d) { (d.signals || []).forEach(onSignal); }).catch(function () {});
  }

  function onSignal(s) {
    if (s.kind === 'ring') {

      if (s.sid) {
        if (seenRingSids[s.sid]) return;
        seenRingSids[s.sid] = true;
      }
      if (call) { signalSend('decline', s.from, { reason: 'busy' }); return; }
      call = { me: who, peer: s.from, dir: 'in', state: 'ringing', offer: s.payload, pendingIce: [], muted: false };
      startRingtone();
      call.timer = setTimeout(function () {
        if (call && call.state === 'ringing') endCall(false, 'Missed call from ' + handleName(s.from));
      }, 30000);
      callUI();
      return;
    }
    if (!call || s.from !== call.peer) return; // stale signal from a dead call
    if (s.kind === 'accept' && call.dir === 'out' && call.pc) {
      call.state = 'connecting'; callUI();

        .catch(function () { endCall(false, 'Call setup failed.'); });
    } else if (s.kind === 'ice') {

        ? (s.payload && s.payload.reason === 'busy' ? handleName(call.peer) + ' is on another call.' : handleName(call.peer) + ' declined.')

  function flushIce() {
    if (!call || !call.pc) return;
    call.pendingIce.splice(0).forEach(function (c) { call.pc.addIceCandidate(c).catch(function () {}); });
  }

  function getMic() {

  function makePc() {
    var pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc.onicecandidate = function (ev) {
      if (ev.candidate && call) signalSend('ice', call.peer, JSON.parse(JSON.stringify(ev.candidate)));
    };
    pc.ontrack = function (ev) {
      if (!call) return;
      call.audio.srcObject = (ev.streams && ev.streams[0]) || new MediaStream([ev.track]);
      call.audio.play().catch(function () {});
    };
    pc.onconnectionstatechange = function () {
      if (!call || !call.pc) return;
      var cs = call.pc.connectionState;
      if (cs === 'connected' && call.state !== 'live') {
        call.state = 'live'; call.t0 = Date.now(); clearTimeout(call.timer); callUI();
      } else if (cs === 'failed') {
        endCall(true, 'Connection failed — the two networks could not find a direct path.', 'failed');
      } else if (cs === 'disconnected') {
        setTimeout(function () {

        }, 4000);

  function startCall(peer) {
    if (!REMOTE) { toast('Calls need the hosted network — the local sandbox has no one on the other end.'); return; }
    if (call) { toast('One call at a time.'); return; }
    if (!peer || peer === who) return;
    call = { me: who, peer: peer, dir: 'out', state: 'ringing', pendingIce: [], muted: false };
    callUI();
    getMic().then(function (stream) {
      if (!call) { stream.getTracks().forEach(function (t) { t.stop(); }); return null; }
      call.stream = stream;
      call.pc = makePc();
      stream.getTracks().forEach(function (t) { call.pc.addTrack(t, stream); });
      return call.pc.createOffer().then(function (o) {
        return call.pc.setLocalDescription(o).then(function () { return o; });
      });
    }).then(function (offer) {

      signalSend('ring', call.peer, { type: offer.type, sdp: offer.sdp });
      call.rang = true; // an outcome act is recorded only for calls that rang

    }).catch(function (e) {

        : 'Microphone unavailable — check browser permissions.');

  function acceptCall() {
    if (!call || call.dir !== 'in' || call.state !== 'ringing') return;
    stopRingtone();
    clearTimeout(call.timer);
    call.state = 'connecting'; callUI();
    getMic().then(function (stream) {
      if (!call) { stream.getTracks().forEach(function (t) { t.stop(); }); return null; }
      call.stream = stream;
      call.pc = makePc();
      stream.getTracks().forEach(function (t) { call.pc.addTrack(t, stream); });

        .then(function () { return call.pc.createAnswer(); })
        .then(function (a) { return call.pc.setLocalDescription(a).then(function () { return a; }); });
    }).then(function (answer) {
      if (!call || !answer) return;
      signalSend('accept', call.peer, { type: answer.type, sdp: answer.sdp });
    }).catch(function (e) {
      endCall(true, e && e.message === 'unsupported'

        : 'Microphone unavailable — check browser permissions.');

  function endCall(notifyPeer, note, outcomeOverride) {

    clearInterval(call.tick);
    if (notifyPeer) signalSend(call.dir === 'in' && call.state === 'ringing' ? 'decline' : 'hangup', call.peer, null);
    if (call.pc) { try { call.pc.close(); } catch (e) {} }
    if (call.stream) call.stream.getTracks().forEach(function (t) { t.stop(); });
    var dur = call.t0 ? Math.round((Date.now() - call.t0) / 1000) : 0;
    // The caller records the outcome as a priced act — the call becomes part
    // of the record and the chat thread. Only calls that actually rang count,
    // and only the calling side writes (single writer, no duplicates).
    if (call.dir === 'out' && call.rang) {
      var outcome = outcomeOverride || (call.t0 ? 'completed' : 'missed');
      pushAct({ t: 'call', from: call.me, to: call.peer, outcome: outcome, dur: dur }, null);
    }
    call = null;
    callUI();
    if (note) toast(note + (dur ? ' · ' + fmtDur(dur) : ''));
    else if (dur) toast('Call ended · ' + fmtDur(dur));
  }

  function toggleMute() {
    if (!call || !call.stream) return;
    call.muted = !call.muted;
    call.stream.getAudioTracks().forEach(function (t) { t.enabled = !call.muted; });
    callUI();

  // Gentle double-beep ring — WebAudio, no asset. May stay silent if the
  // browser refuses audio without a gesture; the dock still shows the call.
  var ringCtx = null, ringInt = null;
  function startRingtone() {

        if (!ringCtx || !call) return;

          var o = ringCtx.createOscillator(), g = ringCtx.createGain();

          g.gain.exponentialRampToValueAtTime(0.045, t + 0.03);

    }

    if (call.state === 'ringing' && call.dir === 'out') {
      panel.appendChild(h('div', { class: 'c-title', text: 'Calling ' + name + '…' }));
      panel.appendChild(h('div', { class: 'c-sub', text: 'voice is peer-to-peer — nothing enters the record' }));
      panel.appendChild(h('div', { class: 'c-row' },
        h('button', { class: 'call-btn no', text: 'Hang up', onclick: function () { endCall(true, null); } })));
    } else if (call.state === 'ringing' && call.dir === 'in') {
      panel.appendChild(h('div', { class: 'c-title', text: name + ' is calling' }));
      panel.appendChild(h('div', { class: 'c-sub', text: 'voice is peer-to-peer — nothing enters the record' }));
      panel.appendChild(h('div', { class: 'c-row' },
        h('button', { class: 'call-btn yes', text: 'Accept', onclick: acceptCall }),
        h('button', { class: 'call-btn no', text: 'Decline', onclick: function () { endCall(true, null); } })));
    } else if (call.state === 'connecting') {
      panel.appendChild(h('div', { class: 'c-title', text: 'Connecting to ' + name + '…' }));

  /**
   * Wall proximity: how close x* is to the W2a safety floor, and how many more
   * acts you can afford before crossing it. Acting raises N, so each act drags
   * x* down — the warning has to come before the last one, not after.
   */
  function wallState(st, id) {
    var l = st.ledgerById[id];
    if (!l) return null;
    var x = st.xById[id] || 0;
    // acts until the OWN-rate floor alone would drop below the wall
    var actsLeft = 0;
    var b = l.burnBal, n = l.actCount;
    while (actsLeft < 999 && b >= THETA && ((b - THETA) / Math.max(n + 1, 1)) / NU >= SAFE_FLOOR) {
      b -= THETA; n += 1; actsLeft += 1;
    }
    return {
      x: x, below: x < SAFE_FLOOR, actsLeft: actsLeft,
      near: x < SAFE_FLOOR * 1.6 || actsLeft <= 5,
      margin: x - SAFE_FLOOR,

        P(B('standing'), ' — ν · x*, the number everyone else sees. With nobody vouching for you it equals your rate exactly.')),

      sect('Acting: post, react, review, tag', false,
        P('Every action is a protocol act: one θ-debit, one count increment, one edge (or two for hyper acts) appended forever. The text you write is ', B('payload'), ' — carried by the network but never read by any formula.'),
        P(B('Post'), ' mints a Content node. The ', K('attachment'), ' slider is your genesis stance toward it.'),
        P(B('React'), ' is an Opinion on an artifact: ', K('polarity'), ' (how aligned) × ', K('reaction'), ' (how strongly). Artifact-directed acts ', B('weigh home'), ' — their coefficient lands on your own diagonal, crowding your outward influence. But they wire you into the graph: reacting is how content becomes reachable for your feed.'),
        P(B('Review'), ' is one hyper act with two legs — toward the work, and minting your Comment (which threads under the post). ', B('Tag'), ' files content under a commons Type node nobody owns.'),
        P('Sliders run −1…+1. Negative values are real records too — the geometry routes them differently (see the Network tab’s red edges).')),

      sect('The feed: why it shows what it shows', false,
        F('S(you, content) = W · (1 + standing(creator)/ν) · ‖T‖F'),
        P(B('W'), ' — the best damped path weight from ', B('you'), ' to the content, at most 4 hops, found by a signed double-cover BFS (inverted-parity paths are blocked). ', B('The feed is your own graph position'), ' — a fresh account reaches nothing, which is why new posts sit under “beyond your horizon” until you act.'),
        P(B('1 + standing/ν'), ' — the creator amplifier: the author’s standing lifts everything they made.'),
        P(B('‖T‖F'), ' — the content tensor norm: the folded stance the network holds toward the piece.'),
        P('Every ranked card prints its own S decomposition — check the arithmetic. ', jump('open feed', 'feed'))),

      sect('The CoGra ranking (Layer-2)', false,
        P('The Feed tab has two rankings. ', B('L1 default'), ' is the substrate’s conservative readout: single best path × creator amplifier × content norm. ', B('CoGra'), ' is the published Layer-2 replacement (from the CoGra content-graph spec) — the ranking the simple mode uses:'),
        F('S(u,c) = Σ over k disjoint paths of  σ(π) · m(π) · f(Δt)'),
        P(B('Breadth counts, funnels don’t.'), ' Up to k=5 node-disjoint strongest paths are summed. Twenty independent endorsement chains beat one strong chain, but a cluster fanning out behind one bridge scores as exactly one path — the min-cut is the amplification ceiling.'),
        P(B('Sign is social, not L1 parity.'), ' balance = product of directional signs (the enemy of my enemy ranks positive again); ', B('taint'), ' — any negative intensity on the route — is absorbing and forces the term negative. Hate-and-avoid ranks opposite to love-and-seek.'),
        P(B('Standing never enters.'), ' No creator amplifier, no inbound records — only paths you and your network built forward. A swarm pointing at you appears in their feeds, never yours.'),
        P(B('Recency'), ' decays only the terminal hop: f(Δt) = 0.5^(Δt/4) in epoch age. Old content resurfaces the moment someone engages now. And netting a bundle to (0,0) kills every path through it — severance, feed, and earnings are the same cut.')),

      sect('Vouching and standing: the mediant', false,
        P('A ', B('vouch'), ' is a positive Opinion on someone’s ', B('profile'), ' (Profile button or Standings row). All your vouches for one person fold into a single net stance — hostility subtracts, and a bundle netted non-positive compiles no vouch (it still costs you).'),
        F('standing(i) = Σᵤ Π[u][i]·burnᵤ / Σᵤ Π[u][i]·Nᵤ   (× ν)'),
        P('Your standing is the ', B('balance/count mediant'), ' of everyone transported to you — a pooled commitment rate, not a score. Consequence worth seeing live: ', B('a backer with a lower rate than yours dilutes you.'), ' Watch the ▲▼ chips in Standings after every act.'),
        P('Transport is conserved (each person disposes exactly one unit over self + recipients), tilted toward higher-standing recipients, and wall-clamped below ' + fmt(SAFE_FLOOR, 3) + '. No mass is created, destroyed, or minted anywhere.')),

      sect('Epochs: stamping the record', false,
        P('You are in epoch ' + st.epochNow + '. ', B('Close epoch'), ' (right rail) stamps every writer with their final reduced standing, checks the wall (each writer ≥ ' + fmt(SAFE_FLOOR, 3) + ') and the door (act-weighted mean ≥ ' + PART_FLOOR + '), and records a certificate in the Record tab.'),
        P('Closing also advances ', B('tenure'), ': each actor’s derived self-edge bond re-reads their standing (p = S/(ν+S)) and its maturity τ steps toward 1 — long-standing identities route more weight. ', jump('see certificates', 'ledger'))),

      sect('The economy: Layer 0 (Peer Attestation)', false,
        P('Reserve is no longer a faucet — it is a ', B('full-reserve receipt system'), ' beneath the network. You hold external reserve, deposit it into the pool, and receive receipt units at the next ', B('cycle boundary'), ': (1−f)·ζ live + (1−f)·(1−ζ) time-locked, with fee f to the operator (ζ = f = 0.5, spec placeholders).'),
        F('φ = Ω / (Y_L + Y_T)   — the redemption floor; it only ever rises'),
        P(B('Burning is real destruction.'), ' burn(x) destroys x live units against an unchanged pool — the floor rises for everyone left — and credits your ', B('attestation'), ' A += x·φ at the settled floor. That attestation is exactly the burn value Layer 1 reads: your standing rate is built from irreversibly destroyed value, nothing else.'),
        P(B('Redemption'), ' pays x·φ reserve back and never lowers the floor. ', B('Time-locked units'), ' exist only during bootstrapping and convert to live in one relabel at maturity (cycle 10). Capacity before deposits is bounded: A_max = E₀·ln(1/(1−ζ)).'),
        P('Try it in the ', B('Economy tab'), ': deposit, close a cycle, burn, watch φ ratchet. ', jump('open economy', 'econ'))),

      sect('Reading the Network tab', false,
        P('Nodes: ', B('circles'), ' are Actors, ', B('diamonds'), ' Profiles, ', B('rounded boxes'), ' artifacts (Content, Comments, Types, Items). Every edge is an act’s projection; ', B('stroke width'), ' is its damped weight.'),
        P('Colors: ', B('ember'), ' full-tier routing, ', B('gold'), ' half-tier (settlement/proposal families), ', B('grey'), ' marginal tier, ', B('red'), ' negative parity.'),
        P('Click an edge: the stored 3×3 sentiment slice Ψ (heatmap), the softened 2×2 path view, and the whole weight chain —'),
        F('w = √|det PV| × √(1+τ²) × e^(−β·H(τ))'),
        P('det score = directional coherence; τ = maturity from how connected both endpoints already were; H(τ) = binary entropy, so brand-new (τ=0) passes clean, half-mature (τ=½) is damped hardest (×0.383), and old edges recover. ', jump('open network', 'net'))),

      sect('PINs, identities, and honesty', false,
        P('A handle can be secured at registration with a ', B('PIN'), ' (🔒 in lists). Only a salted hash enters the public log; the host demands the PIN for every act and strips it before storing. This stops squatting and casual impersonation — it is ', B('not'), ' cryptographic identity (short PINs can be brute-forced from the public hash; real keypairs are roadmap Phase 4).'),
        P('Sandbox liberties, stated plainly: standing re-solves after every act instead of at epoch boundaries, the self-edge bond reads live standing, and on the shared instance every act is public. Don’t post anything private.')),

      sect('Try this: a five-minute experiment', false,
        h('ol', { class: 'steps' },
          h('li', {}, 'Note your ', B('rate'), ' in the identity card. ', B('React'), ' to any horizon post. ', h('span', { class: 'watch', text: 'Watch:' }), ' rate drops by one θ-dilution, and the post jumps into your ranked feed with a printed S.'),
          h('li', {}, B('Post'), ' something. ', h('span', { class: 'watch', text: 'Watch:' }), ' it exists for everyone but ranks only for people connected to you.'),
          h('li', {}, 'Open a peer’s ', B('Profile'), ' and vouch with high support. ', h('span', { class: 'watch', text: 'Watch:' }), ' the ▲▼ chips — if your post-debit rate is below their standing, your vouch ', B('lowers'), ' them. Sincerity is priced.'),
          h('li', {}, 'Burn +1.00, then vouch again. ', h('span', { class: 'watch', text: 'Watch:' }), ' with your rate lifted, the same vouch now pulls them up.'),
          h('li', {}, B('Close the epoch'), '. ', h('span', { class: 'watch', text: 'Watch:' }), ' the certificate in Record, and edge weights shift as tenure advances.'),
          h('li', {}, 'Open ', B('Network'), ' and click the edges you just created — every number you caused, derived in front of you.'))),

      sect('Glossary', false,
        h('table', {},
          h('tr', {}, h('th', { text: 'symbol' }), h('th', { text: 'meaning' })),
          h('tr', {}, h('td', { text: 'θ = ' + fmt(THETA, 4) }), h('td', { text: 'safety threshold — reserve debited per accepted act (gate W1)' })),
          h('tr', {}, h('td', { text: 'ν = ' + NU }), h('td', { text: 'numéraire — the unit standing is expressed against; x* = standing/ν' })),
          h('tr', {}, h('td', { text: 'wall = ' + fmt(SAFE_FLOOR, 3) }), h('td', { text: 'W2a safety wall — every writer’s final x* must clear it' })),
          h('tr', {}, h('td', { text: 'door = ' + PART_FLOOR }), h('td', { text: 'W2b participation door — the act-weighted epoch mean must clear it' })),
          h('tr', {}, h('td', { text: 'rate' }), h('td', { text: 'burn/N — your commitment rate; the only source standing can transport' })),
          h('tr', {}, h('td', { text: 'τ' }), h('td', { text: 'edge maturity, from endpoint connectedness at append time; damps via e^(−β·H(τ))' })),
          h('tr', {}, h('td', { text: 'β = 2 ln 2' }), h('td', { text: 'inverse temperature — scales sentiment clamps and maturity damping' })),
          h('tr', {}, h('td', { text: 'Ψ / PV' }), h('td', { text: 'stored 3×3 sentiment slice / its softened 2×2 path view used for routing' })),
          h('tr', {}, h('td', { text: 'S' }), h('td', { text: 'feed relevance: path weight × creator amplifier × content norm' })),
          h('tr', {}, h('td', { text: 'x*' }), h('td', { text: 'your reduced standing — fixed point of the conserved transport solve' })))));
    return wrap;
  }

  function ledgerTab(st) {
    var wrap = h('div', {});
    var chron = h('div', { class: 'card' }, h('p', { class: 'eyebrow', text: 'chronicle — the append-only record' }), h('div', { class: 'chron' }));
    var host = chron.lastChild;
    st.chron.slice().reverse().forEach(function (c) {
      var jumpable = c.to && resolvePost(st, c.to);
      var row = h('div', { class: jumpable ? 'chron-jump' : '' },
        c.who ? h('b', {}, st.handles[c.who] + ' ') : '', c.line,
        jumpable ? h('span', { class: 'jump-hint', text: ' ↗ open' }) : null);
      if (jumpable) row.addEventListener('click', function () { jumpTo(st, c.to); });
      host.appendChild(row);
    });
    wrap.appendChild(chron);
    if (st.epochHistory.length) {
      var hist = h('div', { class: 'card', style: 'margin-top:14px' }, h('p', { class: 'eyebrow', text: 'epoch certificates' }));
      st.epochHistory.slice().reverse().forEach(function (e2) {
        hist.appendChild(h('p', { class: 'smallnote' },
          'epoch ' + e2.epoch + ' · ' + e2.acts + ' acts · stamp ',
          h('span', { class: 'num', text: fmt(e2.stamp, 3) }), ' · headroom ',
          h('span', { class: 'num', text: fmt(e2.headroom, 3) }), ' · ',
          h('span', { class: 'gate ' + (e2.pass ? 'pass' : 'fail'), text: e2.pass ? 'accepted' : 'failed' })));
      });
      wrap.appendChild(hist);
    }
    return wrap;
  }

  function alertsCard(st) {
    var notifs = notificationsFor(st, who);
    if (!notifs.length) return null;
    var freshN = unseenCount(notifs);
    var card = h('div', { class: 'card' },
      h('h2', {}, 'Alerts', freshN ? h('span', { class: 'standing-chip', style: 'margin-left:8px', text: freshN + ' new' }) : null));
    notifs.slice(0, 8).forEach(function (n) {
      card.appendChild(h('p', { class: 'smallnote', style: n.idx > seenMark ? 'border-left:2px solid var(--ember); padding-left:7px' : '' },
        h('b', {}, st.handles[n.who] || n.who), ' ' + (NOTIF_VERB[n.kind] || n.kind) +
        (n.text ? ' — “' + n.text.slice(0, 40) + '”' : '')));
    });
    markSeen(notifs);
    return card;
  }

  function standingsCard(st) {
    var table = h('table', { class: 'standings' },
      h('tr', {}, h('th', { text: 'peer' }), h('th', { class: 'r', text: 'rate' }), h('th', { class: 'r', text: 'standing' }), h('th', { text: '' })));
    st.ledgers.slice().sort(function (a, b) { return (st.xById[b.id] || 0) - (st.xById[a.id] || 0); }).forEach(function (l) {
      if (l.deleted) return;
      var row = h('tr', { class: l.id === who ? 'me' : '' },
        h('td', {}, st.handles[l.id] + (st.pinHash[l.id] ? ' 🔒' : ''), ' ', deltaChip(l.id, st)),
        h('td', { class: 'r num', text: fmt(l.burnBal / Math.max(l.actCount, 1), 3) }),
        h('td', { class: 'r num', text: fmt(credibility(st, l.id), 4) }),
        h('td', {}));
      row.addEventListener('click', function () { openProfile(l.id); });
      table.appendChild(row);
    });
    return h('div', { class: 'card' }, h('h2', { text: 'Standings' }), table,
      h('p', { class: 'smallnote', text: 'ν · x*, the conserved mediant of transported (balance, count) pairs. Click a peer for their profile.' }));
  }

  function epochCard(st) {
    var dActs = Object.keys(st.deltaActs).reduce(function (s, k) { return s + st.deltaActs[k]; }, 0);
    var gates = E.evaluateGates(st.ledgers, st.solved.x, st.dmap);
    return h('div', { class: 'card' },
      h('h2', { text: 'Epoch ' + st.epochNow }),
      h('p', { class: 'smallnote' }, dActs + ' act' + (dActs === 1 ? '' : 's') + ' pending · projected stamp ',
        h('span', { class: 'num', text: dActs ? fmt(gates.epochStamp, 3) : '—' }), ' vs door ' + PART_FLOOR),
      h('div', {},
        h('span', { class: 'gate ' + (gates.w2bPass ? 'pass' : 'fail'), text: 'W2b door' }),
        h('span', { class: 'gate ' + (gates.w2a.every(function (x) { return x.pass; }) ? 'pass' : 'fail'), text: 'W2a wall' })),
      h('button', { class: 'btn', style: 'margin-top:8px', text: 'Close epoch ' + st.epochNow, onclick: function () {
        var stNow = replay();
        Object.keys(stNow.xById).forEach(function (id) { prevX[id] = stNow.xById[id]; });
        pushAct({ t: 'closeEpoch', epoch: stNow.epochNow }, function () {
          toast('Epoch closed and stamped. Tenure advances; the self-edge bond re-reads standing.');
        });
      } }),
      h('p', { class: 'smallnote', style: 'margin-top:8px', text: 'Closing stamps writers with final reduced standing, checks wall ' + fmt(SAFE_FLOOR, 3) + ' and door ' + PART_FLOOR + ', advances self-edge tenure.' }));
  }

  function openProfile(id) {
    var st = replay();
    var l = st.ledgerById[id];
    if (!l) return;
    var overlay = document.getElementById('overlay');
    overlay.innerHTML = '';
    function close() { overlay.innerHTML = ''; }
    var given = [], received = [];
    for (var k in st.bundles) {
      var b = st.bundles[k];
      var pd = Math.max(-1, Math.min(1, b.pd)), pi = Math.max(-1, Math.min(1, b.pi));
      var live = pd > 0 && pi > 0;
      var line = { other: b.src === id ? b.rcp : b.src, coeff: live ? Math.sqrt(pd * pi) : 0, live: live };
      if (b.src === id) given.push(line); else if (b.rcp === id) received.push(line);
    }
    var bond = credibility(st, id) / (NU + credibility(st, id));
    var drawer = h('div', { class: 'drawer' },
      h('button', { class: 'btn small ghost', text: '← close', onclick: close }),
      avatar(st.handles[id]),
      h('h3', { text: st.handles[id] + (st.pinHash[id] ? ' 🔒' : '') }),
      h('span', { class: 'standing-chip', text: 'standing ' + fmt(credibility(st, id), 4) }),
      h('dl', { class: 'ledger sect' },
        h('dt', { text: 'reserve' }), h('dd', { class: 'num', text: fmt(l.burnBal, 3) }),
        h('dt', { text: 'acts N' }), h('dd', { class: 'num', text: String(l.actCount) }),
        h('dt', { text: 'rate' }), h('dd', { class: 'num', text: fmt(l.burnBal / Math.max(l.actCount, 1), 3) }),
        h('dt', { text: 'self-bond p_i' }), h('dd', { class: 'num', text: fmt(bond, 3) }),
        h('dt', { text: 'acts this epoch' }), h('dd', { class: 'num', text: String(st.deltaActs[id] || 0) })));
    function vsect(title, list, dir) {
      var s = h('div', { class: 'sect' }, h('p', { class: 'eyebrow', text: title }));
      if (!list.length) s.appendChild(h('p', { class: 'smallnote', text: 'none yet' }));
      list.forEach(function (v) {
        s.appendChild(h('div', { class: 'vouchline' },
          h('span', {}, (dir === 'out' ? '→ ' : '← ') + (st.handles[v.other] || v.other)),
          h('span', { class: 'num', text: v.live ? 'c ' + fmt(v.coeff, 3) : 'folded out' })));
      });
      return s;
    }
    drawer.appendChild(vsect('vouches given', given, 'out'));
    drawer.appendChild(vsect('vouches received', received, 'in'));
    if (id !== who) {
      drawer.appendChild(h('div', { class: 'sect' },
        h('button', { class: 'btn small', text: 'Chat with ' + st.handles[id], onclick: function () {
          close();
          chatPeer = id;
          if (mode === 'geek') { tab = 'chat'; } else { lqView = 'chats'; }
          save(); render();
        } })));
      var p = slider('support', 0.7), r = slider('conviction', 0.7);
      drawer.appendChild(h('div', { class: 'sect' },
        h('p', { class: 'eyebrow', text: 'vouch for ' + st.handles[id] }),
        h('div', { class: 'mini-form' }, p.row, r.row,
          h('button', { class: 'btn small primary', text: 'Vouch · −θ', onclick: function () {
            close();
            tryAct(who, { t: 'opinion', author: who, target: 'prof_' + id, p: p.value(), r: r.value() },
              'Vouch recorded — a positive folded Opinion on a profile compiles a person-vouch. Your rate now flows to ' + st.handles[id] + '.');
          } }))));
    }
    overlay.appendChild(h('div', { class: 'scrim', onclick: close }));
    overlay.appendChild(drawer);
  }

  boot();
})();
</script>
