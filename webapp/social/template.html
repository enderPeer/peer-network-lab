<title>Peer — social sandbox</title>
<style>
:root {
  --paper: #FBF6F0;
  --card: #FFFFFF;
  --card-2: #F6EFE6;
  --ink: #251F19;
  --muted: #8A7C6C;
  --line: #E7DCCC;
  --line-2: #D9CBB6;
  --ember: #C24D2C;
  --ember-hot: #E0663C;
  --ember-soft: rgba(194, 77, 44, 0.10);
  --brass: #9C7A3C;
  --brass-soft: rgba(156, 122, 60, 0.12);
  --moss: #4E7A56;
  --moss-soft: rgba(78, 122, 86, 0.13);
  --bad: #A93B2A;
  --bad-soft: rgba(169, 59, 42, 0.11);
  --shadow: 0 1px 2px rgba(60, 42, 24, 0.06), 0 8px 28px rgba(60, 42, 24, 0.07);
  /* type: condensed grotesk for display/labels, book serif for reading, mono for figures */
  --display: 'Bahnschrift', 'Avenir Next Condensed', 'Roboto Condensed', 'Arial Narrow', sans-serif;
  --body: 'Charter', 'Bitstream Charter', Cambria, 'Iowan Old Style', Georgia, serif;
  --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  /* ledger tokens (mainstream view) — paper, ink, one signal colour */
  --lq-paper: #EFEFEA;
  --lq-sheet: #FFFFFF;
  --lq-sunk: #E7E7E1;
  --lq-ink: #17181B;
  --lq-muted: #6E7075;
  --lq-rule: #D6D6CF;
  --lq-rule-2: #BFBFB6;
  --lq-accent: #D8330F;
  --lq-accent-2: #1F3A6B;
  --lq-gold: #8A6A2B;
  --lq-good: #1F6B4A;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #131110; --card: #1C1917; --card-2: #211D1A; --ink: #EEE7DC; --muted: #9F9283;
    --line: #2E2822; --line-2: #3A322A; --ember: #E0663C; --ember-hot: #F07A4C;
    --ember-soft: rgba(224, 102, 60, 0.14); --brass: #C9A45E; --brass-soft: rgba(201, 164, 94, 0.14);
    --moss: #7FAF88; --moss-soft: rgba(127, 175, 136, 0.14); --bad: #E06A55; --bad-soft: rgba(224, 106, 85, 0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 28px rgba(0,0,0,0.35);
    --lq-paper: #131315; --lq-sheet: #1A1B1E; --lq-sunk: #202126;
    --lq-ink: #ECECE7; --lq-muted: #92949A; --lq-rule: #2C2D32; --lq-rule-2: #3D3E45;
    --lq-accent: #FF5630; --lq-accent-2: #7FA3E8; --lq-gold: #C9A25E; --lq-good: #58B98A;
  }
}
:root[data-theme="light"] {
  --paper: #FBF6F0; --card: #FFFFFF; --card-2: #F6EFE6; --ink: #251F19; --muted: #8A7C6C;
  --line: #E7DCCC; --line-2: #D9CBB6; --ember: #C24D2C; --ember-hot: #E0663C;
  --ember-soft: rgba(194,77,44,0.10); --brass: #9C7A3C; --brass-soft: rgba(156,122,60,0.12);
  --moss: #4E7A56; --moss-soft: rgba(78,122,86,0.13); --bad: #A93B2A; --bad-soft: rgba(169,59,42,0.11);
  --shadow: 0 1px 2px rgba(60,42,24,0.06), 0 8px 28px rgba(60,42,24,0.07);
  --lq-paper: #EFEFEA; --lq-sheet: #FFFFFF; --lq-sunk: #E7E7E1;
  --lq-ink: #17181B; --lq-muted: #6E7075; --lq-rule: #D6D6CF; --lq-rule-2: #BFBFB6;
  --lq-accent: #D8330F; --lq-accent-2: #1F3A6B; --lq-gold: #8A6A2B; --lq-good: #1F6B4A;
}
:root[data-theme="dark"] {
  --paper: #131110; --card: #1C1917; --card-2: #211D1A; --ink: #EEE7DC; --muted: #9F9283;
  --line: #2E2822; --line-2: #3A322A; --ember: #E0663C; --ember-hot: #F07A4C;
  --ember-soft: rgba(224,102,60,0.14); --brass: #C9A45E; --brass-soft: rgba(201,164,94,0.14);
  --moss: #7FAF88; --moss-soft: rgba(127,175,136,0.14); --bad: #E06A55; --bad-soft: rgba(224,106,85,0.14);
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 28px rgba(0,0,0,0.35);
  --lq-paper: #131315; --lq-sheet: #1A1B1E; --lq-sunk: #202126;
  --lq-ink: #ECECE7; --lq-muted: #92949A; --lq-rule: #2C2D32; --lq-rule-2: #3D3E45;
  --lq-accent: #FF5630; --lq-accent-2: #7FA3E8; --lq-gold: #C9A25E; --lq-good: #58B98A;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); margin: 0; line-height: 1.45; }
button { font-family: var(--body); cursor: pointer; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
::selection { background: var(--ember-soft); }

.shell { max-width: 1220px; margin: 0 auto; padding: 0 18px 40px; }

/* ═══ GEEK MODE (Layer-1 lab look) ═══ */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 10px 2px; margin-bottom: 14px; flex-wrap: wrap;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.wordmark { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 24px; margin: 0; letter-spacing: 0.04em; }
.wordmark em { font-style: normal; color: var(--ember); }
/* Eight tabs do not fit a phone, and the page clips horizontal overflow, so
   the last ones were unreachable rather than merely off-screen — reported as
   "the Live tab is not shown". The row scrolls on its own instead. */
.tabs { display: flex; gap: 2px; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; max-width: 100%; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 0 0 auto; white-space: nowrap; }
.tabs button { border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 5px 14px; border-radius: 7px; font-weight: 600; }
.tabs button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.switcher { display: flex; gap: 8px; align-items: center; }
.switcher select { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }

.cols { display: grid; grid-template-columns: 256px minmax(0, 1fr) 296px; gap: 16px; align-items: start; }
/* minmax(0,…) everywhere a track holds user content: a plain 1fr floors at
   min-content, so one unbroken 1000-character word would stretch the whole
   page and push the controls off-screen. Anyone can post such a word. */
@media (max-width: 1010px) { .cols { grid-template-columns: minmax(0, 1fr); } .rail { position: static; } }
.cols > * { min-width: 0; }
/* Structural backstop: whatever a peer posts, the page itself never widens —
   an oversized child scrolls inside its own card instead. */
html, body { overflow-x: hidden; }
.post, .card, .lq-card, .chat-msg, .lq-msg { max-width: 100%; }
/* Applied to the CONTAINERS, not to a list of text classes. overflow-wrap
   inherits, so every piece of peer-written text inside a card is covered —
   including the ones nobody thought of. The first version of this rule
   enumerated class names and missed .txt, the comment body in simple mode,
   which a tester found within the hour: a single 1000-character word still
   blew that column out to 7200px. Enumerating was the bug. */
.post, .card, .lq-card, .comment, .lq-comment, .lq-comments, .chat-thread, .lq-thread,
.chat-row, .lq-peer, .lq-alert, .alert-row, .chron-row, .toast, .quote-embed {
  overflow-wrap: anywhere; word-break: break-word;
}
/* Flex and grid children default to min-width:auto, which refuses to shrink
   below their content. Without this the wrap above cannot take effect. */
.post *, .card *, .lq-card *, .comment *, .lq-comment *, .grow { min-width: 0; }
.rail { position: sticky; top: 62px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
.card + .card { margin-top: 14px; }
.card h2 { font-family: var(--display); font-size: 17px; margin: 0 0 10px; letter-spacing: 0.01em; }
.eyebrow { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600; }

.idcard .who { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
.avatar { width: 42px; height: 42px; border-radius: 5px; border: 1.5px solid var(--ink); background: var(--card-2); color: var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 21px; flex: none; }
.avatar.s { width: 27px; height: 27px; font-size: 13.5px; }
.handle { font-weight: 700; font-size: 15px; }
.standing-chip { font-family: var(--mono); font-size: 11px; color: var(--brass); background: var(--brass-soft); border-radius: 10px; padding: 2px 8px; }
.ledger { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12.5px; margin: 0; }
.ledger dt { color: var(--muted); }
.ledger dd { margin: 0; text-align: right; }
.gauge { height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 10px 0 6px; }
.gauge i { display: block; height: 100%; background: var(--ember); border-radius: 4px; transition: width 0.4s ease; }
.smallnote { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

.btn { border: 1px solid var(--line-2); background: var(--card); color: var(--ink); border-radius: 9px; padding: 6px 13px; font-size: 13px; transition: border-color 0.12s, transform 0.05s; }
.btn:hover { border-color: var(--ember); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ember); border-color: var(--ink); color: #FFF4EC; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.small { padding: 3px 10px; font-size: 12px; border-radius: 7px; }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ember); border-color: transparent; }
.btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }

.composer textarea, .mini-form textarea { width: 100%; min-height: 66px; resize: vertical; background: var(--card-2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-family: var(--body); font-size: 13.5px; }
.composer .row { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.slider { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.slider input { accent-color: var(--ember); width: 88px; }
.slider output { font-family: var(--mono); width: 40px; text-align: right; color: var(--ink); }

.post { border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; margin-top: 12px; background: var(--card); transition: border-color 0.15s, box-shadow 0.15s; }
.post:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.post .head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.rank-chip { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 1px 7px; }
.post .head .kindtag { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-left: auto; }
.post .body { font-size: 14.5px; line-height: 1.55; margin: 8px 0; }
.tagrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 6px; }
.tagchip { font-size: 11.5px; color: var(--moss); background: var(--moss-soft); border-radius: 9px; padding: 2px 9px; }
.post .mech { font-family: var(--mono); font-size: 10.8px; color: var(--muted); overflow-wrap: anywhere; }
/* ── installed on a phone ────────────────────────────────────────────────
   In standalone mode there is no Safari chrome, so the app owns the whole
   screen including the strip under the notch and the home-indicator bar.
   Without these insets the top bar sits under the clock and the bottom nav
   under the swipe bar. 100vh is also wrong on iOS while the URL bar animates;
   -webkit-fill-available is the value that actually matches the window. */
body[data-standalone='1'] .shell { padding-top: env(safe-area-inset-top, 0px); }
body[data-standalone='1'] .topbar { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
body[data-standalone='1'] .lq-head { padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
body[data-standalone='1'] .shell, body[data-standalone='1'] .lq-shell {
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
}
@supports (-webkit-touch-callout: none) {
  body[data-standalone='1'] { min-height: -webkit-fill-available; }
}
/* Safari has no install prompt, so the only way in is Share → Add to Home
   Screen. Saying so is the whole feature. */
.a2hs { position: fixed; left: 10px; right: 10px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 500;
  background: #211d1a; color: #efe9df; border: 1px solid rgba(255,255,255,0.16); border-radius: 12px;
  padding: 12px 14px; box-shadow: 0 10px 34px rgba(0,0,0,0.5); font-size: 13.5px; line-height: 1.45; }
.a2hs b { display: block; margin-bottom: 3px; }
/* A paid placement must be unmistakable at a glance, and must not borrow the
   visual language of a ranked post — no rank chip, no relevance bar, and a
   left edge in a colour nothing else in the feed uses. */
.ad-card { border-style: dashed; border-color: var(--muted, #4a443f); position: relative; }
.ad-card::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px;
  border-radius: 12px 0 0 12px; background: #8a7a4a; }
/* A vouch can lower the standing of the person you back. Saying so needs to
   look like information, not like an error — hence a tinted panel rather than
   a red one, and no icon that reads as "something went wrong". */
.vouch-effect { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin: 8px 0; }
.vouch-effect.warn { border-color: #8a7a4a; background: rgba(138,122,74,.10); }
.vouch-effect.good { border-color: #4a7a55; background: rgba(74,122,85,.10); }
.vouch-effect p { margin: 5px 0 0; }
.a2hs.refusal b { display: block; margin-bottom: 2px; }
/* Label/value pairs. The class was used on every economy panel and had no
   rule at all, so on a narrow screen the text ran together: "minted so
   far275000.00hard cap". A two-column grid with the value right-aligned is
   what it always looked like it was meant to be. */
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
  align-items: baseline; margin: 8px 0; }
.kv > span { color: var(--dim, #a29a92); font-size: 13px; }
.kv > b { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 420px) {
  /* Long values wrap under their label rather than squeezing it to nothing. */
  .kv { grid-template-columns: 1fr; gap: 1px 0; }
  .kv > span { margin-top: 6px; }
  .kv > b { text-align: left; }
}

/* The mint attribution table: several numbers per row, so it scrolls
   sideways inside its own box rather than widening the page. */
.mint-epoch { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.mint-table { width: 100%; margin-top: 8px; font-size: 12px; }
.mint-epoch { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.lnk { background: none; border: 0; padding: 0; color: var(--accent, #d8b26a);
  font: inherit; cursor: pointer; text-decoration: underline; }
.tx { display: flex; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
.tx:last-child { border-bottom: 0; }
.tx-who { flex: 0 0 auto; min-width: 74px; color: var(--dim, #a29a92); }

/* ── Feed lanes ────────────────────────────────────────────────────────────
   The switcher is a horizontal strip that scrolls rather than wrapping, so it
   keeps its shape on a narrow phone instead of growing a second row and
   pushing the feed down. Each button is a real touch target. */
.lanes { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  -webkit-overflow-scrolling: touch; padding: 2px 0 8px; }
.lanes::-webkit-scrollbar { display: none; }
.lane { flex: 0 0 auto; min-width: 104px; min-height: 46px; text-align: left;
  background: var(--card-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 7px 12px; color: var(--ink); cursor: pointer; font: inherit; }
.lane b { display: block; font-size: 13px; }
.lane .smallnote { font-size: 10px; }
.lane.on { border-color: var(--accent, #d8b26a); background: var(--card); }

@media (max-width: 560px) {
  .lane { min-width: 92px; }
}
.ad-tag { font-size: 10px; letter-spacing: .12em; padding: 1px 6px; border-radius: 4px;
  background: #8a7a4a; color: #17140f; font-weight: 700; }
.a2hs .row { display: flex; gap: 8px; margin-top: 9px; }
.a2hs button { border: 1px solid rgba(255,255,255,0.22); background: transparent; color: #efe9df;
  border-radius: 8px; padding: 6px 13px; font: inherit; font-size: 13px; cursor: pointer; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #d63b2f; animation: livepulse 1.4s infinite; vertical-align: middle; }
@keyframes livepulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }
.stream-video { display: block; width: 100%; max-height: 60vh; background: #000; border-radius: 10px; margin: 8px 0; }
.view-chip { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: 6px; white-space: nowrap; cursor: help; }
body[data-mode='liquid'] .view-chip { color: var(--lq-muted, #888); }
.lock-warn { border-color: var(--ember); }
.lock-warn b { color: var(--ember); }
.g-handle.locked, .lq-ava.locked { outline: 2px solid var(--ember); outline-offset: 1px; }
.hop-chip { font-family: var(--mono); font-size: 10px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 1px 6px; white-space: nowrap; }
.hop-chip.far { opacity: 0.55; border-style: dashed; }
.react-count { color: var(--ember); font-size: 11.5px; }
body[data-mode='liquid'] .react-count { color: var(--lq-accent); }
.contribute { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line-2); }
.contribute p { margin: 4px 0 9px; }
.contribute .row { display: flex; flex-wrap: wrap; gap: 7px; }
.contribute a.btn { text-decoration: none; }
.who-link { font: inherit; font-weight: 700; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; border-bottom: 1px dotted var(--line-2); }
.who-link:hover { color: var(--ember); border-bottom-color: var(--ember); }
body[data-mode='liquid'] .who-link { color: var(--lq-ink); }
body[data-mode='liquid'] .who-link:hover { color: var(--lq-accent); }
.ref-link { font: inherit; font-family: var(--mono); font-size: 0.92em; color: var(--ember); background: var(--ember-soft); border: 0; border-radius: 4px; padding: 0 4px; cursor: pointer; }
.ref-link:hover { background: var(--ember); color: #fff; }
body[data-mode='liquid'] .ref-link { color: var(--lq-accent); background: rgba(0,0,0,0.05); }
.charcount { display: block; text-align: right; font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.charcount.near { color: var(--ember); }
.charcount.over { color: var(--bad); font-weight: 700; }
.post .mech b { color: var(--ink); font-weight: 600; }
.rankbar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 7px; overflow: hidden; }
.rankbar i { display: block; height: 100%; background: var(--ember); transition: width 0.5s ease; }
.actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.mini-form { background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.mini-form input[type='text'], .mini-form input[type='password'] { background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 6px 9px; font-size: 13px; }

.post-media { display: block; max-width: 100%; max-height: 420px; object-fit: contain; border-radius: 12px; margin: 8px 0 4px; background: rgba(127,127,127,0.08); }
.post-audio { display: block; width: 100%; margin: 4px 0; }
/* Call dock: fixed dark panel, deliberately theme-independent — it floats
   above both frontends and must never be rebuilt by render() mid-call. */
#call-dock { position: fixed; right: 16px; bottom: 16px; z-index: 400; }
#call-dock audio { display: none; }
.call-panel { background: #211d1a; color: #efe9df; border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 12px 14px; min-width: 230px; box-shadow: 0 10px 34px rgba(0,0,0,0.5); font-size: 14px; }
.call-panel .c-title { font-weight: 700; margin-bottom: 2px; }
.call-panel .c-sub { font-size: 11px; opacity: 0.6; margin-bottom: 9px; }
.call-panel .c-row { display: flex; gap: 8px; }
.call-btn { border: 1px solid rgba(255,255,255,0.22); background: transparent; color: #efe9df; border-radius: 8px; padding: 6px 14px; cursor: pointer; font: inherit; font-size: 13px; }
.call-btn.yes { background: #2e7d4f; border-color: #2e7d4f; color: #fff; }
.call-btn.no { background: #a33d2f; border-color: #a33d2f; color: #fff; }
.call-live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4caf7a; margin-right: 7px; animation: callpulse 1.6s infinite; }
@keyframes callpulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.3 } }
.call-panel.ringing { animation: ringpulse 1.1s infinite; border-color: #4caf7a; min-width: 260px; }
@keyframes ringpulse { 0%, 100% { box-shadow: 0 10px 34px rgba(0,0,0,0.5); } 50% { box-shadow: 0 10px 34px rgba(0,0,0,0.5), 0 0 0 6px rgba(76,175,122,0.25); } }
.chat-call { text-align: center; font-size: 12px; opacity: 0.75; margin: 6px 0; }
.audio-wrap { margin: 8px 0 4px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px 4px; background: var(--card-2); }
.audio-wave { display: block; width: 100%; height: 44px; cursor: pointer; }
.audio-wrap.wave-none .audio-wave { display: none; }
body[data-mode='liquid'] .audio-wrap { background: var(--lq-sunk); border-color: var(--lq-rule); border-radius: 4px; }
.file-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; border: 1px solid var(--line-2); border-radius: 9px; padding: 5px 11px; margin: 8px 0 4px; color: var(--ink); text-decoration: none; background: var(--card-2); }
.file-chip:hover { border-color: var(--ember); }
body[data-mode='liquid'] .file-chip { background: var(--lq-glass-2); border-color: var(--lq-edge); color: var(--lq-ink); border-radius: 12px; }
.quote-embed { border-left: 3px solid var(--ember); background: var(--card-2); border-radius: 8px; padding: 8px 12px; margin: 8px 0 4px; cursor: pointer; }
.quote-embed .q-head { font-size: 11.5px; color: var(--muted); }
.quote-embed .q-head b { color: var(--ink); }
.quote-embed .q-text { font-size: 13px; line-height: 1.5; }
.quote-embed.gone { border-left-color: var(--line-2); cursor: default; }
.quote-embed.gone .q-text { font-style: italic; color: var(--muted); }
body[data-mode='liquid'] .quote-embed { background: var(--lq-glass-2); border-left-color: var(--lq-accent); border-radius: 12px; }
body[data-mode='liquid'] .quote-embed .q-text { color: var(--lq-ink); }
.mention-chip { font-size: 11.5px; color: var(--ember); background: var(--ember-soft); border-radius: 9px; padding: 2px 9px; }
body[data-mode='liquid'] .mention-chip { color: var(--lq-accent); background: color-mix(in srgb, var(--lq-accent) 12%, transparent); }
.compose-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px dashed var(--line-2); border-radius: 9px; padding: 3px 9px; color: var(--muted); }
.compose-chip button { border: 0; background: transparent; color: var(--bad); cursor: pointer; font-size: 13px; padding: 0 2px; }

.comments { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 4px; }
.comment { display: flex; gap: 8px; padding: 7px 0; align-items: flex-start; }
.comment .c-body { font-size: 13px; line-height: 1.5; }
.comment .c-head { font-size: 12px; color: var(--muted); }
.comment .c-head b { color: var(--ink); }

.gate { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; border-radius: 10px; padding: 2px 9px; margin: 2px 4px 2px 0; font-weight: 600; }
.gate.pass { background: var(--moss-soft); color: var(--moss); }
.gate.fail { background: var(--bad-soft); color: var(--bad); }
.delta { font-family: var(--mono); font-size: 10.5px; border-radius: 8px; padding: 1px 6px; }
.delta.up { color: var(--moss); background: var(--moss-soft); }
.delta.down { color: var(--bad); background: var(--bad-soft); }

table.standings { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.standings th { text-align: left; color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; padding: 2px 6px 5px 0; }
table.standings td { padding: 5px 6px 5px 0; border-top: 1px solid var(--line); }
table.standings td.r, table.standings th.r { text-align: right; }
table.standings tr.me td { background: var(--ember-soft); }
table.standings tr:not(:first-child) { cursor: pointer; }

/* network tab: path explanation */
.path-row { border-top: 1px solid var(--line); padding: 8px 0 6px; }
.path-row:first-of-type { border-top: 0; }
.path-chain { font-size: 12.5px; color: var(--ink); margin-top: 3px; overflow-wrap: anywhere; }
.bridge-note { font-size: 12.5px; line-height: 1.55; color: var(--muted); background: var(--bad-soft); border: 1px solid rgba(169,59,42,0.35); border-radius: 9px; padding: 9px 12px; margin-top: 10px; }
.bridge-note b { color: var(--bad); }

/* jump-to-content */
.chron-jump { cursor: pointer; border-radius: 6px; padding-left: 6px; margin-left: -6px; }
.chron-jump:hover { background: var(--card-2); }
.jump-hint { font-size: 10.5px; color: var(--ember); font-weight: 600; white-space: nowrap; }
.focus-wrap { border: 2px solid var(--ember); border-radius: 14px; padding: 4px; margin-bottom: 14px; scroll-margin-top: 70px; }
.focus-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 10px 6px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ember); font-weight: 700; }
.focus-hit { background: var(--ember-soft); border-radius: 8px; outline: 1px solid var(--ember); }
body[data-mode='liquid'] .focus-wrap { border-color: var(--lq-accent); border-radius: 6px; }
body[data-mode='liquid'] .focus-bar { color: var(--lq-accent); }

@media (prefers-reduced-motion: no-preference) {
  .focus-wrap { animation: focusIn 0.35s ease-out; }
  @keyframes focusIn { from { box-shadow: 0 0 0 6px var(--ember-soft); } to { box-shadow: 0 0 0 0 transparent; } }
}

/* threaded replies */
.comments .nested, .lq-comments .nested { margin-left: 22px; border-left: 2px solid var(--line); padding-left: 10px; }
.comment .grow, .lq-comment .grow { flex: 1; min-width: 0; }
.reply-btn { margin-top: 4px; opacity: 0.75; }
.reply-btn:hover { opacity: 1; }
body[data-mode='liquid'] .reply-btn { padding: 3px 11px; font-size: 12px; }

/* wall warning */
.wall-warn { background: rgba(210, 153, 34, 0.14); border: 1px solid rgba(210, 153, 34, 0.45); border-radius: 10px; padding: 8px 11px; margin-bottom: 10px; }
.wall-warn b { color: var(--brass); font-size: 12.5px; }
.wall-warn.bad { background: var(--bad-soft); border-color: rgba(169, 59, 42, 0.5); }
.wall-warn.bad b { color: var(--bad); }

/* geek alerts */
.alert-row { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
.alert-row:first-of-type { border-top: 0; }
.alert-row .grow { flex: 1; min-width: 0; }
.alert-row.fresh { background: var(--ember-soft); border-radius: 8px; padding-left: 8px; padding-right: 8px; }
.nbadge { display: inline-block; min-width: 15px; margin-left: 5px; padding: 0 4px; border-radius: 8px; background: var(--ember); color: #FFF4EC; font-size: 10px; line-height: 15px; text-align: center; font-weight: 700; }
.media-failed { display: none; }

/* geek chats */
.chat-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
.chat-row:hover { background: var(--card-2); }
.chat-row .grow { flex: 1; min-width: 0; }
.chat-thread { max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 6px 0; }
.chat-msg { max-width: 78%; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 13.5px; align-self: flex-start; }
.chat-msg.mine { align-self: flex-end; background: var(--ember-soft); border-color: rgba(194,77,44,0.3); }
.chat-msg .m-meta { display: block; font-size: 10px; color: var(--muted); margin-bottom: 2px; }

.chron { font-size: 12.5px; color: var(--muted); }
.chron > div { padding: 7px 0; border-top: 1px dashed var(--line); line-height: 1.5; }
.chron b { color: var(--ink); font-weight: 600; }

.onboard { max-width: 620px; margin: 7vh auto 0; text-align: center; }
.onboard .wordmark { font-size: 64px; margin-bottom: 2px; }
.onboard p.lede { font-family: var(--display); font-size: 18.5px; line-height: 1.6; margin: 12px auto 8px; max-width: 34em; text-wrap: balance; }
.pulse { display: flex; gap: 18px; justify-content: center; margin: 18px 0 26px; flex-wrap: wrap; }
.pulse .stat { font-size: 12px; color: var(--muted); }
.pulse .stat b { display: block; font-family: var(--mono); font-size: 19px; color: var(--ink); font-weight: 600; }
.onboard .join { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.onboard input { background: var(--card); border: 1px solid var(--line-2); color: var(--ink); border-radius: 10px; padding: 10px 14px; font-size: 15px; width: 200px; }
.residents { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.resident { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px 8px 9px; cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s; }
.resident:hover { border-color: var(--ember); box-shadow: var(--shadow); }
.resident .r-h { font-weight: 600; font-size: 13.5px; text-align: left; }
.resident .r-r { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: left; }
@media (prefers-reduced-motion: no-preference) {
  .onboard > * { animation: settle 0.5s ease-out backwards; }
  .onboard > *:nth-child(2) { animation-delay: 0.06s; }
  .onboard > *:nth-child(3) { animation-delay: 0.12s; }
  .onboard > *:nth-child(4) { animation-delay: 0.18s; }
  .onboard > *:nth-child(5) { animation-delay: 0.24s; }
  .onboard > *:nth-child(6) { animation-delay: 0.30s; }
  @keyframes settle { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .post, .lq-card { animation: settle 0.3s ease-out backwards; }
}

.netwrap { overflow-x: auto; }
#netsvg { width: 100%; min-width: 560px; height: auto; }
.node-g text { fill: var(--ink); font-size: 11.5px; text-anchor: middle; font-family: var(--body); pointer-events: none; }
.node-g .kind { fill: var(--muted); font-size: 8.5px; letter-spacing: 0.06em; text-transform: uppercase; }
.edge-g { cursor: pointer; }
.edge-g text { font-family: var(--mono); font-size: 9px; fill: var(--muted); text-anchor: middle; }
.edge-g.sel text { fill: var(--ember); font-weight: 600; }

.mat { display: inline-grid; gap: 3px; margin: 6px 14px 8px 0; vertical-align: top; }
.mat .cell { width: 46px; height: 27px; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-family: var(--mono); border-radius: 5px; color: #1B140E; font-weight: 600; }
.mat-title { font-size: 11px; color: var(--muted); margin-top: 8px; }
.chain { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin: 10px 0 2px; font-size: 12.5px; }
.chain .term { background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; }
.chain .term small { display: block; color: var(--muted); font-size: 9.5px; }
.chain .op { color: var(--muted); }
.chain .result { background: var(--ember-soft); border-color: var(--ember); }

.scrim { position: fixed; inset: 0; background: rgba(30, 20, 12, 0.35); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 92vw); background: var(--card); border-left: 1px solid var(--line); z-index: 31; padding: 20px; overflow-y: auto; box-shadow: -12px 0 40px rgba(30,20,12,0.18); }
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slidein 0.22s ease-out; }
  @keyframes slidein { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
}
.drawer h3 { font-family: var(--display); font-size: 20px; margin: 10px 0 2px; }
.drawer .sect { margin-top: 16px; }
.vouchline { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; border-top: 1px dashed var(--line); }

.pin-dialog { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 40; }
.pin-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; width: min(320px, 90vw); box-shadow: var(--shadow); text-align: center; position: relative; z-index: 41; }
.pin-card h3 { font-family: var(--display); margin: 4px 0 10px; }
.pin-card input { width: 100%; text-align: center; font-size: 18px; letter-spacing: 0.3em; background: var(--card-2); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 10px; font-family: var(--mono); }
.pin-card .row { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }

.toast-host { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 50; width: min(520px, 92vw); }
.toast { background: var(--ink); color: var(--paper); border-radius: 10px; padding: 9px 15px; font-size: 12.5px; box-shadow: 0 6px 24px rgba(20,12,6,0.3); }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise 0.2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
details.about summary { cursor: pointer; font-family: var(--display); font-size: 15px; }
details.about p { font-size: 12.5px; line-height: 1.55; color: var(--muted); }
details.about b { color: var(--ink); }
.footer-note { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 26px; }

/* guidebook */
.guide details { border-top: 1px solid var(--line); padding: 10px 0; }
.guide details:first-of-type { border-top: 0; }
.guide summary { cursor: pointer; font-family: var(--display); font-size: 16px; padding: 4px 0; }
.guide summary::marker { color: var(--ember); }
.guide p, .guide li { font-size: 13px; line-height: 1.6; color: var(--muted); }
.guide b, .guide strong { color: var(--ink); }
.guide .formula { font-family: var(--mono); font-size: 12.5px; color: var(--ink); background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 8px 0; overflow-x: auto; }
.guide .k { font-family: var(--mono); font-size: 11.5px; background: var(--card-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--ink); white-space: nowrap; }
.guide ol.steps { padding-left: 20px; }
.guide ol.steps li { margin: 8px 0; }
.guide ol.steps li::marker { color: var(--ember); font-weight: 700; }
.guide .watch { color: var(--moss); font-weight: 600; }
.guide table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 6px 0; }
.guide th { text-align: left; color: var(--muted); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; padding: 3px 10px 5px 0; }
.guide td { padding: 4px 10px 4px 0; border-top: 1px solid var(--line); vertical-align: top; }
.guide td:first-child { font-family: var(--mono); white-space: nowrap; color: var(--ink); }
.guide .jump { margin-left: 8px; }

/* ═══ MAINSTREAM MODE — the ledger look: paper, ink, one signal colour ═══ */
body[data-mode='liquid'] {
  background: var(--lq-paper);
  color: var(--lq-ink);
  font-family: var(--body);
}
.lq-shell { max-width: 640px; margin: 0 auto; padding: 12px 14px 110px; }
.lq-glass {
  background: var(--lq-sheet);
  border: 1px solid var(--lq-rule-2);
  border-radius: 6px;
  box-shadow: 3px 3px 0 color-mix(in srgb, var(--lq-ink) 10%, transparent);
}
.lq-head { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin: 0 -14px 16px; background: var(--lq-sheet); border: 0; border-bottom: 2px solid var(--lq-ink); border-radius: 0; box-shadow: none; }
.lq-head .wordmark { font-size: 21px; color: var(--lq-ink); }
.lq-head .wordmark em { color: var(--lq-accent); }
.lq-energy { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--lq-muted); }
.lq-energy .bar { width: 74px; height: 9px; border: 1px solid var(--lq-rule-2); background: var(--lq-sunk); overflow: hidden; }
.lq-energy .bar i { display: block; height: 100%; background: var(--lq-accent); transition: width 0.4s; }
.lq-ava { width: 36px; height: 36px; border-radius: 4px; border: 1.5px solid var(--lq-ink); background: var(--lq-sunk); color: var(--lq-ink); font-family: var(--display); font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; }
.lq-ava.s { width: 29px; height: 29px; font-size: 13.5px; }
.lq-ava.xs { width: 23px; height: 23px; font-size: 11.5px; }

.lq-card { padding: 16px 18px; margin-bottom: 14px; }
.lq-card h2 { font-family: var(--display); font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 10px; border-bottom: 1px solid var(--lq-rule); padding-bottom: 6px; }
.lq-name { font-family: var(--display); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--lq-ink); }
.lq-sub { font-size: 12px; color: var(--lq-muted); }
.lq-cred { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-family: var(--mono); color: var(--lq-gold); font-weight: 700; }
.lq-body { font-size: 16px; line-height: 1.55; margin: 10px 0 4px; color: var(--lq-ink); }
.lq-tagrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 2px; }
.lq-tag { font-size: 11px; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.06em; color: var(--lq-accent-2); border: 1px solid currentColor; padding: 1px 8px; font-weight: 600; }

.lq-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.lq-pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1.5px solid var(--lq-ink); background: var(--lq-sheet);
  color: var(--lq-ink); border-radius: 4px; padding: 7px 14px;
  font-family: var(--display); font-size: 12.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em;
  box-shadow: 2px 2px 0 color-mix(in srgb, var(--lq-ink) 25%, transparent);
  transition: transform 0.06s, box-shadow 0.06s;
}
.lq-pill:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 color-mix(in srgb, var(--lq-ink) 25%, transparent); }
.lq-pill:active { transform: translate(1px, 1px); box-shadow: 0 0 0 transparent; }
.lq-pill.hot { background: var(--lq-accent); color: #FFF; border-color: var(--lq-ink); }
.lq-pill svg { width: 14px; height: 14px; }
.lq-pill:focus-visible, .lq-input:focus-visible { outline: 2px solid var(--lq-accent); outline-offset: 1px; }

.lq-input, body[data-mode='liquid'] textarea.lq-input {
  width: 100%; background: var(--lq-sunk); border: 1.5px solid var(--lq-rule-2);
  color: var(--lq-ink); border-radius: 4px; padding: 10px 13px; font-size: 16px; font-family: var(--body);
}
body[data-mode='liquid'] textarea.lq-input { min-height: 72px; resize: vertical; }
.lq-input::placeholder { color: var(--lq-muted); }
.lq-input:focus { background: var(--lq-sheet); border-color: var(--lq-ink); }

.lq-comments { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.lq-comment { display: flex; gap: 9px; align-items: flex-start; background: var(--lq-sunk); border-left: 3px solid var(--lq-rule-2); padding: 8px 12px; }
.lq-comment .lq-sub b { color: var(--lq-ink); }
.lq-comment .txt { font-size: 14px; line-height: 1.5; }

.lq-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 25;
  display: flex; justify-content: center; gap: 0; padding: 0;
  background: var(--lq-sheet); border: 0; border-top: 2px solid var(--lq-ink);
  border-radius: 0; box-shadow: none;
}
.lq-nav button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: transparent; color: var(--lq-muted); font-family: var(--display); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 9px 20px calc(9px + env(safe-area-inset-bottom, 0px)); }
.lq-nav button.on { background: var(--lq-ink); color: var(--lq-paper); }
.lq-nav button .nbadge { position: absolute; top: 3px; right: 8px; background: var(--lq-accent); color: #FFF; font-family: var(--mono); font-size: 9.5px; min-width: 15px; height: 15px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
.lq-nav svg { width: 18px; height: 18px; }

.lq-peer { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-top: 1px solid var(--lq-rule); }
.lq-peer:first-of-type { border-top: 0; }
.lq-peer .grow { flex: 1; min-width: 0; }
.lq-sheet { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--lq-sunk); border: 1px solid var(--lq-rule); border-radius: 4px; padding: 12px 14px; }
.lq-range { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--lq-muted); }
.lq-range input { accent-color: var(--lq-accent); width: 130px; }
.lq-range output { font-family: var(--mono); font-size: 13px; color: var(--lq-ink); width: 34px; text-align: right; }
.lq-note { font-size: 12.5px; color: var(--lq-muted); line-height: 1.55; }

<script>
/*__ENGINE__*/
/*__REPLAY__*/
</script>
<script>
(function () {
  'use strict';
  var E = window.PeerEngine;
  var THETA = E.THETA, NU = E.NU, SAFE_FLOOR = E.SAFE_FLOOR, PART_FLOOR = E.PART_FLOOR;
  var LS_WORLD = 'peer-sandbox-world-v2';
  var LS_WHO = 'peer-sandbox-who-v2';
  var LS_MODE = 'peer-sandbox-mode-v1';
  var LS_PINS = 'peer-sandbox-pins-v1';
  var LS_VIEW = 'peer-sandbox-view-v1';
  // Which tab and which sort you were on survives a reload. Nothing here is
  // protocol state — purely where you were standing.
  var GEEK_TABS = ['feed', 'chat', 'alerts', 'net', 'live', 'econ', 'ledger', 'guide'];
  var LQ_VIEWS = ['feed', 'chats', 'alerts', 'peers', 'you'];

  var world = { acts: [{ t: 'seedWorld' }] }, who = null, tab = 'feed', lqView = 'feed';
  var selEdge = null, prevX = {}, REMOTE = false, feedMode = 'l1'; // geek feed: 'l1' | 'cogra' | 'new' | 'follow'
  // A query is where you are LOOKING, not where you are standing, so it is
  // deliberately not persisted: a restored query would silently filter
  // somebody's feed the next time they opened the app.
  var query = '';
  var econView = 'wallet'; // 'wallet' | 'pools' | 'layer0' | 'ledger'
  // When every host is down, the app can still read a published snapshot of
  // the log from the same static hosting that serves this page. archiveInfo
  // holds what that snapshot is, so the interface can say so instead of
  // pretending to be live.
  var archiveInfo = null;
  var API = ''; // '' = this origin; set by resolveHost() when served statically
  var lqSort = 'foryou'; // liquid feed: 'foryou' | 'new'
  var feedLimit = 30;    // windowed rendering — raised by "show more"
  var composeMedia = null, composeQuote = null; // pending composer attachments
  var focusNode = null;  // jump target from the Record/Alerts — pinned atop the feed
  var netScope = 'social', netMinW = 0, netView = null; // network tab: filter + viewport
  var netTarget = null; // network tab: whose reach we are explaining
  var viewAs = null; // geek feed: rank from another identity's perspective (read-only)
  var netLayoutCache = { key: '', pos: null };
  // Geek is the default for everyone now, new accounts included. Simple mode
  // was the front door and it does not carry the newer surfaces — Live has no
  // tab there at all, which is why testers on several devices reported the
  // stream tab simply missing.
  var mode = 'geek';
  var pins = {};
  try { var w0 = JSON.parse(localStorage.getItem(LS_WORLD)); if (w0 && w0.acts) world = { acts: w0.acts }; } catch (e) {}
  try { who = JSON.parse(localStorage.getItem(LS_WHO)); } catch (e) { who = null; }
  try { var m0 = JSON.parse(localStorage.getItem(LS_MODE)); if (m0 === 'geek' || m0 === 'liquid') mode = m0; } catch (e) {}
  // One-time migration: anyone still parked in simple mode from before this
  // change lands in geek once. A deliberate switch after that is respected —
  // the migration only ever runs a single time per browser.
  try {
    if (!localStorage.getItem('peer-sandbox-geek-default-v1')) {
      localStorage.setItem('peer-sandbox-geek-default-v1', '1');
      mode = 'geek';
      localStorage.setItem(LS_MODE, JSON.stringify(mode));
    }
  } catch (e) {}
  // PINs live in sessionStorage only: closing the browser forgets them, so a
  // shared or stolen device never carries them. (One-time migration wipes the
  // old localStorage copy.)
  try { localStorage.removeItem(LS_PINS); } catch (e) {}
  try { var p0 = JSON.parse(sessionStorage.getItem(LS_PINS)); if (p0 && typeof p0 === 'object') pins = p0; } catch (e) {}
  try {
    var v0 = JSON.parse(localStorage.getItem(LS_VIEW));
    if (v0 && typeof v0 === 'object') {
      if (GEEK_TABS.indexOf(v0.tab) >= 0) tab = v0.tab;
      if (LQ_VIEWS.indexOf(v0.lqView) >= 0) lqView = v0.lqView;
      if (['l1', 'cogra', 'new', 'follow'].indexOf(v0.feedMode) >= 0) feedMode = v0.feedMode;
      if (['wallet', 'pools', 'layer0', 'ledger'].indexOf(v0.econView) >= 0) econView = v0.econView;
      if (['foryou', 'new'].indexOf(v0.lqSort) >= 0) lqSort = v0.lqSort;
      if (v0.netScope === 'social' || v0.netScope === 'all') netScope = v0.netScope;
    }
    // #live / #feed / #ledger override the restored view: the installed app's
    // long-press shortcuts launch with a hash, and a shortcut that opens on
    // whatever tab was open last is not a shortcut.
    var h0 = (location.hash || '').slice(1);
    if (GEEK_TABS.indexOf(h0) >= 0) { tab = h0; lqView = h0 === 'chat' ? 'chats' : (LQ_VIEWS.indexOf(h0) >= 0 ? h0 : lqView); }
  } catch (e) {}

  function epochOf() {
    var n = 1;
    for (var i = 0; i < world.acts.length; i++) if (world.acts[i].t === 'closeEpoch') n++;
    return n;
  }

  // Cheap enough to run on every render, which is how it stays honest: any
  // navigation re-renders, so nothing has to remember to persist itself.
  function saveView() {
    try {
      localStorage.setItem(LS_VIEW, JSON.stringify({
        tab: tab, lqView: lqView, feedMode: feedMode, econView: econView, lqSort: lqSort, netScope: netScope,
      }));
    } catch (e) { /* private mode */ }
  }

  /**
   * Three storages, on purpose, because the three things have different
   * lifetimes. The act log is only kept locally in sandbox mode — against a
   * host the log belongs to the host and a cached copy would be a second
   * source of truth. Identity and mode persist across visits. PINs go to
   * sessionStorage alone, so closing the browser forgets them and a shared
   * machine cannot hold someone's credential.
   */
  function save() {
    try {
      if (!REMOTE) localStorage.setItem(LS_WORLD, JSON.stringify(world));
      localStorage.setItem(LS_WHO, JSON.stringify(who));
      localStorage.setItem(LS_MODE, JSON.stringify(mode));
      saveView();
      sessionStorage.setItem(LS_PINS, JSON.stringify(pins));
    } catch (e) { /* private mode */ }
  }

  // ── PIN hashing (handle security) ──
  function sha256hex(s) {
    if (window.crypto && crypto.subtle) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (b) {
        return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
      });
    }
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return Promise.resolve('fnv' + h.toString(16));
  }

  var lastPinHash = {}; // id -> pinHash from latest replay

  /**
   * Does this PIN match the hash the network is holding for this handle?
   *
   * It has to read EVERY format the host has ever written, and that is not a
   * theoretical requirement: when an account acts with a correct PIN that is
   * still stored in the old format, the host quietly re-stores it as PBKDF2
   * (server.mjs, flushPinUpgrades). Nothing the owner does causes it and
   * nothing tells them.
   *
   * This check used to compute only sha256(id + ':' + pin) and compare that
   * against whatever was stored. Once an account had been upgraded, the
   * comparison was a sha256 string against a pbkdf2 string — which cannot
   * match, whatever the owner types. The PIN stayed valid for acting, because
   * the host verifies it properly; it was only getting back IN that became
   * impossible, and only after the session ended. Fourteen accounts were shut
   * out that way, including people who had done nothing but use the app
   * normally.
   *
   * Returns true, false, or null for "this browser cannot check that here" —
   * which is a different thing from a wrong PIN and has to be said differently.
   */
  function verifyPin(id, pin, stored) {
    if (!stored || typeof pin !== 'string' || !pin) return Promise.resolve(false);
    var m = /^pbkdf2\$(\d+)\$([0-9a-f]+)\$([0-9a-f]{64})$/.exec(stored);
    if (!m) {
      // sha256(id:pin), or the fnv fallback a plain-http page produces. Both
      // are what sha256hex() itself returns, so this covers each of them.
      return sha256hex(id + ':' + pin).then(function (hx) { return hx === stored; });
    }
    if (!(window.crypto && crypto.subtle)) return Promise.resolve(null);
    var salt = new Uint8Array(m[2].length / 2);
    for (var i = 0; i < salt.length; i++) salt[i] = parseInt(m[2].substr(i * 2, 2), 16);
    return crypto.subtle
      .importKey('raw', new TextEncoder().encode(pin), { name: 'PBKDF2' }, false, ['deriveBits'])
      .then(function (key) {
        return crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: salt, iterations: Number(m[1]), hash: 'SHA-256' }, key, 256);
      })
      .then(function (bits) {
        var hex = Array.prototype.map.call(new Uint8Array(bits), function (b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
        return hex === m[3];
      })
      .catch(function () { return null; });
  }

  var NO_CHECK_HERE = 'This page cannot check a PIN in the account\u2019s current format — that needs a secure (https) page. Open the app from its published address and try again; your PIN and your handle are unaffected.';

  // ── Session lock ──────────────────────────────────────────────────────────
  // A PIN lives in sessionStorage only, so closing the browser forgets it while
  // the chosen identity (localStorage) survives. That leaves a state the app
  // used to hide: signed in, apparently fine, but every act bounces off the
  // host with a 401 and incoming calls are silently dropped. The identity is
  // not the credential — say so, and make getting the credential back cost
  // nothing you were in the middle of.
  function sessionLocked() {
    return !!(REMOTE && who && lastPinHash[who] && !pins[who]);
  }

  var unlockQueue = null;      // continuations waiting on one dialog, or null
  var lockNoticeShown = false; // the silent-failure warning fires once per lock
  /**
   * Run `then` with a usable PIN in hand. If the session is unlocked this is
   * synchronous and invisible; if not, it asks once and then continues the
   * caller's work. Nothing the caller was doing is discarded.
   */
  function withUnlock(then) {
    if (!sessionLocked()) { then(); return; }
    // Everything waiting on this one dialog is held and replayed together. The
    // first version dropped every caller after the first and claimed in a
    // comment that they queued; two reactions clicked in quick succession lost
    // the second silently.
    if (unlockQueue) { unlockQueue.push(then); return; }
    unlockQueue = [then];
    var id = who, hash = lastPinHash[who];
    var label = (function () { try { return replay().handles[id] || id; } catch (e) { return id; } })();

    function drain(ok) {
      var q = unlockQueue || [];
      unlockQueue = null;
      if (!ok) {
        if (q.length > 1) toast(q.length + ' pending actions were dropped — nothing was recorded.');
        render();
        return;
      }
      render();
      q.forEach(function (fn) { try { fn(); } catch (e) {} });
    }

    function ask(retry) {
      pinDialog('Unlock ' + label, retry
        ? 'That PIN did not match. Try again, or cancel — the host locks a handle out after repeated wrong attempts.'
        : 'Your session expired, so the PIN is gone from this browser. Your handle and everything you posted are untouched — the PIN just proves it is you.')
        .then(function (pin) {
          if (pin == null) { drain(false); return; }
          verifyPin(id, pin, hash).then(function (ok) {
            if (ok === null) { toast(NO_CHECK_HERE); drain(false); return; }
            if (!ok) {
              // Re-ask rather than discard: a typo used to destroy the queued
              // post, after render() had already cleared the composer.
              if (!retry) { ask(true); return; }
              toast('Wrong PIN again — stopping here so the host does not lock ' + label + ' out.');
              drain(false);
              return;
            }
            pins[id] = pin; save();
            lockNoticeShown = false; // re-arm the silent-failure warning
            signalAuthBad = false;   // call polling gave up on the old PIN; let it try again
            toast('Unlocked. Carrying on where you left off.');
            drain(true);
          });
        });
    }
    ask(false);
  }

  // ── Connection state (server fallback) ──
  var netFails = 0;
  var offline = false;
  /**
   * Two consecutive failures before declaring the connection lost. One failed
   * poll is normal — a tunnel hiccup, a sleeping phone — and announcing it
   * would flash a banner at people constantly. Recovery is immediate, because
   * being wrong about being back costs nothing.
   */
  function setOnline(ok) {
    var was = offline;
    if (ok) { netFails = 0; offline = false; }
    else { netFails++; offline = netFails >= 2; }
    if (was !== offline) renderBanner();
  }
  function renderBanner() {
    var old = document.getElementById('net-banner');
    if (old) old.remove();
    if (!offline) return;
    var b = document.createElement('div');
    b.id = 'net-banner';
    b.className = 'net-banner';
    b.textContent = 'Connection lost — reconnecting… nothing you send is recorded until this clears.';
    document.body.prepend(b);
  }

  /** Merge a server tail response into the local log (incremental sync). */
  function mergeTail(d) {
    if (!d || !d.acts) return false;
    var base = typeof d.since === 'number' ? d.since : world.acts.length;
    if (base > world.acts.length) return false; // gap — full refetch will heal
    var next = world.acts.slice(0, base).concat(d.acts);
    var changed = next.length !== world.acts.length;
    world.acts = next;
    return changed;
  }

  /**
   * Show a refusal with its reason, not just its sentence.
   *
   * The host answers every refusal with a stable `code`, the sentence that
   * names your actual numbers, `why` the rule exists, and the `fix`. A toast
   * that only repeats the sentence throws away the two fields that answer the
   * question people actually have — this network's rules are unusual enough
   * that "why" is rarely obvious.
   */
  function explainRefusal(d) {
    if (!d || !d.error) { toast('The network refused that action.'); return; }
    if (!d.why) { toast(d.error); return; }
    var card = h('div', { class: 'a2hs refusal' },
      h('b', { text: d.error }),
      h('div', { class: 'smallnote', style: 'margin-top:6px', text: d.why }));
    if (d.fix) card.appendChild(h('div', { style: 'margin-top:6px' }, h('b', { text: 'What to do: ' }), d.fix));
    var row = h('div', { class: 'row', style: 'margin-top:8px' },
      h('button', { text: 'Got it', onclick: function () { card.remove(); } }));
    if (d.code) {
      row.appendChild(h('span', { class: 'smallnote mono', text: d.code }));
    }
    card.appendChild(row);
    var old = document.querySelector('.a2hs.refusal');
    if (old) old.remove();
    document.body.appendChild(card);
    setTimeout(function () { if (card.parentNode) card.remove(); }, 20000);
  }

  function pushAct(act, onOk, retried) {
    var actor = act.author || act.from ||
      (act.t === 'closeEpoch' || act.t === 'closeCycle' ? null : act.id) || null;
    // Ask for the PIN before spending the act, not after the host refuses it.
    // The act is re-submitted verbatim once unlocked, so a post someone spent
    // two minutes writing is never lost to an expired session.
    // Offline first: asking for a credential we cannot use, then discarding the
    // act at the offline check three lines below, is the worst of both.
    if (REMOTE && offline && actor && act.t !== 'register' && lastPinHash[actor] && !pins[actor]) {
      toast('Still reconnecting — unlock once the connection is back, so nothing is lost.');
      return;
    }
    if (REMOTE && actor && act.t !== 'register' && lastPinHash[actor] && !pins[actor]) {
      withUnlock(function () { pushAct(act, onOk, retried); });
      return;
    }
    if (REMOTE && actor && act.t !== 'register' && lastPinHash[actor]) act.auth = pins[actor] || '';
    if (!REMOTE) {
      delete act.auth;
      world.acts.push(act); save();
      if (onOk) onOk();
      render(); return;
    }
    if (offline) { toast('Still reconnecting — hold on, nothing can be recorded right now.'); return; }
    act.since = world.acts.length;
    fetch(API + '/api/act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(act) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
      .then(function (x) {
        setOnline(true);
        if (!x.ok) {
          // 401 means the PIN we hold is stale or wrong. Drop it and ask again,
          // ONCE — resending the same bad PIN would walk the handle into the
          // host's PIN-attempt lockout, and retrying forever would be worse
          // than the original failure.
          if (x.status === 401 && actor && !retried) {
            delete pins[actor]; save();
            withUnlock(function () { pushAct(act, onOk, true); });
            return;
          }
          explainRefusal(x.d); render(); return;
        }
        mergeTail(x.d); save();
        if (onOk) onOk();
        render();
      })
      .catch(function () { setOnline(false); toast('Connection hiccup — nothing was recorded, try again.'); });
  }

  function pollLive() {
    if (!REMOTE) return;
    fetch(API + '/api/live', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return;
        var before = liveList.map(function (e) { return e.author; }).join(',');
        // Entries without `relay` come from a browser still running the
        // peer-to-peer build. Showing them would offer a Join button that
        // cannot work, so they are left out rather than explained away.
        liveList = (d.live || []).filter(function (e) { return e.relay; });
        var after = liveList.map(function (e) { return e.author; }).join(',');
        // Only re-render when the set actually changed, so a viewer count tick
        // does not tear down an open composer every eight seconds.
        if (before !== after && !document.querySelector('.pin-dialog')) render();
      })
      .catch(function () {});
  }

  function pollRemote() {
    var ae = document.activeElement;
    // Never while a credential is being typed, offline or not: the reconnect
    // render would wipe the dialog out from under the user mid-PIN. Recovering
    // the connection can wait the five seconds until the next tick.
    if (document.querySelector('.pin-dialog')) return;

  function b64urlToBytes(s2) {

  /**
   * Create a passkey for this handle. The device asks for Face ID, a
   * fingerprint or the screen lock; the private half never leaves it, and the
   * browser refuses to sign for any origin but this one — which is what makes
   * it survive a convincing fake login page.

  function addPasskey(st) {
    if (!REMOTE) { toast('Passkeys need the hosted network.'); return; }
    if (!passkeySupported) {
      toast('This browser or context cannot make a passkey. It needs HTTPS and a device with a screen lock.');
      return;
    }
    withUnlock(function () {
      fetch(API + '/api/auth/challenge', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ as: who }),
      }).then(function (r) { return r.json(); }).then(function (d) {
        return navigator.credentials.create({
          publicKey: {
            challenge: b64urlToBytes(d.challenge),

  /**

          h('p', { class: 'num', style: 'font-size:15px; word-break:break-all; margin:10px 0', text: code }),

  /**

   * "note the min hop-distance everything 1,2,3,4 or more than 4, so I can

  // ── Views: counted by the host, never by the protocol ─────────────────────

      var r = el.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) { viewReported[cid] = 1; fresh.push(cid); }
    });
    if (!fresh.length) return;

      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: fresh }),
    }).then(function (r) { return r.ok ? r.json() : null; })

        // the reader has open every few seconds, and the counts are the only
        // thing that changed.

  function paintViewChips() {

  }
  function viewChip(cid) {

      class: 'view-chip',
      title: 'Seen ' + n + ' time' + (n === 1 ? '' : 's') + '. Host-side telemetry only — views never enter the log, the graph, or any score. This network measures commitment, not attention.',

  function reactionsOn(st, nodeId) {

  function commentTree(st, comments, depth, liquid) {

          ? h('div', { class: 'lq-sub' }, h('b', {}, st.handles[c.author] || '—'),

          : h('div', { class: 'c-head' }, h('b', {}, st.handles[c.author] || '—'),

            .concat(body2 ? body2.rows : [])
            .concat([h('button', { class: liquid ? 'lq-pill hot' : 'btn small primary', text: 'Reply · −θ', onclick: function () {
              if (!txt.value.trim()) { toast('Write your reply first.'); return; }
              tryAct(who, { t: 'review', author: who, target: c.id, e: body2 ? body2.e.value() : 0.7, f: body2 ? body2.f.value() : 0.8, text: txt.value.trim() },

  // ── Jump-to-content: any node id resolves to the post that shows it ──
  function parentOfComment(st, cid) {
    var e = st.g.edges.find(function (x) { return x.family === 'ReviewT' && x.tgt === cid; });
    return e ? e.src : null;
  }
  /** Walk Comment → its target until a displayable post (or nothing) is reached. */
  /**
   * The post to show in order to reveal `nodeId`.
   *
   * Deliberately forgiving, because two things routinely break the naive walk.
   * A comment's post may have had its payload removed — the comment survives
   * that by design, so it must still be reachable, shown under a [deleted]
   * parent. And a comment can point at a counter value that never became a
   * node at all (quote and mention legs consume numbers without minting), in
   * which case the comment is its own destination rather than a dead link.

      if (n.kind === 'Comment') {
        lastComment = cur;
        cur = parentOfComment(st, cur);
        continue;
      }
      return cur;                          // a post, redacted or not

    if (lastComment && st.payloads[lastComment] !== undefined) return lastComment;

  }
  /**
   * Render peer-written text with its content references made clickable.
   *
   * People cite each other by id — "c193, ah so annoying to need to go and look
   * these refs up" — and the network already knows exactly what c193 is. Text
   * nodes and buttons only, never innerHTML: this is other people's writing.
   */

    return h('button', { class: 'ref-link', text: label, title: 'Open ' + cid,
      onclick: function () { jumpTo(st, cid); } });
  }
  function richText(st, s) {
    var out = [], re = /\bc\d+\b/g, last = 0, m;
    s = String(s == null ? '' : s);
    while ((m = re.exec(s)) !== null) {
      if (m.index > last) out.push(s.slice(last, m.index));
      // only link what actually exists and is still readable
      if (st.payloads[m[0]] !== undefined) out.push(refButton(st, m[0], m[0]));
      else out.push(m[0]);
      last = m.index + m[0].length;

  function jumpTo(st, nodeId) {

    }
    if (nodeId && st.ledgerById[nodeId]) { openProfile(nodeId); return; }
    if (!nodeId || !resolvePost(st, nodeId)) { toast('Nothing to open here — this act moved units or closed a period.'); return; }
    focusNode = nodeId;
    if (mode === 'geek') tab = 'feed'; else lqView = 'feed';

    setTimeout(function () {
      var el = document.querySelector('.focus-wrap');
      if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }, 40);
  }
  /** The pinned card: the resolved post, with the jumped-to comment highlighted. */

    var isComment = (st.g.nodes.get(focusNode) || {}).kind === 'Comment';
    var card = liquid
      ? lqPost(st, st.g.nodes.get(post), null)
      : postCard(st, { node: st.g.nodes.get(post), relevance: 0, bfsWeight: 0, amplifier: 1, contentNorm: 0, jumped: true }, null, 1);
    if (isComment) {
      // mark the specific comment that was clicked

      var want = (st.payloads[focusNode] || '').slice(0, 40);
      for (var i = 0; i < bodies.length; i++) {

      }

      h('div', { class: 'focus-bar' },
        h('span', { text: isComment ? 'jumped to a comment' : 'jumped to a post' }),
        h('button', { class: liquid ? 'lq-pill' : 'btn small ghost', text: 'close', onclick: function () { focusNode = null; render(); } })),
      card);

  /** ReferenceT edges out of a post: quoted contents + mentioned persons. */
  function refsOf(st, cid) {

    st.g.edges.forEach(function (e) {
      if (e.family !== 'ReferenceT' || e.src !== cid) return;
      if (e.tgt.indexOf('prof_') === 0) mentions.push(e.tgt.slice(5));
      else quotes.push(e.tgt);

    return { quotes: quotes, mentions: mentions };
  }
  /** θ-cost of an act (posts may carry a quote + mentions, each its own act). */
  /**
   * Search the network.
   *
   * Scope, decided once and written down: post and comment text, handles, and
   * tag labels. DIRECT MESSAGES ARE OUT. They are technically public — every
   * dm act's text is in /api/acts and in the published archive — but no screen
   * in this app has ever shown a conversation to somebody who was not in it,
   * and a search box is exactly what would turn an obscure JSONL file into a
   * browsable index of everyone's messages. The exclusion is this comment plus
   * the absence of st.dms below, and a test that asserts it stays absent.
   *
   * Ordered by append position, newest first — the same authority the Newest
   * ranking uses. It is a filter over the corpus, not a fourth ranking: the
   * three ranking buttons stay live while a query is running.
   */
  function searchState(st, q) {
    var out = { posts: [], comments: [], people: [], tags: [] };
    var needle = String(q || '').trim().toLowerCase();
    if (needle.length < 2) return out;
    Object.keys(st.payloads).forEach(function (cid) {
      var text = st.payloads[cid];
      if (typeof text !== 'string' || text.toLowerCase().indexOf(needle) < 0) return;
      // Sandbox seed content has payloads and no postMeta at all, so this
      // lookup is guarded rather than assumed — that is the offline mode every
      // visitor falls back to when no host answers.
      var meta = st.postMeta[cid];
      (meta && meta.comment ? out.comments : out.posts).push({ cid: cid, idx: meta ? meta.idx : 0 });
    });
    out.posts.sort(function (a, b) { return b.idx - a.idx; });
    out.comments.sort(function (a, b) { return b.idx - a.idx; });
    Object.keys(st.handles).forEach(function (id) {
      if (st.deleted && st.deleted[id]) return;
      // st.handles is the DISPLAY map, which already marks handle-skeleton
      // twins — matching on the raw name would undo that.
      if (String(st.handles[id]).toLowerCase().indexOf(needle) >= 0) out.people.push(id);
    });
    st.g.nodes.forEach(function (n) {
      if (n.kind === 'Type' && String(n.label).toLowerCase().indexOf(needle) >= 0) out.tags.push(n);
    });

  }

  function actCost(act, st) {
    // Removals stay free — a drained author must still be able to take their

  //
  // The video does not travel between browsers any more. It goes up to the
  // host and comes back down again, because a connection to the host is the
  // one path every viewer demonstrably has — it is how they loaded this page.
  //
  // The peer-to-peer version failed in the field with the least useful symptom
  // a program can have: the viewer joins, the picture stays black, and nothing
  // says why. The host's own /api/ice endpoint had the answer printed on it the
  // whole time — "relay": "none". Two ends behind carrier-grade NAT, which is
  // most mobile networks, have no route to each other at all, and retrying does
  // not discover a path that does not exist. It also multiplied the
  // broadcaster's upload by the size of the audience.
  //
  // Now MediaRecorder encodes here, the bytes go up one WebSocket, and the host
  // fans them out. webapp/stream.mjs explains why a WebSocket rather than a
  // plain streaming response: measured through this host's tunnel, a chunked
  // response is held back and released in 128 KB lumps, which for a quiet
  // webcam is eight seconds of "live".

  // pieces come out every 400ms; an MP4 fragment cannot leave the encoder until
  // a whole group of pictures is finished, which measured at one and a half to
  // two seconds. MP4 is still listed, because it is the only thing an iPhone
  // can play back — see the rendition negotiation below.
  // Every entry names its codecs. A bare 'video/webm' is accepted by
  // MediaRecorder and REFUSED by MediaSource, so a broadcast in it would be
  // one nobody could play — the app would work and the viewers would not.

    'video/webm;codecs=vp9,opus',

    // camera, no microphone
    'video/webm;codecs=vp8',
    'video/webm;codecs=vp9',
    'video/mp4;codecs=avc1.42E01E',

   * The formats that match what this stream actually carries.

   * header promises an audio track that never arrives, and the viewer's
   * MediaSource refuses the whole stream with "initialization segment misses
   * expected opus track" — found by watching a real broadcast fail, not by
   * reading the specification.

      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ as: who, auth: pins[who] || '', stop: true }),
    }).catch(function () {});

  function broadcastStart(title, withVideo) {

  /**
   * What a vouch will actually do to the person you are backing.
   *
   * Asked for by @feedback2000, who measured it happening to them: their
   * credibility fell about a quarter across a window whose only change was
   * @Fable vouching on them a second time. Standing is a balance/count
   * mediant of the rates transported to you, so a backer whose own rate is
   * lower than yours pulls you DOWN — and a vouch reads as a compliment
   * everywhere else in the world, which is exactly why it has to say so here,
   * before the act, and not in a guide.
   *
   * The arithmetic is the same one the standings table shows, so this is a
   * reading of state rather than a second implementation of it.

  function vouchEffect(st, from, to) {
    var mine = st.ledgerById[from], theirs = st.ledgerById[to];
    if (!mine || !theirs || !mine.actCount || !theirs.actCount) {
      return h('p', { class: 'smallnote', text: 'Not enough history yet to say which way this will move them.' });
    }
    var myRate = mine.burnBal / mine.actCount;
    var theirRate = theirs.burnBal / theirs.actCount;
    var already = st.bundles && st.bundles[from + '>' + to];
    var box = h('div', { class: 'vouch-effect' });
    var verdict, tone;
    if (myRate > theirRate * 1.02) { verdict = 'LIFTS'; tone = 'good'; }
    else if (myRate < theirRate * 0.98) { verdict = 'DILUTES'; tone = 'warn'; }
    else { verdict = 'BARELY MOVES'; tone = ''; }
    box.className = 'vouch-effect ' + tone;
    box.appendChild(h('div', {},
      h('b', { text: verdict }),
      ' — your rate ' + fmt(myRate, 3) + ' against theirs ' + fmt(theirRate, 3)));
    box.appendChild(h('p', { class: 'smallnote', text:
      verdict === 'DILUTES'
        ? 'Standing is a pooled commitment rate, so backing someone whose rate is higher than yours pulls it toward yours. This is not a bug and it is not an insult — but it is the opposite of what a vouch means anywhere else, so it is worth knowing before you spend the act.'
        : verdict === 'LIFTS'
          ? 'Your rate is higher than theirs, so transporting it raises them. Acting lowers your own rate either way; burning raises it.'
          : 'Your rates are close enough that this will barely move them in either direction.' }));
    if (already) {
      box.appendChild(h('p', { class: 'smallnote', text:
        'You have already vouched for them. Vouches from one person to another fold into a single net stance, so a second one does not double the effect — it deepens the same one.' }));
    }
    return box;
  }

    if (horizon.length && feedMode !== 'new' && feedMode !== 'follow') {
      wrap.appendChild(h('div', { class: 'card', style: 'margin-top:14px' },
        h('p', { class: 'eyebrow', text: 'beyond your horizon — exists, not yet reachable in ≤4 hops (' + horizon.length + ')' })));
      horizon.slice(0, 15).forEach(function (n) {
        wrap.appendChild(postCard(st, { node: n, bfsWeight: 0, amplifier: 1, contentNorm: 0, relevance: 0 }, null, 1));
      });
    }
    return wrap;
