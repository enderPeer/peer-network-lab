      // and this is the act that decides where money goes. But "secured" is a
      // question about credentials, and this page cannot answer it — the
      // replay carries pinHash and nothing whatever about passkeys, so the
      // test that stood here was a PIN test wearing a credential test's
      // sentence. server.mjs enters its no-credential branch only when BOTH
      // stores are empty, and the comment above that line was written for this
      // very act; refusing in the host's name for a rule the host does not
      // have sent the owner of the strongest credential in this codebase off
      // to set a weaker one, or to watch their share stay unbound and return
      // to the steward at every sweep.
      //
      // So the question goes to the host that holds the answer, and only the
      // case it confirms is refused here. A host that will not answer is not a
      // refusal: the act is sent, and whatever the host says of it — including
      // "this handle is secured with a passkey, sign the act with it" — is
      // what the reader is told, in the host's own words.
      var go = function () {
        // The ordinary act path, PIN unlock and all: pushAct is what every
        // other act in this file goes through, and bindAddress is not debited
        // (the replay says so in as many words), so it does not go through the
        // W1 wrapper that would refuse a drained account. Earning needs no
        // reserve and speaking does, so those two run out at different times,
        // and an account that earned a share must still be able to say where
        // it goes.
        pushAct({ t: 'bindAddress', id: me, addr: addr }, function () {
          toast('Bound to ' + addr + '. It costs no \u03b8. From the next epoch close, this handle\u2019s share is a line in the payout list under that address; epochs already closed are unchanged.');
        });
      };
      if (!REMOTE) { go(); return; }
      fetch(API + '/api/auth/status?as=' + encodeURIComponent(me), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var hasPin = !!(d && d.hasPin);
          var keys = d && d.passkeys && d.passkeys.length ? d.passkeys.length : 0;
          if (!hasPin && !keys) {
            toast('Secure this handle first, with a PIN or a passkey \u2014 this act says where money goes, and the host refuses it from a handle anyone could act as.');
            setPinFlow(st, false);
            return;
          }
          go();
        })
        .catch(function () { go(); });
    }

    // ── 2. the wallet, once for the whole card ────────────────────────────
    body.appendChild(wRow);

    // ── 2b. who the steward is, in the host's own words ───────────────────
    //
    // The rows below all depend on one account choosing to fund an epoch, and
    // the card named it nowhere: `steward` appeared once in the whole surface,
    // under the softer label "operator", with no address beside it. Both lines
    // come from this host — the address the contract answers for steward(),
    // and the account of the role that chain-l2/onchain.mjs already computes
    // and serves to every other consumer of /api/token/onchain, including the
    // uncomfortable half. Rendered only where that answer is about the very
    // contract these rows claim against: a steward printed under a different
    // deployment would be a different person entirely.
    var sBox = h('div', {});
    body.appendChild(sBox);
    var sAsked = false;

    function drawSteward() {
      if (sAsked || !claimAddr) return;
      sAsked = true;
      fetch(API + '/api/token/onchain', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var cs = d && d.claimState;
          if (!cs || !cs.contract || !cs.steward) return;
          if (String(cs.contract).toLowerCase() !== String(claimAddr).toLowerCase()) return;
          sBox.innerHTML = '';
          sBox.appendChild(h('p', { class: 'eyebrow', style: 'margin:16px 0 4px', text: 'who can open and fund an epoch here' }));
          var row = h('div', { class: 'mini-form persistent' },
            h('span', { class: 'smallnote' }, 'the ', term('steward', 'steward'), ' of this contract is'),
            h('span', { class: 'smallnote num', style: 'word-break:break-all', text: String(cs.steward) }));
          // No label: l2ScanLink names the explorer it actually built the
          // href from, and this page must not say "basescan" about a chain the
          // host may not be serving.
          var link = l2ScanLink(d.chainId, 'address', cs.steward);
          if (link) row.appendChild(link);
          sBox.appendChild(row);
          if (cs.stewardIs) sBox.appendChild(note(cs.stewardIs));
        })
        .catch(function () { sAsked = false; });   // a question that failed is not an answer
    }

    function drawWallet() {
      wRow.innerHTML = '';
      if (!claimAddr) return;      // nothing on a chain to talk to yet
      if (!window.ethereum) {
        wRow.appendChild(h('span', { class: 'smallnote', text: 'No wallet in this browser, so nothing below can be checked against the chain or claimed. The amounts are still what this host computes from the log.' }));
        return;
      }
      if (!chainHex) {
        wRow.appendChild(h('span', { class: 'smallnote', text: 'This host named no chain id for its claim contract, so this page cannot tell a wallet which network to ask \u2014 and a read on the wrong one would be about a different contract. Nothing here is read through a wallet until it does.' }));
        return;
      }
      if (!l2Wallet) {
        // Not a second button. The binding section above has the only one, and
        // it writes the same l2Wallet this row reads \u2014 two controls doing
        // one thing, a few lines apart, is a question the reader should not
        // have to answer.
        wRow.appendChild(h('span', { class: 'smallnote', text: 'Connect the wallet above and this card will ask the contract whether these epochs have already been claimed. Connecting signs nothing; nothing here is signed until you press a Claim button.' }));
        return;
      }
      wRow.appendChild(h('span', { class: 'smallnote num', style: 'word-break:break-all', text: l2Wallet + ' \u00b7 ' + chainName }));
      wRow.appendChild(h('span', { class: 'smallnote', text: 'claiming at ' + claimAddr }));
    }

    // ── 3. one row per epoch this handle earned in ────────────────────────
    var epochBox = h('div', {});
    body.appendChild(epochBox);
    drawBind();
    drawEpochs();

    function drawEpochs() {
      epochBox.innerHTML = '';
      // Every repaint in that list points at a row this line just detached.
      rowPaints.length = 0;
      epochBox.appendChild(h('p', { class: 'eyebrow', style: 'margin:18px 0 4px', text: 'what each closed epoch credited you' }));
      var dist = (st.tokens && st.tokens.dist) || [];
      var mine = [];
      for (var i = dist.length - 1; i >= 0; i--) {
        var d = dist[i];
        if (d && d.to && d.to[me] > 0) mine.push(d);
      }
      if (!mine.length) {
        epochBox.appendChild(note('No closed epoch has credited this handle yet. Earnings come from other people reacting to and commenting on what you made, shared out when an epoch closes \u2014 so there is nothing here to bind for yet, and binding early is what makes sure the first one has a line to pay.'));
        return;
      }
      var shown = mine.slice(0, shownN);
      if (mine.length > shown.length) {
        epochBox.appendChild(note('The ' + shown.length + ' most recent of ' + mine.length + ' epochs that credited this handle. Each row is one question to this host and one to the chain, so they are asked in batches rather than all at once \u2014 the rest are unchanged and still claimable if they were ever funded, and the button below asks about them.'));
      }
      for (var k = 0; k < shown.length; k++) epochBox.appendChild(epochRow(shown[k]));
      if (mine.length > shown.length) {
        var left = mine.length - shown.length;
        var step = left < ROWS ? left : ROWS;
        epochBox.appendChild(h('div', { class: 'mini-form persistent', style: 'margin-top:12px' },
          h('button', { class: 'btn small ghost', text: 'Show ' + step + ' older epoch' + (step === 1 ? '' : 's'),
            onclick: function () { shownN += ROWS; drawEpochs(); } }),
          h('span', { class: 'smallnote', text: left + ' older epoch' + (left === 1 ? '' : 's') + ' this card has not asked about yet. An epoch\u2019s claim window runs whether or not its row is on screen, so open them rather than read their absence as \u201cnothing there\u201d.' })));
      }
    }

    function epochRow(dist) {
      var n = dist.epoch;
      var logAmt = Math.round((dist.to[me] || 0) * 1e6) / 1e6;
      var box = h('div', { style: 'margin-top:12px; border-top:1px solid var(--line); padding-top:10px' });
      box.appendChild(h('div', { class: 'kv' },
        h('span', { text: 'epoch ' + n }),
        h('b', { class: 'num', text: logAmt + ' PEER credited to this handle in the log' })));
      var stateBox = h('div', {});
      var actBox = h('div', {});
      var sayBox = h('div', {});
      box.appendChild(stateBox);
      box.appendChild(actBox);
      box.appendChild(sayBox);
      var key = me + '|' + n;

      function say(t, warn) {
        sayBox.appendChild(h('p', { class: 'smallnote', style: warn ? WARN : '', text: t }));
      }
      function only(t, style) { stateBox.innerHTML = ''; actBox.innerHTML = ''; stateBox.appendChild(note(t, style)); }

      function stamp(at) {
        var line = h('div', { class: 'mini-form persistent' },
          h('span', { class: 'smallnote', text: 'read from this host at ' + new Date(at).toLocaleTimeString() }),
          h('button', { class: 'btn small ghost', text: 'Check again', onclick: function () { load(true); } }));
        stateBox.appendChild(line);
      }

      /** Everything about epoch `n`, painted from one host answer. */
      function paint(d, at) {
        stateBox.innerHTML = '';
        actBox.innerHTML = '';
        var oc = d.onchain || {};
        var dec = Number(d.decimals);
        var cl = d.claimant;

        // (a) is there a line in the payout list, and what does it pay?
        if (cl) {
          stateBox.appendChild(h('div', { class: 'kv' },
            h('span', {}, 'its ', term('merkle', 'payout list'), ' pays'),
            h('b', { class: 'num', text: l2Human(BigInt(cl.amount), dec) + ' PEER' }),
            h('span', { text: 'to' }),
            h('b', { class: 'num', style: 'word-break:break-all', text: cl.address })));
          if (cl.handles && cl.handles.length > 1) {
            stateBox.appendChild(note('That line is shared: ' + cl.handles.length + ' handles had this same address bound when the epoch closed, so the amount above is their combined share and whoever holds the address collects all of it at once.'));
          }
        } else {
          stateBox.appendChild(note(d.claimantNote || 'This handle has no line in this epoch\u2019s payout list.', WARN));
        }

        // (b) has anybody put money behind it? Four different answers, and
        //     blurring them is exactly how "nothing was deposited" gets read
        //     as "you will be paid".
        if (oc.configured === false) {
          stateBox.appendChild(note('The operator of this host has not deployed a claim contract \u2014 PEER_CLAIM_ADDR is unset. These earnings therefore exist only as a number in this log: there is nothing on any chain to claim, nothing has been deposited, and no deadline is running. That may never change; nothing in this app can make it.', WARN));
          stamp(at);
          return;
        }
        if (!claimAddr && oc.contract) {
          claimAddr = String(oc.contract);
          chainHex = l2ChainHex(oc.chainId);
          chainName = l2ChainName(oc.chainId);
          drawWallet();
          drawSteward();
        }
        if (oc.error) { stateBox.appendChild(note(oc.error, WARN)); stamp(at); return; }
        if (!oc.opened) {
          stateBox.appendChild(note('Nobody has opened epoch ' + n + ' on the claim contract at ' + (oc.contract || 'the configured address') + '. NOTHING HAS BEEN DEPOSITED for it. This is not \u201cyou will be paid later\u201d \u2014 it is \u201cno money has been put behind this\u201d, and opening an epoch is the operator\u2019s own transaction out of coins they already hold. ' + (oc.why || ''), WARN));
          stamp(at);
          return;
        }
        if (oc.rootMatches === false) {
          stateBox.appendChild(note(oc.rootMismatch || 'The payout list published on chain for this epoch is NOT the one this host computes from its log. Nothing here is claimable against it.', WARN));
          stamp(at);
          return;
        }

        var total = BigInt(oc.totalRaw || '0');
        var paid = BigInt(oc.paidRaw || '0');
        var tree = BigInt(d.total || '0');
        var kv = h('div', { class: 'kv' },
          h('span', {}, 'the ', term('steward', 'operator'), ' deposited'),
          h('b', { class: 'num', text: l2Human(total, dec) + ' PEER' }),
          h('span', { text: 'claimed so far' }),
          h('b', { class: 'num', text: l2Human(paid, dec) + ' PEER' }),
          h('span', {}, term('deadline', 'claim deadline')),
          h('b', { text: when(oc.claimUntil) }));
        stateBox.appendChild(kv);
        // The check no contract can make, made here, before anybody spends
        // gas: nothing on chain holds the payout list, so a list adding up to
        // more than the deposit pays first-come and reverts for the rest.
        if (tree > total) {
          stateBox.appendChild(note('This epoch\u2019s payout list adds up to ' + l2Human(tree, dec) + ' PEER but only ' + l2Human(total, dec) + ' was deposited. No contract can add a list up, so this epoch pays whoever claims first and reverts for everyone after. Read that as a warning about the epoch, not about your line.', WARN));
        }
        if (!oc.open) {
          stateBox.appendChild(h('p', { class: 'smallnote', style: WARN },
            'This epoch is not open to claims: the window ran to ' + when(oc.claimUntil) + ', or the remainder has already been ',
            term('sweep', 'swept'),
            '. A claim now would revert and cost the gas, so there is no button.'));
          stamp(at);
          return;
        }
        if (!cl) { stamp(at); return; }

        // (c) can THIS reader take it?
        drawClaim(d, cl, oc, dec);
        stamp(at);
      }

      function drawClaim(d, cl, oc, dec) {
        actBox.innerHTML = '';
        var leafAddr = String(cl.address).toLowerCase();
        if (!window.ethereum) {
          actBox.appendChild(note('There is no wallet in this browser to claim with. This line is payable to ' + leafAddr + ' and to no other address \u2014 open that account in a browser with a wallet.'));
          return;
        }
        if (!chainHex) {
          actBox.appendChild(note('This host named no chain id for its claim contract, so nothing here will be signed \u2014 a claim sent on the wrong chain reaches no contract and costs the gas anyway.', WARN));
          return;
        }
        if (!l2Wallet) {
          actBox.appendChild(note('Connect a wallet above to check whether this has already been claimed, and to claim it. It is payable to ' + leafAddr + ' and to no other address.'));
          return;
        }
        if (l2Wallet !== leafAddr) {
          actBox.appendChild(note('The connected wallet is ' + l2Wallet + '. This line pays ' + leafAddr + ', and the contract checks the proof against whoever sends the transaction \u2014 so nobody can claim it for you, including you from a second wallet. Switch the wallet to that account.', WARN));
          return;
        }
        var flag = l2Claimed[n + '|' + leafAddr];
        if (flag === true) {
          actBox.appendChild(note('This address has already claimed epoch ' + n + '. The contract\u2019s own record says so; there is nothing further to take.'));
          return;
        }
        var btn = h('button', { class: 'btn small primary', text: 'Claim ' + l2Human(BigInt(cl.amount), dec) + ' PEER' });
        btn.onclick = function () {
          btn.disabled = true;
          sayBox.innerHTML = '';
          doClaim(d, cl, oc).catch(function (e) {
            say('Stopped: ' + l2Err(e), true);
          }).then(function () { btn.disabled = false; });
        };
        actBox.appendChild(h('div', { class: 'mini-form persistent' }, btn,
          h('span', { class: 'smallnote' }, 'The contract is asked first, for free, whether this would be paid \u2014 a refused ',
            term('proof', 'proof'), ' costs nothing this way, and this page will not offer to sign a claim the contract has already said no to. It is one moment\u2019s answer, not a guarantee: on an epoch whose list adds up to more than its deposit, another claim landing first can still revert this one, and so can the deadline passing between the check and the block that carries the transaction. Gas spent on a claim that reverts does not come back.')));
        if (flag === undefined) readClaimed(leafAddr);
      }

      /** The contract's own claimed mapping — the same flag claim() checks. */
      function readClaimed(addr) {
        if (!claimAddr || !window.ethereum || !l2Wallet) return;
        l2Eth('eth_call', [{ to: claimAddr, data: CL_SEL.claimed + w256(n) + l2Addr(addr) }, 'latest'])
          .then(function (r) {
            var v = l2Uint(r, 'the claimed flag for epoch ' + n);
            l2Claimed[n + '|' + addr] = v === 1n;
            var c = l2Claims[key];
            if (c) paint(c.d, c.at);
          })
          .catch(function () { /* the dry run below asks the same question anyway */ });
      }

      /**
       * Claim, with the free question asked before the expensive one.
       *
       * checkClaim folds in every check claim() makes, so a claim that would
       * revert is refused here at the cost of one eth_call — and when it does
       * refuse, epochInfo and the claimed flag are read to say WHICH check
       * failed, because "it would fail" is not something anybody can act on.
       */
      async function doClaim(d, cl, oc) {
        var to = String(oc.contract);
        var acct = l2Wallet || await l2Connect(chainHex, chainName);
        if (!acct) return;
        // Asked again at the last moment. l2Wallet outlives the check made at
        // connect time on purpose, so between connecting and pressing, the
        // wallet may have moved account or network without this page hearing.
        var accs = await l2Eth('eth_accounts');
        var cur = accs && accs[0] ? String(accs[0]).toLowerCase() : '';
        if (!cur) { say('The wallet is not connected any more \u2014 nothing was sent.', true); return; }
        if (cur !== String(cl.address).toLowerCase()) {
          l2Wallet = cur;
          redrawAll();
          say('The wallet is on ' + cur + ' now, and this line pays ' + cl.address + '. Nothing was sent: the proof is checked against whoever sends the transaction.', true);
          return;
        }
        var chain = await l2Eth('eth_chainId');
        if (!l2OnChain(chain, chainHex)) {
          l2Wallet = null;
          redrawAll();
          say('That wallet answers for chain ' + chain + ', not ' + chainName + '. Nothing was sent \u2014 a claim signed on the wrong chain reaches no contract and costs the gas anyway.', true);
          return;
        }

        // The proof, exactly as the endpoint supplies it. Checked for shape
        // only: 32-byte words, and the one structural rule of this encoding —
        // proof[0] is a PATH WORD whose bits index the siblings after it, so
        // bits above that count carry no meaning and PeerClaim refuses them.
        var words = cl.proof;
        if (!Array.isArray(words) || !words.length) { say('This host sent no proof for this line, so there is nothing to send.', true); return; }
        for (var i = 0; i < words.length; i++) {
          if (!/^(0x)?[0-9a-fA-F]{64}$/.test(String(words[i]))) {
            say('Word ' + i + ' of this proof is not 32 bytes, so nothing was sent \u2014 this host answered something no contract could read.', true);
            return;
          }
        }
        if ((BigInt('0x' + w32(words[0])) >> BigInt(words.length - 1)) !== 0n) {
          say('The path word of this proof has bits set above its sibling count, which PeerClaim rejects outright. Nothing was sent.', true);
          return;
        }

        var amt = BigInt(cl.amount);
        say('Asking the contract whether this claim would be paid. This is a free read \u2014 no signature, no gas.');
        var dry = CL_SEL.checkClaim + w256(n) + l2Addr(cur) + w256(amt)
          + w256(128) + w256(words.length) + words.map(w32).join('');
        var okWord;
        try {
          okWord = l2Uint(await l2Eth('eth_call', [{ to: to, data: dry }, 'latest']), 'the dry run of this claim');
        } catch (e) {
          say('The dry run could not be read (' + l2Err(e) + '), so nothing was signed. A claim is not sent on a question this page could not ask.', true);
          return;
        }
        if (okWord !== 1n) {
          say('The contract says this claim would NOT be paid. Nothing was signed and no gas was spent. ' + (await whyNot(d, cl, to, cur)), true);
          load(true);
          return;
        }

        say('Approve it in the wallet. This is the only step that costs gas, and it is the only thing this page ever asks you to sign.');
        var data = CL_SEL.claim + w256(n) + w256(amt)
          + w256(96) + w256(words.length) + words.map(w32).join('');
        var tx = await l2Eth('eth_sendTransaction', [{ from: cur, to: to, data: data, chainId: chainHex }]);
        say('Sent. Transaction ' + tx + ' \u2014 waiting for a block to carry it. Nothing has been claimed until one does; do not send it again.');
        if (Number(oc.chainId) === 8453) {
          sayBox.appendChild(h('p', { class: 'smallnote' },
            h('a', { target: '_blank', rel: 'noopener', href: 'https://basescan.org/tx/' + tx, text: 'follow it on basescan' })));
        }
        var rc = null;
        for (var k = 0; k < 90 && !rc; k++) {
          await new Promise(function (r) { setTimeout(r, 2000); });
          // A provider that throws mid-poll throws out of here, which is the
          // truth: the transaction went out and this page stopped watching.
          rc = await l2Eth('eth_getTransactionReceipt', [tx]);
        }
        if (!rc) {
          say('Not mined after three minutes. It may still be waiting in the mempool \u2014 follow the hash above rather than sending it a second time.', true);
        } else if (rc.status !== '0x1') {
          say('It reverted on chain. No PEER moved; the gas did not come back. The state below is re-read from the chain rather than assumed.', true);
        } else {
          say('Claimed. The PEER is in ' + cur + ' now \u2014 if the wallet does not list it, add the token from the card above; a wallet does not show a token it has never been told about.');
        }
        delete l2Claimed[n + '|' + cur];
        load(true);
      }

      /** Which check failed, in the contract's own terms. */
      async function whyNot(d, cl, to, cur) {
        var reasons = [];
        try {
          var got = String(await l2Eth('eth_call', [{ to: to, data: CL_SEL.epochInfo + w256(n) }, 'latest']) || '').replace(/^0x/, '');
          if (got.length >= 320) {
            var root = got.slice(0, 64);
            var total = BigInt('0x' + got.slice(64, 128));
            var paid = BigInt('0x' + got.slice(128, 192));
            var until = Number(BigInt('0x' + got.slice(192, 256)));
            var open = BigInt('0x' + got.slice(256, 320)) === 1n;
            if (/^0+$/.test(root)) {
              reasons.push('this epoch is not open on that contract at all');
            } else {
              if (root !== String(d.root).toLowerCase()) reasons.push('the payout list published on chain is not the one this host computes, so no proof from here folds to it');
              if (!open) reasons.push('the epoch is closed to claims \u2014 its window ran to ' + when(until));
              if (total - paid < BigInt(cl.amount)) reasons.push('what is left of the deposit is ' + l2Human(total - paid, Number(d.decimals)) + ' PEER, less than this line, so the list was funded for less than it promises');
            }
          }
        } catch (e) { /* the claimed read below may still explain it */ }
        try {
          var c = l2Uint(await l2Eth('eth_call', [{ to: to, data: CL_SEL.claimed + w256(n) + l2Addr(cur) }, 'latest']), 'the claimed flag');
          if (c === 1n) {
            l2Claimed[n + '|' + cur] = true;
            reasons.unshift('this address has already claimed this epoch');
          }
        } catch (e) { /* below */ }
        return reasons.length
          ? 'Why: ' + reasons.join('; ') + '.'
          : 'It did not say which check failed. The address, the amount or the proof is not what the published list commits to.';
      }

      function load(force) {
        var c = l2Claims[key];
        if (!force && c && Date.now() - c.at < 60000) { paint(c.d, c.at); return; }
        only('Asking this host what epoch ' + n + ' owes you\u2026');
        fetch(API + '/api/v1/epoch/' + n + '/claim?as=' + encodeURIComponent(me), { cache: 'no-store' })
          .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
          .then(function (x) {
            if (x.status !== 200 || !x.d || !x.d.root) {
              only((x.d && x.d.error) || ('This host answered ' + x.status + ' for epoch ' + n + ', so nothing about it is shown here rather than guessed.'), WARN);
              return;
            }
            l2Claims[key] = { at: Date.now(), d: x.d };
            paint(x.d, l2Claims[key].at);
            // Claimed once this card is actually on screen, for the same
            // reason the token card claims its own slot late: a fetch landing
            // after the reader moved on must not take the hook from the card
            // they moved to.
            if (card.isConnected) l2ClaimRedraw = function () { redrawAll(); };
          })
          .catch(function () {
            only('Could not reach this host to ask about epoch ' + n + '. The ' + logAmt + ' PEER above is what this device\u2019s copy of the log says; whether anything was ever deposited against it is a question only the host and the chain can answer.', WARN);
          });
      }

      rowPaints.push(function () {
        var c = l2Claims[key];
        if (c) paint(c.d, c.at);
      });
      load(false);
      return box;
    }

    return card;
  }

  // ── checking an epoch block here, instead of taking the host's word ────
  //
  // These mirror chain/canonical.mjs and chain/keys.mjs exactly, and they have
  // to: a host reporting that its own chain verifies is a host marking its own
  // work. Keys sorted by UTF-16 code unit, numbers printed by Number::toString
  // (which is what JSON.stringify prints), non-finite numbers refused rather
  // than nulled — JSON.stringify would write `null` for both and two different
  // corruptions would then hash alike. If that file ever changes, this changes
  // with it; the symptom of forgetting is every id on this screen going red at
  // once, which is the right way round for a mistake like that to fail.
  function chainCanon(v) {
    if (v === null) return 'null';
    var t = typeof v, i;
    if (t === 'boolean') return v ? 'true' : 'false';
    if (t === 'number') {
      if (!isFinite(v)) throw new Error('canonical: non-finite number');
      return JSON.stringify(v);
    }
    if (t === 'string') return JSON.stringify(v);
    if (t !== 'object') throw new Error('canonical: cannot encode ' + t);
    if (Array.isArray(v)) {
      var items = [];
      for (i = 0; i < v.length; i++) items.push(chainCanon(v[i]));
      return '[' + items.join(',') + ']';
    }
    var keys = Object.keys(v).sort(), parts = [];
    for (i = 0; i < keys.length; i++) {
      if (v[keys[i]] === undefined) continue;
      parts.push(JSON.stringify(keys[i]) + ':' + chainCanon(v[keys[i]]));
    }
    return '{' + parts.join(',') + '}';
  }
  function chainHexOf(bytes) {
    var out = '', i;
    for (i = 0; i < bytes.length; i++) out += (bytes[i] < 16 ? '0' : '') + bytes[i].toString(16);
    return out;
  }
  function chainBytesFromHex(hex) {
    var t = String(hex), out = new Uint8Array(Math.floor(t.length / 2)), i;
    for (i = 0; i < out.length; i++) out[i] = parseInt(t.slice(i * 2, i * 2 + 2), 16);
    return out;
  }
  // base64url — the representation a producer key and a signature travel in,
  // the same one a JWK carries, so nothing here parses DER.
  function chainBytesFromB64u(t0) {
    var t = String(t0).replace(/-/g, '+').replace(/_/g, '/');
    while (t.length % 4) t += '=';
    var bin = atob(t), out = new Uint8Array(bin.length), i;
    for (i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function chainSha256(text) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text))
      .then(function (buf) { return chainHexOf(new Uint8Array(buf)); });
  }
  // Ed25519 over the 32 raw bytes of the block digest — exactly what
  // chain/keys.mjs signs. A browser without Ed25519 in WebCrypto rejects here
  // and the caller reports "not checked", never "failed": those are opposite
  // claims about somebody's record and this page must not render one as the
  // other.
  function chainVerifySig(pub, digestHex, sig) {
    var jwk = { kty: 'OKP', crv: 'Ed25519', x: String(pub), ext: true, key_ops: ['verify'] };
    return crypto.subtle.importKey('jwk', jwk, { name: 'Ed25519' }, false, ['verify'])
      .then(function (k) {
        return crypto.subtle.verify({ name: 'Ed25519' }, k, chainBytesFromB64u(sig), chainBytesFromHex(digestHex));
      });
  }
  /**
   * One block, recomputed in this browser: { id, sig, why }.
   *
   * `id` is the block's own hash or null; `sig` is true, false, or null for
   * "nothing checked it here". Null is never shown as either of the other two.
   */
  function chainCheck(block) {
    var out = { id: null, sig: null, why: null };
    if (!(window.crypto && window.crypto.subtle)) {
      out.why = 'This browser handed the page no cryptography to check with — crypto.subtle exists only on a secure origin, and this app is often served over plain http on a LAN. Nothing below was recomputed here, so every signature is unchecked rather than trusted.';
      return Promise.resolve(out);
    }
    var unsigned = {}, k;
    for (k in block) if (Object.prototype.hasOwnProperty.call(block, k) && k !== 'sig') unsigned[k] = block[k];
    return chainSha256(chainCanon(block)).then(function (id) {
      out.id = id;
      return chainSha256(chainCanon(unsigned));
    }).then(function (digest) {
      return chainVerifySig(block.producer, digest, block.sig);
    }).then(function (ok) {
      out.sig = ok;
      return out;
    }).catch(function (e) {
      out.why = out.id
        ? 'The id above was recomputed here, but this browser would not check an Ed25519 signature (' + l2Err(e) + '), so the signatures below are unchecked.'
        : 'This browser could not recompute these blocks (' + l2Err(e) + ').';
      return out;
    });
  }

  /**
   * The epoch chain, and who has timestamped it on Base.
   *
   * The distinction this view exists to hold apart is the one the whole design
   * turns on, so it is said on the screen and not only in this comment:
   *
   *   · the LOG is what is true. Anyone holding it recomputes the state and
   *     gets the same numbers. That is replay, and it needs no signature, no
   *     chain and nobody's permission.
   *   · a BLOCK makes a rewrite loud. It says: this key published exactly
   *     these bytes for this epoch, linked to the block before it.
   *   · an ANCHOR adds the one fact replay cannot reconstruct — WHEN a
   *     commitment existed — by putting two hashes somewhere the poster
   *     cannot reach back into.
   *
   * None of the three makes a result correct, and the interface must never
   * blur that: an anchor proves a commitment existed at a time and was never
   * revised, and says nothing whatever about whether what it commits to is
   * true.
   *
   * Anchors are keyed by (poster, epoch) and ANYONE may post one. This app has
   * no official anchoring address to compare against, so every row names WHOSE
   * anchor it is, and an epoch several addresses anchored shows all of them
   * rather than one this page chose.
   */
  function epochChainView() {
    var wrap = h('div', {});
    // The newest N blocks are drawn and checked. The chain is every epoch this
    // network has ever closed; hashing all of it inside a page would be a
    // spinner rather than a check, and the whole file is one fetch away at
    // /api/chain for anyone who wants to run chain/verify.mjs over it.
    var SHOW = 20;

    var card = h('div', { class: 'card' }, h('h2', { text: 'The epoch chain' }));
    card.appendChild(h('p', { class: 'smallnote' },
      'Every closed epoch is sealed into one ', term('epochBlock'),
      ': the acts it covered, hashes of the state computed from them, the constants used, and a signature from the ',
      term('producer'), ' that published it. Each block carries the id of the one before it, so an old block cannot be edited quietly — every id after it changes too, and stops matching the copies other people are holding.'));
    card.appendChild(h('p', { class: 'smallnote' },
      'A block is a publication, not a verdict. What is true here is settled by ', term('replay'),
      ' — recomputing the network from the public act log, which needs neither this host nor any chain. A signature that checks out says this key published exactly these bytes, and nothing at all about the numbers in them being right.'));
    card.appendChild(h('p', { class: 'smallnote', text: 'The ids and signatures below are recomputed in this browser out of the bytes this host served, because a host reporting that its own chain verifies is marking its own work. The same check runs offline over the same two files: node chain/verify.mjs, against /api/chain and /api/acts.' }));
    var body = h('div', {});
    card.appendChild(body);
    wrap.appendChild(card);

    var aCard = h('div', { class: 'card', style: 'margin-top:14px' }, h('h2', { text: 'Anchors — and whose they are' }));
    var aBody = h('div', {});
    aCard.appendChild(aBody);
    wrap.appendChild(aCard);

    var kCard = h('div', { class: 'card', style: 'margin-top:14px' }, h('h2', { text: 'The contracts this host reads' }));
    var kBody = h('div', {});
    kCard.appendChild(kBody);
    wrap.appendChild(kCard);

    body.appendChild(h('p', { class: 'smallnote', text: 'Reading the blocks this host publishes…' }));
    aBody.appendChild(h('p', { class: 'smallnote', text: 'Asking this host what it can see on chain…' }));
    kBody.appendChild(h('p', { class: 'smallnote', text: 'Asking this host which contracts it is pointed at…' }));

    // One shape for three answers, and a refusal that is a status rather than
    // an exception: /api/chain is ndjson and never parses as one document, so
    // the text is kept beside whatever JSON there was.
    function ask(path) {
      return fetch(API + path, { cache: 'no-store' }).then(function (r) {
        return r.text().then(function (t) {
          var d = null;
          try { d = JSON.parse(t); } catch (e) { d = null; }
          return { status: r.status, d: d, text: t };
        });
      }).catch(function () { return { status: 0, d: null, text: '' }; });
    }

    Promise.all([ask('/api/chain'), ask('/api/chain/head'), ask('/api/token/onchain')])
      .then(function (r) { draw(r[0], r[1], r[2]); });

    function draw(chainRes, headRes, ocRes) {
      body.innerHTML = '';
      aBody.innerHTML = '';
      kBody.innerHTML = '';

      var oc = ocRes.d;
      var ocOff = ocRes.status === 404 || !!(oc && oc.code === 'ONCHAIN_OFF');
      var ocOK = ocRes.status === 200 && !!oc && !oc.code;
      var chainId = ocOK && isFinite(Number(oc.chainId)) ? Number(oc.chainId) : null;
      var anch = ocOK && oc.anchors ? oc.anchors : null;
      var anchorsOn = !!(anch && anch.configured !== false && !anch.error && Array.isArray(anch.anchors));

      // Anchors by epoch, in a null-prototype map: the keys are decimal
      // strings a stranger chose, because anyone may anchor any epoch number.
      var byEpoch = Object.create(null);
      if (anchorsOn) {
        anch.anchors.forEach(function (a) {
          var k = String(a.epoch);
          if (!byEpoch[k]) byEpoch[k] = [];
          byEpoch[k].push(a);
        });
      }

      var blocks = [], bad = 0;
      if (chainRes.status === 200) {
        String(chainRes.text || '').split('\n').forEach(function (line) {
          var t = line.trim();
          if (!t) return;
          try {
            var b = JSON.parse(t);
            if (b && typeof b === 'object' && !Array.isArray(b)) blocks.push(b);
            else bad++;
          } catch (e) { bad++; }
        });
      }
      blocks.sort(function (x, y) { return (Number(x.height) || 0) - (Number(y.height) || 0); });

      var head = headRes.status === 200 && headRes.d ? headRes.d : null;
      // What the chain says its own ids are: block N+1 carries N's id in
      // `prev`, and HEAD.json names the tip's. That is what makes recomputing
      // them worth doing — two independent statements of one hash, one
      // derived from the bytes and one asserted by the files, and a
      // disagreement between them is the loudest thing this view can say.
      var said = Object.create(null), saidBy = Object.create(null);
      blocks.forEach(function (b) {
        var hgt = Number(b.height);
        if (typeof b.prev === 'string' && b.prev && isFinite(hgt)) {
          said[String(hgt - 1)] = b.prev;
          saidBy[String(hgt - 1)] = 'the block above names it as its prev';
        }
      });
      if (head && typeof head.hash === 'string' && head.hash) {
        said[String(head.height)] = head.hash;
        saidBy[String(head.height)] = 'HEAD.json names it as the tip';
      }

      var queue = [], whyBox = h('div', {});

      if (chainRes.status === 0) {
        body.appendChild(h('p', { class: 'smallnote', text: 'This page could not reach a host to ask for the chain, so nothing is shown. Nothing is drawn from this page’s own memory on purpose: a chain redrawn out of a cache is exactly what this view exists to make unnecessary.' }));
      } else if (chainRes.status === 404) {
        body.appendChild(h('p', { class: 'smallnote', text: (chainRes.d && chainRes.d.error) || 'This host has sealed no epoch block yet.' }));
        body.appendChild(h('p', { class: 'smallnote', text: 'That is a host which has sealed nothing, not a network without a record: the act log IS the record, and it replays without any of this.' }));
      } else if (chainRes.status !== 200) {
        body.appendChild(h('p', { class: 'smallnote', text: 'This host answered ' + chainRes.status + ' when asked for its chain' + (chainRes.d && chainRes.d.error ? ': ' + chainRes.d.error : '.') }));
      } else if (!blocks.length) {
        body.appendChild(h('p', { class: 'smallnote', text: 'This host served a chain with no blocks in it' + (bad ? ', and ' + bad + ' line(s) of it would not parse.' : '.') }));
      } else {
        drawBlocks();
      }

      function drawBlocks() {
        var shown = blocks.slice(Math.max(0, blocks.length - SHOW)).reverse();
        var top = 'Newest first. ' + (blocks.length > shown.length
          ? 'Showing ' + shown.length + ' of ' + blocks.length + ' blocks — the rest are in the same file, at /api/chain.'
          : blocks.length + ' block' + (blocks.length === 1 ? '' : 's') + ', which is all of them.');
        if (bad) top += ' ' + bad + ' line(s) would not parse and are not counted.';
        if (head && Number(head.height) !== Number(blocks[blocks.length - 1].height)) {
          top += ' This host’s HEAD names height ' + head.height + ' while the last block in its file is height ' + blocks[blocks.length - 1].height + ': the two disagree, which is worth more of your attention than any signature below.';
        }
        body.appendChild(h('p', { class: 'smallnote', text: top }));
        body.appendChild(whyBox);

        shown.forEach(function (b) {
          var row = h('div', { style: 'border-top:1px solid var(--line); padding:10px 0' });
          var when = typeof b.time === 'number' && isFinite(b.time)
            ? new Date(b.time).toLocaleString()
            : 'a time this block does not carry';
          row.appendChild(h('div', { class: 'kv' },
            h('span', { text: 'epoch ' + (b.epoch == null ? '?' : b.epoch) }),
            h('b', { class: 'num', text: 'height ' + (b.height == null ? '?' : b.height) }),
            h('span', { text: 'sealed' }),
            h('b', { class: 'num', text: when })));
          var idLine = h('p', { class: 'smallnote' });
          row.appendChild(idLine);
          row.appendChild(h('p', { class: 'smallnote' },
            h('span', { class: 'num', style: 'word-break:break-all', text: 'producer ' + String(b.producer || '—') })));
          var chips = h('div', {});
          row.appendChild(chips);
          var anchors = h('div', {});
          row.appendChild(anchors);
          body.appendChild(row);
          queue.push({ b: b, idLine: idLine, chips: chips, anchors: anchors });
        });

        body.appendChild(h('p', { class: 'smallnote', text: 'A producer is a signing key — not a wallet and not a person. It signs the record and holds no money. A key that changes from one block to the next is a change in who publishes this network’s epochs, and it is visible here rather than silent.' }));
        run();
      }

      // One at a time. Twenty blocks is twenty canonical encodings and forty
      // digests; done in parallel on a phone the page stops answering, and the
      // rows fill in top-down either way.
      function run() {
        var i = 0;
        function next() {
          if (i >= queue.length) return;
          var slot = queue[i++];
          chainCheck(slot.b).then(function (r) { paint(slot, r); next(); });
        }
        next();
      }

      function paint(slot, r) {
        var b = slot.b, hgt = String(b.height);
        var claimed = said[hgt] || null;
        var id = r.id || claimed;

        slot.idLine.innerHTML = '';
        if (id) {
          slot.idLine.appendChild(h('span', { class: 'num', style: 'word-break:break-all', text: id }));
          slot.idLine.appendChild(h('button', { class: 'btn small', style: 'margin-left:8px', text: 'Copy id',
            onclick: function () { copyLine(id, 'Block id copied.'); } }));
          slot.idLine.appendChild(h('span', { class: 'smallnote', text: r.id ? ' · recomputed here from the bytes served' : ' · not recomputed here — ' + (saidBy[hgt] || 'taken from this host') }));
        } else {
          slot.idLine.appendChild(h('span', { class: 'smallnote', text: 'This block’s id is not on screen: nothing here recomputed it, and neither another block nor HEAD names it.' }));
        }

        slot.chips.innerHTML = '';
        if (r.sig === true) slot.chips.appendChild(h('span', { class: 'gate pass', text: 'signature verifies' }));
        else if (r.sig === false) slot.chips.appendChild(h('span', { class: 'gate fail', text: 'SIGNATURE DOES NOT VERIFY' }));
        else slot.chips.appendChild(h('span', { class: 'gate', style: 'border:1px solid var(--line)', text: 'signature not checked here' }));

        if (r.id && claimed) {
          slot.chips.appendChild(r.id === claimed
            ? h('span', { class: 'gate pass', text: 'id matches — ' + saidBy[hgt] })
            : h('span', { class: 'gate fail', text: 'ID DOES NOT MATCH THE LINK' }));
        } else if (r.id) {
          slot.chips.appendChild(h('span', { class: 'gate', style: 'border:1px solid var(--line)', text: 'nothing else names this id' }));
        }

        if (r.id && claimed && r.id !== claimed) {
          slot.chips.appendChild(h('p', { class: 'smallnote', style: 'border-left:2px solid var(--ember); padding-left:9px',
            text: 'These bytes hash to ' + r.id + ', and this same host says the block at this height is ' + claimed + ' (' + saidBy[hgt] + '). One of the two is wrong, and a chain whose own links do not fit the blocks it serves proves nothing at all. Replay the act log and believe that instead.' }));
        }
        if (r.sig === false) {
          slot.chips.appendChild(h('p', { class: 'smallnote', style: 'border-left:2px solid var(--ember); padding-left:9px',
            text: 'The signature on this block does not check out against the key inside it. That does not say which of the possible things happened — an edited block, a truncated file, a key that is not this producer’s — only that these are not bytes that key published, and they should be read as unsigned.' }));
        }
        // Said once, above the list, rather than twenty times down it.
        if (r.why && !whyBox.firstChild) whyBox.appendChild(h('p', { class: 'smallnote', text: r.why }));

        paintAnchors(slot.anchors, b.epoch, r.id || claimed, false);
      }

      /**
       * The anchors for one epoch, each under the address that posted it.
       *
       * `id` is the block id this screen holds for that epoch, or null. Where
       * both exist they are compared, because an anchor committing to a
       * DIFFERENT block for the same epoch is the single most useful thing an
       * anchor can tell a reader — and it is a fact about two records, never a
       * verdict about which is honest.
       */
      function paintAnchors(box, epoch, id, orphan) {
        if (!anchorsOn) return;   // said once, in the anchors card below
        var rows = byEpoch[String(epoch)] || [];
        if (!rows.length) {
          box.appendChild(h('p', { class: 'smallnote', text: 'No anchor for this epoch in what this host has read. That is not evidence that nobody anchored it: anyone may post one from any address, and this host reports only the rows its own log scan reached.' }));
          return;
        }
        if (rows.length > 1) {
          box.appendChild(h('p', { class: 'smallnote', text: rows.length + ' separate addresses have anchored epoch ' + epoch + '. None of them is “the network’s” — the contract keeps one row per (address, epoch) and anyone may post — so these are ' + rows.length + ' claims sitting side by side, and which of them means anything is a question about those addresses and not about this epoch.' }));
        }
        rows.forEach(function (a) {
          var when = a.at ? new Date(Number(a.at) * 1000).toLocaleString() + ', on the chain’s own clock' : 'a time this host did not report';
          var who = l2ScanLink(chainId, 'address', a.by, 'this address on basescan');
          var tx = l2ScanLink(chainId, 'tx', a.tx, 'the transaction');
          box.appendChild(h('p', { class: 'smallnote' },
            h('span', { class: 'num', text: l2ShortHex(a.by) }),
            ' anchored epoch ' + a.epoch + ' at ' + when + '. ',
            who, who && tx ? ' · ' : null, tx));
          if (typeof a.blockId === 'string' && a.blockId) {
            if (id && String(a.blockId).toLowerCase() === String(id).toLowerCase()) {
              box.appendChild(h('span', { class: 'gate pass', text: 'commits to this exact block' }));
            } else if (id) {
              box.appendChild(h('p', { class: 'smallnote', style: 'border-left:2px solid var(--ember); padding-left:9px',
                text: 'That anchor commits to a different block for epoch ' + a.epoch + ' than the one on this screen: ' + a.blockId + '. Both records are real and they cannot both be this epoch. Which one is honest is not a question an anchor can answer — replay the act log and see whose hashes come out of it.' }));
            } else {
              box.appendChild(h('p', { class: 'smallnote', text: 'It commits to block id ' + a.blockId + '. Nothing here compared that against anything, because ' + (orphan ? 'this host holds no block for that epoch.' : 'this block’s own id could not be established above.') }));
            }
          }
          box.appendChild(h('p', { class: 'smallnote', text: 'It also commits to an earnings root, ' + l2ShortHex(String(a.earningsRoot || '—')) + '. This view checks that root against nothing: what an epoch owes and to whom is the earnings tree’s business, and an anchor only fixes the moment a commitment to it existed.' }));
        });
      }

      // ── the anchors card ──
      aBody.appendChild(h('p', { class: 'smallnote' },
        'An ', term('anchor'), ' is two hashes and a timestamp, posted to a contract on Base by whatever address chose to post them: this address said epoch N had this block id and this earnings root, at this moment. The contract keeps one row per (address, epoch) and refuses a second forever — so what it proves is that the commitment existed by then and was never revised.'));
      aBody.appendChild(h('p', { class: 'smallnote', text: 'It proves nothing else. Not that the epoch was computed honestly, not that the numbers in it are right, and not that the poster is anybody in particular: anyone may anchor anything, and an impostor’s row sits under their own address next to nothing. This app has no official anchoring address, so no row here is “the network’s” and every one of them says whose it is.' }));

      if (ocRes.status === 0) {
        aBody.appendChild(h('p', { class: 'smallnote', text: 'This page could not reach a host to ask what it reads on chain, so nothing is claimed about anchors either way.' }));
      } else if (ocOff) {
        aBody.appendChild(h('p', { class: 'smallnote', text: (oc && oc.why) || 'This host serves no on-chain token, so it reads no anchor contract either.' }));
      } else if (!ocOK) {
        aBody.appendChild(h('p', { class: 'smallnote', text: 'This host answered ' + ocRes.status + ' when asked what it reads on chain' + (oc && oc.error ? ': ' + oc.error : '.') }));
      } else if (!anch) {
        aBody.appendChild(h('p', { class: 'smallnote', text: oc.error || 'This host said nothing about anchors at all — neither a contract nor a reason — and nothing is assumed from that silence.' }));
      } else if (anch.configured === false) {
        aBody.appendChild(h('p', { class: 'smallnote', text: anch.why || 'PEER_ANCHOR_ADDR is unset on this host, so it reads no anchors.' }));
        aBody.appendChild(h('p', { class: 'smallnote', text: 'The blocks above are unaffected: they are this host’s own record and need no contract. Anchoring is an outside witness, and its absence here is not a claim that nobody anchored these epochs — only that this host is not looking.' }));
      } else if (anch.error) {
        aBody.appendChild(h('p', { class: 'smallnote', text: anch.error }));
      } else {
        aBody.appendChild(h('p', { class: 'smallnote' },
          h('span', { class: 'num', style: 'word-break:break-all', text: String(anch.contract || '—') }),
          ' · the anchor contract this host reads, on ' + l2ChainName(chainId) + '. ',
          l2ScanLink(chainId, 'address', anch.contract, 'the contract on basescan')));
        var seen = Number(anch.returned || 0), found = Number(anch.discovered || 0);
        var line = seen + ' anchor' + (seen === 1 ? '' : 's') + ' in view, of ' + found + ' this host has seen';
        if (anch.posters != null) line += ', posted by ' + anch.posters + ' address' + (Number(anch.posters) === 1 ? '' : 'es');
        if (anch.busiestPoster && anch.busiestPoster.by) line += '; the busiest is ' + l2ShortHex(anch.busiestPoster.by) + ' with ' + anch.busiestPoster.anchors;
        aBody.appendChild(h('p', { class: 'smallnote', text: line + '. Nothing ranks them, because there is nothing here to rank by: posting one costs a fee and proves membership of nothing.' }));
        if (anch.note) aBody.appendChild(h('p', { class: 'smallnote', text: anch.note }));

        // Anchors for epochs this host has no block for. Either it is behind,
        // or somebody anchored an epoch that does not exist here — both
        // are ordinary, and neither is evidence about the other.
        var have = Object.create(null);
        blocks.forEach(function (b) { have[String(b.epoch)] = 1; });
        var orphans = Object.keys(byEpoch).filter(function (k) { return !have[k]; });
        if (orphans.length) {
          orphans.sort(function (x, y) { return Number(y) - Number(x); });
          aBody.appendChild(h('p', { class: 'eyebrow', style: 'margin:14px 0 4px', text: 'anchored epochs this host has no block for' }));
          aBody.appendChild(h('p', { class: 'smallnote', text: 'The contract accepts any epoch number from any address, so a row here means somebody committed to an epoch this host cannot show you — because it has not sealed that far yet, or because the epoch is not one it recognises at all.' }));
          orphans.slice(0, 12).forEach(function (k) {
            var oBox = h('div', { style: 'border-top:1px solid var(--line); padding:8px 0' });
            oBox.appendChild(h('div', { class: 'kv' },
              h('span', { text: 'epoch ' + k }),
              h('b', { class: 'num', text: byEpoch[k].length + ' anchor' + (byEpoch[k].length === 1 ? '' : 's') })));
            aBody.appendChild(oBox);
            paintAnchors(oBox, k, null, true);
          });
          if (orphans.length > 12) {
            aBody.appendChild(h('p', { class: 'smallnote', text: orphans.length + ' such epochs in all; the newest twelve are shown.' }));
          }
        }
      }

      // ── the contracts card ──
      kBody.appendChild(h('p', { class: 'smallnote' },
        'Every address below is read from this host and never written into this page, and each one carries a link to a ', term('explorer', 'block explorer'),
        ' — which is how any of it gets checked against something that is not this app.'));
      if (!ocOK) {
        kBody.appendChild(h('p', { class: 'smallnote', text: ocOff
          ? ((oc && oc.why) || 'No on-chain token is configured on this host, so it names no contracts.')
          : 'This host did not answer with what it reads on chain, so there is nothing here to name.' }));
      } else {
        if (chainId === null) {
          kBody.appendChild(h('p', { class: 'smallnote', text: 'This host did not say which chain it serves, so nothing here links anywhere: an explorer for the wrong chain draws a confident page about an entirely different thing.' }));
        } else if (!L2_EXPLORERS[chainId]) {
          kBody.appendChild(h('p', { class: 'smallnote', text: 'This host serves chain ' + chainId + ', and this page knows no explorer for it. The addresses below are printed without links rather than linked to basescan, which only reads Base.' }));
        } else {
          kBody.appendChild(h('p', { class: 'smallnote', text: 'This host serves chain ' + chainId + ' (' + l2ChainName(chainId) + '), so every link below goes to basescan, which is the explorer for that chain.' }));
        }
        kRow('PEER — the ERC-20', oc.token, 'token', 'No token address.');
        kRow('cbBTC — the other side of every pool here', oc.btc, 'token', 'PEER_BTC_ADDR is unset on this host.');
        kRow('the pools factory — this app’s own pools', oc.namedPools && oc.namedPools.factory, 'address',
          'PEER_POOLS_ADDR is unset on this host, so this app has no pools of its own here.');
        kRow('the anchor contract — timestamps over epoch blocks', anch && anch.configured !== false ? anch.contract : null, 'address',
          (anch && anch.why) || 'No anchor contract is configured on this host.');
        var cs = oc.claimState;
        kRow('the claim contract — epoch earnings paid on chain', cs && cs.configured !== false ? cs.contract : null, 'address',
          (cs && cs.why) || 'No claim contract is configured on this host.');
      }

      function kRow(label, addr, kind, off) {
        var row = h('div', { style: 'border-top:1px solid var(--line); padding:8px 0' });
        row.appendChild(h('p', { class: 'eyebrow', style: 'margin:0 0 3px', text: label }));
        if (!addr) {
          row.appendChild(h('p', { class: 'smallnote', text: off }));
        } else {
          row.appendChild(h('p', { class: 'smallnote' },
            h('span', { class: 'num', style: 'word-break:break-all', text: String(addr) }), ' ',
            l2ScanLink(chainId, kind, addr, 'on basescan')));
        }
        kBody.appendChild(row);
      }
    }

    return wrap;
  }

  /**
   * This app's own pools, and the same pair on a public DEX.
   *
   * Two pools over the same two tokens are two pools. They hold different
   * coins, they have different prices, and a trade in one does nothing for the
   * other. That is worth a card of its own because the failure it prevents is
   * expensive and quiet: reading the ratio on this screen as "the price of
   * PEER", depositing into one pool while quoting the other, or believing this
   * app routes a trade somewhere it does not.
   *
   * Nothing here reads Uniswap. This app cannot say whether a Uniswap pool for
   * the pair exists, what it holds, or what it would fill at — so it says that
   * instead of implying otherwise, and the link is a link out rather than a
   * reading.
   */
  function dexCard() {
    var card = h('div', { class: 'card', style: 'margin-top:14px' },
      h('h2', { text: 'This app’s pools, and Uniswap' }));
    var body = h('div', {});
    card.appendChild(body);

    body.appendChild(h('p', { class: 'smallnote' },
      'The card above is this app’s own pools: named pools inside one contract, opened by whoever wanted one, trading PEER against cbBTC. Every button on it calls that contract and nothing else.'));
    body.appendChild(h('p', { class: 'smallnote' },
      'The same two tokens can also have a pool on Uniswap, which is a different ', term('dex'),
      ': a different contract, holding different coins, with its own price and its own fee tier. This app does not read Uniswap, does not route anything to it, and cannot tell you whether a pool for this pair exists there at all.'));
    body.appendChild(h('p', { class: 'smallnote' },
      term('liquidity', 'Liquidity'), ' sits in one pool and nowhere else. Coins deposited here are not available to a trade there, and the reverse is just as true — so the two prices can differ for as long as nobody trades the gap away, and opening both splits what little depth there is rather than adding it up.'));
    body.appendChild(h('p', { class: 'smallnote', text: 'No price on this screen is a market price. A pool’s price is its own ratio: what its opener put in, moved by whoever has traded against it since.' }));

    var out = h('div', {});
    body.appendChild(out);

    function draw(status, d) {
      out.innerHTML = '';
      if (status === 404 || !d || d.code === 'ONCHAIN_OFF' || !d.token) {
        out.appendChild(h('p', { class: 'smallnote', text: 'This host names no token, so there is no pair to point at anywhere — here or on Uniswap.' }));
        return;
      }
      var chainId = Number(d.chainId);
      var token = String(d.token), btc = d.btc ? String(d.btc) : null;
      if (!d.namedPools) {
        out.appendChild(h('p', { class: 'smallnote', text: 'This host has no pools factory configured, so this app has no pools of its own — the card above says so. A Uniswap pool for the same pair would be a separate thing that needs nothing from this host.' }));
      }
      // Three different reasons not to draw a link out, and each says which
      // piece is actually missing. Folded into one sentence they produced
      // "it would be written for Base and this host serves chain 8453" on a
      // host whose only problem was an unset cbBTC address.
      var why = null;
      if (chainId !== 8453) {
        why = 'No link out is drawn. It would be written for Base, and this host serves chain ' + d.chainId + ': an exchange link built for the wrong chain sends somebody to a page about different coins that happen to sit at the same addresses.';
      } else if (!/^0x[0-9a-fA-F]{40}$/.test(token)) {
        why = 'No link out is drawn: this host did not name the token as an address, and a link built around ' + token + ' would point at nothing.';
      } else if (!btc || !/^0x[0-9a-fA-F]{40}$/.test(btc)) {
        why = 'No link out is drawn: a pair needs two sides and this host names only one. PEER_BTC_ADDR is unset here, so there is no second token to ask an exchange about.';
      }
      if (why) {
        out.appendChild(h('p', { class: 'smallnote', text: why }));
      } else {
        var row = h('div', { class: 'mini-form persistent' });
        row.appendChild(h('a', { class: 'btn small', target: '_blank', rel: 'noopener',
          href: 'https://app.uniswap.org/swap?chain=base&inputCurrency=' + btc + '&outputCurrency=' + token,
          text: 'Open this pair on Uniswap' }));
        var tl = l2ScanLink(chainId, 'token', token, 'the token on basescan');
        if (tl) row.appendChild(tl);
        out.appendChild(row);
        out.appendChild(h('p', { class: 'smallnote', text: 'That opens Uniswap with both addresses filled in. It is a link out, not a reading: if no pool exists there, Uniswap is what will tell you, and whatever price it shows is that pool’s and has nothing to do with the numbers above. Opening a position there is a decision about a different pool — chain-l2/DEPLOY.md §3 is the runbook, and a new pair belongs at a 1% fee tier with an opening price you are choosing rather than discovering.' }));
      }
      // PEER_POOL_ADDR: an outside pair this host was pointed at. It is read
      // and reported, and it is still not this app's pool — naming it without
      // that sentence would be the exact blur this card exists to prevent.
      var pool = d.pool ? (typeof d.pool === 'string' ? d.pool : d.pool.address) : null;
      if (pool) {
        var pl = l2ScanLink(chainId, 'address', pool, 'on basescan');
        out.appendChild(h('p', { class: 'smallnote' },
          'This host is also pointed at an outside pair at ',
          h('span', { class: 'num', style: 'word-break:break-all', text: String(pool) }), ' ', pl,
          ' — a UniswapV2-style contract it reads and never trades. No button here touches it, and this page cannot say which exchange it belongs to; the explorer can.'));
        if (d.pool && d.pool.error) out.appendChild(h('p', { class: 'smallnote', text: d.pool.error }));
      }
    }

    out.appendChild(h('p', { class: 'smallnote', text: 'Asking this host which pair it serves…' }));
    fetch(API + '/api/token/onchain', { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (x) { draw(x.status, x.d); })
      .catch(function () {
        out.innerHTML = '';
        out.appendChild(h('p', { class: 'smallnote', text: 'Could not reach this host to ask which pair it serves, so no link out is drawn from memory. Everything above is true regardless: two pools over one pair are two pools.' }));
      });
    return card;
  }

  /**
   * Burning PEER for reserve — the second door, and the only one with a price.
   *
   * The sentences on this card are in this order for a reason:
   *
   *   1. Reserve is value destroyed. Bitcoin at an address with no key is one
   *      way; the PEER ERC-20 at a dead address is a second. Same rate.
   *   2. It is NOT the epoch token. This tab counts PEER that lives in the act
   *      log and on no chain, and says at length that the two do not convert.
   *      A door that quietly implied otherwise would undo that in one card.
   *   3. The two doors are NOT equally provable, and this tab is where both are
   *      visible. The wording comes from the engine
   *      (st.peerBurn.limits.provenance) rather than being phrased here, so
   *      there is one sentence to keep true instead of two to keep matching.
   *   4. The price MOVES. Anything quoted here is one moment's answer from a
   *      contract anybody can trade against; what gets credited is what the
   *      HOST verified when it verified it.
   *   5. What it never buys: reserve only. Never a share of the epoch mint,
   *      never a vote in the writer election — those read satoshis proved
   *      destroyed on the Bitcoin chain, and this door does not write them.
   *
   * Every constant printed comes from the shared engine, never from this file:
   * the page, the host door and replay must refuse in the same words with the
   * same numbers, and a screen that says 'at most 100' while replay enforces
   * something else is the interface lying on the network's behalf.
   *
   * And when there is no price the card draws no amount box and no button. That
   * is today's real state everywhere — no pools factory is deployed, so there
   * is no official pool to read — and it is rendered as the paragraph it is,
   * beside the bitcoin door, which works. Same rule as the pool-opening form
   * further down this tab.
   */
  function peerBurnCard(st) {
    var card = h('div', { class: 'card', style: 'margin-top:14px' },
      h('h2', { text: 'Burn PEER for reserve — the second door' }));
    var lim = st && st.peerBurn && st.peerBurn.limits;
    if (!lim) {
      // An engine with no peerBurn rules in it. Everything below would be this
      // page inventing what a host will accept, which is the one thing a card
      // about a price must never do.
      card.appendChild(h('p', { class: 'smallnote', text: 'This page is running an engine with no PEER burn rules in it, so every limit and every rate this card would print would be one the page made up. Nothing is drawn. The bitcoin door is unaffected and works as it always did.' }));
      return card;
    }
    var satsPer = Math.max(1, Number(lim.satsPerReserve) || 100);
    var minPoolSats = /^[0-9]+$/.test(String(lim.minPoolSats)) ? String(lim.minPoolSats) : '0';
    var twapMs = Number(lim.twapMs) || 0;
    var twapObs = Number(lim.twapObs) || 0;
    var perEpoch = Number(lim.reservePerEpoch) || 0;
    var dead = String(lim.addr || '');

    // ── the two doors ──
    card.appendChild(h('p', { class: 'smallnote' },
      term('reserve', 'Reserve'), ' is value destroyed, and it is the only thing here that buys the right to act. There are two ways to destroy value. Burning bitcoin at an address with no key is the door this network opened with. Destroying the PEER token on Base is the second: the ',
      term('officialPool', 'official pool'), ' is asked what that many PEER would fetch in cbBTC, which is already a number of satoshis, and the burn credits reserve at ' + satsPer + ' sat to 1 — the same rate the bitcoin door uses. Both doors stay open; neither replaces the other.'));

    // ── which PEER this is, said again rather than assumed ──
    card.appendChild(h('p', { class: 'smallnote', text: 'The PEER destroyed here is the ERC-20 on Base — the coin in the card above, the one a wallet can hold. It is not the epoch token counted further up this tab, and this door does not join them: no epoch PEER is spent, none is created, and there is still no exchange rate between the two and no bridge in either direction. What crosses here is value, not either token.' }));

    // ── the provenance difference, in the engine's words ──
    card.appendChild(h('p', { class: 'smallnote' },
      h('b', { text: 'The two burns are not equally provable. ' }),
      String(lim.provenance || ''), ' The sink is a ', term('deadAddr', 'dead address'),
      ' and it has to be: the deployed PEER token refuses transfers to address(0) on purpose, so there is no zero-address burn to be had.'));
    if (dead) {
      var addrRow = h('p', { class: 'smallnote' },
        h('span', { class: 'num', style: 'word-break:break-all', text: dead }),
        ' · where a PEER burn must pay. A burn to anywhere else is not a burn here, whatever it cost. ');
      var sc = l2ScanLink(8453, 'address', dead, 'on basescan');
      if (sc) addrRow.appendChild(sc);
      card.appendChild(addrRow);
    }

    // ── what it never buys ──
    card.appendChild(h('p', { class: 'smallnote' },
      h('b', { text: 'What this door never buys. ' }),
      'A PEER burn credits reserve, and adds nothing to the satoshis you have proved destroyed on the Bitcoin chain — which is the weight the epoch mint shares out and the weight the writer election counts. Those two are what it can never buy, at any size, however the price was arrived at.'));
    card.appendChild(h('p', { class: 'smallnote' },
      h('b', { text: 'What it does buy, said exactly. ' }),
      'Reserve is the energy every act is debited from, so it buys ACTS — and acts are what the standing solve reads. This card used to say a PEER burn "touches nothing else", and that was not true: an account that speaks more has more of a graph around it. What bounds it is the ceiling rather than the claim, so the ceiling is printed below and the two things it can never reach are named above.'));

    // ── the price moves ──
    card.appendChild(h('p', { class: 'smallnote' },
      h('b', { text: 'Any quote here is one moment’s answer. ' }),
      'The pool is a contract anyone may trade against, so its price moves, and a thin one moves a long way on a single trade. What gets credited is what the HOST verifies at the moment it verifies it, from its own ',
      term('twap', 'time-weighted'), ' reading of the pool — not what this screen showed when the button was pressed. If those differ, the host’s reading is the one that enters the log, and it is the one replay checks the act against.'));

    // ── the arithmetic, because this is the number that decides who can speak ──
    card.appendChild(h('p', { class: 'eyebrow', style: 'margin:14px 0 4px', text: 'the arithmetic' }));
    card.appendChild(fbox('sats    = floor( N × poolBTC / (poolPEER + N) )\nreserve = sats / ' + satsPer));
    card.appendChild(h('p', { class: 'smallnote', text: 'N is the raw PEER destroyed and poolPEER / poolBTC are the pool’s two sides, all as whole numbers. That is what the pool would actually PAY for N PEER — not the ratio between its two sides. The ratio is a price no trade can get: a burn big enough to move the pool would credit satoshis nobody could ever have realised. Nothing is taken off for a fee, because nothing is sold: the PEER is destroyed and the pool’s reserves do not move.' }));
    card.appendChild(h('p', { class: 'smallnote', text: 'That line gives ONE burn a ceiling for free — no single burn, however enormous, is worth more than the whole bitcoin side of the pool. It gives a LOG none, and the difference matters: because the PEER is destroyed rather than sold, the reserves never move, so the hundredth burn is priced as if it were the first. Three hundred accounts each taking a full epoch’s allowance against a pool holding 0.01 cbBTC would have created three and a half times what selling that PEER into that pool could ever have paid out. So a pool has a second, separate bound: in one epoch it cannot create more reserve than it holds bitcoin, first come first served, and the rest waits for the next epoch.' }));
    card.appendChild(h('p', { class: 'smallnote', text: 'There is no conversion constant in that line and no euro anywhere in it. cbBTC has 8 decimals, so one raw cbBTC unit IS one satoshi, and PEER’s 18 decimals cancel between the top and the bottom.' }));

    // ── the fences, with their numbers ──
    card.appendChild(h('p', { class: 'eyebrow', style: 'margin:14px 0 4px', text: 'the rules this door runs under' }));
    var rules = h('div', { class: 'kv' });
    function rule(label, value) {
      rules.appendChild(label);
      rules.appendChild(h('b', { class: 'num', text: value }));
    }
    rule(h('span', {}, 'credited at'), satsPer + ' sat = 1 reserve');
    rule(h('span', {}, 'the pool’s bitcoin side, at least (', term('poolDepth', 'depth'), ')'),
      l2Human(minPoolSats, 0) + ' sat · ' + (Number(minPoolSats) / 1e8).toFixed(8) + ' cbBTC');
    rule(h('span', {}, 'the price, ', term('twap', 'time-weighted'), ' over'),
      Math.round(twapMs / 60000) + ' min · ' + twapObs + '+ readings');
    rule(h('span', {}, 'most reserve this door creates'), perEpoch + ' per account per epoch');
    rule(h('span', {}, '…and per pool, per epoch'), 'the pool’s own bitcoin side');
    rule(h('span', {}, 'blocks read inside the window'), (Number(lim.twapGrid) || 0) + ', chosen by the block hash');
    // The ceiling is keyed by the number of epochs CLOSED, which is one less
    // than epochNow — epochNow counts the open one. Reading it with the wrong
    // key would print a full allowance to somebody who had just spent it.
    if (who) {
      var used = (st.peerBurn.usedThisEpoch && st.peerBurn.usedThisEpoch[who + '@' + (st.epochNow - 1)]) || 0;
      rule(h('span', {}, 'your headroom this epoch'), fmt(Math.max(0, perEpoch - used), 2) + ' reserve');
    }
    card.appendChild(rules);
    card.appendChild(h('p', { class: 'smallnote', text: 'Every one of those is a choice about the price of speech, not a discovered quantity, and each is read from the shared engine rather than written into this page — so what this card refuses and what replay refuses cannot drift apart. A burn over the ceiling is not lost: the act records the slice it credits, and the rest of it is credited an epoch at a time, by the host, without you doing anything.' }));
    card.appendChild(h('p', { class: 'smallnote', text: 'The last of those is worth a sentence on its own. A window is only as good as WHERE inside it the price was read, and reading it on a fixed pattern would be no defence at all: whoever burns picks the block their burn lands in, so they would know every block that was going to be read and could push the price at exactly those, holding a false price for a hundredth of the window rather than all of it. The blocks are picked instead by the hash of the block the window ends at — a number nobody knows until that block exists — so pushing the price for a tenth of the window is caught about a tenth of the time, and the cost of lying is the cost of holding the lie. Every burn records that hash and the blocks it read, so anyone can redo the choice and re-read the pool at each of them.' }));

    // ── and then: what is actually possible on this host, right now ──
    //
    // The host door, which this page reads and never second-guesses:
    //
    //   GET  /api/peerburn?peer=<amount>&as=<handle>
    //          { accepting, address, provenance, priceMayMove,
    //            pool:  { poolId, factory, creator, nameNote },
    //            quote: { available, amtRaw, resPeerRaw, resBtcRaw,
    //                     twapMs, observations, sats, reserve }
    //                   | { available: false, code, why },
    //            you:   { boundAddress, reserveLeftThisEpoch } }
    //          404  { code: 'PEERBURN_OFF', accepting: false, why, missing[],
    //                 bitcoinDoor }
    //   POST /api/peerburn/claim  { id, auth, txid }
    //
    // The price is the HOST's reading, over its own window, and this page does
    // not fetch a pool itself: a spot price read here would carry none of the
    // fences and would still look exactly like a quote. What the page DOES do
    // is recheck — the satoshis are recomputed from the reserves the same
    // answer published, and a disagreement is printed loudly rather than
    // smoothed over, because that disagreement is precisely what replay
    // refuses a filed act for.
    var DOOR = '/api/peerburn';
    var stateBox = h('div', { style: 'margin-top:12px' });
    card.appendChild(stateBox);
    drawState();
    return card;

    /** A formula in the figure face. `.guide .formula` is scoped to the guide. */
    function fbox(text) {
      return h('div', { class: 'num', style: 'font-size:12px; background:var(--card-2); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:8px 0; overflow-x:auto; white-space:pre-wrap' , text: text });
    }
    function obj(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : null; }
    function rawStr(v) { return typeof v === 'string' && /^[0-9]+$/.test(v) ? v : null; }
    /** An amount of PEER as text, or null — the only thing sent to the host. */
    function amtText(t) {
      var v = String(t == null ? '' : t).trim();
      return /^[0-9]{0,12}(\.[0-9]{0,18})?$/.test(v) && v !== '' && v !== '.' && Number(v) > 0 ? v : null;
    }
    /**
     * The constant-product OUTPUT, in satoshis — transcribed from the engine's
     * peerBurnSats rather than reinvented. It exists here to CHECK the host's
     * answer against the host's own published reserves, not to price anything:
     * a page that quoted one number while the host credited another would
     * leave every reader thinking one of the two was cheating.
     */
    /**
     * The largest raw PEER whose quoted value is at most `sats`, from the same
     * reserves. Inverting sats = floor(N·rb / (rp + N)) gives
     * N = sats·rp / (rb − sats), floored, which is the number of PEER that
     * fills the headroom without crossing it.
     *
     * Display only. Nothing here decides what is credited — the host prices
     * the burn from its own reading when it verifies the transfer — and a
     * number this page could not compute is simply not printed.
     */
    function maxPeerRaw(sats, rpRaw, rbRaw) {
      try {
        var s = BigInt(Math.max(0, Math.floor(sats))), rp = BigInt(rpRaw), rb = BigInt(rbRaw);
        if (s <= 0n || rp <= 0n || rb <= s) return null;
        return ((s * rp) / (rb - s)).toString();
      } catch (e) { return null; }
    }
    function quoteSats(amtRaw, rpRaw, rbRaw) {
      try {
        var amt = BigInt(amtRaw), rp = BigInt(rpRaw), rb = BigInt(rbRaw);
        if (amt <= 0n || rp <= 0n || rb <= 0n) return null;
        var n = (amt * rb) / (rp + amt);
        if (n > BigInt(Number.MAX_SAFE_INTEGER)) return null;
        return Number(n);
      } catch (e) { return null; }
    }
    // status 0 means 'nothing was reached', which is a different sentence from
    // any status a host can answer with. try/catch as well as .catch: a browser
    // with no fetch at all, or an archive page opened from a file, throws on
    // the call itself rather than rejecting — and a card that threw here would
    // take the whole Economy tab down with it.
    function askJSON(path) {
      try {
        return fetch(API + path, { cache: 'no-store' })
          .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; },
            function () { return { status: r.status, d: null }; }); })
          .catch(function () { return { status: 0, d: null }; });
      } catch (e) { return Promise.resolve({ status: 0, d: null }); }
    }
    function askDoor(amount) {
      var q = [];
      if (amount) q.push('peer=' + encodeURIComponent(amount));
      if (who) q.push('as=' + encodeURIComponent(who));
      return askJSON(DOOR + (q.length ? '?' + q.join('&') : ''));
    }

    function drawState() {
      stateBox.appendChild(h('p', { class: 'smallnote', text: 'Asking this host what it can price…' }));
      // One PEER, so the answer carries a quote object whose reserves and
