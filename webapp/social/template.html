<title>Ender Net — social sandbox</title>
<style>
:root {
  --paper: #EDE4CC;
  --card: #F5EDD8;
  --card-2: #E4D8B9;
  --ink: #2A2312;
  --muted: #665732;
  --line: #D2C29B;
  --line-2: #B9A778;
  --ember: #A94708;
  --ember-hot: #B54B0A;
  --ember-soft: rgba(169, 71, 8, 0.10);
  --logo-red: #F51106;
  --on-ember: #FFF3E2;
  --brass: #8A6F3C;
  --brass-soft: rgba(138, 111, 60, 0.14);
  --moss: #55703F;
  --moss-soft: rgba(85, 112, 63, 0.13);
  --bad: #A93B2A;
  --bad-soft: rgba(169, 59, 42, 0.11);
  --shadow: 0 1px 2px rgba(52, 40, 18, 0.08), 0 8px 28px rgba(52, 40, 18, 0.08);
  /* group colours: a categorical set for the network legend and halos.
     The cool arc 173-328deg, which no semantic token uses -- ember 21,
     brass 38, moss 93, bad 8. Every value clears 4.6:1 on the worst
     surface in its theme, above the 3:1 WCAG asks of a graphical mark. */
  --c1: #10665C; --c2: #0F6486; --c3: #26479E; --c4: #613AA3; --c5: #8B2F86; --c6: #A32A6B;
  /* type: geometric sans for display/labels (the Futura lineage, 1927), book serif for reading, mono for figures */
  --display: 'Century Gothic', 'Futura', 'Twentieth Century', 'Bahnschrift', 'Avenir Next', sans-serif;
  --body: 'Charter', 'Bitstream Charter', Cambria, 'Iowan Old Style', Georgia, serif;
  --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12100B; --card: #1B1710; --card-2: #241E13; --ink: #E9DDC0; --muted: #A08F6C;
    --line: #37301E; --line-2: #4B4128; --ember: #E8641B; --ember-hot: #F5822F;
    --ember-soft: rgba(232, 100, 27, 0.16);
  --logo-red: #F51106; --on-ember: #16110A; --brass: #C9B593; --brass-soft: rgba(201, 181, 147, 0.13);
    --moss: #8CAF7F; --moss-soft: rgba(140, 175, 127, 0.14); --bad: #E05A3C; --bad-soft: rgba(224, 90, 60, 0.15);
    --c1: #38C4AE; --c2: #4FB4E4; --c3: #8AA6F7; --c4: #B79AF0; --c5: #E68FD8; --c6: #F58BB6;
    --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 8px 28px rgba(0,0,0,0.4);
  }
}
:root[data-theme="light"] {
  --paper: #EDE4CC; --card: #F5EDD8; --card-2: #E4D8B9; --ink: #2A2312; --muted: #665732;
  --line: #D2C29B; --line-2: #B9A778; --ember: #A94708; --ember-hot: #B54B0A; --on-ember: #FFF3E2;
  --ember-soft: rgba(169,71,8,0.10);
  --logo-red: #F51106; --brass: #8A6F3C; --brass-soft: rgba(138,111,60,0.14);
  --moss: #55703F; --moss-soft: rgba(85,112,63,0.13); --bad: #A93B2A; --bad-soft: rgba(169,59,42,0.11);
  /* group colours: a categorical set for the network legend and halos.
     The cool arc 173-328deg, which no semantic token uses -- ember 21,
     brass 38, moss 93, bad 8. Every value clears 4.6:1 on the worst
     surface in its theme, above the 3:1 WCAG asks of a graphical mark. */
  --c1: #10665C; --c2: #0F6486; --c3: #26479E; --c4: #613AA3; --c5: #8B2F86; --c6: #A32A6B;
  --shadow: 0 1px 2px rgba(52,40,18,0.08), 0 8px 28px rgba(52,40,18,0.08);
}
:root[data-theme="dark"] {
  --paper: #12100B; --card: #1B1710; --card-2: #241E13; --ink: #E9DDC0; --muted: #A08F6C;
  --line: #37301E; --line-2: #4B4128; --ember: #E8641B; --ember-hot: #F5822F;
  --ember-soft: rgba(232,100,27,0.16);
  --logo-red: #F51106; --on-ember: #16110A; --brass: #C9B593; --brass-soft: rgba(201,181,147,0.13);
  --moss: #8CAF7F; --moss-soft: rgba(140,175,127,0.14); --bad: #E05A3C; --bad-soft: rgba(224,90,60,0.15);
  --c1: #38C4AE; --c2: #4FB4E4; --c3: #8AA6F7; --c4: #B79AF0; --c5: #E68FD8; --c6: #F58BB6;
  --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 8px 28px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); margin: 0; line-height: 1.45; }
button { font-family: var(--body); cursor: pointer; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
::selection { background: var(--ember-soft); }

.shell { max-width: 1220px; margin: 0 auto; padding: 0 18px 40px; }

/* ═══ THE LAB LOOK ═══ */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 10px 2px; margin-bottom: 14px; flex-wrap: wrap;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
/* The base wordmark stays block-level: other surfaces still render the
   old three-piece wordmark markup, and a flex container splits it apart. The
   insignia lockup applies only where the insignia markup exists (geek). */
.wordmark { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 24px; margin: 0; letter-spacing: 0.04em; }
.wordmark em { font-style: normal; color: var(--ember); }
body[data-mode='geek'] .wordmark { font-size: 17px; letter-spacing: 0.22em; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
/* The insignia. Drawn as a vector so it stays sharp from favicon to hero;
   swap the data URI for a raster only if the original art must be exact. */
.brandmark { width: 34px; height: 34px; flex: none; display: block; color: var(--ink); }
/* Eight tabs do not fit a phone, and the page clips horizontal overflow, so
   the last ones were unreachable rather than merely off-screen — reported as
   "the Live tab is not shown". The row scrolls on its own instead. */
.tabs { display: flex; gap: 12px; background: transparent; border: 0; border-radius: 0; padding: 0 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 0 0 auto; white-space: nowrap; }
.tabs button { border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-family: var(--display); font-size: 12.5px; padding: 7px 3px 6px; border-radius: 0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
.tabs button.on { background: transparent; color: var(--ink); border-bottom-color: var(--ember); box-shadow: none; }
.switcher { display: flex; gap: 8px; align-items: center; }
.switcher select { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }

.cols { display: grid; grid-template-columns: 256px minmax(0, 1fr) 296px; gap: 16px; align-items: start; }
/* minmax(0,…) everywhere a track holds user content: a plain 1fr floors at
   min-content, so one unbroken 1000-character word would stretch the whole
   page and push the controls off-screen. Anyone can post such a word. */
@media (max-width: 1010px) { .cols { grid-template-columns: minmax(0, 1fr); } .rail { position: static; } }
.cols > * { min-width: 0; }
/* Structural backstop: whatever a peer posts, the page itself never widens —
   an oversized child scrolls inside its own card instead. */
html, body { overflow-x: hidden; }
.post, .card, .chat-msg { max-width: 100%; }
/* Applied to the CONTAINERS, not to a list of text classes. overflow-wrap
   inherits, so every piece of peer-written text inside a card is covered —
   including the ones nobody thought of. The first version of this rule
   enumerated class names and missed the comment body, which a tester found
   within the hour: a single 1000-character word still
   blew that column out to 7200px. Enumerating was the bug. */
.post, .card, .comment, .chat-thread,
.chat-row, .alert-row, .chron-row, .toast, .quote-embed {
  overflow-wrap: anywhere; word-break: break-word;
}
/* Flex and grid children default to min-width:auto, which refuses to shrink
   below their content. Without this the wrap above cannot take effect. */
.post *, .card *, .comment *, .grow { min-width: 0; }
.rail { position: sticky; top: 62px; }
/* right-rail instrument switch — one bar, one instrument at a time */
.rail-toggle { display: flex; gap: 2px; border: 1px solid var(--line-2); border-radius: 2px; padding: 2px; margin: 14px 0; background: var(--card-2); }
.rail-toggle button { flex: 1; border: 0; background: transparent; color: var(--muted); font-family: var(--display); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; padding: 6px 4px; border-radius: 2px; cursor: pointer; white-space: nowrap; }
.rail-toggle button.on { background: var(--card); color: var(--ink); box-shadow: inset 0 -2px 0 var(--ember); }
.rail-toggle .nbadge { margin-left: 5px; }
/* left-rail sort options — a list, not a row: each order gets its own line */
.rail-opt { display: block; width: 100%; text-align: left; border: 1px solid transparent; border-left: 2px solid transparent; background: transparent; color: var(--muted); padding: 5px 8px; border-radius: 2px; cursor: pointer; font: inherit; }
.rail-opt b { display: block; font-family: var(--display); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: inherit; }
.rail-opt .smallnote { font-size: 10px; }
.rail-opt:hover { color: var(--ink); }
.rail-opt.on { color: var(--ink); border-left-color: var(--ember); background: var(--card-2); }
.rail-opt + .rail-opt { margin-top: 2px; }
/* the feed-head copy of the reading controls: phones only */
.ctl-m { display: none; }
@media (max-width: 1010px) {
  .ctl-m { display: block; margin-bottom: 12px; }
  .ctl-m > summary { cursor: pointer; padding: 9px 12px; background: var(--card); border: 1px solid var(--line); border-top: 2px solid var(--line-2); border-radius: 3px; margin: 0; }
  .ctl-m .card + .card { margin-top: 10px; }
  .ctl-m[open] > summary { margin-bottom: 10px; }
  .rail-left .card:nth-child(-n+3) { display: none; }
}

.card { background: var(--card); border: 1px solid var(--line); border-top: 2px solid var(--line-2); border-radius: 3px; padding: 16px 18px; box-shadow: var(--shadow); }
.card + .card { margin-top: 14px; }
.card h2 { font-family: var(--display); font-size: 14px; margin: 0 0 10px; letter-spacing: 0.12em; text-transform: uppercase; }
.eyebrow { font-family: var(--display); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 700; }

.idcard .who { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
.avatar { width: 42px; height: 42px; border-radius: 5px; border: 1.5px solid var(--ink); background: var(--card-2); color: var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 21px; flex: none; }
.avatar.s { width: 27px; height: 27px; font-size: 13.5px; }
.avatar { position: relative; overflow: hidden; }
/* The portrait sits ON the monogram rather than instead of it, so a picture
   that never loads leaves the letter behind. `cover`, never `contain`: the
   blob is already a square crop, and contain would letterbox anything that
   was stored before this rule existed. */
.ava-img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .12s ease; }
.ava-img.ok { opacity: 1; }
.handle { font-weight: 700; font-size: 15px; }
.standing-chip { font-family: var(--mono); font-size: 11px; color: var(--brass); background: var(--brass-soft); border: 1px solid var(--brass); border-radius: 2px; padding: 1px 8px; white-space: nowrap; }
.ledger { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12.5px; margin: 0; }
.ledger dt { color: var(--muted); }
.ledger dd { margin: 0; text-align: right; }
.gauge { height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 10px 0 6px; }
.gauge i { display: block; height: 100%; background: var(--ember); border-radius: 4px; transition: width 0.4s ease; }
.smallnote { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
/* The stamp on a post, pushed to the far end of its head row. Only posts
   written after the log started stamping have one; the rest show nothing
   rather than a guess. */
.post .when { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
/* The kind chip carries meaning now, so it is allowed to carry colour: an
   event with a price and a broadcast that is on air are the two cards a
   reader must not mistake for an ordinary note. */
.kindtag.k-event { color: var(--brass); border-color: var(--brass); }
.kindtag.k-stream { color: var(--ember); border-color: var(--ember); }
.kindtag.k-live { color: var(--ember); border-color: var(--ember); background: var(--ember-soft); }
/* The broadcast bar. Drawn by render() above everything, so it follows you
   between tabs and between modes — a broadcast you cannot stop is worse than
   one you cannot start. */
.livebar { border-color: var(--ember); margin-bottom: 12px; }
.livebar video { max-height: 180px; }
/* Folded away, the bar keeps only its heading and its controls. It sits above
   whatever screen you are on, so it must be possible to get it out of the way
   without ending the broadcast. */
.livebar.shut { padding-top: 10px; padding-bottom: 10px; }
.livebar .track-list, .livebar .comment { max-height: 40vh; overflow-y: auto; }

/* ── the button system — one family, four ranks ──────────────────────────
   Every geek-mode control derives from these four: standard (outlined),
   primary (the one filled signal per card), ghost (quiet), danger
   (destructive — earns its colour). Uppercase display type, squared
   corners, no decorative variance anywhere else. */
.btn { border: 1.5px solid var(--line-2); background: transparent; color: var(--ink); border-radius: 2px; padding: 7px 14px; font-family: var(--display); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; transition: border-color 0.12s, background 0.12s, color 0.12s, transform 0.05s; }
.btn:hover { border-color: var(--brass); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ember); border-color: var(--ember); color: var(--on-ember, #16110A); }
.btn.primary:hover { background: var(--ember-hot); border-color: var(--ember-hot); }
.btn.small { padding: 4px 10px; font-size: 11px; }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ember); border-color: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger:hover { background: var(--bad); border-color: var(--bad); color: var(--paper); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }

.composer textarea, .mini-form textarea { width: 100%; min-height: 66px; resize: vertical; background: var(--card-2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-family: var(--body); font-size: 13.5px; }
.composer .row { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.slider { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.slider input { accent-color: var(--ember); width: 88px; }
.slider output { font-family: var(--mono); width: 40px; text-align: right; color: var(--ink); }

.post { border: 1px solid var(--line); border-radius: 3px; padding: 13px 15px; margin-top: 12px; background: var(--card); transition: border-color 0.15s, box-shadow 0.15s; }
.post:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.post .head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.rank-chip { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 2px; padding: 1px 7px; }
.post .head .kindtag { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-left: auto; }
.post .body { font-size: 14.5px; line-height: 1.55; margin: 8px 0; }
.tagrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 6px; }
.tagchip { font-size: 11.5px; color: var(--moss); background: var(--moss-soft); border-radius: 2px; padding: 2px 9px; }
.post .mech { font-family: var(--mono); font-size: 10.8px; color: var(--muted); overflow-wrap: anywhere; }
/* ── installed on a phone ────────────────────────────────────────────────
   In standalone mode there is no Safari chrome, so the app owns the whole
   screen including the strip under the notch and the home-indicator bar.
   Without these insets the top bar sits under the clock and the bottom nav
   under the swipe bar. 100vh is also wrong on iOS while the URL bar animates;
   -webkit-fill-available is the value that actually matches the window. */
body[data-standalone='1'] .shell { padding-top: env(safe-area-inset-top, 0px); }
body[data-standalone='1'] .topbar { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
body[data-standalone='1'] .shell {
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
}
@supports (-webkit-touch-callout: none) {
  body[data-standalone='1'] { min-height: -webkit-fill-available; }
}
/* Safari has no install prompt, so the only way in is Share → Add to Home
   Screen. Saying so is the whole feature. */
.a2hs { position: fixed; left: 10px; right: 10px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 500;
  background: #211d1a; color: #efe9df; border: 1px solid rgba(255,255,255,0.16); border-radius: 12px;
  padding: 12px 14px; box-shadow: 0 10px 34px rgba(0,0,0,0.5); font-size: 13.5px; line-height: 1.45; }
.a2hs b { display: block; margin-bottom: 3px; }
/* A paid placement must be unmistakable at a glance, and must not borrow the
   visual language of a ranked post — no rank chip, no relevance bar, and a
   left edge in a colour nothing else in the feed uses. */
.ad-card { border-style: dashed; border-color: var(--muted, #4a443f); position: relative; }
.ad-card::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px;
  border-radius: 12px 0 0 12px; background: #8a7a4a; }
/* A vouch can lower the standing of the person you back. Saying so needs to
   look like information, not like an error — hence a tinted panel rather than
   a red one, and no icon that reads as "something went wrong". */
.vouch-effect { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin: 8px 0; }
.vouch-effect.warn { border-color: #8a7a4a; background: rgba(138,122,74,.10); }
.vouch-effect.good { border-color: #4a7a55; background: rgba(74,122,85,.10); }
.vouch-effect p { margin: 5px 0 0; }
.a2hs.refusal b { display: block; margin-bottom: 2px; }
/* Label/value pairs. The class was used on every economy panel and had no
   rule at all, so on a narrow screen the text ran together: "minted so
   far275000.00hard cap". A two-column grid with the value right-aligned is
   what it always looked like it was meant to be. */
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
  align-items: baseline; margin: 8px 0; }
.kv > span { color: var(--dim, #a29a92); font-size: 13px; }
.kv > b { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 420px) {
  /* Long values wrap under their label rather than squeezing it to nothing. */
  .kv { grid-template-columns: 1fr; gap: 1px 0; }
  .kv > span { margin-top: 6px; }
  .kv > b { text-align: left; }
}

/* The mint attribution table: several numbers per row, so it scrolls
   sideways inside its own box rather than widening the page. */
.mint-epoch { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.mint-table { width: 100%; margin-top: 8px; font-size: 12px; }
.mint-epoch { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.lnk { background: none; border: 0; padding: 0; color: var(--accent, #d8b26a);
  font: inherit; cursor: pointer; text-decoration: underline; }
.tx { display: flex; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
.tx:last-child { border-bottom: 0; }
.tx-who { flex: 0 0 auto; min-width: 74px; color: var(--dim, #a29a92); }

/* ── Feed lanes ────────────────────────────────────────────────────────────
   The switcher is a horizontal strip that scrolls rather than wrapping, so it
   keeps its shape on a narrow phone instead of growing a second row and
   pushing the feed down. Each button is a real touch target. */
.lanes { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  -webkit-overflow-scrolling: touch; padding: 2px 0 8px; }
.lanes::-webkit-scrollbar { display: none; }
.lane { flex: 0 0 auto; min-width: 104px; min-height: 46px; text-align: left;
  background: var(--card-2); border: 1px solid var(--line); border-radius: 2px;
  padding: 7px 12px; color: var(--ink); cursor: pointer; font: inherit; }
.lane b { display: block; font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.lane .smallnote { font-size: 10px; }
.lane.on { border-color: var(--ember); background: var(--card); box-shadow: inset 0 2px 0 var(--ember); }

@media (max-width: 560px) {
  .lane { min-width: 92px; }
}
.ad-tag { font-size: 10px; letter-spacing: .12em; padding: 1px 6px; border-radius: 4px;
  background: #8a7a4a; color: #17140f; font-weight: 700; }
.a2hs .row { display: flex; gap: 8px; margin-top: 9px; }
.a2hs button { border: 1px solid rgba(255,255,255,0.22); background: transparent; color: #efe9df;
  border-radius: 8px; padding: 6px 13px; font: inherit; font-size: 13px; cursor: pointer; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #d63b2f; animation: livepulse 1.4s infinite; vertical-align: middle; }
@keyframes livepulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }
.stream-video { display: block; width: 100%; max-height: 60vh; background: #000; border-radius: 10px; margin: 8px 0; }
.view-chip { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: 6px; white-space: nowrap; cursor: help; }
/* ── The term layer ───────────────────────────────────────────────────────
   A word on screen that can say what it means. The dotted rule is the ONLY
   signal: the token keeps its own size, weight and family, because these sit
   inside ledger rows and gate chips whose columns would jump every time a
   word became explainable. */
.term { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;

      // First: an act signed by an identity that is not the one standing
      // here is not sendable — and must not recurse: withUnlock keys on
      // WHO, this gate keys on the act's author, and when the two disagree
      // the unlock returns immediately into this same line, forever.
      if (actor !== who) {
        toast('That act is signed by another of this device’s identities. Switch to it to send — the act keeps waiting meanwhile.');
        done(); render(); return;
      }
      // Second: hand the write slot back BEFORE the dialog. A cancelled
      // unlock used to strand pushBusy forever — every later act toasting
      // "still recording the last one" at a composer that never would.
      done();
      retry.owned = false;
      withUnlock(function () { pushAct(act, onOk, retry); });
      return;
    }
    if (REMOTE && actor && act.t !== 'register' && lastPinHash[actor]) act.auth = pins[actor] || '';
    if (!REMOTE) {
      delete act.auth;
      world.acts.push(act); save();
      if (onOk) onOk();
      done(); render(); return;
    }
    if (offline) { toast('Still reconnecting — hold on, nothing can be recorded right now.'); done(); return; }
    act.since = world.acts.length;
    // Same fence as pollRemote: if an adoption replaced the world while this
    // write was in flight, its reply describes a record this session no
    // longer holds. Merging it would corrupt the adopted log — and silently
    // resending would risk a double post, so the person decides.
    var gen = netGen;
    fetch(API + '/api/act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(act) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
      .then(function (x) {
        if (gen !== netGen) {
          done(); render();
          toast('The record moved to another host while this was being sent. Check the feed before sending again, so it is not recorded twice.');
          return;
        }
        setOnline(true);
        if (!x.ok) {
          // The pen can move: the writer is elected now, and a host that was
          // the primary this morning may answer as a mirror this afternoon.
          // A demoted host names the current writer in its refusal — follow
          // it, once, and the act lands without anyone reloading anything.
          //
          // Two things this must NOT do, both found in review. It must not
          // post the act (whose auth field holds the user's plaintext PIN)
          // to any address a host cares to name — only to one the published
          // host.json vouches for. And it must not resend against the old
          // host's act count: the new writer's log may be a rebase of this
          // one, where `since` and every content id mean something else. So
          // the app re-reads the record from the new host first, exactly as
          // if it had just opened there.
          if (x.status === 503 && x.d && x.d.code === 'MIRROR_READONLY' && x.d.mirrorOf && !retry.followed) {
            retry.followed = true;
            var target = String(x.d.mirrorOf).replace(/\/+$/, '');
            var follow = function () {
              API = target;
              netGen++;
              toast('This host handed the pen to another — catching up there.');
              fetch(API + '/api/acts', { cache: 'no-store' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (d) {
                  if (!d || !Array.isArray(d.acts)) { toast('The new host did not answer — nothing was recorded.'); done(); render(); return; }
                  onMirror = !!d.mirror;
                  world.acts = d.acts;
                  save();
                  loadIceConfig();
                  pushAct(act, onOk, retry);
                })
                .catch(function () { setOnline(false); done(); toast('The new host did not answer — nothing was recorded.'); });
            };
            if (mayFollow(target)) { follow(); return; }
            // The list this session holds may simply be stale: the liveness
            // job repoints the published host.json while sessions sit open.
            // Re-read it once before refusing — if it vouches for the named
            // host NOW, following is exactly as safe as it was at boot.
            resolveHost().then(function () {
              if (mayFollow(target)) { follow(); return; }
              toast('This host says another one holds the record, but that address is not in the published list — nothing was sent there.');
              done(); render();
            }).catch(function () {
              toast('This host says another one holds the record, but that address is not in the published list — nothing was sent there.');
              done(); render();
            });
            return;
          }
          // A freshly-restarted federated host checks for a longer record
          // before its first act. That takes seconds, not minutes — but the
          // wait must not let the same act be sent twice, so the composer
          // stays locked until this attempt resolves (see pushBusy).
          if (x.status === 503 && x.d && x.d.code === 'ELECTION_PENDING' && !retry.waited) {
            retry.waited = true;
            toast('The host is checking the federation before recording — retrying in a moment.');
            setTimeout(function () { pushAct(act, onOk, retry); }, 4000);
            return;
          }
          // 401 means the PIN we hold is stale or wrong. Drop it and ask again,
          // ONCE — resending the same bad PIN would walk the handle into the
          // host's PIN-attempt lockout, and retrying forever would be worse
          // than the original failure. Its own budget: a 401 after following
          // the pen to a new writer is exactly when the unlock is needed, and
          // one shared flag spent them all.
          if (x.status === 401 && actor && !retry.pin) {
            retry.pin = true;
            delete pins[actor]; save();
            done();
            retry.owned = false;
            withUnlock(function () { pushAct(act, onOk, retry); });
            return;
          }
          explainRefusal(x.d); done(); render(); return;
        }
        mergeTail(x.d); save();
        if (onOk) onOk();
        done(); render();
      })
      .catch(function () {
        if (gen !== netGen) {
          // The failure belongs to the world this session already left —
          // don't let it mark the adopted one offline.
          done(); render();
          toast('The record moved to another host while this was being sent. Check the feed before sending again, so it is not recorded twice.');
          return;
        }
        setOnline(false); done(); toast('Connection hiccup — nothing was recorded, try again.');
      });
  }

  function pollLive() {
    if (!REMOTE) return;
    fetch(API + '/api/live', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return;
        var before = liveList.map(function (e) { return e.author; }).join(',');
        // Entries without `relay` come from a browser still running the
        // peer-to-peer build. Showing them would offer a Join button that
        // cannot work, so they are left out rather than explained away.
        liveList = (d.live || []).filter(function (e) { return e.relay; });
        var after = liveList.map(function (e) { return e.author; }).join(',');
        // Only re-render when the set actually changed, so a viewer count tick
        // does not tear down an open composer every eight seconds.
        // A repaint here wipes whatever is being typed. The composer draft
        // survives it now (see `draft`), but an open dialog or a form the user
        // is standing in should still not be torn down under them — the same
        // guard pollRemote has carried for a while.
        if (before !== after && safeToRepaint()) render();
      })
      .catch(function () {});
  }

  function pollRemote() {
    var ae = document.activeElement;
    // Never while a credential is being typed, offline or not: the reconnect
    // render would wipe the dialog out from under the user mid-PIN. Recovering
    // the connection can wait the five seconds until the next tick.
    if (document.querySelector('.pin-dialog')) return;
    if (!offline && !safeToRepaint()) return;
    // Captured at dispatch, honoured at response. `since` because the world
    // may have GROWN while the request travelled (a push landing mid-poll
    // would double the tail); `gen` because the world may have been REPLACED —
    // a reply from the host this session already left must be dropped, not
    // merged into the record adopted from its successor.
    var gen = netGen, since = world.acts.length;
    fetch(API + '/api/acts?since=' + since, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) {
        if (gen !== netGen) return;
        var wasOffline = offline;
        setOnline(true);
        if (mergeTail({ acts: d.acts, since: since }) || wasOffline) render();
        // The drain's second chance: the adoption-time attempt is a single
        // shot that silently loses to pushBusy or a lingering offline flag.
        // Untried entries only — drainOutbox never auto-retries a marked one.
        if (outbox.length && !pushBusy) drainOutbox(false);
      })
      .catch(function () { if (gen !== netGen) return; setOnline(false); maybeFollowMove(); });
  }

  /**
   * Where the shared network lives.
   *
   * Served by the host itself, that is this origin and API stays ''. Served
   * from a static home — GitHub Pages — the host is a Cloudflare quick tunnel
   * whose domain changes on every restart, so the deployment ships a host.json
   * naming the current one. ?host= overrides both, which is also how you point
   * the app at your own host.
   *
   * If nothing answers, the app is not broken: it falls back to the private
   * per-browser sandbox, which is a complete network with no server at all.
   */
  function resolveHost() {
    var override = null;
    try { override = new URLSearchParams(location.search).get('host'); } catch (e) {}
    if (override) return Promise.resolve(override.replace(/\/+$/, ''));
    if (location.protocol === 'file:') return Promise.resolve('');
    return fetch('host.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return '';
        // Ordered list, primary first. The fallback is a read-only mirror of
        // the primary, so it only ever answers for people the primary has
        // already failed — probing in order means the network never splits
        // across two hosts that are both up.
        var list = (Array.isArray(d.urls) && d.urls.length ? d.urls : [d.url])
          .filter(Boolean).map(function (u) { return String(u).replace(/\/+$/, ''); });
        // The published list IS the trust boundary. The writer is elected
        // now, so a host can hand this app to another one mid-session — and
        // the act it re-sends carries the user's PIN. Following an arbitrary
        // address named by whoever answered would post that credential to a
        // stranger, so only addresses on this list are ever followed.
        KNOWN_HOSTS = list.slice();
        var probe = function (i) {
          if (i >= list.length) return Promise.resolve('');
          var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
          var t = ctrl && setTimeout(function () { ctrl.abort(); }, 5000);
          return fetch(list[i] + '/api/acts?since=999999', ctrl ? { cache: 'no-store', signal: ctrl.signal } : { cache: 'no-store' })
            .then(function (r) {
              if (t) clearTimeout(t);
              return r.ok ? list[i] : probe(i + 1);
            })
            .catch(function () { if (t) clearTimeout(t); return probe(i + 1); });
        };
        return probe(0);
      })
      .catch(function () { return ''; });
  }

  // ── Installed-app behaviour ───────────────────────────────────────────────
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS lies
  var standalone = !!(window.navigator.standalone
    || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));

  function markStandalone() {
    document.body.setAttribute('data-standalone', standalone ? '1' : '0');
  }

  /**
   * In standalone mode there is no back button. A normal link would navigate
   * the whole app away with no way home, stranding the user in a chromeless
   * window — so anything leaving this origin opens outside instead.
   */
  function guardExternalLinks() {
    if (!standalone) return;
    document.addEventListener('click', function (ev) {
      var a = ev.target && ev.target.closest && ev.target.closest('a[href]');
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (!/^https?:/i.test(href)) return;
      if (new URL(href, location.href).origin === location.origin) return;
      ev.preventDefault();
      window.open(href, '_blank', 'noopener');
    }, true);
  }

  var A2HS_KEY = 'peer-a2hs-dismissed-v1';

  // Chromium fires beforeinstallprompt when the app qualifies for install; the
  // browser then hides its own hint behind a menu nobody opens. Capturing the
  // event lets the app show a real Install button instead. The listener must
  // be registered before the event fires — it often fires within seconds of
  // load — which is why this sits at top level rather than inside boot().
  var installPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installPrompt = e;
    offerInstall();
  });
  window.addEventListener('appinstalled', function () {
    installPrompt = null;
    var c = document.querySelector('.a2hs');
    if (c) c.remove();
    toast('Installed. Ender Net now opens full-screen from your home screen.');
  });

  /**
   * One card, three doors, because no two browsers install the same way:
   * Chromium exposes a prompt() the button can call; iOS Safari has no event
   * and no button, only the Share sheet; Firefox on Android installs from its
   * own menu and fires nothing. Firefox on desktop cannot install a PWA at
   * all, so it gets silence instead of instructions that go nowhere.
   * Shown once, and only when not already installed.
   */
  function offerInstall() {
    if (standalone) return;
    if (document.querySelector('.a2hs')) return;
    try { if (localStorage.getItem(A2HS_KEY)) return; } catch (e) { return; }
    var ua = navigator.userAgent;
    var kind = null;
    if (installPrompt) kind = 'prompt';                                   // Chromium, any platform
    else if (isIOS && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua)) kind = 'ios';
    else if (/Android/.test(ua) && /Firefox/.test(ua)) kind = 'fxandroid';
    if (!kind) return;
    var show = function () {
      if (standalone || document.querySelector('.a2hs')) return;
      var body = kind === 'ios'
        ? 'Tap the Share button below, then “Add to Home Screen”. It opens full-screen, keeps you signed in, and still works when the shared host is offline — you get your own private copy of the network instead.'
        : kind === 'fxandroid'
          ? 'Open the ⋮ menu and choose “Add to Home screen”. It opens full-screen, keeps you signed in, and still works offline with your own private copy of the network.'
          : 'It opens full-screen, keeps you signed in, and still works when the shared host is offline — you get your own private copy of the network instead.';
      var row = h('div', { class: 'row' });
      if (kind === 'prompt') {
        row.appendChild(h('button', { text: 'Install', onclick: function () {
          var p = installPrompt;
          if (!p) { card.remove(); return; }
          installPrompt = null;
          p.prompt();
          p.userChoice.then(function (choice) {
            if (choice && choice.outcome === 'accepted') {
              try { localStorage.setItem(A2HS_KEY, '1'); } catch (e) {}
            }
            card.remove();
          }).catch(function () { card.remove(); });
        } }));
      }
      row.appendChild(h('button', { text: kind === 'prompt' ? 'Not now' : 'Got it', onclick: function () {
        try { localStorage.setItem(A2HS_KEY, '1'); } catch (e) {}
        card.remove();
      } }));
      var card = h('div', { class: 'a2hs' },
        h('b', { text: 'Install Ender Net on this ' + (/Android|iP(hone|od)/.test(ua) ? 'phone' : 'device') }),
        h('div', { text: body }),
        row);
      document.body.appendChild(card);
    };
    // The Chromium path shows immediately — the event itself is the signal
    // that the moment is right. The instruction-only paths wait a little so
    // the first thing a new visitor reads is the app, not a banner.
    if (kind === 'prompt') show(); else setTimeout(show, 4000);
  }

  /**
   * Load the published snapshot of the log, and verify it against its own
   * manifest before trusting it.
   *
   * The manifest carries the act count and a hash of the file. A snapshot that
   * does not match its manifest is refused rather than shown: a stale or
   * truncated archive that looks live is worse than no archive, because
   * everything computed from it — standings, feeds, balances — would be wrong
   * in ways nobody could see.
   */
  function loadArchive() {
    return fetch('archive/manifest.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (man) {
        if (!man || !man.acts) return null;
        return fetch('archive/acts.jsonl', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : null; })
          .then(function (text) { return text ? { man: man, text: text } : null; });
      })
      .then(function (got) {
        if (!got) return false;
        var lines = got.text.split('\n').filter(function (l) { return l.trim(); });
        if (lines.length !== got.man.acts) {
          toast('The published archive does not match its manifest (' + lines.length + ' acts, expected ' + got.man.acts + '), so it was not loaded.');
          return false;
        }
        var acts = [];
        for (var i = 0; i < lines.length; i++) {
          try { acts.push(JSON.parse(lines[i])); } catch (e) { return false; }
        }
        world = { acts: [{ t: 'seedWorld' }].concat(acts) };
        archiveInfo = { at: got.man.at, acts: got.man.acts, host: got.man.host || null, sha256: got.man.sha256 };
        // The snapshot ships the blobs beside the log whenever it was published
        // with -ArchiveMedia, and the manifest has always said so. Nothing read
        // it: every media element resolved to /api/media/<hash> on static
        // hosting, which is a 404 by construction — 13.9 MB published and never
        // once displayed. The flag is not taken on trust; a blob that is not
        // there still fails the same visible way it always did.
        ARCHIVE_MEDIA = got.man.media ? 'archive/media/' : '';
        REMOTE = false;                 // read-only: there is nobody to write to
        render();
        return true;
      })
      .catch(function () { return false; });
  }

  /**
   * Acts waiting on this device for the network to wake. Drained through the
   * ordinary pushAct — same PIN unlock, same refusal explanations — one at a
   * time, stopping at the first act the host refuses so the refusal is read
   * rather than steamrolled. A stopped drain resumes from the banner button.
   */
  function drainOutbox(manual) {
    if (!REMOTE || offline || !outbox.length || pushBusy) return;
    // At-most-once AUTOMATICALLY: an entry is marked before its first send,
    // and an entry whose send ended anywhere but success — refused, lost
    // connection, the record moving mid-flight — is never auto-retried,
    // because the host may have recorded it even though no reply said so.
    // Resending that without a human is how a post appears twice, charged
    // twice, forever. The Send-now button IS the human: it clears the marks.
    if (manual) { outbox.forEach(function (e) { delete e.tried; }); saveOutbox(); }
    var entry = null;
    for (var i = 0; i < outbox.length; i++) if (!outbox[i].tried) { entry = outbox[i]; break; }
    if (!entry) return; // everything left needs a person; the banner says so
    entry.tried = 1; saveOutbox();
    var act = JSON.parse(JSON.stringify(entry.act));
    pushAct(act, function () {
      var at = outbox.indexOf(entry);
      if (at >= 0) outbox.splice(at, 1);
      saveOutbox();
      toast(outbox.length ? 'Recorded. ' + outbox.length + ' more in the outbox…' : 'Outbox empty — everything you wrote while the network slept is on the record.');
      if (outbox.length) setTimeout(function () { drainOutbox(false); }, 500);
      render();
    });
  }

  /** Said on screen while the outbox holds anything, live or dark. */
  function outboxBanner() {
    if (!outbox.length) return null;
    var held = 0;
    for (var i = 0; i < outbox.length; i++) if (outbox[i].tried) held++;
    var box = h('div', { class: 'card', style: 'margin-bottom:14px; border-style:dashed' },
      h('p', { class: 'eyebrow', text: 'outbox — ' + outbox.length + ' act(s) waiting on this device' }),
      h('p', { class: 'smallnote', text: !REMOTE
        ? 'No host is answering yet. These were written into the dark window and stay on this device — the PIN is never stored with them — until the network wakes; then they are recorded automatically.'
        : held
          ? held + ' of these stopped on a refusal or an unclear send and will not retry by themselves — check the feed for doubles first, then Send now retries everything.'
          : 'The network is back. These send through the normal door — a PIN-secured handle is asked to unlock first, and anything the host refuses stays here with the reason on screen.' }));
    // What is actually waiting, not just how much: an act nobody can read is
    // an act nobody meant, and the drain must never sign a mystery.
    outbox.slice(0, 6).forEach(function (e) {
      var line = h('div', { class: 'row', style: 'margin-top:4px; align-items:baseline; gap:6px' },
        h('span', { class: 'smallnote mono', text: e.act.t + (e.tried ? ' (held)' : '') }),
        h('span', { class: 'smallnote', text: String(e.act.text || '').slice(0, 64) || '(no text)' }),
        h('button', { text: '×', title: 'discard this one', onclick: function () {
          var at = outbox.indexOf(e);
          if (at >= 0) outbox.splice(at, 1);
          saveOutbox(); render();
        } }));
      box.appendChild(line);
    });
    if (outbox.length > 6) box.appendChild(h('p', { class: 'smallnote', text: '…and ' + (outbox.length - 6) + ' more' }));
    var row = h('div', { class: 'row', style: 'margin-top:6px' });
    if (REMOTE && !offline) row.appendChild(h('button', { text: 'Send now', onclick: function () { drainOutbox(true); } }));
    row.appendChild(h('button', { text: 'Discard all', onclick: function () {
      if (window.confirm && !window.confirm('Throw away ' + outbox.length + ' unsent act(s)? They exist nowhere else.')) return;
      outbox = []; saveOutbox(); render();
    } }));
    box.appendChild(row);
    return box;
  }

  /** Said on screen whenever what you are reading is a snapshot, not a network. */
  function archiveBanner() {
    if (!archiveInfo) return null;
    var age = archiveInfo.at ? Math.round((Date.now() - archiveInfo.at) / 3600000) : null;
    return h('div', { class: 'card', style: 'margin-bottom:14px; border-style:dashed' },
      h('p', { class: 'eyebrow', text: 'reading a published archive — no host is answering' }),
      h('p', { text: 'This is the whole network as it stood '
        + (age === null ? 'when it was last published' : age < 1 ? 'less than an hour ago' : age + ' hours ago')
        + ' — ' + archiveInfo.acts + ' acts, read from a file on this page\u2019s own hosting. Everything here replays and verifies exactly as it would live.' }),
      h('p', { class: 'smallnote', text: 'You cannot post, react or call: those need a host, and none answered. Nothing you do here is lost, because nothing here is recorded. When a host comes back the app reconnects by itself.' }),
      h('p', { class: 'smallnote mono', text: 'sha256 ' + String(archiveInfo.sha256 || '').slice(0, 32) + '\u2026' }));
  }

  // The live timers start exactly once no matter which door was used to go
  // live — at boot, or minutes later when a fallen-back session reconnects.
  // A second adoption doubling every poll would be a slow leak, not a feature.
  var liveTimersOn = false;
  function startLiveTimers() {
    if (liveTimersOn) return;
    liveTimersOn = true;
    pollLive();
    setInterval(pollLive, 8000);
    setInterval(reportViews, 4000);
    pollAds();
    setInterval(pollAds, 60000);
    window.addEventListener('scroll', function () { reportViews(); }, { passive: true });
    setInterval(pollRemote, 5000);
    setInterval(watchWriter, 60000); // only acts while parked on a read-only mirror
    setInterval(signalTick, 1200); // call signaling: ~5s idle, ~1.2s in-call
    // Background tabs get throttled — poll the moment the tab comes back,
    // so an incoming call shows immediately instead of one interval late.
    document.addEventListener('visibilitychange', function () { if (!document.hidden) signalTick(true); });
    window.addEventListener('focus', function () { signalTick(true); });
  }

  /**
   * Go live on a host. The record is adopted whole, never merged: what was on
   * screen before — a published archive, or the private sandbox — is not a
   * prefix of the host's log, and `since` or a content id computed against it
   * would mean something else there. The sandbox copy survives the swap
   * untouched, because save() only writes the world to localStorage while
   * !REMOTE.
   */
  function adoptLive(base, d) {
    // A host that answers 200 without an act log is not a host worth
    // adopting — and half-adopting it (flags flipped, world broken) would
    // leave the page inert, every loop convinced someone else was in charge.
    // Refuse whole, adopt whole.
    if (!d || !Array.isArray(d.acts)) return false;
    netGen++;
    API = base;
    REMOTE = true;
    archiveInfo = null;
    ARCHIVE_MEDIA = '';
    onMirror = !!d.mirror;
    world = { acts: d.acts };
    setOnline(true);
    loadIceConfig();
    // Timers before render, deliberately: render can throw on a surprise, and
    // with the polls already running the next merge repaints and heals. The
    // other order strands REMOTE=true with nothing left alive to retry.
    startLiveTimers();
    render();
    // Anything written into the dark window goes out now, through the same
    // door as everything else. A moment's delay so the adoption render (and
    // any PIN unlock it triggers) has settled ground to stand on.
    if (outbox.length) setTimeout(drainOutbox, 1200);
    return true;

  // "When a host comes back the app reconnects by itself" — the archive

  /**

  /**

   * an address written into it would be public for good, and hashing would not
   * save it, because addresses are guessable in a way 128 random bits are not.

  function setPinFlow(st, isChange) {

  // ── References ──

  /**
   * Recursive comment thread. A reply is an ordinary Review act targeting the
   * COMMENT node, so replies nest by the same ReviewT edge that made the
   * comment — no new act kind, and the thread depth is graph depth.
   */
  // How many reactions a comment (or any node) carries, and their net stance.
  // A comment is a node like any other, so an Opinion act can target it — the
  // data path testers confirmed works; this reads it back.
  /**
   * Hop distance from the viewer, memoised per replay. Requested by cam:
   * "note the min hop-distance everything 1,2,3,4 or more than 4, so I can
   * see what comments are linked, and what are too far away". The feed reaches
   * four hops, so anything past that is genuinely out of range rather than
   * merely weak — a distinction "no BFS path from you yet" could not make.
   */
  var hopCache = { st: null, who: null, map: null };
  function hopsFrom(st, nodeId) {
    if (hopCache.st !== st || hopCache.who !== who) {
      hopCache = { st: st, who: who, map: who ? E.hopDistance(st.g, who) : new Map() };
    }
    var d = hopCache.map.get(nodeId);
    return d === undefined ? null : d;
  }
  // ── Views: counted by the host, never by the protocol ─────────────────────
  // Deliberately not an act. An act costs θ, enters the log and moves standing;
  // charging people to read, and letting reading move influence, would turn this
  // into the attention market the whole design refuses. So views are host-side
  // telemetry: reported for curiosity, never scored, and labelled as such.
  var viewCounts = {};
  var viewReported = {};
  function reportViews() {
    if (!REMOTE) return;
    var fresh = [];
    document.querySelectorAll('[data-cid]').forEach(function (el) {
      var cid = el.getAttribute('data-cid');
      if (viewReported[cid]) return;
      var r = el.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) { viewReported[cid] = 1; fresh.push(cid); }
    });
    if (!fresh.length) return;
    fetch(API + '/api/view', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: fresh }),
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.views) return;
        viewCounts = d.views;
        // Patch the chips in place. A full render here would tear down whatever
        // the reader has open every few seconds, and the counts are the only
        // thing that changed.
        paintViewChips();
      })
      .catch(function () {});
  }

  function paintViewChips() {
    document.querySelectorAll('[data-cid]').forEach(function (el) {
      var cid = el.getAttribute('data-cid');
      var n = viewCounts[cid];
      if (!n) return;
      var label = n + (n === 1 ? ' view' : ' views');
      var chip = el.querySelector('.view-chip');
      if (chip) { chip.textContent = label; return; }
      var head = el.querySelector('.head');
      if (head) head.appendChild(viewChip(cid));
    });
  }
  function viewChip(cid) {
    var n = viewCounts[cid];
    if (!n) return null;
    return h('span', {
      class: 'view-chip',
      title: 'Seen ' + n + ' time' + (n === 1 ? '' : 's') + '. Host-side telemetry only — views never enter the log, the graph, or any score. This network measures commitment, not attention.',
      text: n + (n === 1 ? ' view' : ' views'),
    });
  }

  function hopChip(st, nodeId) {
    if (!who) return null;
    var d = hopsFrom(st, nodeId);
    return h('span', {
      class: 'hop-chip' + (d === null ? ' far' : ''),
      title: d === null
        ? 'Beyond four hops — outside the depth your feed traverses. React to something closer and the graph pulls it into range.'
        : d + ' hop' + (d === 1 ? '' : 's') + ' from you through routable edges',
      text: d === null ? '>4 hops' : d + ' hop' + (d === 1 ? '' : 's'),
    });
  }

  function reactionsOn(st, nodeId) {
    var n = 0, net = 0;
    st.g.edges.forEach(function (e) {
      if (e.family === 'Opinion' && e.tgt === nodeId) { n++; net += e.pd; }
    });
    return { n: n, net: net };
  }

  function commentTree(st, comments, depth) {
    var wrap = h('div', { class: 'comments' });
    comments.forEach(function (c) {
      var rx = reactionsOn(st, c.id);
      var body = h('div', { class: 'grow' },
        h('div', { class: 'c-head' }, h('b', {}, st.handles[c.author] || '—'),
          c.meta ? ' · review (e ' + fmt(c.meta.e, 2) + ', f ' + fmt(c.meta.f, 2) + ')' : ' · review',
          rx.n ? h('span', { class: 'react-count', text: ' · ♥ ' + rx.n + (rx.net < 0 ? ' (net −)' : '') }) : null,
          ' ', hopChip(st, c.id)),
        h.apply(null, ['div', { class: 'c-body' }].concat(richText(st, c.text))));
      var row = h('div', { class: 'comment' + (depth > 0 ? ' nested' : '') },
        avatar(c.author, 'avatar s'), body);
      var openForm = null;
      // React on the comment itself — cam's ask, confirmed on the data side by
      // feedback2000. An Opinion act targeting the Comment node.
      if (c.author !== who) {
        body.appendChild(h('button', {
          class: 'btn small ghost',
          text: '♥ React',
          onclick: function () {
            tryAct(who, { t: 'opinion', author: who, target: c.id, p: 0.8, r: 0.8 },
              'Reacted to the comment — an Opinion act on the Comment node, so it weighs like any reaction and wires you to this branch.');
          },
        }));
      }
      body.appendChild(h('button', {
        class: 'btn small ghost reply-btn',
        text: 'Reply',
        onclick: function () {
          if (openForm) { openForm.remove(); openForm = null; return; }
          var txt = h('textarea', { placeholder: 'reply to ' + (st.handles[c.author] || 'this comment') });
          // A reply carries the stance sliders too — cam noted the comment
          // form gave no params. e = enthusiasm, f = effort.
          var e2 = slider('enthusiasm', 0.7), f2 = slider('effort', 0.8);
          var body2 = { e: e2, f: f2, rows: [e2.row, f2.row] };
          openForm = h.apply(null, ['div', { class: 'mini-form' }, txt]
            .concat(body2.rows)
            .concat([h('button', { class: 'btn small primary', text: 'Reply · −θ', onclick: function () {
              if (!txt.value.trim()) { toast('Write your reply first.'); return; }
              tryAct(who, { t: 'review', author: who, target: c.id, e: body2 ? body2.e.value() : 0.7, f: body2 ? body2.f.value() : 0.8, text: txt.value.trim() },
                'Reply appended — a Review act on the comment itself, so it threads underneath.');
            } })]));
          body.appendChild(openForm);
        },
      }));
      wrap.appendChild(row);
      // replies to this comment, capped so a pathological chain can't blow up the DOM

      }

  }

  // ── Jump-to-content: any node id resolves to the post that shows it ──
  function parentOfComment(st, cid) {
    var e = st.g.edges.find(function (x) { return x.family === 'ReviewT' && x.tgt === cid; });
    return e ? e.src : null;
  }
  /** Walk Comment → its target until a displayable post (or nothing) is reached. */
  /**
   * The post to show in order to reveal `nodeId`.
   *
   * Deliberately forgiving, because two things routinely break the naive walk.
   * A comment's post may have had its payload removed — the comment survives
   * that by design, so it must still be reachable, shown under a [deleted]
   * parent. And a comment can point at a counter value that never became a
   * node at all (quote and mention legs consume numbers without minting), in
   * which case the comment is its own destination rather than a dead link.
   */
  function resolvePost(st, nodeId) {
    var cur = nodeId, seen = {}, lastComment = null;
    while (cur && !seen[cur]) {
      seen[cur] = 1;
      var n = st.g.nodes.get(cur);
      if (!n) break;                       // dangling target — fall back below
      if (n.kind === 'Comment') {
        lastComment = cur;
        cur = parentOfComment(st, cur);
        continue;
      }
      return cur;                          // a post, redacted or not
    }
    // Nothing above it survives: show the comment itself if it still has text.
    if (lastComment && st.payloads[lastComment] !== undefined) return lastComment;
    return null;
  }
  /**
   * Render peer-written text with its content references made clickable.
   *
   * People cite each other by id — "c193, ah so annoying to need to go and look
   * these refs up" — and the network already knows exactly what c193 is. Text
   * nodes and buttons only, never innerHTML: this is other people's writing.
   */
  function refButton(st, cid, label) {
    return h('button', { class: 'ref-link', text: label, title: 'Open ' + cid,
      onclick: function () { jumpTo(st, cid); } });
  }
  function richText(st, s) {
    var out = [], re = /\bc\d+\b/g, last = 0, m;
    s = String(s == null ? '' : s);
    while ((m = re.exec(s)) !== null) {
      if (m.index > last) out.push(s.slice(last, m.index));
      // only link what actually exists and is still readable
      if (st.payloads[m[0]] !== undefined) out.push(refButton(st, m[0], m[0]));
      else out.push(m[0]);
      last = m.index + m[0].length;
    }
    if (last < s.length) out.push(s.slice(last));
    return out.length ? out : [s];
  }

  function jumpTo(st, nodeId) {
    // A person is a destination too: reactions and vouches point at profiles.
    if (nodeId && nodeId.indexOf('prof_') === 0) {
      var pid = nodeId.slice(5);
      if (st.ledgerById[pid]) { openProfile(pid); return; }
    }
    if (nodeId && st.ledgerById[nodeId]) { openProfile(nodeId); return; }
    if (!nodeId || !resolvePost(st, nodeId)) { toast('Nothing to open here — this act moved units or closed a period.'); return; }
    focusNode = nodeId;
    tab = 'feed';
    render();
    setTimeout(function () {
      var el = document.querySelector('.focus-wrap');
      if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }, 40);
  }
  /** The pinned card: the resolved post, with the jumped-to comment highlighted. */

    if (!focusNode) return null;
    var post = resolvePost(st, focusNode);
    if (!post) { focusNode = null; return null; }
    var isComment = (st.g.nodes.get(focusNode) || {}).kind === 'Comment';
    var card = postCard(st, { node: st.g.nodes.get(post), relevance: 0, bfsWeight: 0, amplifier: 1, contentNorm: 0, jumped: true }, null, 1);
    if (isComment) {
      // mark the specific comment that was clicked
      var bodies = card.querySelectorAll('.comment');
      var want = (st.payloads[focusNode] || '').slice(0, 40);
      for (var i = 0; i < bodies.length; i++) {
        if (bodies[i].textContent.indexOf(want) >= 0) { bodies[i].classList.add('focus-hit'); break; }
      }
    }
    return h('div', { class: 'focus-wrap' },
      h('div', { class: 'focus-bar' },
        h('span', { text: isComment ? 'jumped to a comment' : 'jumped to a post' }),
        h('button', { class: 'btn small ghost', text: 'close', onclick: function () { focusNode = null; render(); } })),
      card);
  }

  /** ReferenceT edges out of a post: quoted contents + mentioned persons. */
  function refsOf(st, cid) {
    var quotes = [], mentions = [];
    st.g.edges.forEach(function (e) {
      if (e.family !== 'ReferenceT' || e.src !== cid) return;
      if (e.tgt.indexOf('prof_') === 0) mentions.push(e.tgt.slice(5));
      else quotes.push(e.tgt);
    });
    return { quotes: quotes, mentions: mentions };
  }
  /** θ-cost of an act (posts may carry a quote + mentions, each its own act). */
  /**
   * Search the network.
   *
   * Scope, decided once and written down: post and comment text, handles, and
   * tag labels. DIRECT MESSAGES ARE OUT. They are technically public — every
   * dm act's text is in /api/acts and in the published archive — but no screen
   * in this app has ever shown a conversation to somebody who was not in it,
   * and a search box is exactly what would turn an obscure JSONL file into a
   * browsable index of everyone's messages. The exclusion is this comment plus
   * the absence of st.dms below, and a test that asserts it stays absent.
   *
   * Ordered by append position, newest first — the same authority the Newest
   * ranking uses. It is a filter over the corpus, not a fourth ranking: the
   * three ranking buttons stay live while a query is running.
   */
  function searchState(st, q) {
    var out = { posts: [], comments: [], people: [], tags: [] };
    var needle = String(q || '').trim().toLowerCase();
    if (needle.length < 2) return out;
    Object.keys(st.payloads).forEach(function (cid) {
      var text = st.payloads[cid];
      if (typeof text !== 'string' || text.toLowerCase().indexOf(needle) < 0) return;
      // Sandbox seed content has payloads and no postMeta at all, so this
      // lookup is guarded rather than assumed — that is the offline mode every
      // visitor falls back to when no host answers.
      var meta = st.postMeta[cid];
      (meta && meta.comment ? out.comments : out.posts).push({ cid: cid, idx: meta ? meta.idx : 0 });
    });
    out.posts.sort(function (a, b) { return b.idx - a.idx; });
    out.comments.sort(function (a, b) { return b.idx - a.idx; });
    Object.keys(st.handles).forEach(function (id) {
      if (st.deleted && st.deleted[id]) return;
      // st.handles is the DISPLAY map, which already marks handle-skeleton
      // twins — matching on the raw name would undo that.
      if (String(st.handles[id]).toLowerCase().indexOf(needle) >= 0) out.people.push(id);
    });
    st.g.nodes.forEach(function (n) {
      if (n.kind === 'Type' && String(n.label).toLowerCase().indexOf(needle) >= 0) out.tags.push(n);
    });
    return out;
  }

  /**
   * The wall-clock stamp of an act by its position in the log.
