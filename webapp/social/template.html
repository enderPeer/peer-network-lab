      // window can be shown and checked before anybody types anything.
      Promise.all([askDoor('1'), askJSON('/api/token/onchain')]).then(function (r) {
        var d = obj(r[0].d);
        if (d && d.accepting === true) drawOpen(d, obj(r[1].d));
        else drawShut(r[0], r[1]);
      });
    }

    /**
     * No price. Which piece is missing is asked of BOTH the burn door and the
     * chain config, and both answers are printed: 'this host serves no PEER
     * door' and 'nobody has deployed a pool to price against' are different
     * failures with different people who can fix them, and one sentence
     * covering both would send the operator after the wrong one.
     */
    function drawShut(door, oc) {
      stateBox.innerHTML = '';
      stateBox.appendChild(h('p', { class: 'eyebrow', style: 'margin:0 0 6px', text: 'right now: there is no price, so this door is shut' }));
      var lines = [];
      var d = obj(door.d);
      if (!d || door.status === 0) {
        lines.push(door.status === 0
          ? 'This page could not reach the host at all, so it cannot say whether a PEER burn would be accepted — and it will not guess.'
          : 'This host serves no PEER burn door: nothing answers at ' + DOOR + '. There is nothing here that could verify a transfer or read a pool, and a page cannot open a door the host does not have.');
      } else {
        lines.push('The host’s own answer: ' + String(d.why || d.error || 'it is not accepting PEER burns, and it did not say why.'));
        if (Array.isArray(d.missing) && d.missing.length) {
          lines.push('It named what is missing: ' + d.missing.map(String).join(', ') + '. Those are the operator’s to set, not yours.');
        }
      }
      var o = obj(oc.d);
      if (!o) {
        lines.push('It also could not be asked what is deployed on the chain, so this card cannot even name which piece is missing.');
      } else if (!o.token) {
        lines.push('No PEER token is configured on this host (PEER_TOKEN_ADDR is unset), so there is no ERC-20 here to destroy.');
      } else if (!o.namedPools) {
        lines.push('The PEER token is deployed at ' + String(o.token) + ', but no pools factory is: PEER_POOLS_ADDR is unset on this host, so there is no contract holding a PEER/cbBTC pool, no official pool to name, and therefore no price to read. That is the operator’s move and not yours — chain-l2/DEPLOY.md is the runbook for it.');
      } else if (o.namedPools.error) {
        lines.push('The pools factory this host names did not read: ' + String(o.namedPools.error));
      } else if (!(o.namedPools.pools && o.namedPools.pools.length)) {
        lines.push('A pools factory is configured and it holds no pool yet, so there are no reserves anywhere to price a burn against.');
      } else {
        lines.push('Pools exist on this host, but it names no official one to price a burn against — and a page that picked one for itself would be choosing whose price counts, which is precisely what this door must never do.');
      }
      lines.forEach(function (t) { stateBox.appendChild(h('p', { class: 'smallnote', text: t })); });
      stateBox.appendChild(h('p', { class: 'smallnote', text: 'So there is no amount box here and no button: a control that cannot work is worse than none, and a price this page invented would be exactly the number nobody should trust. Nothing above is affected — the reserve you hold and every bitcoin burn ever recorded are untouched by this door being shut.' }));
      stateBox.appendChild(h('div', { class: 'mini-form persistent' },
        h('span', { class: 'smallnote', text: 'The other door needs no pool and no price, and it is open:' }),
        h('button', { class: 'btn small primary', text: 'Burn bitcoin →', onclick: function () { burnDialog(); } })));
    }

    /**
     * The door is on. That is still not the same as a usable price — a pool can
     * be too thin or a window too short to have one — so the quote's own
     * verdict decides whether an amount box is drawn at all.
     */
    function drawOpen(d, oc) {
      stateBox.innerHTML = '';
      var pool = obj(d.pool), you = obj(d.you), q = obj(d.quote);
      var sink = /^0x[0-9a-fA-F]{40}$/.test(String(d.address)) ? String(d.address) : dead;

      stateBox.appendChild(h('p', { class: 'eyebrow', style: 'margin:0 0 6px', text: 'this host prices PEER burns' }));
      if (pool && pool.poolId != null) {
        stateBox.appendChild(h('div', { class: 'kv' },
          h('span', {}, term('officialPool', 'the official pool')), h('b', { class: 'num', text: 'id ' + String(pool.poolId) }),
          h('span', { text: 'in the factory' }), h('b', { class: 'num', text: l2ShortHex(String(pool.factory || '—')) }),
          h('span', { text: 'opened by' }), h('b', { class: 'num', text: l2ShortHex(String(pool.creator || '—')) })));
        if (pool.nameNote) stateBox.appendChild(h('p', { class: 'smallnote', text: String(pool.nameNote) }));
      } else {
        stateBox.appendChild(h('p', { class: 'smallnote', text: 'This host did not say WHICH pool it prices against, and two reserve numbers with no pool behind them are not an auditable price — anyone may open a pool and give it any name. Nothing is quoted until it says.' }));
        return;
      }

      if (!q || q.available !== true) {
        stateBox.appendChild(h('p', { class: 'smallnote', style: 'color:var(--bad)', text: 'There is no usable price at this moment: ' + String((q && (q.why || q.code)) || 'the host published no quote.') }));
        stateBox.appendChild(h('p', { class: 'smallnote', text: 'The door is on and the pool exists; what is missing is a price this network will stand behind. No amount box is drawn for a quote that does not exist, and nothing here will offer to destroy PEER at a number nobody would honour.' }));
        stateBox.appendChild(h('div', { class: 'mini-form persistent' },
          h('span', { class: 'smallnote', text: 'The bitcoin door has no price to lose:' }),
          h('button', { class: 'btn small primary', text: 'Burn bitcoin →', onclick: function () { burnDialog(); } })));
        return;
      }

      // How the burn finds its owner. Said BEFORE the box, because it is the
      // one thing that decides whether destroyed PEER credits anybody at all.
      stateBox.appendChild(h('p', { class: 'smallnote' },
        h('b', { text: 'Bind the address first, then burn from it. ' }),
        'A PEER burn is credited to the handle that had bound the sending address ALREADY, when the coins were destroyed — and to exactly one handle: an address two handles have bound is credited to neither. Both halves are the protection. Binding an address costs nothing but your own PIN and nothing anywhere can check that an address is really yours, so if a binding filed afterwards could reach a burn, anyone could read the public list of uncredited burns, bind the address a stranger sent from, and take it — permanently, because a burn is claimed once. Nothing needs to stay open once the order is right: the host watches the dead address on its own tick and credits your burn whether or not this page exists.'));
      if (who && you && you.boundAddress && you.burnsFromItAreYours === false) {
        stateBox.appendChild(h('p', { class: 'smallnote', style: 'color:var(--bad)', text: 'Another handle has also bound ' + String(you.boundAddress) + ', so a burn from it would be credited to nobody — not to them and not to you. Nothing of yours can be taken through it; it simply cannot be used for this door. Bind an address only this handle has named and burn from that one instead.' }));
      } else if (who && you && you.boundAddress) {
        stateBox.appendChild(h('p', { class: 'smallnote', text: 'This handle is bound to ' + String(you.boundAddress) + ', and that binding is already older than anything you burn from here on — so burns from it are yours. It is the only address whose burns count as yours.' }));
      } else if (who) {
        stateBox.appendChild(h('p', { class: 'smallnote', style: 'color:var(--bad)', text: 'This handle has no address bound to it, so a burn made now would credit nobody — and binding afterwards would not rescue it, because a binding cannot reach coins that were already destroyed. Bind one in the card above FIRST: it is free and costs no θ.' }));
      }

      var winMs = Number(q.twapMs) || 0, obs = Number(q.observations) || 0;
      var amt = h('input', { type: 'text', value: '', placeholder: '0', style: 'width:130px', inputmode: 'decimal' });
      stateBox.appendChild(h('div', { class: 'mini-form persistent' },
        h('span', { class: 'smallnote', text: 'PEER to destroy' }), amt,
        h('span', { class: 'smallnote', text: 'the host re-quotes as you type' })));
      var work = h('div', {});
      var actions = h('div', { class: 'mini-form persistent' });
      var euroLine = h('p', { class: 'smallnote' });
      var log = h('div', { style: 'margin-top:8px' });
      stateBox.appendChild(work);
      stateBox.appendChild(actions);
      // The euro figure lives here, after the arithmetic and after the button,
      // and is never spoken in the same breath as the reserve maths. It is a
      // label: when its source is down, a label is what is lost.
      stateBox.appendChild(euroLine);
      stateBox.appendChild(log);
      // var(--bad) inline: `.bad` was never a rule in this stylesheet, so a
      // refusal styled with it renders in the same grey as everything else.
      function say(t, cls) { log.appendChild(h('div', { class: 'smallnote', style: cls === 'bad' ? 'color:var(--bad)' : (cls === 'ok' ? 'color:var(--moss)' : ''), text: t })); }

      var cur = q;            // the host's latest quote
      var ready = null;       // what may be burned right now, or null
      var timer = null;

      draw();
      amt.addEventListener('input', function () {
        var text = amtText(amt.value);
        ready = null;
        actions.innerHTML = '';
        if (timer) clearTimeout(timer);
        if (!text) { draw(); return; }
        work.innerHTML = '';
        work.appendChild(h('p', { class: 'smallnote', text: 'Asking the host what ' + text + ' PEER is worth…' }));
        // Debounced, because every keystroke is a chain read on the host's
        // side. The screen says it is asking rather than leaving a stale
        // number sitting under a changed amount.
        timer = setTimeout(function () {
          askDoor(text).then(function (r) {
            var d2 = obj(r.d);
            if (amtText(amt.value) !== text) return;      // typed on since
            if (d2 && obj(d2.quote)) { cur = d2.quote; if (obj(d2.you)) you = obj(d2.you); }
            draw();
          });
        }, 450);
      });

      function draw() {
        work.innerHTML = '';
        euroLine.textContent = '';
        ready = null;
        var rp = rawStr(cur.resPeerRaw), rb = rawStr(cur.resBtcRaw), raw = rawStr(cur.amtRaw);
        if (!rp || !rb) {
          work.appendChild(h('p', { class: 'smallnote', text: 'The host answered without readable reserves, so there is nothing to check its price against and nothing is shown. Two numbers that cannot be rechecked are worse than none.' }));
          drawActions();
          return;
        }
        // What the pool holds, and over what window — printed whatever the
        // amount is, because these are the numbers the quote is made of.
        work.appendChild(h('div', { class: 'kv' },
          h('span', { text: 'the pool holds' }), h('b', { class: 'num', text: l2Human(rp, 18) + ' PEER · ' + l2Human(rb, 0) + ' sat' }),
          h('span', {}, term('twap', 'averaged'), ' over'), h('b', { class: 'num', text: Math.round((Number(cur.twapMs) || winMs) / 60000) + ' min · ' + (Number(cur.observations) || obs) + ' readings' })));
        if (!amtText(amt.value)) {
          work.appendChild(h('p', { class: 'smallnote', text: 'Say how much PEER to destroy and the whole calculation appears here, from the host’s reading, before anything is signed.' }));
          drawActions();
          return;
        }
        if (!raw) {
          work.appendChild(h('p', { class: 'smallnote', text: 'The host did not answer with a raw amount for that figure, so there is nothing to price. Nothing is shown.' }));
          drawActions();
          return;
        }
        var mine = quoteSats(raw, rp, rb);
        var theirs = Number(cur.sats);
        work.appendChild(fbox(
          'N       = ' + raw + '  (' + l2Human(raw, 18) + ' PEER)\n' +
          'pool    = ' + rp + ' PEER raw\n' +
          '          ' + rb + ' sat\n' +
          'sats    = floor(' + raw + ' × ' + rb + ' / (' + rp + ' + ' + raw + '))\n' +
          '        = ' + mine + ' sat\n' +
          'reserve = ' + mine + ' / ' + satsPer + ' = ' + (mine === null ? '—' : mine / satsPer)));
        if (mine === null) {
          work.appendChild(h('p', { class: 'smallnote', text: 'That is more satoshis than will ever exist, so nothing is offered.' }));
          drawActions();
          return;
        }
        // The recheck. This is the whole reason the reserves are published.
        if (isFinite(theirs) && theirs !== mine) {
          work.appendChild(h('p', { class: 'smallnote', style: 'color:var(--bad)', text: 'This host quotes ' + theirs + ' sat, and its own published reserves produce ' + mine + '. A host that disagrees with itself is not evidence of anything, and an act recording that pair is one replay refuses outright. Nothing is offered here until the two agree.' }));
          drawActions();
          return;
        }
        var reserve = mine / satsPer;
        work.appendChild(h('p', { class: 'smallnote', text: 'That reserve is ' + Math.floor(reserve / THETA) + ' act' + (Math.floor(reserve / THETA) === 1 ? '' : 's') + ' at θ ' + fmt(THETA, 4) + ' each. It is the host’s reading as of a moment ago; what gets credited is what it reads when it verifies the transfer.' }));
        var refuse = [];
        try {
          if (BigInt(rb) < BigInt(minPoolSats)) refuse.push('This pool holds ' + l2Human(rb, 0) + ' sat and a burn needs at least ' + l2Human(minPoolSats, 0) + ' — below that a pool has no price, only a last trade, so a burn is refused rather than priced badly.');
        } catch (e) { /* unreadable reserves were caught above */ }
        var w2 = Number(cur.twapMs) || 0, o2 = Number(cur.observations) || 0;
        if (!(w2 >= twapMs) || !(o2 >= twapObs)) refuse.push('This price was averaged over ' + Math.round(w2 / 60000) + ' min from ' + o2 + ' reading(s), and this network requires ' + Math.round(twapMs / 60000) + ' min from ' + twapObs + '. A spot price can be bought for the length of one block.');
        var left = you && isFinite(Number(you.reserveLeftThisEpoch)) ? Number(you.reserveLeftThisEpoch) : null;
        if (who && left !== null && reserve > left) {
          // Not a refusal any more, and the difference is the whole point: a
          // burn over the ceiling used to credit NOTHING, in every epoch,
          // while the screen promised the rest next epoch. It is now credited
          // in slices. What the person still needs is the amount that lands
          // in one go, in the unit they are typing.
          var fits = maxPeerRaw(Math.round(left * satsPer), rp, rb);
          work.appendChild(h('p', { class: 'smallnote', text: 'This would be worth ' + fmt(reserve, 2) + ' reserve and you have ' + fmt(left, 2) + ' of your ' + perEpoch + ' left this epoch. Nothing is lost by burning it anyway: ' + fmt(left, 2) + ' is credited now and the rest an epoch at a time, by the host, with nothing left open on your side. To have all of it credited at once, burn ' + (fits === null ? 'less' : 'about ' + l2Human(fits, 18) + ' PEER') + ' instead.' }));
        }
        refuse.forEach(function (t) { work.appendChild(h('p', { class: 'smallnote', style: 'color:var(--bad)', text: t })); });
        if (!refuse.length) ready = { raw: raw, sats: mine, reserve: reserve };
        // The label, and only where the host quoted a rate to make it from.
        var eurPerBtc = Number(d.eurPerBtc);
        if (isFinite(eurPerBtc) && eurPerBtc > 0) {
          euroLine.textContent = 'For humans only: about €' + (mine / 1e8 * eurPerBtc).toFixed(2) + ' at the €' + eurPerBtc.toFixed(0) + '/BTC rate this host quoted' + (d.eurSource ? ' from ' + String(d.eurSource) : '') + '. It is a label. It enters none of the arithmetic above, and if that source goes down this line disappears and nothing else changes.';
        } else {
          euroLine.textContent = 'This host quotes no euro rate, so there is no euro figure here. Nothing is missing: a euro number never enters any of the arithmetic above.';
        }
        drawActions();
      }

      function drawActions() {
        actions.innerHTML = '';
        var token = oc && typeof oc.token === 'string' ? oc.token : null;
        var chainHex = oc ? l2ChainHex(Number(oc.chainId)) : null;
        function note(t) { actions.appendChild(h('span', { class: 'smallnote', text: t })); }
        if (!who) { note('Sign in to a handle first: a burn is credited to a handle, and there is none here to credit.'); return; }
        if (!you || !you.boundAddress) { note('No button until this handle has an address bound to it — PEER destroyed from an unbound address credits nobody, and no host can undo that.'); return; }
        if (!token || !chainHex) { note('This host did not say which token on which chain to send, so nothing here will build a transfer: an ERC-20 transfer aimed at a guess is money destroyed for nothing.'); return; }
        if (!window.ethereum) { note('No wallet in this browser, so nothing here can sign. The transfer is an ordinary ERC-20 send of PEER to the address above, from the bound address, in any wallet — the host credits it on its own tick.'); return; }
        if (l2Wallet && String(l2Wallet).toLowerCase() !== String(you.boundAddress).toLowerCase()) {
          note('The connected wallet is ' + l2ShortHex(l2Wallet) + ' and this handle is bound to ' + l2ShortHex(String(you.boundAddress)) + '. A burn from the connected one would not be yours, so no button is drawn: switch the wallet, or bind that address above.');
          return;
        }
        if (!ready) { note('No button until there is an amount this network would accept.'); return; }
        var go = h('button', { class: 'btn small danger', text: 'Destroy ' + l2Human(ready.raw, 18) + ' PEER →', onclick: function () {
          go.disabled = true;
          send(ready, token, chainHex).catch(function (e) { say('not sent: ' + l2Err(e), 'bad'); go.disabled = false; });
        } });
        actions.appendChild(go);
        note('Red because it cannot be undone. It transfers the PEER to the dead address; nobody receives it, and no host can give it back. The reserve credited is whatever the host verifies afterwards from its own reading of the pool — not the figure above.');
      }

      /**
       * One ERC-20 transfer, signed by the user's own wallet, and then the hash
       * handed over. The page verifies nothing and prices nothing: the host
       * reads the transfer and the pool itself, which is the only reason the
       * number it records is worth anything. Filing the hash only hurries it —
       * the watcher credits a transfer from a bound address on its own tick.
       */
      async function send(r, token, chainHex) {
        var acct = l2Wallet || await l2Connect(chainHex, l2ChainName(Number(oc.chainId)));
        if (!acct) return;                       // l2Connect already said why
        if (String(acct).toLowerCase() !== String(you.boundAddress).toLowerCase()) {
          say('That wallet is ' + acct + ', and this handle is bound to ' + you.boundAddress + '. Nothing was sent — a burn from the wrong address is destroyed PEER credited to somebody else, or to nobody.', 'bad');
          drawActions();
          return;
        }
        var chain = await l2Eth('eth_chainId');
        if (!l2OnChain(chain, chainHex)) { say('That wallet is on chain ' + chain + ' now. Nothing was sent — a transfer on the wrong chain moves some other token.', 'bad'); return; }
        // transfer(address,uint256) — the selector beside its signature, this
        // file's standing policy: no keccak library in the page.
        var data = '0xa9059cbb' + l2Addr(sink) + BigInt(r.raw).toString(16).padStart(64, '0');
        say('The wallet will ask you to confirm. Check the destination against the dead address above before approving.');
        var txid = await l2Eth('eth_sendTransaction', [{ from: acct, to: token, data: data }]);
        say('sent: ' + String(txid), 'ok');
        var link = l2ScanLink(8453, 'tx', txid, 'check it on basescan');
        if (link) log.appendChild(h('div', {}, link));
        say('The PEER is gone from here on. It is credited when the host verifies the transfer — you can close this page: the watcher does it without you.');
        withUnlock(function () {
          fetch(API + DOOR + '/claim', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: who, auth: pins[who] || '', txid: txid }) })
            .then(function (x) { return x.json().then(function (b) { return { ok: x.ok, b: b }; }); })
            .then(function (x) {
              if (!x.ok) {
                say('The host did not record it yet: ' + String((x.b && (x.b.error || x.b.why)) || 'refused') + ' — keep that hash. The burn is on the chain and stays valid, so the watcher or a later claim can still take it.', 'bad');
                return;
              }
              say('Recorded: ' + String(x.b.sats) + ' sat → ' + String(x.b.reserve) + ' reserve, at the pool the host read itself.', 'ok');
              pollRemote();
            })
            .catch(function () { say('Could not reach the host to file the hash — keep it. The burn is on the chain and the watcher credits it anyway.', 'bad'); });
        }, function () {
          say('Not filed from here: the session is locked. The burn is still on the chain and the watcher still credits it, because it is attributed by the address it came from, not by this page.', 'bad');
        });
      }
    }
  }

  function econTab(st) {
    var l0 = st.l0;
    var w = l0.bal(who);
    var op = l0.bal('op');
    var escrowTotal = l0.escrow.reduce(function (s, e) { return s + e.amount; }, 0);
    var wrap = h('div', {});

    var tok = st.tokens, myPools = st.pools;
    function round6(x) { return Math.round(x * 1e6) / 1e6; }
    function tbal(sym) { return (tok.bal[sym] && tok.bal[sym][who]) || 0; }

    // ── Sub-tabs ─────────────────────────────────────────────────────────
    // The economy screen had grown into one long scroll holding four
    // unrelated jobs: what you hold, what the pools are doing, the Layer-0
    // receipt system, and the history. Splitting them means the wallet is
    // reachable without scrolling past a ledger of raw addresses.
    var views = [['wallet', 'Wallet'], ['net', 'Network'], ['pools', 'Pools & ads'], ['chain', 'Epoch chain'], ['layer0', 'Layer 0'], ['ledger', 'Transactions']];
    var bar = h('div', { class: 'lanes' });
    views.forEach(function (v) {
      var b = h('button', { class: 'lane' + (econView === v[0] ? ' on' : '') }, h('b', { text: v[1] }));
      b.onclick = function () { econView = v[0]; saveView(); render(); };
      bar.appendChild(b);
    });
    wrap.appendChild(bar);

    if (econView === 'net') {
      // The graph is a way of looking at the economy — every edge in it is a
      // transported rate — so it sits here rather than owning a tab of its own.
      wrap.appendChild(netTab(st));
    }
    if (econView === 'wallet') {
      wrap.appendChild(walletView(st));
    }

    if (econView === 'wallet') {
      var tCard = h('div', { class: 'card', style: 'margin-top:14px' },
        h('h2', { text: 'PEER — the epoch token' }),
        h('p', { class: 'smallnote', text: 'Minted when an epoch closes: 5000/epoch in year one, decaying 0.9 per 365 epochs, capped at 18.25M (the poolsite curve). Distributed to CREATORS by the engagement their work drew — reactions 1.0, comments 1.2, dislikes 0.3, damped per fan (1/(1+0.3·(n−1))), each weigher scaled linearly by the satoshis they have proved destroyed — an account that never burned weighs nothing, and above zero there is no threshold. Value, never standing: no balance enters any score.' }));
      var bkv = h('div', { class: 'kv' });
      var symsAll = Object.keys(tok.meta);
      for (var ti = 0; ti < symsAll.length; ti++) {
        var sym0 = symsAll[ti];
        if (tbal(sym0) > 0 || sym0 === 'PEER') {
          bkv.appendChild(h('span', { text: sym0 }));
          bkv.appendChild(h('b', { class: 'num', text: round6(tbal(sym0)) + '' }));
        }
      }
      tCard.appendChild(bkv);
      tCard.appendChild(h('p', { class: 'smallnote', text: 'Supply: ' + round6(tok.supply.PEER) + ' PEER minted over ' + tok.epochN + ' epoch(s) · ' + round6(tok.carry) + ' carried to the next · your distributions ride on people engaging with what you make.' }));
      var myDist = [];
      for (var di = 0; di < tok.dist.length; di++) if (tok.dist[di].to[who]) myDist.push(tok.dist[di]);
      if (myDist.length) {
        var dl = myDist.slice(-5).map(function (d) { return 'epoch ' + d.epoch + ': +' + d.to[who]; }).join(' · ');
        tCard.appendChild(h('p', { class: 'smallnote', text: 'Your last distributions — ' + dl }));
      }
      wrap.appendChild(tCard);
      // Directly under the epoch token, because the two are only confusable
      // while they are apart.
      wrap.appendChild(l2TokenCard());
      // And under both: the epoch token is what an epoch credits, the coin on
      // Base is what a claim pays, and this is the only place the two ever
      // meet — the operator transferring the second against a list of the
      // first. It reads as nonsense anywhere else on the page.
      wrap.appendChild(l2ClaimCard(st));
      // The second door into reserve, under BOTH of them, because it needs
      // both to have been read first: it prices the coin on Base (the card
      // above) and it must not be taken for the epoch token (the card above
      // that). Last rather than between them, so the token card's sentence
      // about 'the card below this one' still names the claim card.
      wrap.appendChild(peerBurnCard(st));

    }

    if (econView === 'pools') {
      // ── pools on Base — the ones that are real ──
      // This card sits above the sandbox because it is the one that costs
      // and pays actual money: the PEER ERC-20 against cbBTC — bitcoin held
      // in Coinbase custody and issued as a token on Base. The pools below
      // it settle inside this log and nowhere else; a swap here moves value
      // that exists whether or not this page does.
      //
      // The division of labour is strict, and worth stating. The HOST only
      // reads: /api/token/onchain comes from chain-l2/onchain.mjs, which
      // contains no signing code and accepts no key. The WALLET only signs:
      // every write below is encoded by hand in this file — a 4-byte
      // selector plus 32-byte words, no ABI library — and handed to
      // window.ethereum for the user to approve or refuse. The page never
      // sees a key, so there is nothing here worth stealing.
      var ocCard = h('div', { class: 'card', style: 'margin-top:14px' },
        h('h2', { text: 'Pools \u2014 PEER / BTC on Base' }),
        h('p', { class: 'smallnote', text: 'These pools settle on the real chain: the PEER token against cbBTC \u2014 bitcoin custodied by Coinbase and issued as an ERC-20 on Base. The sandbox pools below settle only in this log; everything in this card is actual money.' }));
      var ocBody = h('div', {});
      ocCard.appendChild(ocBody);
      // Where a multi-step sequence says what it is doing and what it did.
      // Outside ocBody on purpose: ocRefresh() rebuilds ocBody, so an account
      // written inside the form would be erased by the very redraw that shows
      // the pool it opened — and a half-finished sequence's account of which
      // approvals landed is the one thing nobody should have to remember.
      var ocSeq = h('div', {});
      ocCard.appendChild(ocSeq);
      // Every transaction hash this card produces, kept where it can be
      // clicked. Deliberately NOT inside ocSeq: the create sequence clears
      // that panel when it starts, and a hash from an earlier swap is exactly
      // the thing that must survive somebody pressing another button.
      var ocTxBox = h('div', {});
      ocCard.appendChild(ocTxBox);
      wrap.appendChild(ocCard);
      // Two pools over one pair are two pools. Directly under the card whose
      // prices could otherwise be read as the market's.
      wrap.appendChild(dexCard());

      // Hardcoded 4-byte selectors, each with the signature it hashes from —
      // the same policy as chain-l2/onchain.mjs: no keccak library in the
      // page. The pool ones match PeerPools.build.json's methodIdentifiers;
      // recompute any of them with `cast sig '<signature>'` if you do not
      // want to take them on trust, which you should not.
      //
      // A selector is keccak of the name and the INPUT types, so the three
      // functions that grew a guard parameter grew new selectors with them:
      // swap, addLiquidity and removeLiquidity are NOT the four-argument ones
      // this card first shipped against. Sending an old selector to the new
      // contract does not misbehave subtly — it reaches no function at all —
      // but the signature beside each one is the only thing that says which
      // is which, so read them together.
      var OC_SEL = {
        createPool: '0xb3a2199d',      // createPool(bytes32,uint256,uint256)
        addLiquidity: '0xa360501c',    // addLiquidity(uint256,uint256,uint256,uint256,uint256)
        removeLiquidity: '0xf88bf15a', // removeLiquidity(uint256,uint256,uint256,uint256)
        swap: '0x0b719a65',            // swap(uint256,bool,uint256,uint256,uint256)
        sharesOf: '0xe78307ca',        // sharesOf(uint256,address)
        // The two READ selectors this card grew. poolInfo is how a pool the
        // host's scan never reached can still be opened here by its id — the
        // reader's own note promises exactly that, and a promise with no door
        // is worse than no promise. balanceOf is how a wallet that cannot
        // cover a trade finds out before it signs an approval for one. Both
        // are copied from the table in chain-l2/onchain.mjs, which took them
        // from the compiler's own methodIdentifiers rather than from memory.
        poolInfo: '0x1526fe27',        // poolInfo(uint256)
        balanceOf: '0x70a08231',       // balanceOf(address)
        taken: '0xd174c832',           // taken(address,bytes32)
        minLiq: '0x5731bb0a',          // MIN_LIQ()
        peer: '0x11cda415',            // peer()
        btc: '0xa28d57d8',             // btc()
        approve: '0x095ea7b3',         // approve(address,uint256)
        allowance: '0xdd62ed3e'        // allowance(address,address)
      };
      var OC_CHAIN = '0x2105'; // Base mainnet, 8453

      // One 32-byte ABI word from a BigInt (a bool is just 0n or 1n), one
      // from an address. This plus the selectors above is the whole encoder
      // this card needs.
      function ocWord(v) { return BigInt(v).toString(16).padStart(64, '0'); }
      function ocAddr(a) { return String(a).toLowerCase().replace(/^0x/, '').padStart(64, '0'); }
      // A wallet's error can be a paragraph of JSON-RPC, so it is cut — but
      // the cut is now visible. A silent slice at 140 turns a sentence into a
      // fragment that ends mid-clause, and the sentences this card composes
      // itself get read back to somebody deciding what to press.
      function ocErr(e) {
        var t = String((e && e.message) || e);
        return t.length > 140 ? t.slice(0, 139) + '…' : t;
      }
      // An address as a human can carry it in their head, or '' if the thing
      // handed over is not an address. Empty rather than a shortened piece of
      // garbage: half an address on screen would read as provenance.
      function ocShort(a) {
        var t = String(a == null ? '' : a);
        return /^0x[0-9a-fA-F]{40}$/.test(t) ? t.slice(0, 6) + '\u2026' + t.slice(-4) : '';
      }

      // A bytes32 name as text: UTF-8 bytes up to the first NUL. This is
      // chain-l2/onchain.mjs's bytes32Name transcribed rather than
      // reinvented, so a pool read here by id renders under exactly the same
      // name the list gives it — two spellings of one pool would be a worse
      // bug than no lookup at all. Nothing is stripped, for the same reason:
      // the name on screen is the name on chain. It reaches the page only
      // through textContent, so bytes chosen by a stranger stay text.
      function ocName(hexWord) {
        var bytes = [];
        for (var i = 0; i + 2 <= hexWord.length && i < 64; i += 2) {
          var b = parseInt(hexWord.slice(i, i + 2), 16);
          if (!b) break;
          bytes.push(b);
        }
        return new TextDecoder().decode(new Uint8Array(bytes));
      }

      // A 32-byte answer as a BigInt, or a refusal in a plain sentence. An
      // eth_call that reaches an address holding no code answers '0x' —
      // EMPTY, not zero — and the difference is the whole failure this card
      // was capable of: on the wrong network the allowance read comes back
      // empty, reading it as 0 makes the page approve into the void, and the
      // data-carrying call that follows returns status 0x1 because a call to
      // a codeless address always does. Nothing here turns "no answer" into a
      // number.
      function ocUint(res, what) {
        var body = String(res == null ? '' : res).replace(/^0x/, '');
        // Kept short on purpose: this sentence is read back through ocErr,
        // and one that overruns its cut arrives as a fragment.
        if (body.length < 64) throw new Error(what + ' answered nothing \u2014 that call reached no contract. Check the wallet is on Base.');
        return BigInt('0x' + body.slice(0, 64));
      }

      // The 2% slippage guard, in raw units, with a floor. Percentages die on
      // small integers: 98/100 of three sats is two, of one sat is ZERO, and
      // a minimum of zero is not a loose guard but no guard at all. cbBTC
      // carries 8 decimals, so quotes of a few raw units are ordinary here,
      // not a corner case — and they are exactly the trades a sandwich costs
      // least to steal. The floor never lets a nonzero expected amount go out
      // with a zero minimum; where that makes the trade all-or-nothing the
      // quote line says so rather than letting the user find out on chain.
      function ocGuard(expected) {
        if (expected <= 0n) return 0n;
        var m = expected * 98n / 100n;
        return m < 1n ? 1n : m;
      }

      // Integer square root, rounding down — PeerPools._sqrt transcribed line
      // for line, including its small-input branch, so the pre-check below
      // refuses exactly what the contract refuses and nothing else. Written
      // out rather than paraphrased on purpose: the tidier Newton loop most
      // people reach for returns 2 for an input of 2, where this contract
      // returns 1, and a pre-check that disagrees with the contract about
      // anything is worse than no pre-check. BigInt throughout because
      // Math.sqrt stops being exact at 2^53 and the product of an
      // 18-decimal and an 8-decimal amount starts well past it.
      function ocSqrt(y) {
        if (y > 3n) {
          var z = y, x = y / 2n + 1n;
          while (x < z) { z = x; x = (y / x + x) / 2n; }
          return z;
        }
        return y === 0n ? 0n : 1n;
      }

      // Where a half-finished sequence actually left somebody, and in WHICH
      // of five states each leg of it stopped. Approving a token and then
      // refusing the next signature does not undo the approval: it landed, it
      // cost gas, and it still stands.
      //
      // The first version of this ledger recorded only the legs that
      // CONFIRMED, and that left the two failures where money actually moved
      // both saying "nothing else was signed":
      //
      //   · a leg that was broadcast and whose receipt was never observed —
      //     the poll gave up after four minutes, and the transaction may be
      //     in the mempool right now;
      //   · a leg that reverted on chain, which costs the gas whatever it
      //     does with the coins.
      //
      // Telling somebody nothing happened while their transaction is pending
      // is how the same trade gets signed, and paid for, twice. So every leg
      // is opened before the wallet is asked and carries its own state:
      //
      //   attempted — opened; nothing broadcast yet
      //   rejected  — no hash ever came back, so nothing went out
      //   sent      — broadcast, no receipt seen: UNKNOWN, which is not failed
      //   reverted  — mined and refused: coins stayed, gas did not
      //   confirmed — mined and accepted
      //
      // An unknown is never collapsed into "nothing happened", and a leg in
      // `sent` keeps its hash on screen, because looking that hash up is the
      // only thing that can settle it.
      function ocLedger() {
        var legs = [];
        function inState(st) { return legs.filter(function (l) { return l.state === st; }); }
        function clauses(st) {
          return inState(st).map(function (l) { return l.what + (l.tx ? ' \u2014 ' + l.tx : ''); }).join('; ');
        }
        return {
          // Exposed so the on-screen record can print each leg beside a link
          // to the explorer. Read-only by convention: the ledger owns them.
          legs: legs,
          open: function (what) {
            var leg = { what: what || 'that step', state: 'attempted', tx: null };
            legs.push(leg);
            return leg;
          },
          sentence: function (headline, e) {
            var parts = [headline + ': ' + ocErr(e)];
            // Worst-known first: an unknown outranks a plain failure, because
            // it is the one the reader has to act on.
            if (inState('sent').length) parts.push('SENT AND NOT CONFIRMED, so this may still land and must not be treated as undone: ' + clauses('sent') + '. Look that hash up on basescan.org before pressing anything again \u2014 pressing again can pay for the same thing twice.');
            if (inState('reverted').length) parts.push('Refused by the chain, which costs the gas and moves no coins: ' + clauses('reverted') + '.');
            if (inState('confirmed').length) parts.push('Landed and still stands: ' + clauses('confirmed') + '. An approval that stands is not asked for twice \u2014 your wallet reuses it.');
            if (parts.length === 1) parts.push('Nothing was broadcast, so nothing of yours moved and no gas was spent.');
            return parts.join(' ');
          }
        };
      }

      /**
       * Every transaction this card produced, on screen, with a link each.
       *
       * A hash inside a toast is a hash nobody can act on: it is gone in five
       * seconds and it cannot be clicked — and the two states where it
       * matters most, BROADCAST WITH NO RECEIPT SEEN and REVERTED, are exactly
       * the ones somebody has to look up before pressing anything again.
       * Pressing again can pay for the same thing twice.
       *
       * Base is not asked for here: this whole card refuses to draw unless the
       * host answered chain 8453, a few hundred lines above, so a hash it
       * produced is a hash on Base by construction.
       */
      function ocTxRecord(led, headline) {
        var all = (led && led.legs) || [], rows = [], i;
        for (i = 0; i < all.length; i++) if (all[i].tx) rows.push(all[i]);
        if (!rows.length) return;
        var box = h('div', { style: 'margin-top:10px' });
        box.appendChild(h('p', { class: 'eyebrow', style: 'margin:0 0 4px', text: headline }));
        rows.forEach(function (l) {
          var said = l.state === 'confirmed' ? 'landed'
            : l.state === 'reverted' ? 'REVERTED — it cost the gas and moved no coins'
            : l.state === 'sent' ? 'BROADCAST AND NOT SEEN TO CONFIRM — it may still land, so look it up before signing anything like it again'
            : l.state;
          box.appendChild(h('p', { class: 'smallnote' },
            h('span', { class: 'num', style: 'word-break:break-all', text: String(l.tx) }),
            ' · ' + l.what + ' · ' + said + ' ',
            l2ScanLink(8453, 'tx', l.tx, 'on basescan')));
        });
        ocTxBox.appendChild(box);
      }

      // Decimal text -> raw BigInt at `dec` decimals, or null. NEVER
      // parseFloat for an amount that will be signed: a double carries 53
      // bits, a token amount carries 256, and the difference is somebody's
      // money. The fraction is truncated rather than rounded — pulling a
      // hair less than typed is a non-event; pulling more would be theft.
      function ocUnits(sIn, dec) {
        var t = String(sIn == null ? '' : sIn).trim();
        if (t === '' || t === '.' || !/^\d*(\.\d*)?$/.test(t)) return null;
        var dot = t.split('.');
        var frac = (dot[1] || '').slice(0, dec);
        while (frac.length < dec) frac += '0';
        var v = BigInt((dot[0] || '0') + frac);
        return v > 0n ? v : null;
      }
      // Raw -> a number for the screen. Precision dies here by design, so
      // nothing computed from this ever goes into a transaction.
      function ocFmt(raw, dec) {
        var n = Number(raw) / Math.pow(10, dec);
        if (!isFinite(n)) return '?';
        if (n === 0) return '0';
        return n >= 0.001 ? String(Math.round(n * 1e6) / 1e6) : n.toExponential(3);
      }
      // Raw -> the exact decimal string, every digit of it. This is the one
      // for a FIELD, where ocFmt is the one for a sentence: what sits in an
      // input is parsed straight back into a transaction by ocUnits, and a
      // "max" filled from a double is not the balance. Rounded up it reverts
      // after costing gas; rounded down it silently strands the remainder.
      // This round-trips through ocUnits exactly, by construction.
      function ocDec(raw, dec) {
        var t = BigInt(raw).toString().padStart(dec + 1, '0');
        var whole = t.slice(0, t.length - dec);
        var frac = dec ? t.slice(t.length - dec).replace(/0+$/, '') : '';
        return frac ? whole + '.' + frac : whole;
      }
      // A price for the eye only, in the two shapes the pool rows already
      // use. Nothing that has been through a double is ever signed.
      function ocPx(n) {
        if (!isFinite(n) || n <= 0) return '?';
        return n >= 0.001 ? String(Math.round(n * 1e8) / 1e8) : n.toExponential(3);
      }
      // The UniswapV2 integer quote, exactly as the contract computes it and
      // as replay.cjs mirrors it for the sandbox (eff = amt * 0.997): fee on
      // the way in, integer division, the 0.3% staying in the pool. Run in
      // BigInt so the number on this screen is the number the chain would
      // produce against the same reserves — not a float that agrees with the
      // contract until the amounts get interesting.
      function ocQuote(amtIn, resIn, resOut) {
        var fee = amtIn * 997n;
        var den = resIn * 1000n + fee;
        return den === 0n ? 0n : (resOut * fee) / den;
      }

      function ocEth(method, params) { return window.ethereum.request({ method: method, params: params || [] }); }

      // The wallet is not a thing this page can hold still. A user can switch
      // network or account in MetaMask at any moment, including while this
      // card sits open, and a chain verified at connect time says nothing
      // about the chain a minute later. So the wallet's own event channel is
      // the authority: on either change everything learned under the old
      // connection is dropped — the address, and the token addresses read off
      // a factory that only exists on Base — and the row redraws to what is
      // true now. Registered once per page rather than once per render, or a
      // second visit to this tab would install a second handler.
      if (window.ethereum && window.ethereum.on && !l2Watching) {
        l2Watching = true;
        var ocForget = function (why) {
          var had = l2Wallet;
          l2Wallet = null;
          l2Tokens = null;
          if (had) toast(why);
          if (l2Redraw) l2Redraw();
        };
        window.ethereum.on('chainChanged', function () { ocForget('The wallet changed network. Nothing here reads or signs until it is back on the chain this host serves and connected again.'); });
        window.ethereum.on('accountsChanged', function () { ocForget('The wallet switched accounts. Connect again \u2014 the address shown here is only ever the one that connected.'); });
      }

      // A deadline is a second on the CHAIN's clock, so it is read off the
      // chain rather than off this computer: a browser an hour slow would
      // sign deadlines already expired (every trade reverts, gas each time)
      // and one an hour fast would sign a protection that does not begin for
      // an hour. Ten minutes is the window — long enough for somebody to walk
      // away from a wallet prompt, short enough that a transaction held back
      // by a builder and replayed later is void rather than merely late. If
      // the block will not answer, this machine's clock stands in; that is a
      // worse clock, and this comment is the disclosure.
      async function ocDeadline() {
        var secs = Math.floor(Date.now() / 1000);
        try {
          var blk = await ocEth('eth_getBlockByNumber', ['latest', false]);
          if (blk && blk.timestamp) secs = Number(BigInt(blk.timestamp));
        } catch (e) { /* the local clock stands in */ }
        return BigInt(secs + 600);
      }

      // Connecting is its own deliberate press, deploy-page style: the list
      // is readable without a wallet, and the address shown afterwards is
      // the wallet's current answer, never something remembered for it.
      async function ocConnect() {
        if (!window.ethereum) return null;
        var accs = await ocEth('eth_requestAccounts');
        if (!accs || !accs[0]) return null;
        var chain = await ocEth('eth_chainId');
        if (chain !== OC_CHAIN) {
          // The wrong network is the failure that looks most like success —
          // same shapes, different chain — so nothing proceeds until the
          // wallet itself confirms Base.
          try { await ocEth('wallet_switchEthereumChain', [{ chainId: OC_CHAIN }]); }
          catch (e) { toast('That wallet is not on Base and would not switch. Switch it by hand, then connect again.'); return null; }
          // Ask again rather than believing the switch. That call resolving
          // means the wallet accepted the request, not that the network
          // moved — and this is the one question where accepting a promise
          // instead of an answer puts a signature on the wrong chain.
          chain = await ocEth('eth_chainId');
          if (chain !== OC_CHAIN) { toast('The wallet still answers for chain ' + chain + ', not Base. Nothing here will sign until it does.'); return null; }
        }
        l2Wallet = String(accs[0]).toLowerCase();
        return l2Wallet;
      }

      // Wait for the receipt the way deploy.html does: poll. A plain
      // provider has no push channel, and two seconds of latency on a
      // confirmation nobody is racing costs nothing.
      //
      // The chain is re-asked here, at the last moment before anything is
      // signed, and named in the transaction itself. l2Wallet outlives the
      // check made at connect time on purpose — it has to survive the
      // re-render after every act — so between connecting and pressing, a
      // user can move MetaMask to another network and this page would never
      // hear about it. On the wrong chain the factory address holds no code:
      // an approve is signed to nothing, the call that follows returns status
      // 0x1 (which is what ANY data-carrying call to a codeless address
      // returns), and the card congratulates a trade that never existed, with
      // real gas burned twice. Two cheap defences, both here: ask eth_chainId
      // again, and put chainId in the params so the wallet refuses a mismatch
      // itself rather than trusting this page to have asked.
      // `led` and `what` are how this send reaches the sentence a failure
      // further down the sequence prints. The leg is opened BEFORE the wallet
      // is asked, so a press that dies at any point still has a record of
      // where it died — a leg written only on success is exactly the ledger
      // that reported "nothing was signed" over a pending transaction.
      async function ocSend(to, data, label, led, what) {
        var leg = (led || ocLedger()).open(what || label);
        var chain = await ocEth('eth_chainId');
        if (chain !== OC_CHAIN) {
          l2Wallet = null;
          l2Tokens = null;
          if (l2Redraw) l2Redraw();
          leg.state = 'rejected';
          throw new Error('the wallet is on chain ' + chain + ', not Base (' + OC_CHAIN + ') \u2014 nothing was signed. Put it back on Base and connect again.');
        }
        toast(label + ' \u2014 approve it in the wallet.');
        var tx;
        try {
          tx = await ocEth('eth_sendTransaction', [{ from: l2Wallet, to: to, data: data, chainId: OC_CHAIN }]);
        } catch (e) {
          // No hash came back, so nothing left the wallet. This is the one
          // branch where "nothing happened" is a true sentence.
          leg.state = 'rejected';
          throw e;
        }
        leg.tx = tx;
        // Broadcast. From here on the honest state is `sent` — not failed,
        // not done — and it stays that way until a receipt says otherwise.
        leg.state = 'sent';
        var rc = null;
        for (var i = 0; i < 120 && !rc; i++) {
          await new Promise(function (res) { setTimeout(res, 2000); });
          // A provider that throws mid-poll throws out of here with the leg
          // still in `sent`, which is the truth: the transaction went out and
          // this page stopped being able to watch it.
          rc = await ocEth('eth_getTransactionReceipt', [tx]);
        }
        // Both messages below leave the hash to the ledger, which prints it
        // once, beside the state that makes it worth looking up.
        if (!rc) throw new Error('not mined after four minutes \u2014 it may still be waiting in the mempool');
        if (rc.status !== '0x1') { leg.state = 'reverted'; throw new Error('reverted on chain \u2014 the coins stayed where they were, the gas did not'); }
        leg.state = 'confirmed';
        return rc;
      }

      // Allowance first, approve only if short — and approve the exact
      // amount rather than infinity: one more signature per trade, one
      // fewer standing permission over the user's coins. This network takes
      // that trade every time.
      //
      // The read is no longer wrapped in a swallow. An allowance that cannot
      // be read is not an allowance of zero — it is a call that hit nothing,
      // and the only safe move is to stop rather than to approve. When it
      // does sign, it hands back the clause the ledger needs, so a refusal
      // further down the sequence can say that this approval stands.
      async function ocAllow(token, spender, need, symbol, dec, led) {
        var have = ocUint(await ocEth('eth_call', [{ to: token, data: OC_SEL.allowance + ocAddr(l2Wallet) + ocAddr(spender) }, 'latest']), 'the ' + symbol + ' allowance');
        if (have >= need) return;
        // The clause travels with the send now rather than being handed back
        // afterwards, so an approval that is broadcast and never confirmed is
        // recorded too \u2014 the old shape could only report the ones that
        // finished, which is precisely the case that did not need reporting.
        await ocSend(token, OC_SEL.approve + ocAddr(spender) + ocWord(need), 'Approving ' + symbol, led,
          'your approval of ' + ocFmt(need, dec) + ' ' + symbol + ' to the pools contract');
      }

      // Can this wallet even pay? A free eth_call, asked before the first
      // signature on every path that pulls a token. An approval signed by a
      // wallet that cannot cover the trade costs real gas and buys nothing:
      // the pull reverts a moment later, and a standing permission over coins
      // the user does not have is left behind. createPool already spends two
      // free reads to make its knowable refusals free; this is the third, and
      // it belongs to swapping and depositing just as much.
      //
      // It is a snapshot and not a guarantee \u2014 a balance can move between
      // this read and the pull, and the contract stays the authority on that.
      // All it can do is turn a failure somebody paid for into one they did
      // not.
      async function ocHave(token, need, symbol, dec) {
        var have = ocUint(await ocEth('eth_call', [{ to: token, data: OC_SEL.balanceOf + ocAddr(l2Wallet) }, 'latest']), 'your ' + symbol + ' balance');
        if (have >= need) return;
        throw new Error('that wallet holds ' + ocFmt(have, dec) + ' ' + symbol + ' and this needs ' + ocFmt(need, dec) + ' \u2014 nothing was signed');
      }

      // The balance as a number rather than as a verdict. ocHave above asks
      // "is it enough" and throws if it is not, which is the right shape for
      // a trade; opening a pool needs the figure itself — to fill a max field
      // with it, and to tell a wallet that is SHORT from one holding none of
      // that coin at all. Those two want opposite sentences.
      async function ocBal(token, symbol) {
        return ocUint(await ocEth('eth_call', [{ to: token, data: OC_SEL.balanceOf + ocAddr(l2Wallet) }, 'latest']), 'your ' + symbol + ' balance');
      }

      // Which two tokens get approved? Asked of the factory itself, not
      // taken from this host's env: peer() and btc() are immutables the
      // factory was deployed with, and an approve aimed anywhere else is a
      // wasted signature.
      //
      // The cache lives at module level so a chainChanged can empty it: an
      // address read off a factory on Base is not an address anywhere else.
      // And a word that is not there is not an address — slicing the last 40
      // characters off '0x' yields something that LOOKS addressable, and an
      // approve aimed at it is a signature spent on nothing.
      // The cache is keyed on the factory that answered it. It used to be
      // keyed on nothing, which made it true of "some factory, once": a tab
      // left open while the operator repointed PEER_POOLS_ADDR would go on
      // approving the OLD factory's tokens \u2014 to the NEW factory's address,
      // over coins the new one never pulls, one signature and one standing
      // permission spent on nothing. The address is normalised because a
      // checksummed and a lowercase spelling of one address must not read as
      // two.
      async function ocGetTokens(factory) {
        var key = String(factory || '').toLowerCase();
        if (l2Tokens && l2Tokens.factory === key) return l2Tokens;
        var pw = await ocEth('eth_call', [{ to: factory, data: OC_SEL.peer }, 'latest']);
        var bw = await ocEth('eth_call', [{ to: factory, data: OC_SEL.btc }, 'latest']);
        var pa = ocUint(pw, 'the factory\u2019s peer() address'), ba = ocUint(bw, 'the factory\u2019s btc() address');
        if (pa === 0n || ba === 0n || pa >> 160n !== 0n || ba >> 160n !== 0n) throw new Error('that factory did not answer with two token addresses \u2014 nothing was signed');
        l2Tokens = { factory: key, peer: '0x' + pa.toString(16).padStart(40, '0'), btc: '0x' + ba.toString(16).padStart(40, '0') };
        return l2Tokens;
      }

      // Both refusals createPool can hand back are knowable for FREE, and
      // both are asked before the first approval is signed. An approval that
      // lands ahead of a revert costs gas and leaves a standing permission
      // over somebody's coins; an eth_call and a square root cost neither.
      //
      // MIN_LIQ is read from the deployed factory rather than pasted from
      // PeerPools.sol. The constant in the source is 1000, but the number
      // that matters is the one the contract about to take the money answers
      // with; a page that hardcodes it is pre-checking a different contract
      // than it is paying.
      // Keyed on the factory for the same reason ocGetTokens is: MIN_LIQ is
      // a number one deployment answers with, and pre-checking a deposit
      // against a different contract's floor is a pre-check that agrees with
      // nothing. Two factories can legitimately lock different amounts.
      var ocMin = null;
      async function ocMinLiq(factory) {
        var key = String(factory || '').toLowerCase();
        if (!ocMin || ocMin.factory !== key) {
          ocMin = { factory: key, value: ocUint(await ocEth('eth_call', [{ to: factory, data: OC_SEL.minLiq }, 'latest']), 'the factory\u2019s MIN_LIQ') };
        }
        return ocMin.value;
      }

      // taken(creator, name) — the name-claim mapping's own getter. It asks
      // about THIS wallet only, which is the whole design: the name you
      // cannot have is one you already used, never one a stranger used.
      async function ocTaken(factory, who, hexName) {
        return ocUint(await ocEth('eth_call', [{ to: factory, data: OC_SEL.taken + ocAddr(who) + hexName }, 'latest']), 'the name claim') !== 0n;
      }

      // The reserves every quote and every guard on a pool row is computed
      // from are frozen into that row's closure when it is drawn, and
      // between the press and the signature sit up to two approvals, each
      // polled for as long as four minutes. This screen's own repaint is
      // suppressed the whole time \u2014 safeToRepaint() returns false while
      // any non-persistent mini-form is in the document, and this view
      // always has several \u2014 so ocLoad() does not re-run and those
      // integers can be hours old, not the half-minute the old comment
      // claimed. A minOut that is 98% of a stale quote is not a loose
      // guard: if the pool moved the user's WAY it sits far below the fair
      // output, the user is never shown the better number, and a
      // sandwicher can push the fill down to it and keep the rest \u2014 with
      // the 2% band holding perfectly the whole time.
      //
      // So the pool is asked again, from the factory itself, after the last
      // approval has confirmed. Five static words: name, resPeer, resBtc,
      // totalShares, creator \u2014 the same decode the id lookup does. It is
      // a free read and it signs nothing.
      async function ocFresh(factory, id) {
        var ret = await ocEth('eth_call', [{ to: factory, data: OC_SEL.poolInfo + ocWord(id) }, 'latest']);
        var body = String(ret == null ? '' : ret).replace(/^0x/, '');
        if (body.length < 64 * 5) throw new Error('the pool would not read back before signing, so the guard could not be set against a live price \u2014 nothing was signed');
        return {
          rp: BigInt('0x' + body.slice(64, 128)),
          rb: BigInt('0x' + body.slice(128, 192)),
          ts: BigInt('0x' + body.slice(192, 256))
        };
      }
      // Did the number on screen survive the wait? Inside the 2% band is
      // what the reader agreed to; outside it is a different trade, and
      // they get to look at it before pressing again. BOTH directions: a
      // move in their favour is exactly the one a stale minimum gives away.
      function ocDrift(shown, now) {
        if (shown <= 0n) return false;
        if (now <= 0n) return true;
        return now < shown * 98n / 100n || now > shown * 102n / 100n;
      }
      // The guard actually sent: 2% under what the pool pays NOW, but never
      // under what the line on screen promised. Those are two different
      // protections and the trade needs both \u2014 the first against a pool
      // that moved since the quote, the second against this page quietly
      // lowering a minimum somebody read.
      function ocFloor(shown, now) {
        var a = ocGuard(now), b = ocGuard(shown);
        return a > b ? a : b;
      }

      // One fetch per render of this tab. The host caches the answer for 30
      // seconds, so flipping between tabs cannot become load on the public
      // Base RPC.
      function ocLoad() {
        fetch(API + '/api/token/onchain', { cache: 'no-store' })
          .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
          .then(function (x) { ocRender(x.status, x.d); })
          .catch(function () {
            ocBody.innerHTML = '';
            ocBody.appendChild(h('p', { class: 'smallnote', text: 'Could not reach this host to ask about the chain. The sandbox below still works; it never leaves this log.' }));
          });
      }

      // The host answers /api/token/onchain from a 30-second cache, so the
      // reload fired the instant a transaction lands usually redraws the very
      // snapshot that was taken before it: same numbers, and a card that
      // looks like it did not notice. The old toast promised the card would
      // follow and nothing in the code made it. So: read now (the cache may
      // be about to turn over anyway) and once more after the window has
      // certainly rolled, and say the half-minute out loud. The second read
      // is skipped if the card has since been navigated away from — nobody's
      // tab should keep polling a page they left.
      var OC_LAG = 'This card catches up when the host\u2019s 30-second read of the chain rolls over, about half a minute from now.';
      function ocRefresh() {
        ocLoad();
        setTimeout(function () { if (ocBody.isConnected) ocLoad(); }, 31000);
      }

      function ocRender(status, d) {
        ocBody.innerHTML = '';
        // Branch honestly. "Switched off", "misconfigured", "unreachable"
        // and "empty" are four different sentences, and blurring them is
        // how a wrong-chain RPC gets read as an empty pool. Where the
        // endpoint sent its own error sentence, it is shown verbatim —
        // never replaced with an invented zero.
        if (status === 404 || !d || d.code === 'ONCHAIN_OFF') {
          ocBody.appendChild(h('p', { class: 'smallnote', text: 'Off. The operator has not pointed this host at a deployment \u2014 PEER_TOKEN_ADDR is unset, and an address baked into source is one nobody verified. chain-l2/DEPLOY.md is the recipe.' }));
          return;
        }
        if (d.error) {
          ocBody.appendChild(h('p', { class: 'smallnote', text: d.error }));
          return;
        }
        if (!d.namedPools) {
          ocBody.appendChild(h('p', { class: 'smallnote', text: 'The PEER token is deployed, but no pools factory is: PEER_POOLS_ADDR is unset on this host, so there is no contract here to open a pool in and nothing to trade against. That is the operator\u2019s move and not yours \u2014 chain-l2/DEPLOY.md is the runbook for it. The form for opening a pool is deliberately not drawn below, because a button that cannot work is worse than no button.' }));
          return;
        }
        // Every button below says \u201con Base\u201d and every check below
        // compares against OC_CHAIN, but the factory address comes from a
        // host that can be configured for any EVM chain. Pointing a Base
        // wallet at another chain's factory address does not fail loudly:
        // the same deployer at the same nonce lands on the same address
        // everywhere, so it either reaches nothing \u2014 and a data-carrying
        // call to a codeless address returns status 0x1, which this card
        // would report as a trade \u2014 or it reaches somebody else's
        // contract with a real approval already standing in front of it.
        // So this card refuses rather than quietly translating itself.
        if (Number(d.chainId) !== 8453) {
          ocBody.appendChild(h('p', { class: 'smallnote', style: 'border-left:2px solid var(--ember); padding-left:9px', text: 'This host serves chain ' + d.chainId + ', and everything in this card is written for Base (8453): the addresses, the checks and every signature. The factory address would be read and approved on the wrong chain, where it can hold nothing at all or hold a different contract entirely, so nothing is drawn here rather than drawn wrong. The sandbox pools below are unaffected \u2014 they never leave this log.' }));
          return;
        }
        var np = d.namedPools;
        // One field, np.error, carries two failures that deserve opposite
        // treatment, and telling them apart is the difference between a card
        // that degrades and a card that disappears:
        //
        //   · the address answered poolCount() but the POOL SCAN failed. The
        //     scan is the fragile part — most public RPCs refuse a getLogs
        //     range this wide — and NOTHING else on this card is derived from
        //     it. Collapsing the whole card here meant that the moment the
        //     scan broke, a user could not open a pool either, on a form that
        //     never touched the scan. So it degrades: the endpoint's own
        //     sentence goes where the list would be, and everything that
        //     speaks to Base directly keeps working.
        //
        //   · nothing at that address answered poolCount() at all. Then there
        //     is no factory: no decimals to scale an amount by, and nothing
        //     for a create to create in. That one still collapses, and says
        //     which of the two it is.
        //
        // The test is whether the factory answered anything before the scan.
        // A host that later reports its scan under new names still trips it,
        // because tokens/total/decimals are read off the factory itself.
        var answered = np.total != null || np.tokens != null || np.pools != null ||
          np.peerDecimals != null || np.btcDecimals != null || np.scan != null;
        if (np.error && !answered) {
          // The factory address is set but did not answer like a factory.
          // That is the endpoint's own sentence too, and "unreadable" must
          // not be dressed up as "empty" — an empty factory invites a
          // deposit; an unreadable one is a misconfiguration to fix first.
          ocBody.appendChild(h('p', { class: 'smallnote', text: np.error }));
          return;
        }
        // Held, not returned on. drawPools prints it in place of the list.
        var scanError = np.error || null;
        var factory = np.factory;
        var pdec = np.peerDecimals == null ? 18 : Number(np.peerDecimals);
        var bdec = np.btcDecimals == null ? 8 : Number(np.btcDecimals);

        // The factory names its own two tokens and the reader checks them
        // against the ones this host was configured with. Where they
        // disagree, that sentence is the endpoint's own and it goes FIRST,
        // before the wallet row: it means the pools below are over coins the
        // operator did not mean to serve. Nothing is hidden and nothing is
        // disabled — this page cannot know which of the two addresses is the
        // wrong one, and the trades are perfectly real either way — but
        // nobody should approve a token here without having read it.
        if (np.mismatch && np.mismatch.error) {
          ocBody.appendChild(h('p', { class: 'smallnote', style: 'border-left:2px solid var(--ember); padding-left:9px', text: np.mismatch.error }));
        } else if (np.tokensNote) {
          ocBody.appendChild(h('p', { class: 'smallnote', text: np.tokensNote }));
        }

        // The address every button below sends to, printed and linkable. It
        // was the one address on this card a reader could not check, which is
        // backwards: a pool list is judged by its reserves and its creators,
        // and the factory holding all of them is judged by being readable.
        ocBody.appendChild(h('p', { class: 'smallnote' },
          h('span', { class: 'num', style: 'word-break:break-all', text: String(factory) }),
          ' · the pools contract this host reads, on Base. ',
          l2ScanLink(8453, 'address', factory, 'on basescan')));

        var walletRow = h('div', { class: 'mini-form persistent' });
        ocBody.appendChild(walletRow);
        function drawWallet() {
          walletRow.innerHTML = '';
          if (l2Wallet) {
            // .num is the stylesheet's monospace face (var(--mono), tabular
            // figures); .mono was never a rule in this file, so the address
            // used to render in the body font like ordinary prose.
            walletRow.appendChild(h('span', { class: 'smallnote num', text: (ocShort(l2Wallet) || l2Wallet) + ' \u00b7 Base' }));
          } else if (window.ethereum) {
            walletRow.appendChild(h('button', { class: 'btn small', text: 'Connect wallet', onclick: function () {
              ocConnect().then(function (a) { if (a) { drawWallet(); drawPools(); } })
                .catch(function (e) { toast('Connect failed: ' + ocErr(e)); });
            } }));
            walletRow.appendChild(h('span', { class: 'smallnote', text: 'Prices are public; only signing needs the wallet. It signs, this page never sees a key.' }));
          } else {
            walletRow.appendChild(h('span', { class: 'smallnote', text: 'No wallet detected \u2014 the list stays readable, but swapping, adding or opening a pool needs one on Base.' }));
          }
        }

        // A name here is a LABEL and never an identifier. PeerPools claims
        // names per creator on purpose — a global namespace on a public
        // mempool just sells the word "main" to whoever pays the higher
        // priority fee — and the deliberate consequence is that two different
        // people can both have a pool called "main". So this list refuses to
        // present a name as canonical: it ranks by BTC depth, which is the
        // one property of a pool nobody can simply type in; it names the
        // creator of every row; it marks a name more than one pool is using;
        // and every call any button sends is keyed by id, which is the only
        // part of a pool that is unique.
        var listBox = h('div', {});
        ocBody.appendChild(listBox);

        // Everything the reader says about its own reading gets said again
        // here, in its words rather than this page's summary of them. The
        // reader knows things about its scan that this card cannot: how many
        // windows it walked, how many an endpoint refused, how far behind the
        // backfill still is, how many pools it saw but had no reads left for.
        //
        // OC_SAID is the set of keys this card already has a sentence for.
        // Anything else the reader reports is a host NEWER than this page —
        // and it is printed under the reader's own key name rather than
        // dropped, because the alternative is a page that silently hides the
        // one counter that would have explained a short list. Objects are
        // skipped; only scalars are safe to render as a name and a value.
        var OC_SAID = {
          factory: 1, error: 1, tokens: 1, tokensNote: 1, mismatch: 1, peerDecimals: 1,
          btcDecimals: 1, fromBlock: 1, fromBlockIgnored: 1, discoveredBy: 1, rankedBy: 1,
          pools: 1, discovered: 1, returned: 1, total: 1, skipped: 1, unread: 1,
          truncated: 1, note: 1, scan: 1, count: 1
        };
        function ocExtras(o, known) {
          var bits = [];
          Object.keys(o || {}).forEach(function (k) {
            if (known && known[k]) return;
            var v = o[k], t = typeof v;
            if (t === 'string') { if (v) bits.push(k + ' \u2014 ' + v.slice(0, 240)); }
            else if (t === 'number' || t === 'boolean') bits.push(k + ': ' + v);
          });
          return bits;
        }
        // `shown` is how many rows this card is about to draw, or null when
        // it is drawing none because the scan failed. The counted sentence is
        // only a fallback: where the reader wrote its own note, that is what
        // appears, because it is the one that knows why.
        function drawScanState(box, shown) {
          var total = np.total == null ? (np.count == null ? null : Number(np.count)) : Number(np.total);
          var seen = np.returned == null ? shown : Number(np.returned);
          var skipped = Array.isArray(np.skipped) ? np.skipped.length : Number(np.skipped || 0);
          var unread = Number(np.unread || 0);
          if (np.note) {
            box.appendChild(h('p', { class: 'smallnote', text: np.note }));
          } else if (seen != null && (np.truncated || (total != null && total > seen))) {
            box.appendChild(h('p', { class: 'smallnote', text: 'Showing ' + seen + ' of ' + total + ' pools on this factory \u2014 the rest exist on chain and are simply not in this list. Any of them can still be reached below by its id.' + (skipped ? ' ' + skipped + ' would not decode.' : '') + (unread ? ' ' + unread + ' were seen but not read this round.' : '') }));
          } else if (seen != null && skipped > 0) {
            box.appendChild(h('p', { class: 'smallnote', text: skipped + ' pool' + (skipped === 1 ? '' : 's') + ' on this factory would not decode and ' + (skipped === 1 ? 'was' : 'were') + ' skipped \u2014 what is here is the rest, not all of it.' }));
          }
          var said = [];
          if (np.scan && typeof np.scan === 'object') said = said.concat(ocExtras(np.scan, null));
          said = said.concat(ocExtras(np, OC_SAID));
          if (said.length) box.appendChild(h('p', { class: 'smallnote', text: 'This host also reported, in its own names: ' + said.slice(0, 16).join(' \u00b7 ') + '.' }));
        }

        // How many pools ON THIS PAGE carry one pool's name — the honest
        // scope of the shared-name warning, and the number the row prints.
        // It counts the list this card was given and nothing else; a factory
        // the scan only half reached can hold a third pool of the same name
        // that nobody here can see.
        function ocSharing(p) {
          var k = String(p.nameRaw || p.name || ''), n = 0, listed = false;
          (np.pools || []).forEach(function (q) {
            if (String(q.nameRaw || q.name || '') === k) n++;
            if (String(q.id) === String(p.id)) listed = true;
          });
          return listed ? n : n + 1;
        }

        function drawPools() {
          listBox.innerHTML = '';
          // The scan failed, the card did not. Its sentence goes where the
          // list would be, and everything below it \u2014 the wallet row, the id
          // lookup, opening a pool \u2014 goes on working, because none of them
          // read a log.
          if (scanError) {
            listBox.appendChild(h('p', { class: 'smallnote', style: 'border-left:2px solid var(--ember); padding-left:9px', text: 'The pool list could not be read: ' + scanError }));
            listBox.appendChild(h('p', { class: 'smallnote', text: 'That is this host\u2019s scan of the pool log, and only that. The wallet row, opening a pool and looking a pool up by its id all ask Base directly, so they are unaffected \u2014 what is missing here is the list, not the pools.' }));
          }
          var list = (np.pools || []).slice();
          if (!list.length) {
            // "Empty" and "could not be read" are the two sentences this card
            // must never blur: an empty factory invites the first deposit, an
            // unreadable one is a host to fix first. So the invitation is
            // printed only when the scan actually came back empty.
            if (!scanError) {
              var known = Number(np.total || 0);
              listBox.appendChild(known === 0
                ? h('p', { class: 'smallnote', text: 'The factory is live and empty. The first pool is opened below \u2014 its starting ratio IS its starting price.' })
                : h('p', { class: 'smallnote', style: 'border-left:2px solid var(--ember); padding-left:9px',
                    text: 'This factory holds ' + known + ' pool' + (known === 1 ? '' : 's') + ' that this host has not read yet \u2014 it is still walking the log. That is a list which has not arrived, not an empty factory. Do not open a \u201cfirst\u201d pool here: its ratio would be priced against pools you cannot see.' }));
            }
            drawScanState(listBox, scanError ? null : 0);
            return;
          }
          // Deepest BTC reserve first. The reader ranks the same way; this
          // sorts again rather than trusting the order it arrived in, because
          // an order that silently depends on a host being current is one
          // that quietly puts a dust pool at the top of somebody's screen.
          list.sort(function (a, b) {
            var A = BigInt(a.resBtcRaw || '0'), B = BigInt(b.resBtcRaw || '0');
            if (A !== B) return A > B ? -1 : 1;
            return Number(a.id) - Number(b.id);
          });
          // How many pools in THIS list wear each name, keyed by the raw
          // bytes32 where the host sends it: two names that render alike but
          // differ by a byte are still two names, and the raw word is what
          // the chain actually holds. A null-prototype object because the
          // keys are somebody else's chosen text — a pool named __proto__
          // must count as a pool, not reach into this page's object model.
          var byName = Object.create(null);
          list.forEach(function (p) {
            var k = String(p.nameRaw || p.name || '');
            byName[k] = (byName[k] || 0) + 1;
          });
          listBox.appendChild(h('p', { class: 'smallnote', text: 'Deepest BTC reserve first. A pool\u2019s name was chosen by whoever opened it and is claimed per creator \u2014 two different people can each have one called \u201cmain\u201d, and both are legitimate. A name carries no trust and no endorsement here: read the creator and the reserves, and note that the id beside it is what every button below actually sends. Where two pools ON THIS PAGE carry one name the row says so \u2014 but this page is all it can compare, so an unmarked name is not a proven unique one.' }));

          // What this list is NOT, in the reader's own account of its scan:
          // the windows it walked, the ones an endpoint refused, the pools it
          // saw and had no reads left for. A partial list drawn as though it
          // were the whole factory is exactly the omission that sends a
          // deposit into the wrong pool.
          drawScanState(listBox, list.length);

          list.forEach(function (p) { listBox.appendChild(poolRow(p, byName[String(p.nameRaw || p.name || '')] || 1)); });
        }

        // `foundById` marks a row that was read from the chain a second ago
        // by id rather than served by this host's scan \u2014 different
