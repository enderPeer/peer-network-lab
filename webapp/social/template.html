   */
  function netAdvice(st, me, reach) {
    var out = [];
    var baseline = 0;
    reach.forEach(function (r) { if (r.pos > 0) baseline += 1; });
    if (!baseline) {
      out.push({ tone: 'warn', text: 'Nothing is reachable from here yet. Reach is carried by acts: react to a post, review one, or vouch for somebody, and the paths open from that point. Twenty-five of the accounts on this network are in the same position.' });
      return out;
    }
    // Neighbours: actors one hop out in the directed register.
    var neigh = [];
    reach.forEach(function (r, id) {
      var n = st.g.nodes.get(id);
      if (r.pos > 0 && n && n.kind === 'Actor' && id !== me) neigh.push(id);
    });
    // The counterfactual, run rather than estimated. Capped because it is one
    // BFS per neighbour and the graph is walked in full each time.
    var worst = null;
    neigh.slice(0, 12).forEach(function (id) {
      var pruned = { nodes: new Map(), edges: [] };
      st.g.nodes.forEach(function (n, k) { if (k !== id && k !== 'prof_' + id) pruned.nodes.set(k, n); });
      st.g.edges.forEach(function (e) {
        if (e.src === id || e.tgt === id || e.src === 'prof_' + id || e.tgt === 'prof_' + id) return;
        pruned.edges.push(e);
      });
      pruned.incoming = function (x) { return pruned.edges.filter(function (e) { return e.tgt === x; }); };
      var after = 0;
      try {
        var r2 = E.doubleCoverBFS(pruned, me);
        r2.forEach(function (r) { if (r.pos > 0) after += 1; });
      } catch (e) { return; }
      var lost = Math.round(((baseline - after) / baseline) * 100);
      if (!worst || lost > worst.lost) worst = { id: id, lost: lost };
    });
    if (worst && worst.lost >= 25) {
      out.push({ tone: 'warn', text: 'Your reach runs through ' + (st.handles[worst.id] || worst.id)
        + '. Without that one connection you would reach ' + worst.lost + '% less of this network — measured by removing them and running the reach again. A second route to the same people would cost one act and remove that dependency.' });
    }
    if (neigh.length && neigh.length < 4) {
      out.push({ tone: 'note', text: 'You are connected through ' + neigh.length + ' account' + (neigh.length === 1 ? '' : 's')
        + '. Reach here is not symmetric — being reachable is a different thing from reaching — so a few more acts widen it faster than anything else.' });
    }
    var reverse = 0;
    st.ledgers.forEach(function (l) {
      if (l.deleted || l.id === me) return;
      try {
        var rr = E.doubleCoverBFS(st.g, l.id);
        var seen = rr.get(me);
        if (seen && seen.pos > 0) reverse += 1;
      } catch (e) { /* an actor with no register */ }
    });
    out.push({ tone: 'note', text: reverse
      ? reverse + ' account' + (reverse === 1 ? '' : 's') + ' can reach you. That is the audience your posts can travel to, and it is counted separately from the ' + neigh.length + ' you reach, because the graph is directed.'
      : 'Nobody can currently reach you. Your posts exist in the record but no path carries them to another feed — that changes the moment somebody acts on one of them.' });
    return out;
  }

  // ── Groups: the one thing on this screen that is chosen, not recorded ──
  //
  // Six colours and no seventh. Past six, categorical hues stop being separable
  // at halo width, so every remaining group shares one dashed swatch and gets
  // no colour at all — absence is the honest encoding for "not named".
  var NET_COMM_MAX = 6;

  /**
   * The partition, cached on the same set the layout is cached on.
   *
   * netHidden is deliberately absent from the key: hiding a group must not
   * reflow the picture underneath it, or the toggle destroys the thing it is
   * for. Scope and min-weight ARE in the key, because they change which graph
   * is being grouped — and the legend says so.
   */
  function netCommunities(st, data) {
    var key = netScope + '|' + netMinW + '|' + data.nodes.length + '|' + data.edges.length + '|' + world.acts.length;
    if (netCommCache.key === key && netCommCache.comm) return netCommCache.comm;
    var comm = E.communities(data.nodes, data.edges, personOfId);
    netCommCache = { key: key, comm: comm };
    return comm;
  }

  /**
   * A name for each group, preferring one somebody wrote over one we computed.
   *
   * A dominant tag is RECORDED: that string is literally in the log. The
   * fallback is DERIVED and is written "alice +11" on purpose — it reads as
   * "alice and eleven others", which is all a partition supports. It does not
   * say alice leads anything, and it must not be made to.
   */
  function netCommNames(st, data, comm) {
    var n = comm.count, i, c;
    var tally = [], members = [], bestActor = [], bestDeg = [], bestAny = [], bestAnyDeg = [];
    for (i = 0; i < n; i++) {
      tally.push({}); members.push(0);
      bestActor.push(null); bestDeg.push(-1);
      bestAny.push(null); bestAnyDeg.push(-1);
    }
    var seen = {};
    data.nodes.forEach(function (nd) {
      var pid = personOfId(nd.id);
      c = comm.of[pid];
      if (c === undefined) return;
      if (!seen[pid]) { seen[pid] = 1; members[c] += 1; }
      var deg = comm.strength[pid] || 0;
      if (deg > bestAnyDeg[c]) { bestAnyDeg[c] = deg; bestAny[c] = nd; }
      if (nd.kind === 'Actor' && deg > bestDeg[c]) { bestDeg[c] = deg; bestActor[c] = nd; }
    });
    // One pass for every tag act, rather than tagsOf() per node (that filters
    // the whole edge list each call, which is O(N·E) on this screen).
    st.g.edges.forEach(function (e) {
      if (e.family !== 'TagT') return;
      c = comm.of[personOfId(e.src)];
      if (c === undefined) return;
      var label = (st.g.nodes.get(e.tgt) || {}).label || '';
      if (!label) return;
      tally[c][label] = (tally[c][label] || 0) + 1;
    });
    var out = [];
    for (i = 0; i < n; i++) {
      var keys = Object.keys(tally[i]).sort(function (a, b) {
        if (tally[i][b] !== tally[i][a]) return tally[i][b] - tally[i][a];
        return a < b ? -1 : a > b ? 1 : 0;
      });
      var top = keys[0], topN = top ? tally[i][top] : 0;
      var runner = keys[1] ? tally[i][keys[1]] : 0;
      // A tag only names the group when it plainly dominates it. Otherwise it
      // would be a characterisation dressed as a record.
      if (top && topN >= 3 && topN >= runner * 2) {
        out.push({ text: top, prov: 'rec', note: topN + ' acts here carry this tag' });
      } else if (bestActor[i]) {
        var extra = members[i] - 1;
        out.push({
          text: (st.handles[bestActor[i].id] || bestActor[i].label) + (extra > 0 ? ' +' + extra : ''),
          prov: 'der', note: 'most-connected member, by act weight',
        });
      } else if (bestAny[i]) {
        out.push({ text: bestAny[i].label || 'group ' + (i + 1), prov: 'der', note: 'largest member' });
      } else {
        out.push({ text: 'group ' + (i + 1), prov: 'der', note: '' });
      }
    }
    return out;
  }

  /** RECORDED = read out of the log. DERIVED = computed from it by this page. */
  function provChip(kind) {
    return h('span', { class: 'prov ' + kind, text: kind === 'rec' ? 'RECORDED' : 'DERIVED' });
  }

  /**
   * The legend, and the only control over what the picture shows.
   *
   * Toggling a group hides it from the drawing without recomputing anything —
   * the layout and the partition are both solved on the unfiltered graph, so
   * nodes never move when you fold a group away.
   */
  function netLegendCard(st, data, comm, names) {
    var card = h('div', { class: 'card' },
      h('p', { class: 'eyebrow', text: 'groups — derived, not recorded' }));
    if (comm.count <= 1) {
      card.appendChild(h('p', { class: 'smallnote', text: 'This graph does not separate: every node sits in one group. That is a fact about the record, not a failure to find structure — nothing here transacts in clusters yet.' }));
      return card;
    }
    if (comm.q < 0.15) {
      card.appendChild(h('p', { class: 'warn', text: 'This graph barely separates. The split below is the best one found and it is weak (Q ' + fmt(comm.q, 2) + ') — read it as a hint, not a boundary.' }));
    }
    var list = h('div', { class: 'netlist' });
    var shown = Math.min(comm.count, NET_COMM_MAX);
    var i;
    for (i = 0; i < shown; i++) {
      (function (ci) {
        var off = !!netHidden[ci];
        var row = h('div', { class: 'netrow' + (off ? ' off' : '') });
        row.appendChild(h('span', { class: 'legend-sw', style: 'background: var(--c' + (ci + 1) + ')' }));
        row.appendChild(h('span', { class: 'grow' },
          h('b', { text: names[ci].text }),
          names[ci].note ? h('small', { text: names[ci].note }) : null));
        row.appendChild(provChip(names[ci].prov));
        row.appendChild(h('span', { class: 'num', text: String(comm.sizes[ci]) }));
        row.addEventListener('click', function () {
          if (netHidden[ci]) delete netHidden[ci]; else netHidden[ci] = 1;
          render();
        });
        list.appendChild(row);
      })(i);
    }
    if (comm.count > NET_COMM_MAX) {
      var rest = 0;
      for (i = NET_COMM_MAX; i < comm.count; i++) rest += comm.sizes[i];
      var allOff = true;
      for (i = NET_COMM_MAX; i < comm.count; i++) if (!netHidden[i]) allOff = false;
      var row2 = h('div', { class: 'netrow' + (allOff ? ' off' : '') });
      row2.appendChild(h('span', { class: 'legend-sw dashed' }));
      row2.appendChild(h('span', { class: 'grow' },
        h('b', { text: (comm.count - NET_COMM_MAX) + ' smaller groups' }),
        h('small', { text: 'past six, colours stop being tellable apart' })));
      row2.appendChild(h('span', { class: 'num', text: String(rest) }));
      row2.addEventListener('click', function () {
        for (var k = NET_COMM_MAX; k < comm.count; k++) {
          if (allOff) delete netHidden[k]; else netHidden[k] = 1;
        }
        render();
      });
      list.appendChild(row2);
    }
    card.appendChild(list);
    card.appendChild(h('p', { class: 'smallnote', text: 'Click a group to fold it out of the picture. Grouping drops direction and sign: it says who transacts with whom, never who reaches whom, and never who agrees. It is computed over the graph as filtered above, so changing scope or min weight changes the groups.' }));
    return card;
  }

  /**
   * The most-connected accounts. Deliberately NOT called influence, centrality
   * or importance: it counts the acts touching an account, not what those acts
   * did. The only structural-importance claim on this page stays the min-cut-1
   * bridge and the leave-one-out counterfactual, both measured by removal.
   */
  function netHubCard(st, data, comm, focus) {
    var rows = [];
    var seen = {};
    data.nodes.forEach(function (nd) {
      var pid = personOfId(nd.id);
      if (seen[pid]) return;
      seen[pid] = 1;
      rows.push({ id: nd.id, pid: pid, node: nd, w: comm.strength[pid] || 0, k: comm.links[pid] || 0 });
    });
    rows.sort(function (a, b) {
      if (b.w !== a.w) return b.w - a.w;
      if (b.k !== a.k) return b.k - a.k;
      return a.pid < b.pid ? -1 : a.pid > b.pid ? 1 : 0;
    });
    // A "most connected" list that includes things nothing touches is not a
    // ranking, it is a roster.
    rows = rows.filter(function (r) { return r.w > 0; }).slice(0, 8);
    var card = h('div', { class: 'card' },
      h('p', { class: 'eyebrow', text: 'most connected — derived' }));
    if (!rows.length || rows[0].w <= 0) {
      card.appendChild(h('p', { class: 'smallnote', text: 'No priced act connects anything in this view yet.' }));
      return card;
    }
    var list = h('div', { class: 'netlist' });
    rows.forEach(function (r) {
      var row = h('div', { class: 'netrow' });
      var ci = comm.of[r.pid];
      row.appendChild(h('span', { class: 'legend-sw' + (ci === undefined || ci >= NET_COMM_MAX ? ' dashed' : ''),
        style: ci !== undefined && ci < NET_COMM_MAX ? 'background: var(--c' + (ci + 1) + ')' : '' }));
      row.appendChild(h('span', { class: 'grow' },
        h('b', { text: st.handles[r.pid] || r.node.label || r.pid }),
        h('small', { text: r.k + (r.k === 1 ? ' relationship' : ' relationships') })));
      row.appendChild(h('span', { class: 'num', text: fmt(r.w, 2) }));
      row.addEventListener('click', function () { focus(r.id); });
      list.appendChild(row);
    });
    card.appendChild(list);
    card.appendChild(h('p', { class: 'smallnote', text: 'People and posts alike, weighted by the damped weight of every act touching each one, direction dropped. Connected is not the same as important — this counts the acts, not what they did.' }));
    return card;
  }

  /**
   * What is behind one node: its group, how far off it is, and who it actually
   * touches. Replaces a click that used to fire a profile drawer straight out
   * of a pan-and-zoom surface.
   */
  function netNodeCard(st, data, comm, dist, focus) {
    var nd = st.g.nodes.get(netSel);
    if (!nd) return null;
    var pid = personOfId(netSel);
    var ci = comm.of[pid];
    var name = st.handles[pid] || (st.payloads[netSel] ? '\u201c' + st.payloads[netSel].slice(0, 44) + '\u201d' : nd.label || netSel);
    if (nd.kind === 'Profile') name += '\u2019s profile';
    var card = h('div', { class: 'card', style: 'margin-top:14px' },
      h('div', { class: 'panel-head' },
        h('h2', { style: 'margin:0', text: name }),
        h('button', { class: 'btn small ghost', text: 'close', onclick: function () { netSel = null; render(); } })));
    var d = dist.get(netSel);
    card.appendChild(h('p', { class: 'smallnote',
      text: nd.kind + ' \u00b7 ' + (ci === undefined ? 'no group' : 'group ' + (ci + 1))
        + ' \u00b7 ' + (d === 0 ? 'this is you' : d === undefined ? 'beyond your 4-hop horizon' : d + (d === 1 ? ' hop away' : ' hops away')) }));
    // Neighbours, from the drawn edge set so the panel and the picture agree.
    var nb = [], nbSeen = {};
    data.edges.forEach(function (e) {
      var other = e.src === netSel ? e.tgt : e.tgt === netSel ? e.src : null;
      if (!other || nbSeen[other]) return;
      nbSeen[other] = 1;
      nb.push({ id: other, out: e.src === netSel, family: e.family, w: e.weight });
    });
    nb.sort(function (a, b) { return b.w - a.w; });
    if (!nb.length) {
      card.appendChild(h('p', { class: 'smallnote', text: 'Nothing in this view points at it and it points at nothing — it is in the record, but no priced act connects it here.' }));
    } else {
      var list = h('div', { class: 'netlist' });
      nb.slice(0, 10).forEach(function (x) {
        var on = st.g.nodes.get(x.id) || {};
        var row = h('div', { class: 'netrow' });
        // A profile leg folds onto its owner, so naming it after the person
        // rendered "Alice \u2192 Alice". It is the profile being pointed at.
        var oName = st.handles[personOfId(x.id)] || on.label || x.id;
        if (String(x.id).indexOf('prof_') === 0) oName += '\u2019s profile';
        row.appendChild(h('span', { class: 'arrow', text: x.out ? '\u2192' : '\u2190' }));
        row.appendChild(h('span', { class: 'grow' },
          h('b', { text: oName }),
          h('small', { text: x.family })));
        row.appendChild(h('span', { class: 'num', text: fmt(x.w, 3) }));
        row.addEventListener('click', function () { netSel = x.id; focus(x.id); });
        list.appendChild(row);
      });
      card.appendChild(list);
      if (nb.length > 10) card.appendChild(h('p', { class: 'smallnote', text: 'Showing the 10 heaviest of ' + nb.length + '.' }));
      card.appendChild(h('p', { class: 'smallnote', text: 'Arrows are the direction commitment travelled. Every row is a recorded act; the weight beside it is that act damped by its maturity.' }));
    }
    var acts = h('div', { style: 'display:flex; gap:6px; flex-wrap:wrap; margin-top:8px' });
    if (nd.kind === 'Actor' || nd.kind === 'Profile') {
      acts.appendChild(h('button', { class: 'btn small', text: 'Open profile',
        onclick: function () { openProfile(pid); } }));
    }
    if (netTarget !== netSel) {
      acts.appendChild(h('button', { class: 'btn small primary', text: 'Explain my reach to this',
        onclick: function () { netTarget = netSel; netView = null; render(); } }));
    }
    card.appendChild(acts);
    return card;
  }

  /** Legend and hubs side by side, so neither pushes the graph off the screen. */
  function netInstruments(st, data, comm, names, dist, focus) {
    var grid = h('div', { class: 'netgrid' },
      netLegendCard(st, data, comm, names),
      netHubCard(st, data, comm, focus));
    var wrap = h('div', {}, grid);
    var sel = netNodeCard(st, data, comm, dist, focus);
    if (sel) wrap.appendChild(sel);
    return wrap;
  }

  function netTab(st) {
    var wrap = h('div', {});
    var me = personOfId(who);
    var data = netData(st);
    // The layout is the expensive part of this screen by two orders of
    // magnitude — measured on the live graph: 467ms to solve, against 7ms to
    // build the SVG from it. It is a deterministic solve over the same node
    // set, so it is cached on that set rather than recomputed every time the
    // page repaints. That is the single change that makes this view stop
    // freezing the tab, and it is not a rendering change at all.
    var lkey = data.nodes.length + ':' + data.edges.length + ':' + netScope + ':' + netMinW;
    if (!netLayoutCache || netLayoutCache.key !== lkey) {
      netLayoutCache = { key: lkey, pos: layoutGraph(data.nodes, data.edges) };
    }
    var pos = netLayoutCache.pos;

    // Everything in this tab answers one question: how do I reach this, and
    // through whom. Reachability is the raw depth-4 register; explanations are
    // the same k-disjoint CoGra extraction the feed ranks with.
    var reach = E.doubleCoverBFS(st.g, me);
    var hops = cograHops(st);
    var maxReach = 0;
    reach.forEach(function (r) { if (r.pos > maxReach) maxReach = r.pos; });

    // Grouping is the one figure here that is chosen rather than read, so it is
    // solved once, cached, and labelled as derived wherever it appears.
    var comm = netCommunities(st, data);
    var commNames = netCommNames(st, data, comm);
    var commOf = function (id) {
      var c = comm.of[personOfId(id)];
      return c === undefined ? -1 : c;
    };
    var commHidden = function (id) {
      var c = commOf(id);
      return c >= 0 && !!netHidden[c];
    };
    // The cover answers "how strongly does this reach me"; it cannot answer
    // "how far off is it", because zero weight and out-of-range look alike.
    var dist = E.hopDistance(st.g, me);
    var netFocusTo = function (id) {
      var p = pos[id];
      if (p) netView = { x: p.x - 190, y: p.y - 150, w: 380, h: 300 };
      render();
    };

    var stats = netStats(st, me, reach);
    var sum = h('div', { class: 'card' },
      h('p', { class: 'eyebrow', text: 'your position' }));
    var tiles = h('div', { class: 'stat-row' });
    [
      [String(stats.peers), 'peers you reach', 'of ' + (stats.total - 1) + ' on the network'],
      [String(stats.nodes), 'things in reach', 'posts, people and threads within 4 hops'],
      [fmt(stats.standing, 4), 'your standing', stats.tied
        ? 'rank ' + stats.rank + ' of ' + stats.of + ', tied with ' + stats.tied
        : 'rank ' + stats.rank + ' of ' + stats.of],
      [String(stats.edges), 'edges in the record', 'every one a priced act'],
    ].forEach(function (t) {
      tiles.appendChild(h('div', { class: 'stat-tile' },
        h('b', { text: t[0] }), h('span', { text: t[1] }), h('span', { text: t[2] })));
    });
    sum.appendChild(tiles);
    sum.appendChild(h('p', { class: 'smallnote', text: 'Reach is counted the way this network actually routes: along the direction commitment was transported. It is not symmetric — the people you reach and the people who can reach you are different sets, and both are shown. An undirected count would be several times larger and would tell you that you reach people who cannot see you.' }));
    wrap.appendChild(sum);

    var adv = netAdvice(st, me, reach);
    if (adv.length) {
      var ac = h('div', { class: 'card' }, h('p', { class: 'eyebrow', text: 'what this means' }));
      adv.forEach(function (a) {
        ac.appendChild(h('p', { class: a.tone === 'warn' ? 'warn' : 'smallnote', text: a.text }));
      });
      wrap.appendChild(ac);
    }

    var explained = null, bridgeSet = {};
    if (netTarget && st.g.nodes.get(netTarget)) {
      var res = E.scoreCandidate(hops, me, netTarget, st.epochHistory.length);
      explained = res;
      // CoGra §8.5: one extracted path and no disjoint alternative ⇒ every
      // interior node is a min-cut-1 bridge holding your only route.
      if (res.paths.length === 1) {
        res.paths[0].nodes.slice(1, -1).forEach(function (n) { bridgeSet[n] = 1; });
      }
    }
    // edges that carry an explained path (person-folded endpoints)
    var pathEdge = {}, pathNode = {};
    if (explained) {
      explained.paths.forEach(function (p) {
        p.nodes.forEach(function (n) { pathNode[n] = 1; });
        for (var i = 0; i + 1 < p.nodes.length; i++) pathEdge[p.nodes[i] + '>' + p.nodes[i + 1]] = 1;
      });
    }

    // ── controls ──
    var scopeSel = h('select', {},
      h('option', { value: 'social', text: 'social graph (no topics)' }),
      h('option', { value: 'all', text: 'everything' }),
      h('option', { value: 'ego', text: 'my neighborhood (2 hops)' }));
    scopeSel.value = netScope;
    scopeSel.addEventListener('change', function () { netScope = scopeSel.value; netView = null; render(); });

    var targetSel = h('select', {});
    targetSel.appendChild(h('option', { value: '', text: 'explain my reach to…' }));
    var cands = [];
    st.ledgers.forEach(function (l) { if (l.id !== me && !l.deleted) cands.push({ id: l.id, label: '👤 ' + st.handles[l.id] }); });
    st.g.nodes.forEach(function (n) {
      if (n.kind === 'Content' && st.payloads[n.id]) {
        cands.push({ id: n.id, label: '▪ ' + (st.payloads[n.id] || '').slice(0, 34) });
      }
    });
    cands.forEach(function (c) {
      var o = h('option', { value: c.id, text: c.label });
      if (netTarget === c.id) o.selected = true;
      targetSel.appendChild(o);
    });
    targetSel.addEventListener('change', function () { netTarget = targetSel.value || null; render(); });

    var wSlider = h('input', { type: 'range', min: '0', max: '0.25', step: '0.01', value: String(netMinW) });
    var wOut = h('output', { class: 'num', text: fmt(netMinW, 2) });
    wSlider.addEventListener('change', function () { netMinW = Number(wSlider.value); netView = null; render(); });
    wSlider.addEventListener('input', function () { wOut.textContent = fmt(Number(wSlider.value), 2); });

    function zoom(factor) {
      var cx = netView.x + netView.w / 2, cy = netView.y + netView.h / 2;
      netView.w *= factor; netView.h *= factor;
      netView.x = cx - netView.w / 2; netView.y = cy - netView.h / 2;
      svg.setAttribute('viewBox', netView.x + ' ' + netView.y + ' ' + netView.w + ' ' + netView.h);
    }
    function fitView() {
      var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
      var subset = explained ? data.nodes.filter(function (n) { return pathNode[personOfId(n.id)] || pathNode[n.id]; }) : data.nodes;
      if (!subset.length) subset = data.nodes;
      subset.forEach(function (n) {
        var p = pos[n.id]; if (!p) return;
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      });
      if (minX > maxX) { minX = -100; maxX = 100; minY = -100; maxY = 100; }
      var pad = 80;
      netView = { x: minX - pad, y: minY - pad, w: (maxX - minX) + 2 * pad, h: (maxY - minY) + 2 * pad };
    }
    if (!netView) fitView();

    wrap.appendChild(h('div', { class: 'card' },
      h('div', { class: 'panel-head', style: 'margin-bottom:4px' },
        h('p', { class: 'eyebrow', style: 'margin:0', text: 'the graph — brightness is how strongly you reach a thing, ring colour is its group' }),
        h('div', { style: 'display:flex; gap:6px' },
          h('button', { class: 'btn small', text: '−', onclick: function () { zoom(1.3); } }),
          h('button', { class: 'btn small', text: '+', onclick: function () { zoom(1 / 1.3); } }),
          h('button', { class: 'btn small', text: 'fit', onclick: function () { fitView(); zoom(1); } }))),
      h('div', { style: 'display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:6px' },
        targetSel, scopeSel,
        h('span', { class: 'slider' }, 'min weight ', wSlider, wOut),
        h('button', { class: 'btn small', text: 'Export JSON', onclick: function () { exportGraphJSON(st); } })),
      netStatsStrip(data, comm),
      netSearchRow(st, data, netFocusTo),
      h('p', { class: 'smallnote', style: 'margin-top:6px', text: 'Drag to pan, wheel to zoom. Click any node for what it touches, or an edge for its tensor. Pick a target to see the disjoint paths your feed rank is actually built from.' })));

    // ── the graph ──
    // touch-action:none was set so a drag would pan the graph rather than
    // scroll the page. On a phone it also made 234 measured pixels of the
    // drawing unreachable: the SVG has a 560px minimum and the column is
    // 354px, so a third of the graph sat past the edge with no gesture that
    // could bring it into view. pan-y gives the page back its vertical
    // scrolling while the horizontal drag still belongs to the graph.
    var card = h('div', { class: 'card netwrap', style: 'margin-top:14px; touch-action:pan-y' });
    var svg = sv('svg', { id: 'netsvg', viewBox: netView.x + ' ' + netView.y + ' ' + netView.w + ' ' + netView.h });
    var defs = sv('defs');
    ['arr', 'arr-hot'].forEach(function (id) {
      var mk = sv('marker', { id: id, viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '6.5', markerHeight: '6.5', orient: 'auto-start-reverse' });
      mk.appendChild(sv('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'currentColor' }));
      defs.appendChild(mk);
    });
    svg.appendChild(defs);

    var dragState = null, dragMoved = false;
    svg.addEventListener('pointerdown', function (ev) {
      dragState = { px: ev.clientX, py: ev.clientY, vx: netView.x, vy: netView.y };
      dragMoved = false; svg.setPointerCapture(ev.pointerId);
    });
    svg.addEventListener('pointermove', function (ev) {
      if (!dragState) return;
      var rect = svg.getBoundingClientRect();
      if (Math.abs(ev.clientX - dragState.px) + Math.abs(ev.clientY - dragState.py) > 6) dragMoved = true;
      netView.x = dragState.vx - (ev.clientX - dragState.px) * netView.w / rect.width;
      netView.y = dragState.vy - (ev.clientY - dragState.py) * netView.h / rect.height;
      svg.setAttribute('viewBox', netView.x + ' ' + netView.y + ' ' + netView.w + ' ' + netView.h);
    });
    svg.addEventListener('pointerup', function () { dragState = null; });
    // A trackpad's sideways swipe reports deltaX, and this handler read only
    // deltaY — so brushing left or right ZOOMED. Measured: one deltaX event
    // shrank the viewBox to 0.87 of its width. Sideways now pans, which is
    // what the gesture means everywhere else.
    svg.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      if (Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) {
        var vb = svg.viewBox.baseVal;
        svg.setAttribute('viewBox', (vb.x + ev.deltaX * (vb.width / 600)) + ' ' + vb.y + ' ' + vb.width + ' ' + vb.height);
        return;
      }
      zoom(ev.deltaY > 0 ? 1.15 : 1 / 1.15);
    }, { passive: false });

    var pair = {};
    data.edges.forEach(function (e) {
      var p1 = pos[e.src], p2 = pos[e.tgt];
      if (!p1 || !p2) return;
      if (commHidden(e.src) || commHidden(e.tgt)) return; // folded away, not filtered out
      var key = [e.src, e.tgt].sort().join('|');
      var nth = pair[key] || 0; pair[key] = nth + 1;
      var dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1;
      var pad = 20;
      var sx = p1.x + dx / len * pad, sy = p1.y + dy / len * pad;
      var tx = p2.x - dx / len * pad, ty = p2.y - dy / len * pad;
      var off = nth > 0 ? 13 * (e.src < e.tgt ? 1 : -1) * (1 + nth * 0.5) : 0;
      var mx = (sx + tx) / 2 - dy / len * off, my = (sy + ty) / 2 + dx / len * off;
      var onPath = pathEdge[personOfId(e.src) + '>' + personOfId(e.tgt)];
      var color = onPath ? 'var(--ember-hot)'
        : e.sign < 0 ? 'var(--bad)' : e.tier === 'half' ? 'var(--brass)' : e.tier === 'marginal' ? 'var(--muted)' : 'var(--ember)';
      var dim = explained && !onPath;
      var g2 = sv('g', { class: 'edge-g' + (selEdge === e.id ? ' sel' : ''), style: 'color:' + color });
      var d = 'M ' + sx + ' ' + sy + ' Q ' + mx + ' ' + my + ' ' + tx + ' ' + ty;
      g2.appendChild(sv('path', { d: d, stroke: 'transparent', fill: 'none', 'stroke-width': '14' }));
      g2.appendChild(sv('path', {
        d: d, stroke: color, fill: 'none',
        'stroke-width': String((onPath ? 2.2 : 0.8) + e.weight * 7),
        'stroke-opacity': dim ? '0.12' : (selEdge === e.id ? '1' : '0.68'),
        'marker-end': 'url(#' + (onPath ? 'arr-hot' : 'arr') + ')',
      }));
      if ((data.edges.length <= 30 || onPath || selEdge === e.id) && !dim) {
        var lbl = sv('text', { x: String(mx), y: String(my - 5) });
        lbl.textContent = e.id + ' · ' + fmt(e.weight);
        g2.appendChild(lbl);
      }
      g2.addEventListener('click', function () { if (!dragMoved) { selEdge = e.id; render(); } });
      svg.appendChild(g2);
    });

    data.nodes.forEach(function (n) {
      var p = pos[n.id];
      if (commHidden(n.id)) return; // folded away by the legend
      var pid = personOfId(n.id);
      var r = reach.get(n.id);
      var strength = r && maxReach > 0 ? Math.min(1, r.pos / maxReach) : 0;
      var isMe = pid === me;
      var onPath = pathNode[pid] || pathNode[n.id];
      var isBridge = bridgeSet[pid];
      var dim = explained && !onPath;
      var g2 = sv('g', { class: 'node-g', style: 'cursor:pointer' + (dim ? '; opacity:0.18' : '') });
      var fillOpacity = String(0.12 + strength * 0.7);
      var stroke = isMe ? 'var(--ink)' : isBridge ? 'var(--bad)' : n.kind === 'Actor' ? 'var(--ember)'
        : n.kind === 'Profile' ? 'var(--brass)' : 'var(--moss)';
      var base = n.kind === 'Actor' ? 'var(--ember)' : n.kind === 'Profile' ? 'var(--brass)' : 'var(--moss)';
      var rad = n.kind === 'Actor' ? (isMe ? 20 : 15) : 11;
      // Group colour rides a halo BEHIND the shape rather than the fill: fill
      // already carries kind and reach brightness, and at 0.12 opacity a
      // community colour would be invisible on exactly the nodes you most want
      // to place. Groups past the sixth get no halo — absence is honest.
      var ci = commOf(n.id);
      // Exposed so a render test can assert the partition is identical
      // across two boots of the same log — the doctrine, checked end to end.
      g2.setAttribute('data-comm', String(ci));
      if (ci >= 0 && ci < NET_COMM_MAX && !dim) {
        g2.appendChild(sv('circle', { cx: String(p.x), cy: String(p.y), r: String(rad + 5),
          fill: 'none', stroke: 'var(--c' + (ci + 1) + ')', 'stroke-width': '2.5', 'stroke-opacity': '0.9' }));
      }
      if (n.kind === 'Actor') {
        g2.appendChild(sv('circle', { cx: String(p.x), cy: String(p.y), r: String(rad), fill: base, 'fill-opacity': fillOpacity, stroke: stroke, 'stroke-width': isMe ? '3' : isBridge ? '2.5' : '1.5' }));
      } else if (n.kind === 'Profile') {
        g2.appendChild(sv('polygon', { points: p.x + ',' + (p.y - 12) + ' ' + (p.x + 12) + ',' + p.y + ' ' + p.x + ',' + (p.y + 12) + ' ' + (p.x - 12) + ',' + p.y, fill: base, 'fill-opacity': fillOpacity, stroke: stroke, 'stroke-width': '1.2' }));
      } else if (n.kind === 'Type') {
        g2.appendChild(sv('circle', { cx: String(p.x), cy: String(p.y), r: '10', fill: base, 'fill-opacity': fillOpacity, stroke: stroke, 'stroke-width': '1.2', 'stroke-dasharray': '3 2' }));
      } else {
        g2.appendChild(sv('rect', { x: String(p.x - 14), y: String(p.y - 10), width: '28', height: '20', rx: '6', fill: base, 'fill-opacity': fillOpacity, stroke: stroke, 'stroke-width': n.id === netTarget ? '3' : '1.2' }));
      }
      if (isMe) {
        var ring = sv('circle', { cx: String(p.x), cy: String(p.y), r: String(rad + 10), fill: 'none', stroke: 'var(--ink)', 'stroke-width': '1', 'stroke-dasharray': '2 3' });
        g2.appendChild(ring);
      }
      if (n.kind === 'Actor' || onPath || n.id === netTarget || data.nodes.length <= 60) {
        var t1 = sv('text', { x: String(p.x), y: String(p.y + rad + 12) });
        t1.textContent = (isMe ? 'you · ' : '') + n.label + (isBridge ? ' ⚠bridge' : '');
        g2.appendChild(t1);
      }
      g2.addEventListener('click', function () {
        if (dragMoved) return;
        // A single click on a pan-and-zoom surface used to fire a profile
        // drawer. It now selects, and the inspector below carries the drawer
        // behind a button you have to mean.
        netSel = n.id;
        render();
      });
      svg.appendChild(g2);
    });
    card.appendChild(svg);
    wrap.appendChild(card);
    wrap.appendChild(netInstruments(st, data, comm, commNames, dist, netFocusTo));

    // ── explanation panel: the same numbers the feed ranks with ──
    if (explained) {
      var tgtNode = st.g.nodes.get(netTarget) || {};
      var tName = st.handles[netTarget] || (st.payloads[netTarget] ? '“' + st.payloads[netTarget].slice(0, 40) + '”' : tgtNode.label || netTarget);
      var ex = h('div', { class: 'card', style: 'margin-top:14px' },
        h('h2', { text: 'How you reach ' + tName }));
      if (!explained.paths.length) {
        ex.appendChild(h('p', { class: 'smallnote', text: 'No live path within depth 4. Nothing you or your network has pointed at leads here, so it carries no feed weight for you at all — this is absence, not a low score. React to something nearby and it becomes reachable.' }));
      } else {
        ex.appendChild(h('div', { class: 'kv' },
          h('span', { text: 'S(you, target)' }), h('b', { class: 'num', text: fmt(explained.S, 4) }),
          h('span', { text: 'disjoint paths' }), h('b', { class: 'num', text: String(explained.paths.length) })));
        explained.paths.forEach(function (p, i) {
          ex.appendChild(h('div', { class: 'path-row' },
            h('div', { class: 'mech' },
              h('b', { text: '#' + (i + 1) + ' ' }),
              (p.sigma > 0 ? '+' : '−') + fmt(p.m, 4) + ' · recency ' + fmt(p.f, 2) + ' → contributes ' + fmt(p.term, 4)),
            h('div', { class: 'path-chain', text: p.nodes.map(function (nid) {
              return st.handles[nid] || (st.g.nodes.get(nid) || {}).label || nid;
            }).join('  →  ') })));
        });
        if (explained.paths.length === 1) {
          var interior = explained.paths[0].nodes.slice(1, -1);
          ex.appendChild(h('p', { class: 'bridge-note' },
            h('b', { text: '⚠ single route. ' }),
            interior.length
              ? 'Everything here reaches you only through ' + interior.map(function (n) {
                  return st.handles[n] || (st.payloads[n] ? '“' + st.payloads[n].slice(0, 24) + '…”' : (st.g.nodes.get(n) || {}).label || n);
                }).join(', ') +
                '. That is the min-cut-1 signature the spec flags as a bridge: a genuine hub would also be reachable by an independent second path. It is advisory — structure, not a verdict.'
              : 'You reach this directly, with no independent second route behind it.'));
        } else {
          ex.appendChild(h('p', { class: 'smallnote', text: 'Several independent routes reach this — breadth counts, and no single person can cut you off from it.' }));
        }
      }
      ex.appendChild(h('button', { class: 'btn small ghost', style: 'margin-top:8px', text: 'clear', onclick: function () { netTarget = null; netView = null; render(); } }));
      wrap.appendChild(ex);
    } else {
      // no target: summarise the viewer's own structural position
      var reachable = 0, unreachable = 0;
      data.nodes.forEach(function (n) {
        if (n.kind === 'Profile') return;
        var r2 = reach.get(n.id);
        if (r2 && r2.pos > 0) reachable++; else unreachable++;
      });
      wrap.appendChild(h('div', { class: 'card', style: 'margin-top:14px' },
        h('h2', { text: 'Your reach' }),
        h('div', { class: 'kv' },
          h('span', { text: 'reachable within 4 hops' }), h('b', { class: 'num', text: String(reachable) }),
          h('span', { text: 'beyond your horizon' }), h('b', { class: 'num', text: String(unreachable) })),
        h('p', { class: 'smallnote', text: 'Brightness above is your raw path weight to each node. Pick a target — or click any actor or post in the graph — to see the disjoint paths that carry it, the same extraction your feed rank sums. A target reached by exactly one route names the person holding that route.' })));
    }

    var e2 = st.g.edges.find(function (x) { return x.id === selEdge; });
    if (e2) wrap.appendChild(inspectorCard(st, e2));
    return wrap;
  }

  /** N nodes · M edges · K groups · Q, with what is read and what is computed. */
  function netStatsStrip(data, comm) {
    var strip = h('div', { class: 'netstats' });
    strip.appendChild(h('span', {}, h('b', { text: String(data.nodes.length) }), ' nodes'));
    strip.appendChild(h('span', {}, h('b', { text: String(data.edges.length) }), ' edges'));
    strip.appendChild(provChip('rec'));
    strip.appendChild(h('span', { class: 'sep', text: '\u00b7' }));
    strip.appendChild(h('span', {}, h('b', { text: String(comm.count) }), comm.count === 1 ? ' group' : ' groups'));
    strip.appendChild(h('span', {}, 'Q ', h('b', { class: 'num', text: fmt(comm.q, 2) })));
    strip.appendChild(provChip('der'));
    return strip;
  }

  /**
   * Search over the drawn nodes.
   *
   * Results are built in the input handler against a list held here, and
   * render() is only called on a click. Calling it per keystroke would replay
   * the whole log, run 51 reach passes and re-solve a 467ms layout on every
   * letter. The row must also stay .persistent: safeToRepaint blocks every
   * background repaint while a non-persistent .mini-form is in the DOM.
   */
  function netSearchRow(st, data, focus) {
    var input = h('input', { type: 'search', placeholder: 'find a node\u2026', style: 'flex:1; min-width:0' });
    var out = h('div', { class: 'netfind' });
    var row = h('div', { class: 'mini-form persistent', style: 'margin-top:6px' }, input);
    function label(nd) {
      var base = st.handles[personOfId(nd.id)] || (st.payloads[nd.id] ? '\u201c' + st.payloads[nd.id].slice(0, 40) + '\u201d' : nd.label || nd.id);
      // Without this an account and its profile are two rows both reading
      // "Bob", and picking one is a coin toss.
      return String(nd.id).indexOf('prof_') === 0 ? base + '\u2019s profile' : base;
    }
    input.addEventListener('input', function () {
      var q = input.value.trim().toLowerCase();
      out.innerHTML = '';
      if (!q) return;
      var hits = data.nodes.filter(function (nd) { return label(nd).toLowerCase().indexOf(q) >= 0; }).slice(0, 8);
      if (!hits.length) {
        out.appendChild(h('p', { class: 'smallnote', text: 'Nothing in this view matches. Widen the scope, or drop the min weight.' }));
        return;
      }
      hits.forEach(function (nd) {
        var hit = h('button', { class: 'btn small ghost', text: label(nd) });
        hit.addEventListener('click', function () { netSel = nd.id; focus(nd.id); });
        out.appendChild(hit);
      });
    });
    return h('div', {}, row, out);
  }

  function heat(v) {
    var t = Math.max(-1, Math.min(1, v));
    if (t >= 0) {
      return 'rgb(' + Math.round(238 - 90 * t) + ',' + Math.round(226 - 40 * t) + ',' + Math.round(208 - 90 * t) + ')';
    }
    return 'rgb(' + Math.round(238 + 8 * t) + ',' + Math.round(226 + 110 * t) + ',' + Math.round(208 + 100 * t) + ')';
  }
  function matView(m, title) {
    var cols = m[0] ? m[0].length : 0;
    var grid = h('div', { class: 'mat', style: 'grid-template-columns: repeat(' + cols + ', auto)' });
    m.forEach(function (row) {
      row.forEach(function (v) {
        grid.appendChild(h('div', { class: 'cell', style: 'background:' + heat(v), text: v === 0 ? '0' : fmt(v, 2) }));
      });
    });
    return h('div', {}, h('div', { class: 'mat-title', text: title }), grid);
  }
  function inspectorCard(st, e) {
    var H = E.binaryEntropy(e.tau);
    var srcL = (st.g.nodes.get(e.src) || {}).label || e.src;
    var tgtL = (st.g.nodes.get(e.tgt) || {}).label || e.tgt;
    function term(v, s, res) {
      return h('div', { class: 'term' + (res ? ' result' : '') }, v, h('small', { text: s }));
    }
    var det = e.pv[0][0] * e.pv[1][1] - e.pv[0][1] * e.pv[1][0];
    return h('div', { class: 'card', style: 'margin-top:14px' },
      h('h2', { text: e.id + ' — ' + srcL + ' → ' + tgtL }),
      h('p', { class: 'smallnote', text: e.family + ' · ' + e.domain + ' · tier ' + e.tier + ' · p_d ' + fmt(e.pd, 2) + ' · p_i ' + fmt(e.pi, 2) + ' · τ ' + fmt(e.tau, 3) + ' · sign ' + (e.sign > 0 ? '+1' : '−1') }),
      h('div', { class: 'chain' },
        term(fmt(e.score), 'det score'),
        h('span', { class: 'op', text: '×' }),
        term(fmt(Math.sqrt(1 + e.tau * e.tau)), '√(1+τ²)'),
        h('span', { class: 'op', text: '×' }),
        term(fmt(Math.exp(-E.BETA * H)), 'e^(−β·H), H=' + fmt(H, 3)),
        h('span', { class: 'op', text: '=' }),
        term(fmt(e.weight), 'damped weight', true)),
      h('div', { style: 'display:flex; flex-wrap:wrap' },
        matView(e.slice, 'stored Ψ · ‖Ψ‖F ' + fmt(e.frob)),
        matView(e.pv, 'path view · det ' + fmt(det, 4))));
  }

  // Alerts — the notification feed, at act-level detail.
  function alertsTab(st) {
    var outer = h('div', {});
    var bar = h('div', { class: 'lanes' });
    [['inbound', 'Inbound'], ['record', 'The record']].forEach(function (v) {
      var b = h('button', { class: 'lane' + (alertView === v[0] ? ' on' : '') }, h('b', { text: v[1] }));
      b.onclick = function () { alertView = v[0]; saveView(); render(); };
      bar.appendChild(b);
    });
    outer.appendChild(bar);
    if (alertView === 'record') {
      // The full chronicle. It is the same material as the alerts, without the
      // filter that keeps only the acts naming you — so it belongs beside them
      // rather than in a tab of its own.
      outer.appendChild(ledgerTab(st));
      return outer;
    }

    var notifs = notificationsFor(st, who);
    var wrap = h('div', { class: 'card' },
      h('p', { class: 'eyebrow', text: 'alerts — inbound acts naming you (mentions, quotes, backings, comments, messages)' }));
    if (!notifs.length) {
      wrap.appendChild(h('p', { class: 'smallnote', text: 'Nothing inbound yet. Note that inbound acts never enter your feed ranking — this list is the only place they surface.' }));
      outer.appendChild(wrap);
      return outer;
    }
    notifs.forEach(function (n) {
      var row = h('div', { class: 'alert-row' + (n.idx > seenMark ? ' fresh' : '') },
        avatar(n.who, 'avatar s'),
        h('div', { class: 'grow' },
          h('div', {}, h('b', { text: st.handles[n.who] || n.who }), ' ',
            h('span', { class: 'smallnote', text: NOTIF_VERB[n.kind] || n.kind }),
            h('span', { class: 'rank-chip', style: 'margin-left:6px', text: '#' + n.idx })),
          n.text ? h('div', { class: 'smallnote', text: '“' + n.text.slice(0, 110) + '”' }) : null));
      if (n.kind === 'dm' || n.kind === 'call') {
        row.style.cursor = 'pointer';
        row.addEventListener('click', function () { chatPeer = n.who; tab = 'chat'; render(); });
      } else if (n.target && resolvePost(st, n.target)) {
        row.style.cursor = 'pointer';
        row.appendChild(h('span', { class: 'jump-hint', text: '↗ open' }));
        row.addEventListener('click', function () { jumpTo(st, n.target); });
      }
      wrap.appendChild(row);
    });
    markSeen(notifs);
    outer.appendChild(wrap);
    return outer;
  }

  /** Somebody else's conversation. Readable, and not writable by a bystander. */
  function publicThreadCard(st, key) {
    var parts = key.split('|');
    var every = allThreads(st)[key] || [];
    var card = h('div', { class: 'card' },
      h('div', { style: 'display:flex; align-items:center; gap:10px; margin-bottom:8px' },
        h('button', { class: 'btn small ghost', text: '← close', onclick: function () { chatOpen = null; render(); } }),
        h('b', { text: (st.handles[parts[0]] || parts[0]) + ' ↔ ' + (st.handles[parts[1]] || parts[1]) }),
        h('span', { class: 'smallnote', style: 'margin-left:auto', text: 'you are reading, not taking part' })));
    var tEl = h('div', { class: 'chat-thread' });
    every.forEach(function (m) {
      if (m.call) {
        tEl.appendChild(h('div', { class: 'chat-call', text: st.handles[m.from] + ' · ' + callLabel(m.call) + ' · act #' + m.idx }));
        return;
      }
      tEl.appendChild(h('div', { class: 'chat-msg' + (m.from === who ? ' mine' : '') },
        h('span', { class: 'm-meta num', text: (st.handles[m.from] || m.from) + ' · act #' + m.idx + ' · ' + relAgo(actStamp(m.idx)) }),
        h('div', {}, m.text)));
    });
    card.appendChild(tEl);
    if (parts[0] === who || parts[1] === who) {
      card.appendChild(h('div', { class: 'mini-form' },
        h('button', { class: 'btn small primary', text: 'Open as your chat', onclick: function () {
          chatPeer = parts[0] === who ? parts[1] : parts[0]; chatOpen = null; render();
        } })));
    }
    return card;
  }

  /** A way into the guide from wherever somebody actually gets stuck. */

  // Chats — the dm acts and their threads.
  /**
   * Every conversation on the network, not only yours.
   *
   * The messages were always public — a dm act's text sits in /api/acts, in
   * every mirror and in the published archive — but until now no screen showed
   * one to somebody who was not in it, and people write differently when a
   * thing is merely technically readable than when it is browsable. That gap
   * is closed here on purpose, at the owner's decision, so the app must say so

  function allThreads(st) {
    var out = {};
    (st.dms || []).forEach(function (m) {
      var key = [m.from, m.to].sort().join('|');
      (out[key] || (out[key] = [])).push(m);
    });
    return out;
  }

  /** 1st, 2nd, 3rd, 4th — "their 2th" read like a bug, because it was one. */
  function ordinal(n) {

    return n + ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');

  // ══ Every value movement, in order ═══════════════════════════════════════

  function valueLedger(st) {
    var wrap = h('div', {});

    st.tokens.dist.forEach(function (d) {
      for (var k in d.to) rows.push({ idx: -1, epoch: d.epoch, kind: 'mint', who: k, text: '+' + fmt(d.to[k], 4) + ' PEER \u2014 epoch ' + d.epoch + ' distribution' });

      var l = c.line || '';
      if (/minted \d+ |sent .* to |swapped |added liquidity|withdrew from|opened the .* pool|bought a placement|stopped advert/.test(l)) {
        rows.push({ idx: i, kind: 'act', who: c.who, text: l });

    var mineOnly = false;
    var box = h('div', { class: 'card' },

        h('button', { class: 'btn small', text: 'only mine', onclick: function () { mineOnly = !mineOnly; draw(); } })));
    var list = h('div', {});
    function draw() {
      list.innerHTML = '';
      var shown = rows.filter(function (r) { return !mineOnly || r.who === who; }).slice().reverse().slice(0, 120);

      shown.forEach(function (r) {

    box.appendChild(list);
    box.appendChild(h('p', { class: 'smallnote', text: 'Read from the act log, not stored separately \u2014 so this cannot drift from what happened. Mints are the epoch distributions; everything else is an act somebody paid \u03b8 for.' }));
    wrap.appendChild(box);
    return wrap;
  }

  /**
   * PEER on Base — the ERC-20, which is NOT the epoch token above it.
   *
   * Two different things in this app are called PEER and the interface did not
   * say so anywhere. The cards above print "you hold N PEER" out of the act
   * log: a number in a ledger anyone can replay, minted when an epoch closes,
   * on no chain and in no wallet — a wallet cannot even be shown it. The PEER
   * here is an ERC-20 deployed on Base: it sits in an account, it moves when
   * its holder signs, and it is the only one of the two that a pool can trade.
   * They share a name and a symbol and nothing else. There is no bridge, no
   * claim and no conversion in either direction, and nothing in this codebase
   * could make one — so this card says that outright, first, rather than
   * leaving two tokens to be read as one.
   *
   * Everything shown is read, never assumed. The address, its decimals and
   * the supply come from this host's /api/token/onchain and are NEVER
   * constants in this file: a different operator runs a different token, and
   * an address baked into source is one nobody verified. The balances come
   * from eth_call through the user's own wallet, so they are the chain's
   * answer rather than this host's 30-second cache. The one call that writes
   * anything, wallet_watchAsset, writes to the WALLET's list of tokens: it
   * touches no chain, no balance and no coin, and the button says so, because
   * a button next to a balance looks like it does something to the balance.
   */
  function l2TokenCard() {
    var card = h('div', { class: 'card', style: 'margin-top:14px' },
      h('h2', { text: 'PEER on Base \u2014 the coin in your wallet' }));
    var body = h('div', {});
    card.appendChild(body);

    function only(text) {
      body.innerHTML = '';
      body.appendChild(h('p', { class: 'smallnote', text: text }));
    }

    function draw(status, d) {
      body.innerHTML = '';
      // Four different sentences, and blurring them is how "switched off"
      // gets read as "empty". Where the endpoint sent its own error, it is
      // shown verbatim and never replaced with an invented zero.
      if (status === 404 || !d || d.code === 'ONCHAIN_OFF' || !d.token) {
        only('The operator of this host has not deployed a token \u2014 PEER_TOKEN_ADDR is unset, and an address baked into source is one nobody verified, so this card will not print one. There is no ERC-20 called PEER here; the PEER counted above is the epoch token in this network\u2019s log, and it was never on a chain.');
        return;
      }
      if (d.error) { only(d.error); return; }
      if (d.decimals == null || d.totalSupplyRaw == null) {
        only('This host names a token at ' + d.token + ' but could not read its decimals or its supply off the chain, so every number here would be a guess. Nothing else is shown until it can.');
        return;
      }

      var token = String(d.token);
      var btc = d.btc ? String(d.btc) : null;
      var dec = Number(d.decimals);
      var supply = BigInt(d.totalSupplyRaw);
      var chainId = Number(d.chainId);
      // Everything below that touches a wallet is anchored to THIS, never
      // to the constant at the top of the file. Null where the host named
      // no usable chain, and then no balance is read at all: a number read
      // off some other chain and printed under this token's name is worse
      // than no number, because it looks exactly like an answer.
      var chainHex = l2ChainHex(chainId);
      var chainName = l2ChainName(chainId);

      // ── which token is which, before anything else on the card ──
      body.appendChild(h('p', { class: 'smallnote', text: 'The PEER counted further up this tab is the EPOCH token: a number in this network\u2019s act log, minted when an epoch closes and shared out by engagement. It is not on a chain, it is not in a wallet, and no wallet can be pointed at it.' }));
      body.appendChild(h('p', { class: 'smallnote', text: 'The PEER below is a different token that happens to share the name: an ERC-20 on ' + chainName + '. That is the one a wallet holds and the only one an on-chain pool can trade. There is no exchange rate between the two and nothing converts one into the other automatically: the coin below never becomes epoch PEER, and epoch PEER is never spent to get it.' }));
      // The one crossing, named here because the card that does it is the very
      // next thing in this view. This used to be an absolute — nothing in this
      // app can turn epoch PEER into the coin below — with the claim card
      // rendered two hundred pixels lower doing precisely that, and the
      // misleading direction is the expensive one: a reader who believes there
      // is nothing to collect never scrolls to the only place in this app that
      // says an unbound handle gets no line at all, and that share is gone at
      // the sweep rather than waiting for them.
      body.appendChild(h('p', { class: 'smallnote', text: 'One crossing does exist, in the card below this one, and it runs one way only: the operator may deposit coins they already hold against an epoch\u2019s payout list, and a handle with an address bound before that epoch closed can then claim its line \u2014 paid in the coin below, at the number the log computed. Nobody is obliged to fund an epoch, a handle with no address bound gets no line in the list at all, and claiming does not spend the epoch PEER the line was computed from.' }));

      // ── the address, in full, because half an address reads as provenance ──
      body.appendChild(h('p', { class: 'eyebrow', style: 'margin:14px 0 4px',
        text: isFinite(chainId) ? 'the contract, on chain ' + chainId : 'the contract' }));
      var addrRow = h('div', { class: 'mini-form persistent' },
        h('span', { class: 'num', style: 'word-break:break-all', text: token }),
        h('button', { class: 'btn small', text: 'Copy address', onclick: function () {
          copyLine(token, 'Token address copied.');
        } }));
      // Only where the explorer is the one for this chain. An operator running
      // this app against another network gets no link rather than a wrong one.
      if (chainId === 8453) {
        addrRow.appendChild(h('a', { class: 'smallnote', target: '_blank', rel: 'noopener',
          href: 'https://basescan.org/token/' + token, text: 'check it on basescan' }));
      }
      body.appendChild(addrRow);
      body.appendChild(h('p', { class: 'smallnote', text: 'Read from this host, not from anything written into the page \u2014 whoever runs this app points it at their own deployment, so an address in the source would be one nobody checked.' }));

      // ── the actual answer to "where is it" ──
      var addRow = h('div', { class: 'mini-form persistent' });
      if (!chainHex) {
        addRow.appendChild(h('span', { class: 'smallnote', text: 'This host did not answer with a chain id, so this page cannot tell a wallet which network to ask \u2014 and a balance read on the wrong one would be some other token\u2019s, printed under this name. The address and the supply above are what the host reported; nothing here is read through a wallet until the host says which chain it serves.' }));
      } else if (window.ethereum) {
        addRow.appendChild(h('button', { class: 'btn small primary', text: 'Add to MetaMask', onclick: function () {
          addToWallet().catch(function (e) { toast('The wallet refused: ' + l2Err(e)); });
        } }));
        addRow.appendChild(h('span', { class: 'smallnote', text: 'This only tells the wallet that the token exists. It moves nothing, mints nothing and changes no balance: coins sent to an account are in it whether or not the wallet lists them, and MetaMask simply does not show a token it has never been told about. That is the whole of \u201cwhere is it\u201d.' }));
      } else {
        addRow.appendChild(h('span', { class: 'smallnote', text: 'No wallet in this browser. Anything sent to an account on ' + chainName + ' is in it regardless \u2014 open that account in a wallet on ' + chainName + ' and paste the address above under \u201cimport token\u201d to see it listed.' }));
      }
      body.appendChild(addRow);

      // ── connect, then read the two balances that decide what is possible ──
      var wRow = h('div', { class: 'mini-form persistent' });
      var balBox = h('div', {});
      // Only where there is a wallet to connect to. Without one this row has
      // nothing to say that the line beside the add button has not already
      // said, and an empty mini-form still draws its own box.
      if (window.ethereum && chainHex) body.appendChild(wRow);
      body.appendChild(balBox);

      // ── supply, so no share is read without its denominator ──
      body.appendChild(h('div', { class: 'kv', style: 'margin-top:10px' },
        h('span', { text: 'total supply' }), h('b', { class: 'num', text: l2Human(supply, dec) + ' PEER' }),
        h('span', { text: 'raw, at ' + dec + ' decimals' }), h('b', { class: 'num', text: supply.toString() })));
      // Said to EVERY reader, not only to the one address that holds it.
      // The note further down (\u201cthis account holds every PEER in
      // existence\u201d) is drawn only when the connected wallet IS that
      // address \u2014 which is the one person who already knew. Everybody
      // else saw a supply, a 0.00% share, and then a pool ratio a few
      // hundred pixels below, with nothing between the two to stop the
      // ratio being read as a market. This page cannot count holders
      // without an indexer, so it says exactly that and links the list
      // rather than inventing a distribution.
      body.appendChild(h('p', { class: 'smallnote', text: 'How that supply is HELD is not something this card can show. It reads one balance \u2014 the connected wallet\u2019s \u2014 and nothing about who holds the rest, so a token sitting entirely in one address and a token spread over thousands look identical here. A newly deployed token is normally the former, and a ratio in a pool is then a price its one holder chose rather than one a market found.' }));
      if (chainId === 8453) {
        body.appendChild(h('p', { class: 'smallnote' },
          h('a', { target: '_blank', rel: 'noopener', href: 'https://basescan.org/token/' + token + '#balances', text: 'who holds it, on basescan' })));
      }

      async function addToWallet() {
        if (!window.ethereum) { toast('There is no wallet in this browser to add it to.'); return; }
        var acct = l2Wallet || await l2Connect(chainHex, chainName);
        if (!acct) return;              // l2Connect already said why
        // MetaMask adds a token to the network the wallet is ON. Asked on the
        // wrong one it would list this address against a chain where nothing
        // is deployed at it, which is a permanent wrong entry in somebody's
        // wallet, so the chain is re-asked here rather than assumed from the
        // check made at connect time.
        var chain = await l2Eth('eth_chainId');
        if (!chainHex || !l2OnChain(chain, chainHex)) {
          l2Wallet = null;
          drawWallet();
          toast('The wallet is on chain ' + chain + ', not ' + chainName + ' \u2014 a token added there would point at an address with nothing behind it. Put it on ' + chainName + ' and connect again.');
          return;
        }
        // The symbol comes off the token itself. Not from this file: a wallet
        // listing somebody else's name for this contract is worse than a
        // button that refuses.
        var sym = l2Symbol(await l2Eth('eth_call', [{ to: token, data: L2_SEL.symbol }, 'latest']));
        if (!sym) { toast('That contract did not answer symbol() with a readable name, so nothing was added \u2014 a token listed under a name this page invented would be worse than one not listed.'); return; }
        var ok = await l2Eth('wallet_watchAsset', { type: 'ERC20', options: { address: token, symbol: sym, decimals: dec } });
        toast(ok === false
          ? 'The wallet declined to add it. Nothing changed \u2014 the coins are wherever they were either way.'
          : sym + ' is now listed in that wallet. No coin moved: this told the wallet the token exists, nothing more.');
      }

      async function readBalances() {
        var acct = l2Wallet;
        if (!acct) return;
        balBox.innerHTML = '';
        balBox.appendChild(h('p', { class: 'smallnote', text: 'Reading the chain\u2026' }));
        try {
          // Asked again at the last moment: l2Wallet outlives the check made
          // at connect time on purpose, so between connecting and now the
          // wallet may have moved to a network where these addresses hold no
          // code — or, worse, hold something else.
          var chain = await l2Eth('eth_chainId');
          if (!chainHex || !l2OnChain(chain, chainHex)) {
            l2Wallet = null;
            l2Bal = null;
            drawWallet();
            toast('That wallet is on chain ' + chain + ' now, not ' + chainName + '. Nothing was read \u2014 a balance from the wrong chain is not this token\u2019s balance.');
            return;
          }
          var peerRaw = l2Uint(await l2Eth('eth_call', [{ to: token, data: L2_SEL.balanceOf + l2Addr(acct) }, 'latest']), 'that account\u2019s PEER balance');
          var btcRaw = null, btcDec = 8;
          if (btc) {
            btcDec = Number(l2Uint(await l2Eth('eth_call', [{ to: btc, data: L2_SEL.decimals }, 'latest']), 'the cbBTC decimals'));
            btcRaw = l2Uint(await l2Eth('eth_call', [{ to: btc, data: L2_SEL.balanceOf + l2Addr(acct) }, 'latest']), 'that account\u2019s cbBTC balance');
          }
          // The wallet can switch accounts mid-read. Numbers read for one
          // address must never be printed under another.
          if (l2Wallet !== acct) return;
          l2Bal = { acct: acct, token: token, peer: peerRaw.toString(), btc: btcRaw === null ? null : btcRaw.toString(), btcDec: btcDec, at: Date.now() };
        } catch (e) {
          if (l2Wallet !== acct) return;
          balBox.innerHTML = '';
          balBox.appendChild(h('p', { class: 'smallnote', text: 'Could not read the balances: ' + l2Err(e) }));
          return;
        }
        showBalances();
      }

      function showBalances() {
        balBox.innerHTML = '';
        if (!l2Bal || l2Bal.acct !== l2Wallet || l2Bal.token !== token) return;
        var peerRaw = BigInt(l2Bal.peer);
        var kv = h('div', { class: 'kv' },
          h('span', { text: 'this account holds' }), h('b', { class: 'num', text: l2Human(peerRaw, dec) + ' PEER' }),
          h('span', { text: 'raw, at ' + dec + ' decimals' }), h('b', { class: 'num', text: peerRaw.toString() }));
        // Share of supply in basis points by integer division, so a hundred
        // per cent is a hundred per cent and a dust balance does not round up
        // into looking like one.
        if (supply > 0n) {
          var bp = peerRaw * 10000n / supply;
          kv.appendChild(h('span', { text: 'share of the whole supply' }));
          kv.appendChild(h('b', { class: 'num', text: bp === 0n && peerRaw > 0n ? 'under 0.01%' : (Number(bp) / 100).toFixed(2) + '%' }));
        }
        balBox.appendChild(kv);
        if (supply > 0n && peerRaw === supply) {
          // Neutral, and worth the sentence: a token one address holds all of
          // has never been priced by anybody, and a reader should know that
          // before reading a price into any number on this page.
          balBox.appendChild(h('p', { class: 'smallnote', text: 'This account holds every PEER in existence. Nobody else has any, no pool has ever traded it, and nothing has ever priced it \u2014 which is the ordinary state of a token on the day it is deployed, and not a claim about what it is worth.' }));
        }
        if (!btc) {
          balBox.appendChild(h('p', { class: 'smallnote', text: 'This host has no cbBTC address configured (PEER_BTC_ADDR is unset), so this card cannot say whether that account holds any. A pool trades PEER against cbBTC, so it is the other number to know before opening one.' }));
        } else if (l2Bal.btc === null) {
          balBox.appendChild(h('p', { class: 'smallnote', text: 'The cbBTC balance was not read.' }));
        } else {
          var btcRaw = BigInt(l2Bal.btc);
          var btcKv = h('div', { class: 'kv' });
          btcKv.appendChild(h('span', { text: 'and cbBTC' }));
          btcKv.appendChild(h('b', { class: 'num', text: l2Human(btcRaw, l2Bal.btcDec) + ' cbBTC' }));
          btcKv.appendChild(h('span', { text: 'raw, at ' + l2Bal.btcDec + ' decimals' }));
          btcKv.appendChild(h('b', { class: 'num', text: btcRaw.toString() }));
          balBox.appendChild(btcKv);
          if (btcRaw === 0n) {
            // Said here, where it is cheap, rather than three clicks later at
            // a wallet prompt that reverts.
            balBox.appendChild(h('p', { class: 'smallnote', style: 'border-left:2px solid var(--ember); padding-left:9px', text: 'This account holds no cbBTC. Every pool here is PEER against cbBTC \u2014 bitcoin custodied by Coinbase and issued as a token on Base \u2014 so opening a pool or adding to one needs some in this same account. Nothing in this app can create it: it is bridged or bought on Base like any other coin.' }));
          }
        }
        balBox.appendChild(h('p', { class: 'smallnote', text: 'Read from the chain by this browser at ' + new Date(l2Bal.at).toLocaleTimeString() + ', through the connected wallet \u2014 not from this host, and not from the log.' }));
      }

      function drawWallet() {
        wRow.innerHTML = '';
        balBox.innerHTML = '';
        // The row is not in the document at all without a wallet, nor
        // without a chain from the host to point one at.
        if (!window.ethereum || !chainHex) return;
        if (!l2Wallet) {
          wRow.appendChild(h('button', { class: 'btn small', text: 'Connect wallet', onclick: function () {
            l2Connect(chainHex, chainName).then(function (a) { if (a) drawWallet(); })
              .catch(function (e) { toast('Connect failed: ' + l2Err(e)); });
          } }));
          wRow.appendChild(h('span', { class: 'smallnote', text: 'Connecting shows an address and reads two balances. It signs nothing, and this page never sees a key.' }));
          return;
        }
        wRow.appendChild(h('span', { class: 'smallnote num', style: 'word-break:break-all', text: l2Wallet + ' \u00b7 ' + chainName }));
        wRow.appendChild(h('button', { class: 'btn small', text: 'Read again', onclick: function () { readBalances(); } }));
        // A remembered read is shown at once and its clock time with it; a
        // stale or missing one is re-read. Re-rendering this tab should not
        // cost three more calls through somebody's wallet.
        if (l2Bal && l2Bal.acct === l2Wallet && l2Bal.token === token && Date.now() - l2Bal.at < 60000) showBalances();
        else readBalances();
      }

      // The wallet's own events reach whichever card is on screen through
      // this one slot; the pools card sets it the same way when it renders,
      // and the two are never mounted at once. Only claimed if this card is
      // actually in the document — a fetch that lands after the reader has
      // moved on must not take the hook away from the card they moved to.
      if (card.isConnected) l2Redraw = function () { drawWallet(); };
      drawWallet();
    }

    only('Asking this host which token it serves\u2026');
    // One fetch per render of this tab, like the pools card: the host answers
    // from a 30-second cache, so flipping between tabs cannot become load on
    // the public Base RPC.
    fetch(API + '/api/token/onchain', { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (x) { draw(x.status, x.d); })
      .catch(function () {
        only('Could not reach this host to ask which token it serves, so there is no address here that anybody verified \u2014 and this card will not print one from memory. Nothing above is affected: that PEER is the epoch token in this network\u2019s log and was never on a chain.');
      });
    return card;
  }

  /**
   * Epoch earnings: binding an address, what an epoch owes, and claiming it.
   *
   * Three sources feed this card and they are never blended, because the whole
   * value of the card is in keeping them apart:
   *
   *   THIS LOG (st)  — which epochs credited this handle and which address is
   *                    bound to it. Local, instant, replayable by anyone.
   *   THIS HOST      — GET /api/v1/epoch/N/claim: the earnings tree for one
   *                    epoch, the amount in raw units, the proof PeerClaim
   *                    takes, and what the host can see of that epoch on the
   *                    chain. The proof is used exactly as it arrives; the
   *                    encoding is position-dependent and a second derivation
   *                    in the browser would be a second thing to keep in step.
   *   THE CHAIN      — read through the reader's OWN wallet: whether this
   *                    address has already claimed, the free dry run before a
   *                    signature, and the receipt afterwards.
   *
   * The sentence this card exists to avoid is "you are owed 4,000 PEER" said
   * about an epoch nobody has funded. PEER has no mint: every claim is a
   * transfer out of holdings the operator already has, made only if they
   * choose to open and fund that epoch, and where no claim contract is
   * configured at all the honest answer is that these earnings are a number in
   * a log and nothing else. So "the log credited you", "somebody deposited
   * money behind it" and "you can take it now" are three separate statements
   * here, in that order, and the button only ever appears under the third.
   */
  function l2ClaimCard(st) {
    var card = h('div', { class: 'card', style: 'margin-top:14px' },
      h('h2', {}, term('earnings', 'Epoch earnings'), ' \u2014 getting paid on Base'));
    var body = h('div', {});
    card.appendChild(body);

    var me = who;
    if (!me) {
      body.appendChild(h('p', { class: 'smallnote', text: 'Nobody is signed in here, so there is no handle to bind an address to and nothing to claim.' }));
      return card;
    }

    // PeerClaim's selectors, each beside the signature it hashes from — the
    // same policy as the pools card and chain-l2/onchain.mjs: no keccak in
    // this page. Recompute any of them with `cast sig '<signature>'`.
    var CL_SEL = {
      claim: '0xae0b51df',        // claim(uint256,uint256,bytes32[])
      checkClaim: '0x65574c78',   // checkClaim(uint256,address,uint256,bytes32[])
      claimed: '0x120aa877',      // claimed(uint256,address)
      epochInfo: '0x3894228e'     // epochInfo(uint256)
    };
    var WARN = 'border-left:2px solid var(--ember); padding-left:9px';
    var ROWS = 6;   // epochs asked about per press, newest first
    // How many rows are on screen. It only rises, and only when somebody asks.
    // The cap is there because every row costs one host read and one chain
    // read, which is a reason to ask in batches and no reason at all to make
    // an epoch unreachable: nothing else in this app renders an epoch row, so
    // a funded, open, still-matching epoch pushed off the bottom by a busy
    // afternoon of closes had no route to a Claim button until its window ran
    // out and the remainder swept back to the steward.
    var shownN = ROWS;

    function note(t, style) { return h('p', { class: 'smallnote', style: style || '', text: t }); }
    /** A uint as a 32-byte argument word. */
    function w256(v) { return BigInt(v).toString(16).padStart(64, '0'); }
    /** A bytes32 as it arrives from the host (0x-prefixed) as an argument word. */
    function w32(x) { return String(x).replace(/^0x/, '').toLowerCase().padStart(64, '0'); }
    /** A chain deadline in words. The clock is named, because it is not the
     *  chain's — a browser an hour out would otherwise state a deadline as
     *  fact that the contract disagrees with. */
    function when(sec) {
      var v = Number(sec);
      if (!isFinite(v) || v <= 0) return 'no deadline this host could read';
      var days = Math.round((v * 1000 - Date.now()) / 86400000);
      return new Date(v * 1000).toLocaleString() + ' \u2014 '
        + (days >= 0 ? 'about ' + days + ' day(s) from now' : Math.abs(days) + ' day(s) ago')
        + ', by this computer\u2019s clock';
    }

    // ── first, the thing that is true of every row below ──
    body.appendChild(note('Epoch earnings are paid OUT OF THE OPERATOR\u2019S OWN HOLDINGS. The PEER token on Base has no mint \u2014 its supply is fixed and nothing in this app can add to it \u2014 so an epoch is paid only if the operator deposits coins they already hold against it. Everything below says which of those two things has happened.'));

    // What the chain block is anchored to, once any epoch answer has named it.
    // Never a constant in this file: a different operator runs a different
    // contract on a different chain.
    var claimAddr = null, chainHex = null, chainName = null;
    var rowPaints = [];       // every row's repaint, so a wallet change reaches all of them
    var wRow = h('div', { class: 'mini-form persistent' });

    function redrawAll() {
      drawWallet();
      drawBind();
      for (var i = 0; i < rowPaints.length; i++) { try { rowPaints[i](); } catch (e) {} }
    }

    // ── 1. binding ────────────────────────────────────────────────────────
    var bindBox = h('div', {});
    body.appendChild(bindBox);

    function drawBind() {
      bindBox.innerHTML = '';
      var bound = (st.addresses || {})[me] || '';
      bindBox.appendChild(h('p', { class: 'eyebrow', style: 'margin:16px 0 4px' },
        term('binding', 'where this handle is paid')));
      if (bound) {
        bindBox.appendChild(h('div', { class: 'kv' },
          h('span', { text: 'bound to' }),
          h('b', { class: 'num', style: 'word-break:break-all', text: bound })));
        bindBox.appendChild(note('Whoever holds that address collects this handle\u2019s earnings from the epochs that close from now on. It is public: the binding is an act in this log like everything else.'));
      } else {
        // The loudest sentence on the card, and it is here rather than in a
        // row because a row is read after the epoch closed, which is too late
        // for it to be worth anything.
        bindBox.appendChild(h('p', { class: 'smallnote', style: WARN },
          'No address is bound to this handle. An epoch\u2019s payout list is built from the bindings as they stood AT ITS CLOSE, and a handle with no address gets no line in it at all \u2014 not a line worth zero, no line. That share is not held for you: it stays with whoever funded the epoch and returns to them at the ',
          term('sweep', 'sweep'),
          '. Bind an address before the next close, or this repeats.'));
      }

      var row = h('div', { class: 'mini-form persistent' });
      bindBox.appendChild(row);
      if (!window.ethereum) {
        row.appendChild(h('span', { class: 'smallnote', text: 'There is no wallet in this browser to take an address from. Open this app in a browser with one \u2014 the address is never typed here, because a typo in an address cannot be detected and would send these earnings somewhere nobody can reach.' }));
        return;
      }
      if (!l2Wallet) {
        row.appendChild(h('button', { class: 'btn small', text: 'Connect a wallet', onclick: function () {
          // The chain to connect to is the one the host names for its claim
          // contract, and only once an epoch answer has named it. Before
          // that, Base is the default this page has always used — connecting
          // reads an address and signs nothing either way.
          l2Connect(chainHex, chainName).then(function (a) { if (a) redrawAll(); })
            .catch(function (e) { toast('Connect failed: ' + l2Err(e)); });
        } }));
        row.appendChild(h('span', { class: 'smallnote', text: 'Connecting shows an address. It signs nothing, records nothing, and this page never sees a key.' }));
        return;
      }
      row.appendChild(h('span', { class: 'smallnote num', style: 'word-break:break-all', text: 'wallet ' + l2Wallet }));
      if (l2Wallet === String(bound).toLowerCase()) {
        row.appendChild(h('span', { class: 'smallnote', text: '\u2014 which is the address already bound. Nothing to change.' }));
        return;
      }
      row.appendChild(h('button', { class: 'btn small', text: bound ? 'Bind this wallet instead' : 'Bind this wallet', onclick: function () { confirmBind(l2Wallet, bound); } }));
    }

    /**
     * Read the address back, in full, before it is recorded.
     *
     * Not a confirm() and not a short form of the address: this is the one
     * screen where somebody should compare 40 characters against their wallet,
     * and a truncated address is precisely how a wrong one gets past a person
     * who was looking straight at it.
     */
    function confirmBind(addr, bound) {
      // One confirmation at a time. Pressed twice, the old shape stacked two
      // identical blocks and the reader confirmed the one they were not
      // looking at.
      var open = bindBox.querySelector('[data-confirm]');
      if (open) open.remove();
      var box = h('div', { style: 'margin-top:10px', 'data-confirm': '1' });
      bindBox.appendChild(box);
      box.appendChild(h('p', { class: 'eyebrow', style: 'margin:6px 0 4px', text: 'bind this handle\u2019s earnings to' }));
      box.appendChild(h('p', { class: 'num', style: 'word-break:break-all; margin:0 0 6px', text: addr }));
      box.appendChild(note('Read it against the wallet before pressing. Nothing here can check it: an address is 20 bytes and any 20 bytes are a valid one, and the checksum a wallet shows is keccak-based while this codebase carries no keccak on purpose. A wrong address is earnings paid to somebody else, or to nobody, permanently.'));
      box.appendChild(note('Whoever holds this address can claim this handle\u2019s earnings from now on. That is the whole security of it \u2014 there is no second check and no way to reverse a payment.', WARN));
      box.appendChild(h('p', { class: 'smallnote' },
        'It applies to FUTURE epochs only. Epochs that have already closed have their payout lists published, and a published ',
        term('merkle', 'root'),
        ' cannot be recomputed \u2014 so this changes nothing about what they pay, including epochs where this handle was unbound and therefore has no line at all.'));
      if (bound) box.appendChild(note('This replaces ' + bound + ' from the next close onward. Anything already claimable at that address stays claimable there.'));
      var go = h('div', { class: 'mini-form persistent' });
      box.appendChild(go);
      go.appendChild(h('button', { class: 'btn small primary', text: 'Bind ' + addr.slice(0, 10) + '\u2026' + addr.slice(-6), onclick: function () { submitBind(addr); } }));
      go.appendChild(h('button', { class: 'btn small ghost', text: 'Cancel', onclick: function () { box.remove(); } }));
    }

    function submitBind(addr) {
      // The host refuses this act from a handle with NO CREDENTIAL, and it is
      // right to: an unsecured handle is claimable by anyone who knows its id,
