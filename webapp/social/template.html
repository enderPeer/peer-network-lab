    fetch(API + '/api/ice', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.iceServers && d.iceServers.length) {
          iceServers = d.iceServers;
          iceRelayKind = d.relay || null;
        }
      })
      .catch(function () {});
  }

  /**
   * Report the path the call actually took. A relayed call is still encrypted
   * end to end — the relay forwards packets it cannot read — but it is not
   * peer-to-peer, and the dock says "peer-to-peer" everywhere else. Saying
   * "direct" when a third party is forwarding the audio would be exactly the
   * kind of claim this project keeps having to take back.
   */
  function describePath(c) {
    if (!c.pc || !c.pc.getStats) return;
    c.pc.getStats(null).then(function (stats) {
      var pair = null, local = {};
      stats.forEach(function (r) {
        if (r.type === 'local-candidate') local[r.id] = r;
        if (r.type === 'candidate-pair' && (r.selected || r.state === 'succeeded') && !pair) pair = r;
      });
      var lc = pair && local[pair.localCandidateId];
      var relayed = !!(lc && lc.candidateType === 'relay');
      if (!call || call.pc !== c.pc) return;
      call.relayed = relayed;
      callUI();
      if (relayed) {
        toast('Connected through a relay — your two networks had no direct path. Still encrypted end to end; the relay cannot hear it, but it does carry it.');
      }
    }).catch(function () {});
  }

  /**
   * Gather ICE candidates against the current configuration and report what
   * came back. This exists because a relay that is configured is not the same
   * as a relay that works: the first thing tried here was a public TURN service
   * that accepted connections and no longer spoke STUN, which would have looked
   * like a fix and changed nothing. A 'relay' candidate is the only proof.
   */
  function testRelay() {
    if (!window.RTCPeerConnection) return Promise.resolve({ error: 'This browser has no WebRTC.' });
    var pc = new RTCPeerConnection({ iceServers: iceServers, iceCandidatePoolSize: 1 });
    var types = { host: 0, srflx: 0, relay: 0 };
    try { pc.createDataChannel('probe'); } catch (e) {}
    pc.onicecandidate = function (ev) {
      if (!ev.candidate) return;
      var m = / typ (\w+)/.exec(ev.candidate.candidate || '');
      var t = ev.candidate.type || (m && m[1]);
      if (types[t] !== undefined) types[t]++;
    };
    return pc.createOffer()
      .then(function (o) { return pc.setLocalDescription(o); })
      .then(function () {
        return new Promise(function (res) {
          var settled = false;
          function fin() { if (!settled) { settled = true; res(); } }
          pc.onicegatheringstatechange = function () { if (pc.iceGatheringState === 'complete') fin(); };
          setTimeout(fin, 8000);
        });
      })
      .then(function () {
        try { pc.close(); } catch (e) {}
        return { types: types, relayKind: iceRelayKind };
      })
      .catch(function (e) { try { pc.close(); } catch (x) {} return { error: e.message }; });
  }

  // ══ Live streaming ════════════════════════════════════════════════════════
  //
  // The video does not travel between browsers any more. It goes up to the
  // host and comes back down again, because a connection to the host is the
  // one path every viewer demonstrably has — it is how they loaded this page.
  //
  // The peer-to-peer version failed in the field with the least useful symptom
  // a program can have: the viewer joins, the picture stays black, and nothing
  // says why. The host's own /api/ice endpoint had the answer printed on it the
  // whole time — "relay": "none". Two ends behind carrier-grade NAT, which is
  // most mobile networks, have no route to each other at all, and retrying does
  // not discover a path that does not exist. It also multiplied the
  // broadcaster's upload by the size of the audience.
  //
  // Now MediaRecorder encodes here, the bytes go up one WebSocket, and the host
  // fans them out. webapp/stream.mjs explains why a WebSocket rather than a
  // plain streaming response: measured through this host's tunnel, a chunked
  // response is held back and released in 128 KB lumps, which for a quiet
  // webcam is eight seconds of "live".
  var live = null;     // broadcaster: see broadcastStart
  var watching = null; // viewer: see watchStart
  var liveList = [];   // what the host says is on air

  // Containers this browser might record, best first. WebM leads because its
  // pieces come out every 400ms; an MP4 fragment cannot leave the encoder until
  // a whole group of pictures is finished, which measured at one and a half to
  // two seconds. MP4 is still listed, because it is the only thing an iPhone
  // can play back — see the rendition negotiation below.
  // Every entry names its codecs. A bare 'video/webm' is accepted by
  // MediaRecorder and REFUSED by MediaSource, so a broadcast in it would be
  // one nobody could play — the app would work and the viewers would not.
  var STREAM_FORMATS = [
    // camera and microphone
    'video/webm;codecs=vp8,opus',
    'video/webm;codecs=vp9,opus',
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    // camera, no microphone
    'video/webm;codecs=vp8',
    'video/webm;codecs=vp9',
    'video/mp4;codecs=avc1.42E01E',
    // microphone only
    'audio/webm;codecs=opus',
    'audio/mp4;codecs=mp4a.40.2',
  ];
  // Safari on the iPhone has no MediaSource; it has ManagedMediaSource from
  // iOS 17.1, which is the same idea with the browser deciding when it wants
  // data. Everything below works with either.
  var MSE = window.ManagedMediaSource || window.MediaSource || null;

  function canRecord() {
    if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return [];
    return STREAM_FORMATS.filter(function (m) {
      try { return MediaRecorder.isTypeSupported(m); } catch (e) { return false; }
    });
  }

  /**
   * The formats that match what this stream actually carries.
   *
   * Announcing vp8,opus for a camera with no microphone produces a file whose
   * header promises an audio track that never arrives, and the viewer's
   * MediaSource refuses the whole stream with "initialization segment misses
   * expected opus track" — found by watching a real broadcast fail, not by
   * reading the specification.
   */
  function recordFormatsFor(stream) {
    var hasAudio = stream.getAudioTracks().length > 0;
    var hasVideo = stream.getVideoTracks().length > 0;
    return canRecord().filter(function (m) {
      var carriesAudio = /opus|mp4a/.test(m);
      var carriesVideo = /vp8|vp9|avc1/.test(m);
      return carriesAudio === hasAudio && carriesVideo === hasVideo;
    });
  }
  function canPlayStream() {
    if (!MSE || !MSE.isTypeSupported) return [];
    return STREAM_FORMATS.filter(function (m) {
      try { return MSE.isTypeSupported(m); } catch (e) { return false; }
    });
  }
  function fmtShort(mime) { return String(mime).indexOf('mp4') >= 0 ? 'MP4' : 'WebM'; }
  function streamSocket(role, cid) {
    var base = API || location.origin;
    return new WebSocket(base.replace(/^http/, 'ws')
      + '/api/stream/ws?role=' + role + '&s=' + encodeURIComponent(cid));
  }

  // ── broadcasting ─────────────────────────────────────────────────────────

  function broadcastStop(note) {
    if (!live) return;
    live.state = 'stopping';
    live.recs.forEach(function (r) { if (r) { try { r.rec.stop(); } catch (e) {} } });
    if (live.stream) live.stream.getTracks().forEach(function (t) { t.stop(); });
    try { live.ws.close(); } catch (e) {}
    fetch(API + '/api/live', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ as: who, auth: pins[who] || '', stop: true }),
    }).catch(function () {});
    live = null;
    render();
    if (note) toast(note);
  }

  function broadcastStart(title, withVideo) {
    if (!REMOTE) { toast('Streaming needs the hosted network — there is nothing to relay through in the private sandbox.'); return; }
    if (live) { toast('You are already live.'); return; }
    if (watching) watchStop();
    if (!canRecord().length) {
      toast('This browser cannot encode video for streaming: it has no MediaRecorder support.'); return;
    }
    if (!navigator.mediaDevices || !window.isSecureContext) {
      toast('Streaming needs camera access over HTTPS — this context has neither.'); return;
    }
    // The relay refuses a handle with no PIN, and it refuses AFTER the stream
    // act has already been minted and paid for. Measured on the live log:
    // twenty-six of twenty-six broadcasts were published by handles that could
    // not open a relay, burning θ each for a permanent node nobody could ever
    // join — one of them titled 'no pin'. Ask first.
    if (!replay().pinHash[who]) {
      toast('Set a PIN before broadcasting — a stream puts your face and your voice on this handle, and the relay will not carry one without it.');
      return;
    }
    navigator.mediaDevices.getUserMedia({
      audio: true,
      video: withVideo ? { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } } : false,
    })
      .then(function (stream) {
        // The act first: going live is a priced, recorded gesture, and it mints
        // the node people react to. The id can only be read AFTER the act has
        // landed and been replayed — reading it before attaches the stream to
        // the previous one, which is exactly what the first version did.
        pushAct({ t: 'stream', author: who, text: title, a: 0.8 }, function () {
          var st = replay();
          var mine = Object.keys(st.creators).filter(function (c) {
            return st.creators[c] === who && st.postMeta[c] && st.postMeta[c].stream;
          }).sort(function (a, b) { return st.postMeta[a].idx - st.postMeta[b].idx; });
          var cid = mine.length ? mine[mine.length - 1] : null;
          if (!cid) {
            stream.getTracks().forEach(function (t) { t.stop(); });
            toast('The network did not record the stream, so there is nothing to join. Nothing was broadcast.');
            return;
          }
          var formats = recordFormatsFor(stream);
          if (!formats.length) {
            stream.getTracks().forEach(function (t) { t.stop(); });
            toast('This browser cannot encode ' + (stream.getVideoTracks().length ? 'video' : 'audio') + ' in any format the network can relay.');
            return;
          }
          openRelay(cid, title, stream, formats);
        });
      })
      .catch(function () { toast('Could not open the camera or microphone — check the browser permissions for this site.'); });
  }

  /** Ask the host for a broadcast key, then open the socket the video rides. */
  function openRelay(cid, title, stream, formats) {
    fetch(API + '/api/stream/open', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ as: who, auth: pins[who] || '', cid: cid, title: title, can: formats }),
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (res) {
      if (!res.ok) {
        stream.getTracks().forEach(function (t) { t.stop(); });
        // The host's refusals carry their own explanation; showing it beats
        // inventing a shorter one that says less.
        toast((res.d.error || 'The host refused the broadcast.') + (res.d.fix ? ' — ' + res.d.fix : ''));
        return;
      }
      var ws = streamSocket('push', cid);
      live = {
        cid: cid, title: title, stream: stream, ws: ws, recs: [], formats: formats,
        limits: res.d.limits || {}, t0: Date.now(), state: 'connecting', note: '', el: null, warned: false,
      };
      // Build the recorder before announcing anything, and announce ITS idea
      // of what it will produce. What was asked for and what comes out are not
      // always the same string, and the viewer's decoder is configured from
      // this one — a mismatch there is a stream that plays for nobody.
      var first = makeRecorder(formats[0]);
      if (!first) {
        broadcastStop('This browser refused to start the encoder.');
        return;
      }
      live.recs[0] = { index: 0, mime: first.mimeType || formats[0], rec: first, started: false };
      render();
      ws.onopen = function () {
        ws.send(JSON.stringify({ t: 'auth', key: res.d.key, mime: live.recs[0].mime }));
      };
      ws.onmessage = function (ev) {
        var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.t === 'ready') {
          startRendition(0);
          live.state = 'live'; render();
          toast('You are live. Your broadcast is a post in everyone’s feed, and it is listed at the top of the feed while it runs.');
        } else if (m.t === 'need') {
          addRendition(m.mime);
        } else if (m.t === 'drop') {
          dropRendition(m.mime);
        } else if (m.t === 'error') {
          broadcastStop(m.why || 'The host stopped the broadcast.');
        }
      };
      ws.onclose = function (e) {
        if (!live || live.state === 'stopping') return;
        broadcastStop((e && e.reason) || 'The connection to the host closed, so the broadcast ended.');
      };
    }).catch(function () {
      stream.getTracks().forEach(function (t) { t.stop(); });
      toast('Could not reach the host to start the broadcast.');
    });
  }

  function makeRecorder(mime) {
    if (!live) return null;
    var opts = { mimeType: mime, videoBitsPerSecond: 1200000, audioBitsPerSecond: 64000 };
    try { return new MediaRecorder(live.stream, opts); }
    catch (e) {
      try { return new MediaRecorder(live.stream, { mimeType: mime }); } catch (e2) { return null; }
    }
  }

  function startRendition(index) {
    if (!live || !live.recs[index] || live.recs[index].started) return;
    var rec = live.recs[index].rec;
    rec.ondataavailable = function (ev) {
      if (!live || !ev.data || !ev.data.size || live.ws.readyState !== 1) return;
      // An upload that cannot keep up shows as the socket's queue growing. It
      // is better to say so and stop than to let it grow until the tab dies
      // with no explanation at all.
      var queued = live.ws.bufferedAmount;
      if (queued > 12 * 1048576) { broadcastStop('Your upload could not keep up with the video, so the broadcast stopped.'); return; }
      if (queued > 4 * 1048576 && !live.warned) {
        live.warned = true;
        toast('Your upload is falling behind the video — viewers may see it stall.');
      }
      // One byte in front says which format these bytes belong to, so a single
      // ordered socket carries every rendition. Two sockets would race, and
      // media that arrives out of order does not decode.
      live.ws.send(new Blob([new Uint8Array([index]), ev.data]));
    };
    try { rec.start(400); } catch (e) { broadcastStop('The encoder refused to start.'); return; }
    live.recs[index].started = true;
  }

  /**
   * A viewer turned up who cannot decode what is being sent. The host asks for
   * a format they can, and it is only started now — nobody's upload is spent
   * on a second copy nobody is watching.
   */
  function addRendition(mime) {
    if (!live || live.formats.indexOf(mime) < 0) return;
    for (var i = 0; i < live.recs.length; i++) if (live.recs[i] && live.recs[i].mime === mime) return;
    var index = live.recs.length;
    if (index >= 2) return;
    var rec = makeRecorder(mime);
    if (!rec) return;
    live.recs[index] = { index: index, mime: rec.mimeType || mime, rec: rec, started: false };
    live.ws.send(JSON.stringify({ t: 'rendition', i: index, mime: live.recs[index].mime }));
    startRendition(index);
    live.note = 'Also sending ' + fmtShort(mime) + ', because somebody joined on a device that cannot play ' + fmtShort(live.formats[0]) + '.';
    render();
  }

  function dropRendition(mime) {
    if (!live) return;
    for (var i = 1; i < live.recs.length; i++) {
      if (live.recs[i] && live.recs[i].mime === mime) {
        try { live.recs[i].rec.stop(); } catch (e) {}
        live.recs[i] = null;
        live.note = '';
        render();
      }
    }
  }

  // ── watching ─────────────────────────────────────────────────────────────

  function watchStop() {
    if (!watching) return;
    try { watching.ws.close(); } catch (e) {}
    if (watching.objectUrl) { try { URL.revokeObjectURL(watching.objectUrl); } catch (e) {} }
    watching = null;
    render();
  }

  function watchStart(entry) {
    if (!REMOTE) { toast('Watching a live stream needs the hosted network.'); return; }
    if (live) { toast('End your own broadcast before joining another.'); return; }
    if (watching) watchStop();
    var playable = canPlayStream();
    if (!playable.length) {
      toast('This browser cannot play a relayed live stream — it has no MediaSource. Everything else in the app still works.');
      return;
    }
    // One element, kept on the state object, so a re-render cannot replace it
    // and restart playback.
    var el = h('video', { class: 'stream-video', autoplay: '', playsinline: '' });
    el.muted = true;
    watching = {
      author: entry.author, cid: entry.cid, el: el, t0: Date.now(), muted: true,
      state: 'connecting', note: 'Opening the connection to the host…',
      ms: null, sb: null, queue: [], mime: null, bytes: 0, started: false, objectUrl: null,
      ws: streamSocket('watch', entry.cid),
    };
    var ws = watching.ws;
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () {
      if (!watching) return;
      ws.send(JSON.stringify({ t: 'can', list: playable }));
      watching.note = 'Asking the host for the stream…';
      render();
    };
    ws.onmessage = function (ev) {
      if (!watching) return;
      if (typeof ev.data === 'string') {
        var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.t === 'start') beginPlayback(m.mime);
        else if (m.t === 'wait') { watching.state = 'waiting'; watching.note = m.why || 'Waiting for a format this device can play…'; render(); }
        // 'hold' means the host has the header but no clean place to start
        // yet; it lets us in at the broadcaster's next full frame. Saying so
        // beats a silent wait that looks identical to a failure.
        else if (m.t === 'hold') { watching.note = (m.why || 'waiting for the next full frame') + '…'; render(); }
        else if (m.t === 'no') { watching.state = 'refused'; watching.note = m.why || 'The host refused.'; render(); }
        return;
      }
      watching.bytes += ev.data.byteLength;
      watching.queue.push(new Uint8Array(ev.data));
      pumpStream();
    };
    ws.onclose = function (e) {
      if (!watching) return;
      // A close ALWAYS carries a reason now. The failure this replaces was a
      // viewer sitting in front of a black rectangle with nothing to read.
      watching.state = watching.started ? 'ended' : 'failed';
      watching.note = (e && e.reason) || 'The connection to the host closed.';
      render();
    };
    ws.onerror = function () {
      if (!watching || watching.started) return;
      watching.state = 'failed';
      watching.note = 'Could not open the media connection to the host.';
      render();
    };
    render();
  }

  function beginPlayback(mime) {
    if (!watching || !MSE) return;
    var w = watching;
    w.mime = mime;
    w.state = 'buffering';
    w.note = 'Receiving video…';
    var ms = new MSE();
    w.ms = ms;
    if (window.ManagedMediaSource && ms instanceof window.ManagedMediaSource) {
      // Safari's variant is attached as an object rather than through a URL,
      // and it asks for data only while it wants it. Written from the API, not
      // verified on a real iPhone from here — said plainly rather than claimed.
      w.el.disableRemotePlayback = true;
      w.el.srcObject = ms;
    } else {
      w.objectUrl = URL.createObjectURL(ms);
      w.el.src = w.objectUrl;
    }
    ms.addEventListener('sourceopen', function () {
      if (!watching || watching.ms !== ms) return;
      try { watching.sb = ms.addSourceBuffer(mime); }
      catch (e) {
        watching.state = 'refused';
        watching.note = 'This browser said it could play ' + mime + ' and then refused it.';
        render(); return;
      }
      watching.sb.addEventListener('updateend', afterAppend);
      watching.sb.addEventListener('error', function () {
        if (!watching) return;
        watching.state = 'error';
        watching.note = 'The browser rejected the video data.';
        render();
      });
      pumpStream();
    });
    render();
  }

  /**
   * Coming back to a hidden tab. Browsers pause a muted video-only stream in
   * the background, and on return the element would resume minutes behind
   * with no way for the viewer to know they were not watching the present.
   */
  function resumeWatching() {
    var w = watching;
    if (!w || !w.el || w.state !== 'playing') return;
    try {
      var b = w.el.buffered;
      if (b.length) w.el.currentTime = b.end(b.length - 1) - 0.5;
    } catch (e) {}
    w.el.play().catch(function () {});
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) resumeWatching();
  });

  function pumpStream() {
    var w = watching;
    if (!w || !w.sb || w.sb.updating || !w.queue.length) return;
    var chunk = w.queue.shift();
    try { w.sb.appendBuffer(chunk); }
    catch (e) {
      if (e && e.name === 'QuotaExceededError') { w.queue.unshift(chunk); evictBuffered(true); }
      else { w.state = 'error'; w.note = 'The browser rejected the video data: ' + ((e && e.message) || e); render(); }
    }
  }

  /** Drop what has already been watched: a long broadcast fills the buffer. */
  function evictBuffered(hard) {
    var w = watching;
    if (!w || !w.sb || w.sb.updating) return;
    var b = w.sb.buffered;
    if (!b.length) return;
    var keepFrom = Math.max(b.start(0), (w.el.currentTime || 0) - (hard ? 4 : 20));
    if (keepFrom > b.start(0) + 1) { try { w.sb.remove(b.start(0), keepFrom); } catch (e) {} }
  }

  function afterAppend() {
    var w = watching;
    if (!w || !w.sb) return;
    var b;
    try { b = w.sb.buffered; } catch (e) { return; }
    if (b.length) {
      var end = b.end(b.length - 1);
      if (!w.started) {
        w.started = true;
        // A joiner is handed the newest keyframe, which may be a couple of
        // seconds old. Start there, then stay at the edge — otherwise the
        // viewer is permanently that far behind and never finds out why.
        try { w.el.currentTime = b.start(0); } catch (e) {}
        w.el.play().catch(function () {});
        w.state = 'playing'; w.note = '';
        render();
      } else if (!w.el.paused && end - w.el.currentTime > 3) {
        // Only chase the edge while actually playing. A browser that paused
        // the video — Chrome stops muted, video-only media in a background
        // tab to save power — would otherwise be seeked forward every couple
        // of seconds for as long as the tab stayed hidden.
        try { w.el.currentTime = end - 0.5; } catch (e) {}
      }
      if (end - b.start(0) > 45) evictBuffered(false);
    }
    pumpStream();
  }

  function makePc() {
    var pc = new RTCPeerConnection({ iceServers: iceServers, iceCandidatePoolSize: 2 });
    // Remember what kinds of candidate we managed to gather. When a call fails
    // this is the difference between a useful sentence and a shrug: no relay
    // candidate means the two networks had no path and no relay to fall back
    // on, which is a configuration answer, not a mystery.
    call.cand = { host: 0, srflx: 0, relay: 0 };
    pc.onicecandidate = function (ev) {
      if (!ev.candidate || !call) return;
      var t = ev.candidate.type || (/ typ (\w+)/.exec(ev.candidate.candidate || '') || [])[1];
      if (call.cand && t && call.cand[t] !== undefined) call.cand[t]++;
      signalSend('ice', call.peer, JSON.parse(JSON.stringify(ev.candidate)));
    };
    pc.ontrack = function (ev) {
      if (!call) return;
      call.audio.srcObject = (ev.streams && ev.streams[0]) || new MediaStream([ev.track]);
      call.audio.play().catch(function () {});
    };
    pc.onconnectionstatechange = function () {
      if (!call || !call.pc) return;
      var cs = call.pc.connectionState;
      if (cs === 'connected' && call.state !== 'live') {
        call.state = 'live'; call.t0 = Date.now(); clearTimeout(call.timer); callUI();
        describePath(call); // says truthfully whether this call is direct or relayed
      } else if (cs === 'failed') {
        var c = call.cand || {};
        endCall(true, c.relay
          ? 'Connection failed even through the relay — one side is probably blocking UDP and TCP relay ports.'
          : 'Connection failed: no path between these two networks, and no relay was available. '
            + 'This is what happens when both ends sit behind carrier-grade NAT, common on mobile networks. '
            + 'The operator can fix it by configuring a TURN relay.', 'failed');

  var MM_CS = 'metamask-contentscript', MM_INPAGE = 'metamask-inpage', MM_CH = 'metamask-multichain-provider';

    var m = d.data.data;
    if (m && m.id != null && mmPending[m.id]) { mmPending[m.id](m); delete mmPending[m.id]; }
  });

    return new Promise(function (resolve, reject) {
      var id = ++mmSeq;
      var to = setTimeout(function () { delete mmPending[id]; reject(new Error('no answer')); }, ms || 60000);
      mmPending[id] = function (m) { clearTimeout(to); m.error ? reject(new Error(m.error.message || 'refused')) : resolve(m.result); };
      window.postMessage({ target: MM_CS, data: { name: MM_CH, data: { jsonrpc: '2.0', id: id, method: method, params: params } } }, location.origin);
    });
  }

      } })));

    shell.appendChild(h('div', { class: 'cols' },
      h('div', { class: 'rail rail-left' }, railSearchCard(), railSortCard(), railFilterCard(), aboutCard(), ageWidget(st), epochCard(st)),
      // (the same three reading controls render again inside feedTab for
      //  phones — CSS shows exactly one of the two copies per breakpoint)

      term('theta', 'θ'), ' ' + fmt(THETA, 4) + ' · ', term('nu', 'ν'), ' ' + NU + ' · ',
      term('wall', 'wall'), ' ' + fmt(SAFE_FLOOR, 3) + ' · ', term('door', 'door'), ' ' + PART_FLOOR + ' · ',

  /**
   * Wall proximity: how close x* is to the W2a safety floor, and how many more
   * acts you can afford before crossing it. Acting raises N, so each act drags
   * x* down — the warning has to come before the last one, not after.
   */
  function wallState(st, id) {
    var l = st.ledgerById[id];
    if (!l) return null;
    var x = st.xById[id] || 0;
    // acts until the OWN-rate floor alone would drop below the wall
    var actsLeft = 0;
    var b = l.burnBal, n = l.actCount;
    while (actsLeft < 999 && b >= THETA && ((b - THETA) / Math.max(n + 1, 1)) / NU >= SAFE_FLOOR) {
      b -= THETA; n += 1; actsLeft += 1;
    }
    return {
      x: x, below: x < SAFE_FLOOR, actsLeft: actsLeft,
      near: x < SAFE_FLOOR * 1.6 || actsLeft <= 5,
      margin: x - SAFE_FLOOR,
    };
  }
  /**
   * The two states where an identity is signed in but not fully usable, both
   * of which used to be invisible until something bounced:
   *   locked    — PIN-secured, but the browser session forgot the PIN
   *   unsecured — never had a PIN, so anyone who knows the handle can be you
   * One banner, because to a reader they are the same question: is this
   * really my account right now?
   */
  function lockBanner(st) {
    if (!REMOTE || !who) return null;
    var name = st.handles[who] || who;
    if (sessionLocked()) {
      return h('div', { class: 'wall-warn lock-warn' },
        h('b', { text: '🔒 session locked' }),
        h('div', { class: 'smallnote' },
          'Your PIN is not in this browser any more — it is forgotten whenever the browser closes, on purpose, so a shared machine cannot keep it. You are still ' + name + ' and nothing you posted is affected; you just cannot act or receive calls until you prove it is you.'),
        h('button', { class: 'btn small primary', style: 'margin-top:8px',
          text: 'Unlock', onclick: function () { withUnlock(function () {}); } }));
    }
    if (!st.pinHash[who]) {
      return h('div', { class: 'wall-warn lock-warn' },
        h('b', { text: '⚠ this handle has no PIN' }),
        h('div', { class: 'smallnote' },
          'Anyone who knows the name ' + name + ' can post, message and vouch as you — that has already happened to someone here. Deleting or editing your own posts is refused for the same reason: the host cannot tell it is you. Setting a PIN takes a second and only a hash of it ever enters the record.'),
        h('button', { class: 'btn small primary', style: 'margin-top:8px',
          text: 'Secure this handle', onclick: function () { setPinFlow(st, false); } }));
    }
    return null;
  }

  function wallBanner(st, id) {
    var w = wallState(st, id);
    if (!w || !w.near) return null;
    var msg = w.below
      ? 'Below the safety wall — the network will refuse your writes until you burn credits.'
      : (w.actsLeft <= 0
        ? 'One more act and your own rate falls below the wall. Burn credits first.'
        : 'Close to the safety wall: about ' + w.actsLeft + ' more act' + (w.actsLeft === 1 ? '' : 's') + ' before your rate drops under it. Burn credits to keep talking.');
    return h('div', { class: 'wall-warn' + (w.below ? ' bad' : '') },
      h('b', { text: w.below ? '⛔ frozen' : '⚠ approaching the wall' }),
      h('div', { class: 'smallnote', text: msg }));
  }

  /**
   * Your events — the four questions the deleted tab was the only answer to.
   *
   * Read straight from st.events and never through the feed's ranking. That is
   * not a shortcut: measured, the default L1 feed returns ZERO gatherings even
   * for somebody who paid to enter one, because an rsvp appends no edge and
   * the card's relevance stays at nothing. A page about what YOU are going to
   * cannot be built on a ranking that does not know you went.
   */
  function eventLanes(st) {
    var wrap = h('div', { class: 'your-events' });
    var now = Date.now();
    var head = h('div', { class: 'sect' }, h('p', { class: 'eyebrow', text: 'your events' }));
    var views = [['soon', 'Coming up'], ['mine', 'Yours'], ['invited', 'Invited'], ['past', 'Past']];
    var bar = h('div', { class: 'uline' });
    views.forEach(function (v) {
      bar.appendChild(h('button', { class: eventView === v[0] ? 'on' : '', text: v[1],
        onclick: function () { eventView = v[0]; saveView(); render(); } }));
    });
    head.appendChild(bar);
    wrap.appendChild(head);

    var list = Object.keys(st.events || {}).filter(function (cid) {
      // st.events is written even for a gathering that was deleted — the map
      // is filled unconditionally so a departure cannot re-cut a closed epoch.
      // Without this guard the list carries blank ghost cards still offering a
      // door and a price.
      if (st.payloads[cid] === undefined) return false;
      var ev = st.events[cid];
      var going = (st.eventGoing[cid] || {})[who];
      var invited = (st.eventInvites[cid] || {})[who];
      if (eventView === 'mine') return ev.host === who || !!going;
      if (eventView === 'invited') return !!invited;
      // at === 0 is 'no time stated', not 'happened in 1970'. The one real
      // gathering on this network has no time on it, so reading this the other
      // way round empties the screen it is supposed to fill.
      if (eventView === 'past') return !!ev.at && ev.at < now;
      return !ev.at || ev.at >= now;
    });
    list.sort(function (a, b) {
      var A = st.events[a], B = st.events[b];
      if (eventView === 'past') return (B.at || 0) - (A.at || 0);
      if (A.at && B.at) return A.at - B.at;      // soonest first, ahead of us
      return (B.idx || 0) - (A.idx || 0);
    });

    if (!list.length) {
      wrap.appendChild(h('p', { class: 'smallnote', text:
        eventView === 'invited' ? 'Nobody has invited you to anything yet.'
          : eventView === 'mine' ? 'You are not hosting or going to anything yet.'
            : eventView === 'past' ? 'Nothing of yours has happened yet.'
              : 'Nothing coming up. Announce one from the composer — pick Gathering.' }));
      return wrap;
    }
    list.slice(0, 10).forEach(function (cid) {
      var node = st.g.nodes.get(cid);
      if (!node) return;
      // The same card the feed builds, so the door, the fee and the invite
      // are the same controls with one implementation of each.
      wrap.appendChild(postCard(st, { node: node, relevance: 0, bfsWeight: 0, amplifier: 0, contentNorm: 0, newest: true }, 0, 1));
    });
    if (list.length > 10) {
      wrap.appendChild(h('p', { class: 'smallnote', text: 'Showing 10 of ' + list.length + '.' }));
    }
    return wrap;
  }

  /**

  function profileTab(st) {

    })());
    // One door instead of a folded list: everything about the account — how it

    card.appendChild(h('div', { class: 'mini-form persistent', style: 'margin-top:8px' },

    var mine = Object.keys(st.payloads).filter(function (cid) {

      return st.creators[cid] === who && meta && !meta.comment && st.g.nodes.get(cid);
    }).sort(function (a, b) { return st.postMeta[b].idx - st.postMeta[a].idx; });
    var posts = h('details', {}, h('summary', { class: 'eyebrow', style: 'cursor:pointer',
      text: 'what you published · ' + mine.length }));
    mine.slice(0, 20).forEach(function (cid) {

    });
    if (!mine.length) posts.appendChild(h('p', { class: 'smallnote', text: 'Nothing on the record from this handle yet.' }));
    wrap.appendChild(h('div', { class: 'card' }, posts));

    // The guide, last, and by CALLING it rather than copying it — one guide,
    // one set of edits.
    var guide = h('details', { id: 'guide' }, h('summary', { class: 'eyebrow', style: 'cursor:pointer', text: 'the guide — how any of this works' }));
    guide.appendChild(guideTab(st));
    wrap.appendChild(h('div', { class: 'card' }, guide));
    return wrap;
  }

  /**
   * The invitation, placed where people already are. Most of what has been
   * fixed here started as somebody in the network saying plainly that
   * something was wrong — so say out loud that this is a thing you can do.
   */
  /** Operator-facing: can this instance actually connect two hard networks? */
  function callHealthCard() {
    var out = h('div', { class: 'smallnote', text: 'Not tested yet.' });
    var card = h('div', { class: 'card', style: 'margin-top:14px' },
      h('p', { class: 'eyebrow', text: 'call reachability' }),
      h('p', { class: 'smallnote', text: 'A call needs a path between two networks. Direct usually works within one country; when both ends sit behind carrier-grade NAT — normal on mobile, and common between countries — it needs a relay. This checks which candidate types this browser can actually obtain.' }),
      h('button', { class: 'btn small', text: 'Test reachability', onclick: function (ev) {
        var b = ev.target; b.disabled = true; b.textContent = 'Testing…';
        out.textContent = 'Gathering candidates (up to 8 seconds)…';
        testRelay().then(function (r) {
          b.disabled = false; b.textContent = 'Test again';
          if (r.error) { out.textContent = 'Could not test: ' + r.error; return; }
          var t = r.types;
          out.innerHTML = '';
          out.appendChild(h('div', { text: 'host ' + t.host + ' · server-reflexive ' + t.srflx + ' · relay ' + t.relay }));
          out.appendChild(h('div', { style: 'margin-top:6px' , text: t.relay > 0
            ? 'A relay answered. Calls should connect even between networks with no direct path.'
            : (r.relayKind === 'operator'
              ? 'A relay is configured but produced no candidate — wrong credentials, wrong port, or it is not reachable from here. Calls between hard networks will fail.'
              : 'No relay configured, so calls work only where the two networks can reach each other directly. Set PEER_TURN_URL, PEER_TURN_USER and PEER_TURN_PASS on the host to fix it.') }));
        });
      } }),

    return card;
  }

  function feedTab(st) {
    var text = h('textarea', { placeholder: 'Say something… (payload — carried, never scored; @name mentions and quotes are priced Reference acts)' });
    var att = slider('attachment', 0.8);
    var fileIn = h('input', { type: 'file', multiple: '', accept: 'image/*,video/*,audio/*,.pdf,.txt,.md,.csv,.json,.zip,.heic,.heif,.mov,.m4a', style: 'display:none' });
    var chips = h('div', { class: 'row' });
    composeChipHost = chips;
    redrawComposeChips();
    fileIn.addEventListener('change', function () {
      handleMediaPicks(fileIn.files);
      fileIn.value = '';
    });
    // Show the ceiling before it is hit — finding it by trial cost a tester
    // several real acts, and every one of them burned θ.
    var TEXT_MAX = 1000;
    // Declared HERE, above the counter that reads it: the first updateCount()
    // runs while this composer is being assembled, and a `var` further down
    // the function is hoisted as a name with no value.
    var CEIL = { post: TEXT_MAX, event: 280, stream: 200, market: 280 };
    var counter = h('span', { class: 'charcount' });
    function updateCount() {
      // Against the ceiling for the KIND being written, not always the note's.
      // A gathering takes 280 and a bet takes 280, and both used to be counted
      // against 1000 — so the composer said 320 / 1000 in green and the door
      // refused it, after the θ had been spent finding out.
      var lim = CEIL[draft.kind] || TEXT_MAX;
      var n = text.value.length;
      counter.textContent = n + ' / ' + lim;
      counter.className = 'charcount' + (n > lim ? ' over' : n > lim * 0.9 ? ' near' : '');
    }
    text.addEventListener('input', updateCount);
    updateCount();
    // ── One composer, three kinds ────────────────────────────────────────
    //
    // A note, a gathering and a broadcast are the same thing in the record —
    // each mints a Content node through the same path — so they are published
    // from the same place. The fields a kind cannot carry are UNMOUNTED, not
    // disabled: the host's field whitelist deletes them silently and answers
    // 200, so a fee left behind on a note would vanish without a word, and an
    // attachment left on an event would show a chip for a file that never
    // travelled.
    text.value = draft.text;
    text.addEventListener('input', function () { draft.text = text.value; });
    var KINDS = [['post', 'Note'], ['event', 'Gathering'], ['stream', 'Broadcast'], ['market', 'Bet']];
    var kindBar = h('div', { class: 'uline' });
    KINDS.forEach(function (k) {
      kindBar.appendChild(h('button', { class: draft.kind === k[0] ? 'on' : '', text: k[1], onclick: function () {
        draft.kind = k[0];
        // Clear what the new kind cannot carry, rather than leaving it to be
        // dropped at the door.
        if (k[0] !== 'event') { draft.place = ''; draft.fee = ''; draft.cap = ''; }
        // `at` is shared: a gathering and a bet both need a moment, and
        // retyping it when switching between them helps nobody.
        if (k[0] !== 'event' && k[0] !== 'market') { draft.at = ''; }
        if (k[0] !== 'post') { clearCompose(); }
        render();
      } }));
    });

    var evAt = h('input', { type: 'datetime-local', value: draft.at });
    var evPlace = h('input', { type: 'text', placeholder: 'where', maxlength: '120', value: draft.place, style: 'flex:1; min-width:0' });
    var evFee = h('input', { type: 'text', inputmode: 'decimal', placeholder: 'entry (blank = free)', value: draft.fee, style: 'width:150px' });
    // PEER only. tBTC is retired, and an entry fee denominated in a retired
    // faucet asset would be a price in a currency nobody can obtain.
    var evCur = h('select', {}, h('option', { value: 'PEER', text: 'PEER' }));
    evCur.value = draft.cur;
    var evCap = h('input', { type: 'text', inputmode: 'numeric', placeholder: 'places', value: draft.cap, style: 'width:90px' });
    [[evAt, 'at'], [evPlace, 'place'], [evFee, 'fee'], [evCur, 'cur'], [evCap, 'cap']].forEach(function (p) {
      p[0].addEventListener('input', function () { draft[p[1]] = p[0].value; });
      p[0].addEventListener('change', function () { draft[p[1]] = p[0].value; });
    });
    var camBox = h('input', { type: 'checkbox' });
    camBox.checked = draft.camera;
    camBox.addEventListener('change', function () { draft.camera = camBox.checked; });

    /**
     * A fee typed on a German keyboard.
     *
     * The old form read parseFloat on a number input, and a browser that
     * considers "0,5" invalid reports an empty string — so a comma decimal
     * silently became 0 and published a FREE gathering the author believed
     * was priced. The field is text now and the comma is read as what it is.
     */
    function readFee() {
      var raw = String(draft.fee || '').trim().replace(',', '.');
      if (!raw) return 0;
      var n = parseFloat(raw);
      return isFinite(n) && n > 0 ? n : NaN;
    }
    /** The same lesson, for the numbers on a bet: a comma is a decimal point
     *  on most of the keyboards this is used from, and a browser that calls
     *  '0,5' invalid reports it as the empty string. */
    function readDecimal(v) {
      var raw = String(v == null ? '' : v).trim().replace(',', '.');
      if (!raw) return NaN;
      var n = parseFloat(raw);
      return isFinite(n) ? n : NaN;
    }

    var cost = (function () {
      if (draft.kind !== 'post') return 1;
      var probe = { t: 'post', author: who, text: text.value, ref: composeQuote };
      try { return actCost(probe, st); } catch (e) { return 1; }
    })();
    var verb = draft.kind === 'event' ? 'Announce' : draft.kind === 'stream' ? 'Go live'
      : draft.kind === 'market' ? 'Ask' : 'Publish';

    var composer = h('div', { class: 'card composer' },
      h('p', { class: 'eyebrow', text: 'publish' }), kindBar, text, counter, chips);
    if (draft.kind === 'event') {
      composer.appendChild(h('div', { class: 'mini-form persistent' }, evAt, evPlace));
      composer.appendChild(h('div', { class: 'mini-form persistent' }, evFee, evCur, evCap));
      composer.appendChild(h('p', { class: 'smallnote', text: 'An entry fee moves existing tokens from whoever joins to you. It mints nothing and raises nobody\u2019s standing, yours included. The place is a physical address — deleting the gathering redacts it. A gathering cannot be revised afterwards, only deleted.' }));
    }
    if (draft.kind === 'stream') {
      composer.appendChild(h('div', { class: 'mini-form persistent' },
        h('label', { class: 'smallnote' }, camBox, ' camera'),

      row.appendChild(h('button', { class: 'btn small', text: 'Invite', onclick: function () {

  /**
   * Is this broadcast on air right now, and can the reader get to it?
   *
   * liveList is the host's own answer — it is keyed by the stream's content
   * id — and until now no feed card looked at it. The only on-air signal in
   * the whole app was a dot on a tab. Only relay entries are offered: pollLive
   * already filters to those, because an entry from the older peer-to-peer
   * build is one this app cannot join, and a Watch button that cannot work is
   * worse than none.
   */

    for (var i = 0; i < liveList.length; i++) if (liveList[i].cid === cid) return liveList[i];
    return null;
  }
  function onAirChip(st, cid) {
    if (!(st.postMeta[cid] && st.postMeta[cid].stream)) return null;

  /**
   * Everything one person has published that carries music.
   *
   * Scans st.mediaMeta rather than st.creators, for two reasons that are not
   * about speed alone. The replay writes mediaMeta ONLY in the post branch, so
   * a comment, a stream and an event structurally cannot appear in it, and a
   * deleted post has its entry removed — there is no filtering to remember and
   * therefore none to forget. It is also the smaller map by two orders of
   * magnitude: measured against the published 754-act log, 12 keys against 249,
   * 0.0009 ms against 0.0102 ms, and the gap widens with the corpus.
   *
   * Ordered by first publication, deliberately. A revision replaces the media
   * on a post but leaves postMeta.idx at the genesis index, so this is the date
   * the release entered the record — not the date its files were last swapped.
   */
  function songsOf(st, id) {
    var out = [];
    Object.keys(st.mediaMeta || {}).forEach(function (cid) {
      if (st.creators[cid] !== id) return;
      if (st.payloads[cid] === undefined) return;      // deleted, or its author left
      var meta = st.postMeta[cid];
      if (!meta) return;
      var entries = st.mediaMeta[cid] || [];
      var tracks = entries.filter(isAudioEntry);
      if (!tracks.length) return;
      out.push({
        cid: cid, idx: meta.idx, ts: meta.ts, tracks: tracks,
        cover: entries.filter(function (e) { return isImageEntry(e) && e.cv; })[0] || null,
        title: String(st.payloads[cid] || '').trim(),
      });
    });
    out.sort(function (a, b) { return b.idx - a.idx; });
    return out;
  }

  /**
   * A person's music, on their page.
   *
   * ONE player over every track they have released, not one player per
   * release. That is not a layout preference: audioPlaylist fetches a whole
   * file on mount to decode its waveform, so a player per release downloads
   * the entire catalogue the moment somebody opens the page — measured, four
   * players pulled four complete files with nothing played. The releases are
   * expressed as rows AROUND the single player instead.
   *
   * It says 'releases carrying audio', not 'songs'. The host now checks a
   * post's declared type against the sidecar the upload wrote, so the word
   * would hold today — but the log already contains posts published before
   * that check existed, and this page reads the whole log.
   */
  function musicSection(st, id) {
    var rows = songsOf(st, id);
    if (!rows.length) return null;
    // One row per track, carrying the release it came from. Without this the
    // player shows one release's sleeve over every other release's music and
    // numbers the tracks by their position in the catalogue — both of them
    // claims the record does not make.
    var tracks = [], per = [];
    rows.forEach(function (r) {
      r.tracks.forEach(function (t, j) {
        tracks.push(t);
        per.push({ cover: r.cover, title: r.title, no: j + 1 });
      });
    });
    var box = h('div', { class: 'sect your-music' });
    box.appendChild(h('p', { class: 'eyebrow', text: 'music · ' + rows.length + ' release'
      + (rows.length === 1 ? '' : 's') + ' carrying audio, ' + tracks.length + ' track'
      + (tracks.length === 1 ? '' : 's') }));
    box.appendChild(audioPlaylist(tracks, {
      per: per,
      note: tracks.length + ' track' + (tracks.length === 1 ? '' : 's') + ' from '
        + rows.length + ' release' + (rows.length === 1 ? '' : 's') + ', newest first',
    }));
    if (rows.length > 1) {
      var list = h('div', { class: 'release-list' });
      rows.forEach(function (r) {
        var row = h('div', { class: 'release-row' },

          h('span', { class: 'release-n', text: r.tracks.length + (r.tracks.length === 1 ? ' track' : ' tracks') }),

          jumpTo(st, r.cid);
        });

      });

    var out = {};

  // ── Network view: deterministic force layout + pan/zoom + filters ──
  function hash32(s) {
    var hh = 2166136261;
    for (var i = 0; i < s.length; i++) { hh ^= s.charCodeAt(i); hh = Math.imul(hh, 16777619) >>> 0; }
    return hh;
  }
  function netData(st) {
    var nodes = [], keep = {};
    if (netScope === 'ego') {
      // undirected 2-hop neighborhood of the current identity (person-folded)
      var adj = {};
      st.g.edges.forEach(function (e) {
        (adj[e.src] = adj[e.src] || []).push(e.tgt);
        (adj[e.tgt] = adj[e.tgt] || []).push(e.src);
      });
      var frontier = [who, 'prof_' + who], depth = 0;
      frontier.forEach(function (id) { keep[id] = 1; });
      while (depth < 2 && frontier.length) {
        var next = [];
        frontier.forEach(function (id) {
          (adj[id] || []).forEach(function (nb) { if (!keep[nb]) { keep[nb] = 1; next.push(nb); } });
        });
        frontier = next; depth++;
      }
      st.g.nodes.forEach(function (n) { if (keep[n.id]) nodes.push(n); });
    } else {
      st.g.nodes.forEach(function (n) {
        if (netScope === 'social' && n.kind === 'Type') return;
        keep[n.id] = 1; nodes.push(n);
      });
    }
    var edges = st.g.edges.filter(function (e) {
      return keep[e.src] && keep[e.tgt] && e.weight >= netMinW;
    });
    return { nodes: nodes, edges: edges };
  }
  function layoutGraph(nodes, edges) {
    var key = netScope + '|' + netMinW + '|' + nodes.length + '|' + edges.length + '|' + world.acts.length + '|' + who;
    if (netLayoutCache.key === key && netLayoutCache.pos) return netLayoutCache.pos;
    var pos = {};
    nodes.forEach(function (n) {
      var hh = hash32(n.id);
      var ang = (hh % 6283) / 1000;
      var rad = 60 + (hh % 977) * 0.28;
      pos[n.id] = { x: Math.cos(ang) * rad, y: Math.sin(ang) * rad * 0.8 };
    });
    var iters = nodes.length > 120 ? 90 : 160;
    for (var it = 0; it < iters; it++) {
      var t = 1 - it / iters;
      var disp = {};
      nodes.forEach(function (n) { disp[n.id] = { x: 0, y: 0 }; });
      for (var i = 0; i < nodes.length; i++) {
        for (var j = i + 1; j < nodes.length; j++) {
          var a = pos[nodes[i].id], b = pos[nodes[j].id];
          var dx = a.x - b.x, dy = a.y - b.y;
          var d2 = dx * dx + dy * dy + 0.01, d = Math.sqrt(d2);
          var f = 2200 / d2;
          dx = dx / d * f; dy = dy / d * f;
          disp[nodes[i].id].x += dx; disp[nodes[i].id].y += dy;
          disp[nodes[j].id].x -= dx; disp[nodes[j].id].y -= dy;
        }
      }
      edges.forEach(function (e) {
        var a = pos[e.src], b = pos[e.tgt];
        if (!a || !b) return;
        var dx = b.x - a.x, dy = b.y - a.y;
        var d = Math.sqrt(dx * dx + dy * dy) + 0.01;
        var f = (d - 95) * 0.025;
        dx = dx / d * f; dy = dy / d * f;
        disp[e.src].x += dx; disp[e.src].y += dy;
        disp[e.tgt].x -= dx; disp[e.tgt].y -= dy;
      });
      nodes.forEach(function (n) {
        var dd = disp[n.id], p = pos[n.id];
        dd.x -= p.x * 0.035; dd.y -= p.y * 0.035;
        var len = Math.sqrt(dd.x * dd.x + dd.y * dd.y) + 1e-9;
        var cap = 16 * t + 1;
        p.x += dd.x / len * Math.min(len, cap);
        p.y += dd.y / len * Math.min(len, cap);
      });
    }
    netLayoutCache = { key: key, pos: pos };
    return pos;
  }
  function exportGraphJSON(st) {
    var data = {
      format: 'peer-network-graph/1',
      generatedFromActs: world.acts.length,
      epoch: st.epochNow,
      constants: { theta: THETA, nu: NU, wall: SAFE_FLOOR, door: PART_FLOOR, feedDepth: 4 },
      nodes: [],
      edges: st.g.edges.map(function (e) {
        return { id: e.id, family: e.family, src: e.src, tgt: e.tgt, pd: e.pd, pi: e.pi, tau: e.tau, epoch: e.epoch, weight: e.weight, sign: e.sign, detScore: e.score };
      }),
      standings: st.ledgers.filter(function (l) { return !l.deleted; }).map(function (l) { return { id: l.id, burnBal: l.burnBal, actCount: l.actCount, x: st.xById[l.id] || 0 }; }),
    };
    st.g.nodes.forEach(function (n) { data.nodes.push({ id: n.id, kind: n.kind, label: n.label }); });
    var blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'peer-graph-' + world.acts.length + 'acts.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  }
  /**
   * The Network view's summary — what a reader needs before a picture.
   *
   * Every figure here is measured from the record, and each one names WHICH
   * measurement it is, because the obvious ones disagree with each other by
   * large factors and a bare number would be a guess dressed as a fact:
   *
   *   Reach, undirected and person-folded: for one account here, 39 peers.
   *   Reach, through the protocol's own directed primitive: 5.
   *
   * The second is the one this page reports, because it is the mechanism that
   * actually decides the feed — "transported commitment" is directional, and
   * an undirected count would tell somebody they reach people who cannot see
   * them. Measured across this network: 25 of 51 accounts reach nobody at all.
   */
  function netStats(st, me, reach) {
    var live = st.ledgers.filter(function (l) { return !l.deleted; });
    var peers = 0, nodes = 0;
    reach.forEach(function (r, id) {
      if (!(r.pos > 0)) return;
      nodes += 1;
      var n = st.g.nodes.get(id);
      if (n && n.kind === 'Actor' && id !== me) peers += 1;
    });
    // Rank, reported as a band. Twenty of the fifty-one accounts here sit on
    // exactly tied standings — eight of them share one value — so a bare
    // "top N%" would be arbitrary for two fifths of the roster.
    var mine = st.xById[me] || 0;
    var above = 0, tied = 0;
    live.forEach(function (l) {
      var x = st.xById[l.id] || 0;
      if (x > mine) above += 1; else if (x === mine && l.id !== me) tied += 1;
    });
    return {
      peers: peers, nodes: nodes, total: live.length,
      edges: st.g.edges.length,
      rank: above + 1, tied: tied, of: live.length,
      standing: NU * mine,
    };
  }

  /**
   * Advice, and only the kind that survived being checked.
   *
   * Two things the brief asked for are not derivable here and are left out
   * rather than approximated. Topic concentration: 22 tag edges over 256
   * pieces of content, and a tag node is a dead end in the routing graph, so
   * "connect to X and reach grows by N%" evaluates to exactly zero every time
   * — it was run, not assumed. And a day-based "dormant" count would be a
   * fiction, because a third of this log carries no timestamp at all.
   *
   * What IS derivable is the one that matters most: remove a neighbour and
   * re-run the reach, and see what is left. The shares do not sum to a hundred
